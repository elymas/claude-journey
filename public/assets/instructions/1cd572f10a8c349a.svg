<svg xmlns="http://www.w3.org/2000/svg" width="692" height="744" viewBox="0 0 692 744" role="img"><title>결과물(날짜_콘티.md)을 확인하고 '미확인'란을 체크한다.</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H692" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="680" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 결과물(날짜_콘티.md)을 확인하고 '미확인'란을 체크한다.</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="14.3" y="71.8" font-size="22.4" textLength="75.9" lengthAdjust="spacingAndGlyphs">시간 합계</text>
<text x="14.4" y="106.2" font-size="18.0" textLength="353.7" lengthAdjust="spacingAndGlyphs">1+2+ 4+3+2+3= 15분 (발표 시간 15분과 같음)</text>
<text x="15.4" y="155.9" font-size="22.2" textLength="474.7" lengthAdjust="spacingAndGlyphs">출처 (콘티장&gt; 기획안 덩어리&gt; 기획안이 인용한 요약 항목)</text>
<text x="25.6" y="191.8" font-size="22.3" textLength="513.6" lengthAdjust="spacingAndGlyphs">• 표지: 기획안 제목, 기획 조건의 목표 (문장 일부만 골라 말투만 다듬음)</text>
<text x="65.6" y="223.4" font-size="23.3" textLength="608.6" lengthAdjust="spacingAndGlyphs">2. 배경: 기획안 1. 배경 (요약 260728 핵심요약 3, 260806 쟁점 1, 260811 핵심요약 2)</text>
<text x="67.7" y="258.4" font-size="22.4" textLength="476.7" lengthAdjust="spacingAndGlyphs">3. 쟁점: 기획안 2. 쟁점' (요약 260721 핵심요약 3, 260811 쟁점 1•2)</text>
<text x="26.7" y="292.4" font-size="14.8" textLength="22.6" lengthAdjust="spacingAndGlyphs">•</text>
<text x="24.6" y="331.3" font-size="22.2" textLength="24.6" lengthAdjust="spacingAndGlyphs">•</text>
<text x="59.5" y="293.6" font-size="21.3" textLength="346.0" lengthAdjust="spacingAndGlyphs">4. 제안: 기획안 3. 제안'(요약 260811 쟁점 1•2)</text>
<text x="64.5" y="332.7" font-size="26.0" textLength="605.9" lengthAdjust="spacingAndGlyphs">5. 다음 단계: 기획안 '4. 다음 단계 (요약 260721 핵심요약 3, 260811 쟁점 1•2,260806</text>
<text x="94.2" y="353.6" font-size="19.7" textLength="51.5" lengthAdjust="spacingAndGlyphs">쟁점 1)</text>
<text x="27.7" y="387.8" font-size="14.8" textLength="21.5" lengthAdjust="spacingAndGlyphs">.</text>
<text x="63.5" y="392.3" font-size="26.4" textLength="497.4" lengthAdjust="spacingAndGlyphs">6. 기대효과: 기획안 '5. 기대효과'(요약 260811 쟁점 2, 나머지는 추정)</text>
<text x="15.4" y="452.6" font-size="21.3" textLength="54.3" lengthAdjust="spacingAndGlyphs">미확인</text>
<text x="26.7" y="487.7" font-size="20.3" textLength="635.6" lengthAdjust="spacingAndGlyphs">• 7월 21일 쟁의 범위 논의와 8월 11일 쟁의 대상 기준 논의가 이후 어떻게 정리됐는지: 기획</text>
<text x="54.3" y="512.2" font-size="20.1" textLength="388.5" lengthAdjust="spacingAndGlyphs">안(요약)에 없음. 4장에서 해결책을 단정하지 않은 이유.</text>
<text x="26.7" y="540.1" font-size="20.3" textLength="638.7" lengthAdjust="spacingAndGlyphs">• 광주 반도체 공장 노조 주장(7월 21일)과 광주 군공항 이전(8월 11일)이 같은 사업인지: 기</text>
<text x="54.3" y="563.5" font-size="20.1" textLength="295.3" lengthAdjust="spacingAndGlyphs">획안(요약)에 없음. 둘의 연결은 쓰지 않음.</text>
<text x="26.7" y="592.2" font-size="21.3" textLength="640.7" lengthAdjust="spacingAndGlyphs">• 주 52시간제 논의가 3대 메가프로젝트와 관련된 것인지: 기획안(요약)에 없음. 3장에서는</text>
<text x="54.3" y="615.0" font-size="19.0" textLength="211.2" lengthAdjust="spacingAndGlyphs">부처 간 입장차의 사례로만 씀.</text>
<text x="26.7" y="644.6" font-size="21.3" textLength="639.7" lengthAdjust="spacingAndGlyphs">• 쟁의 기준 확정이나 투자 가속 효과를 보여주는 근거: 기획안(요약)에 없음. 6장에서 '보장</text>
<text x="54.3" y="666.3" font-size="19.0" textLength="144.6" lengthAdjust="spacingAndGlyphs">하지 않음'으로만 씀.</text>
<text x="55.2" y="720.3" font-size="22.4" textLength="99.9" lengthAdjust="spacingAndGlyphs">안 점검 기록).</text></g><rect x=".5" y=".5" width="691" height="743" rx="6" fill="none" stroke="#d8cfc0"/></svg>