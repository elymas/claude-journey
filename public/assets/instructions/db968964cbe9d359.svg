<svg xmlns="http://www.w3.org/2000/svg" width="532" height="776" viewBox="0 0 532 776" role="img"><title>Ctrl + V로 덮어쓴다. 5번이 다섯 덩어리로 바뀐 것을 확인하고 Ctrl + S로 저장한다.</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H532" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="520" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · Ctrl + V로 덮어쓴다. 5번이 다섯 덩어리로 바뀐 것을 확인하고</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="56.8" y="67.9" font-size="16.8" textLength="111.5" lengthAdjust="spacingAndGlyphs"># 정책자료 기획안</text>
<text x="302.5" y="68.1" font-size="14.4" textLength="13.9" lengthAdjust="spacingAndGlyphs">+</text>
<text x="15.0" y="100.1" font-size="15.5" textLength="139.4" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="16.1" y="139.8" font-size="15.5" textLength="111.5" lengthAdjust="spacingAndGlyphs"># 정책자료 기획안</text>
<text x="18.2" y="157.1" font-size="15.6" textLength="233.8" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="15.9" y="190.8" font-size="15.5" textLength="53.9" lengthAdjust="spacingAndGlyphs">## 할 일</text>
<text x="17.2" y="208.3" font-size="16.6" textLength="326.1" lengthAdjust="spacingAndGlyphs">1. 부를 때 받은 결과 폴더의 요약 파일 한 개만 읽는다.</text>
<text x="32.2" y="225.5" font-size="16.8" textLength="177.0" lengthAdjust="spacingAndGlyphs">정책자료 원본은 읽지 않는다.</text>
<text x="17.2" y="241.7" font-size="15.5" textLength="367.9" lengthAdjust="spacingAndGlyphs">2. 쓰기 전에 네 가지를 묻는다. 답을 받기 전에는 쓰지 않는다.</text>
<text x="32.2" y="258.8" font-size="15.6" textLength="242.4" lengthAdjust="spacingAndGlyphs">이 기획안의 목표 / 얻고 싶은 기대효과 /</text>
<text x="32.2" y="276.1" font-size="15.5" textLength="257.4" lengthAdjust="spacingAndGlyphs">누구에게 보고하나 / 발표 시간은 몇 분인가</text>
<text x="17.2" y="293.2" font-size="15.6" textLength="369.0" lengthAdjust="spacingAndGlyphs">3. 답을 받으면 요약에서 목표에 맞는 주제 후보를 2~3개 낸다.</text>
<text x="32.2" y="312.0" font-size="18.8" textLength="342.2" lengthAdjust="spacingAndGlyphs">후보마다 요약의 어느 항목이 근거인지 적고, 고르게 한다.</text>
<text x="16.1" y="327.4" font-size="16.6" textLength="253.1" lengthAdjust="spacingAndGlyphs">4. 요약 맨 아래의 ‘점검 기록’을 먼저 본다.</text>
<text x="33.3" y="344.2" font-size="12.4" textLength="241.3" lengthAdjust="spacingAndGlyphs">고친 양복이 있으면 고신 우의 없을 쓴나.</text>
<text x="17.2" y="362.6" font-size="17.7" textLength="402.2" lengthAdjust="spacingAndGlyphs">5. 기획안 맨 위에 목표·기대효과·대상·시간을 내가 답한 그대로 적고,</text>
<text x="33.3" y="378.0" font-size="15.8" textLength="118.0" lengthAdjust="spacingAndGlyphs">다섯 덩어리로 쓴다.</text>
<text x="33.3" y="396.0" font-size="16.6" textLength="348.6" lengthAdjust="spacingAndGlyphs">덩어리마다 첫 줄은 결론 한 문장, 그 아래 근거 세 줄 이하.</text>
<text x="30.0" y="411.2" font-size="15.6" textLength="197.4" lengthAdjust="spacingAndGlyphs">- 배경: 왜 지금 이 얘기를 하는가</text>
<text x="30.0" y="428.4" font-size="15.5" textLength="244.5" lengthAdjust="spacingAndGlyphs">- 쟁점: 무엇이 문제인가 (숫자 하나 이상)</text>
<text x="30.0" y="445.5" font-size="15.5" textLength="229.5" lengthAdjust="spacingAndGlyphs">- 제안: 그래서 무엇을 하자는 것인가</text>
<text x="31.1" y="462.7" font-size="15.5" textLength="209.2" lengthAdjust="spacingAndGlyphs">- 다음 단계: 누가 언제까지 무엇을</text>
<text x="30.0" y="479.8" font-size="15.5" textLength="362.5" lengthAdjust="spacingAndGlyphs">- 기대효과: 제안이 내가 답한 기대효과를 어떻게 가져오는가.</text>
<text x="42.9" y="496.9" font-size="16.8" textLength="347.2" lengthAdjust="spacingAndGlyphs">요약에 근거가 없으면 숫자 없이 쓰고 ‘추정’이라고 적는다.</text>
<text x="16.1" y="514.0" font-size="16.6" textLength="407.6" lengthAdjust="spacingAndGlyphs">6. 숫자·날짜마다 괄호 안에 요약 파일의 어느 항목에서 왔는지 적는다.</text>
<text x="32.2" y="531.9" font-size="12.4" textLength="193.1" lengthAdjust="spacingAndGlyphs">요약에 없는 숫자는 쓰지 않는다.</text>
<text x="16.1" y="548.3" font-size="16.6" textLength="202.7" lengthAdjust="spacingAndGlyphs">7. 맨 아래에 ‘점검 기록’을 만든다.</text>
<text x="32.2" y="564.6" font-size="15.6" textLength="340.0" lengthAdjust="spacingAndGlyphs">기획안의 숫자마다 요약의 숫자와 같은지 한 줄씩 적는다.</text>
<text x="17.2" y="584.6" font-size="18.9" textLength="509.5" lengthAdjust="spacingAndGlyphs">8. 결과 폴더에 YYYY-MM-DD_기획안.md로 저장한다. 같은 이름이 있으면 _2를 붙인다.</text>
<text x="16.1" y="615.2" font-size="14.5" textLength="111.5" lengthAdjust="spacingAndGlyphs">## 다 됐다는 기준</text>
<text x="15.0" y="633.1" font-size="16.6" textLength="451.6" lengthAdjust="spacingAndGlyphs">- 묻기 전에 쓰지 않았다. 맨 위에 내가 답한 목표·기대효과·대상·시간이 있다.</text>
<text x="16.1" y="651.1" font-size="17.7" textLength="371.1" lengthAdjust="spacingAndGlyphs">- 다섯 덩어리가 모두 있고, 덩어리마다 첫 줄이 결론 문장이다.</text>
<text x="16.1" y="666.5" font-size="15.5" textLength="205.9" lengthAdjust="spacingAndGlyphs">- 요약에 없는 숫자가 하나도 없다.</text>
<text x="16.1" y="683.7" font-size="15.6" textLength="312.1" lengthAdjust="spacingAndGlyphs">- 기대효과에 근거 없는 줄은 ‘추정’이라고 적혀 있다.</text>
<text x="16.1" y="700.8" font-size="15.5" textLength="293.9" lengthAdjust="spacingAndGlyphs">- 점검 기록에 기획안의 숫자가 전부 올라가 있다.</text>
<text x="16.1" y="717.9" font-size="16.8" textLength="404.4" lengthAdjust="spacingAndGlyphs">- 요약에 없는 내용을 써야 할 것 같으면 쓰지 말고 멈춰서 물어본다.</text>
<text x="20.4" y="765.2" font-size="15.5" textLength="120.1" lengthAdjust="spacingAndGlyphs">출 35, 열 40 987자</text>
<text x="316.4" y="762.5" font-size="12.4" textLength="106.2" lengthAdjust="spacingAndGlyphs">Mu Markdown 구문</text></g><rect x=".5" y=".5" width="531" height="775" rx="6" fill="none" stroke="#d8cfc0"/></svg>