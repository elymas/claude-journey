<text x="86.3" y="205.5" font-size="13.4" textLength="370.9" lengthAdjust="spacingAndGlyphs">• 8차 최고가격 인하(스150원/L)를 통해 7월 물가상승률 스0.0%p 완화 효과</text>
<text x="78.3" y="227.6" font-size="16.7" textLength="386.9" lengthAdjust="spacingAndGlyphs">• 다만 8월은 작년 동신비 할인에 따른 기저효과 등 상방압력 상존</text>
<text x="64.0" y="246.8" font-size="14.9" textLength="417.3" lengthAdjust="spacingAndGlyphs">2. 대응 : 중동상황·부문별 영향 면밀히 모니터링 + 민생부담 경감 총력</text>
<text x="71.9" y="269.1" font-size="16.6" textLength="414.1" lengthAdjust="spacingAndGlyphs">ㅁ (공급망•에너지) 원유는 단기 수급 영향은 제한적이나, 9월 도입 예정</text>
<text x="91.1" y="288.1" font-size="16.5" textLength="356.5" lengthAdjust="spacingAndGlyphs">물량 도착 지연 및 10월 이후 수급 차질 가능성에 철저히 대비</text>
<text x="78.3" y="310.6" font-size="16.5" textLength="412.2" lengthAdjust="spacingAndGlyphs">• UAE 물량은 푸자이라 동해 지속 도입, 사우디 물량은 수에즈운하,</text>
<text x="97.5" y="329.9" font-size="15.0" textLength="225.4" lengthAdjust="spacingAndGlyphs">수메드 송유관(이집트) 활용한 도입 유도</text>
<text x="78.3" y="352.1" font-size="16.5" textLength="423.7" lengthAdjust="spacingAndGlyphs">• 기존 비축유 SWAP물량 전량 상환(~8월) 차질 없이 마무리하고, 필요시</text>
<text x="97.5" y="371.2" font-size="16.6" textLength="329.4" lengthAdjust="spacingAndGlyphs">대체물량(미주 등) 확대를 위한 비축유 SWAP 즉각 재가동</text>
<text x="71.9" y="393.4" font-size="18.1" textLength="420.5" lengthAdjust="spacingAndGlyphs">ㅁ (물가) 민생부담 최소화, 물가 상방압력 최대한 억제 등 정책노력 강화</text>
<text x="78.3" y="414.1" font-size="20.1" textLength="458.9" lengthAdjust="spacingAndGlyphs">• 최고가격제 운영, 먹거리 할인행사(~8월) 및 계란• 고등어 등 수입 신속 추진,</text>
<text x="95.9" y="436.3" font-size="19.8" textLength="356.5" lengthAdjust="spacingAndGlyphs">폭염•폭우 민감품목 철저 관리, 『추석 민생안정대책」 마련 (9월)</text>
<text x="84.7" y="453.3" font-size="13.2" textLength="449.3" lengthAdjust="spacingAndGlyphs">• 수입 신선란 주당 2천만 개 공급, 노르웨이산 고등어 2,000년 화보 및 1,200년 추가수입 계약체전 예정</text>
