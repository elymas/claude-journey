<svg xmlns="http://www.w3.org/2000/svg" width="592" height="533" viewBox="0 0 592 533" role="img"><title>칸1의 ‘✦ 마법 주문 제작 — 그래프.md’를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H592" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="580" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 칸1의 ‘✦ 마법 주문 제작 — 그래프.md’를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="26.7" y="97.1" font-size="13.4" textLength="122.2" lengthAdjust="spacingAndGlyphs">STEP 03 · 돌발</text>
<text x="171.2" y="98.5" font-size="40.0" textLength="395.8" lengthAdjust="spacingAndGlyphs">그래프 규칙을 파일로 새긴다</text>
<text x="37.9" y="164.5" font-size="10.8" textLength="71.4" lengthAdjust="spacingAndGlyphs">STEPS.</text>
<text x="108.4" y="167.2" font-size="16.1" textLength="194.5" lengthAdjust="spacingAndGlyphs">네모는 체크, 제목은 펼치기</text>
<text x="67.1" y="208.6" font-size="20.4" textLength="294.3" lengthAdjust="spacingAndGlyphs">01 그래프.md를 새 파일로 붙여 저장한다</text>
<text x="67.1" y="241.3" font-size="15.2" textLength="413.9" lengthAdjust="spacingAndGlyphs">질문지 때처럼 새 텍스트 문서에 붙여 넣고 다른 이름으로 저장 - 파일 형식</text>
<text x="65.4" y="264.4" font-size="21.3" textLength="165.2" lengthAdjust="spacingAndGlyphs">'모든 파일', 이름 그래프. md.</text>
<text x="78.3" y="308.7" font-size="17.7" textLength="203.9" lengthAdjust="spacingAndGlyphs">✦ 마법 주문 제작 — 그래프.md</text>
<text x="570.5" y="165.0" font-size="13.4" textLength="20.7" lengthAdjust="spacingAndGlyphs">작업</text>
<text x="78.3" y="357.0" font-size="10.7" textLength="93.8" lengthAdjust="spacingAndGlyphs">JUDGE 1/ 1</text>
<text x="228.0" y="381.3" font-size="21.4" textLength="103.3" lengthAdjust="spacingAndGlyphs">저장하고 보니?</text>
<text x="202.2" y="410.3" font-size="16.9" textLength="152.3" lengthAdjust="spacingAndGlyphs">폴더에 그래프.md가 생겼다</text>
<text x="212.5" y="448.0" font-size="16.9" textLength="131.7" lengthAdjust="spacingAndGlyphs">이름 끝에 .txt가 붙었다</text>
<text x="207.4" y="486.2" font-size="15.1" textLength="142.0" lengthAdjust="spacingAndGlyphs">이름이 엉뚱하게 저장됐다</text></g><rect x=".5" y=".5" width="591" height="532" rx="6" fill="none" stroke="#d8cfc0"/></svg>