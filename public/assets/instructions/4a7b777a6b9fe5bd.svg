<text x="15.0" y="280.6" font-size="16.5" textLength="76.0" lengthAdjust="spacingAndGlyphs">## 시킬 일</text>
<text x="19.0" y="308.3" font-size="18.5" textLength="506.0" lengthAdjust="spacingAndGlyphs">폴더 안 정책자료를 전부 읽고, 내가 말한 목적에 맞춰 기획안 5장을 만든다.</text>
