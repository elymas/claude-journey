<text x="17.8" y="412.0" font-size="19.3" textLength="81.3" lengthAdjust="spacingAndGlyphs">4. 핵심 쟁점</text>
<text x="17.0" y="437.4" font-size="17.5" textLength="132.0" lengthAdjust="spacingAndGlyphs">5. 제안과 다음 단계</text>
<text x="16.0" y="489.4" font-size="17.5" textLength="91.0" lengthAdjust="spacingAndGlyphs">## 파일 이름</text>
