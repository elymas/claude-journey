<text x="348.5" y="141.7" font-size="23.2" textLength="417.3" lengthAdjust="spacingAndGlyphs">H1V :=~ BTS .</text>
<text x="19.1" y="300.4" font-size="31.7" textLength="169.6" lengthAdjust="spacingAndGlyphs">## 결과물 위치</text>
<text x="24.0" y="340.9" font-size="28.3" textLength="677.9" lengthAdjust="spacingAndGlyphs">새로 만든 파일은 같은 폴더에 넣는다. 원본은 건드리지 않는다.</text>
<text x="17.5" y="422.3" font-size="28.3" textLength="92.8" lengthAdjust="spacingAndGlyphs">## 절차</text>
<text x="22.9" y="463.9" font-size="33.2" textLength="531.7" lengthAdjust="spacingAndGlyphs">1. 이 폴더의 정책자료를 파일별로 끝까지 읽는다.</text>
<text x="24.0" y="508.2" font-size="29.6" textLength="489.2" lengthAdjust="spacingAndGlyphs">2. 자료마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="24.0" y="548.4" font-size="28.0" textLength="519.6" lengthAdjust="spacingAndGlyphs">3. 요약과 쟁점을 바탕으로 기획안 5장을 만든다.</text>
<text x="22.4" y="590.0" font-size="28.0" textLength="612.4" lengthAdjust="spacingAndGlyphs">4. 근거가 없는 항목은 빈칸으로 두고 목록으로 알려준다.</text>
<text x="20.5" y="674.0" font-size="30.9" textLength="152.4" lengthAdjust="spacingAndGlyphs">## 하지 말 것</text>
<text x="18.3" y="715.9" font-size="33.2" textLength="426.3" lengthAdjust="spacingAndGlyphs">- 자료에 없는 내용을 지어내지 않는다.</text>
<text x="18.3" y="757.2" font-size="33.1" textLength="375.8" lengthAdjust="spacingAndGlyphs">- 원본 파일 이름을 바꾸지 않는다.</text>
