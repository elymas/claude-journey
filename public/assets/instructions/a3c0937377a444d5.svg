<text x="142.9" y="395.5" font-size="27.6" textLength="192.3" lengthAdjust="spacingAndGlyphs">(.md)로 저장합니다.</text>
<text x="145.5" y="422.9" font-size="31.5" textLength="516.9" lengthAdjust="spacingAndGlyphs">일반 텍스트 파일로 저장하면 모든 서식이 손실됩니다.</text>
