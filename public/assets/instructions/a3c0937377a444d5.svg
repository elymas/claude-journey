<svg xmlns="http://www.w3.org/2000/svg" width="919" height="565" viewBox="0 0 919 565" role="img"><title>④ Markdown 파일로 저장</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H919" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="907" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ④ Markdown 파일로 저장</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="29.4" y="83.6" font-size="26.1" textLength="175.0" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="25.4" y="132.0" font-size="23.5" textLength="207.0" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="22.7" y="198.4" font-size="26.2" textLength="165.6" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="26.7" y="229.1" font-size="26.2" textLength="394.0" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="22.7" y="287.9" font-size="24.7" textLength="88.2" lengthAdjust="spacingAndGlyphs">## 할 일</text>
<text x="28.1" y="318.4" font-size="26.1" textLength="85.5" lengthAdjust="spacingAndGlyphs">1. 이 폴|</text>
<text x="48.1" y="347.9" font-size="24.8" textLength="54.8" lengthAdjust="spacingAndGlyphs">(결과</text>
<text x="25.4" y="379.5" font-size="27.6" textLength="85.5" lengthAdjust="spacingAndGlyphs">2. 파일0</text>
<text x="25.2" y="409.4" font-size="27.0" textLength="85.8" lengthAdjust="spacingAndGlyphs">3. 자료!</text>
<text x="50.8" y="437.4" font-size="25.0" textLength="61.4" lengthAdjust="spacingAndGlyphs">결과 :</text>
<text x="26.7" y="467.9" font-size="26.4" textLength="84.2" lengthAdjust="spacingAndGlyphs">기획안은</text>
<text x="22.6" y="528.0" font-size="26.5" textLength="88.3" lengthAdjust="spacingAndGlyphs">## 다 됐</text>
<text x="24.0" y="555.1" font-size="22.0" textLength="86.8" lengthAdjust="spacingAndGlyphs">_ 결과 폴</text>
<text x="168.5" y="531.0" font-size="23.6" textLength="191.5" lengthAdjust="spacingAndGlyphs">Markdown 파일로</text>
<text x="452.8" y="87.0" font-size="30.2" textLength="26.7" lengthAdjust="spacingAndGlyphs">+</text>
<text x="852.2" y="61.0" font-size="8.0" textLength="16.0" lengthAdjust="spacingAndGlyphs">-</text>
<text x="802.8" y="129.7" font-size="20.7" textLength="61.4" lengthAdjust="spacingAndGlyphs">3~</text>
<text x="880.3" y="130.3" font-size="26.1" textLength="37.4" lengthAdjust="spacingAndGlyphs">g</text>
<text x="137.6" y="319.2" font-size="38.5" textLength="545.0" lengthAdjust="spacingAndGlyphs">서식을 유지하려면 Markdown으로 저장</text>
