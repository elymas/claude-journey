<svg xmlns="http://www.w3.org/2000/svg" width="800" height="393" viewBox="0 0 800 393" role="img"><title>담당자·기한도 요약에 없어 물어본다 — 직접 적어 준다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H800" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="788" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 담당자·기한도 요약에 없어 물어본다 — 직접 적어 준다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="31.4" y="88.8" font-size="17.9" textLength="393.0" lengthAdjust="spacingAndGlyphs">'다음 단계'의 누가 언제까지는 요약에 없습니다. 어떻게 할까요?</text>
<text x="629.1" y="88.0" font-size="15.8" textLength="136.0" lengthAdjust="spacingAndGlyphs">&lt; 2개중 2개 &gt; X</text>
<text x="43.0" y="135.4" font-size="24.0" textLength="288.7" lengthAdjust="spacingAndGlyphs">1 비워 두고 미확인' 표기 (Recommended)</text>
<text x="72.1" y="149.1" font-size="18.0" textLength="645.6" lengthAdjust="spacingAndGlyphs">규칙.md대로 요약에 없는 담당자•기한은 비워 두고, 기획안 맨 아래 미확인 목록에 적습니다. '무엇을만 채웁니다.</text>
<text x="72.1" y="179.6" font-size="15.5" textLength="101.2" lengthAdjust="spacingAndGlyphs">직접 알려줄게요</text>
<text x="70.0" y="200.9" font-size="20.6" textLength="663.3" lengthAdjust="spacingAndGlyphs">담당자와 기한을 other로 입력해 주시면 그대로 넣습니다. 그 숫자. 날짜는 요약 출처가 아니므로 '사용자 지정'으로 따</text>
<text x="72.1" y="216.9" font-size="14.3" textLength="83.7" lengthAdjust="spacingAndGlyphs">로 표시합니다.</text>
<text x="40.0" y="256.8" font-size="23.9" textLength="250.0" lengthAdjust="spacingAndGlyphs">• 담당자: 옷고은, 기한: 10월 31일까지</text>
<text x="746.5" y="255.6" font-size="19.1" textLength="16.3" lengthAdjust="spacingAndGlyphs">7</text>
<text x="38.4" y="319.8" font-size="16.7" textLength="111.6" lengthAdjust="spacingAndGlyphs">또는 직접 답장...</text>
<text x="38.4" y="360.9" font-size="21.6" textLength="55.8" lengthAdjust="spacingAndGlyphs">+ h</text>
