<svg xmlns="http://www.w3.org/2000/svg" width="691" height="876" viewBox="0 0 691 876" role="img"><title>보고 ② — ‘알아서’로 정한 값, 질문지와 다르게 한 것</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H691" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="679" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 보고 ② — ‘알아서’로 정한 값, 질문지와 다르게 한 것</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="34.1" y="46.3" font-size="10.0" textLength="176.4" lengthAdjust="spacingAndGlyphs">wscom empide Creduon</text>
<text x="26.8" y="114.7" font-size="17.9" textLength="127.7" lengthAdjust="spacingAndGlyphs">'알아서'로 정한 값</text>
<text x="35.3" y="151.0" font-size="18.9" textLength="582.7" lengthAdjust="spacingAndGlyphs">• 글꼴: 제목은 KoPubWorld돋움체 Bold, 본문은 KoPubWorld 돋음체 Medium으로 정</text>
<text x="63.3" y="175.3" font-size="19.0" textLength="537.7" lengthAdjust="spacingAndGlyphs">했어요. 회사 PC에 이 글꼴이 있는지는 확인하지 못했어요. 없으면 PowerPoint가</text>
<text x="63.3" y="198.6" font-size="18.9" textLength="192.2" lengthAdjust="spacingAndGlyphs">다른 글꼴로 바꿔 보여 줘요.</text>
<text x="35.3" y="227.5" font-size="20.1" textLength="571.8" lengthAdjust="spacingAndGlyphs">• 여백•정렬: 화면은 16:9 와이드예요. 가장자리 여백은 0.6인치이고, 제목은 위쪽 왼</text>
<text x="60.8" y="249.8" font-size="17.6" textLength="325.1" lengthAdjust="spacingAndGlyphs">쪽에 놓았어요. 마무리 만 가운데 정렬이에요.</text>
<text x="29.2" y="296.1" font-size="17.6" textLength="150.9" lengthAdjust="spacingAndGlyphs">질문지와 다르게 한 것</text>
<text x="34.1" y="333.5" font-size="20.1" textLength="575.4" lengthAdjust="spacingAndGlyphs">• 회색 네 가지를 추가했어요. 표에 없던 색이에요. 카드 면은 O #F2F2F2, 선•눈금선</text>
<text x="63.3" y="358.0" font-size="18.8" textLength="537.7" lengthAdjust="spacingAndGlyphs">은 O#D909D9, 그래프 셋째 막대는 O #A6A6A6, 캡션 글자는 #6B6B6B 예요. 흔</text>
<text x="63.3" y="381.2" font-size="18.9" textLength="540.1" lengthAdjust="spacingAndGlyphs">바탕에 팔레트 다섯 색만 쓰면 카드와 바탕이 구분되지 않고, 질문지의 그래프 색</text>
<text x="63.3" y="404.3" font-size="18.9" textLength="515.4" lengthAdjust="spacingAndGlyphs">순서에 '회색이 들어 있어서 넣었어요. 팔레트 색은 하나도 바꾸지 않았어요.</text>
<text x="35.3" y="433.4" font-size="20.3" textLength="573.0" lengthAdjust="spacingAndGlyphs">• 큰 숫자형 장의 '숫자만 60pt예요. 장의 쓰임이 크게 보여 주기'라서 본문 크기로</text>
<text x="63.3" y="455.7" font-size="17.9" textLength="150.9" lengthAdjust="spacingAndGlyphs">두면 의미가 없어서요.</text>
<text x="35.3" y="484.5" font-size="20.1" textLength="577.9" lengthAdjust="spacingAndGlyphs">• 장 안에 항목 1', 단계 1' 같은 번호가 있어요. 질문지에 예로 나온 자리 이름 방식</text>
<text x="61.9" y="507.3" font-size="18.9" textLength="87.8" lengthAdjust="spacingAndGlyphs">을 따랐어요.</text>
<text x="35.3" y="534.6" font-size="18.9" textLength="570.6" lengthAdjust="spacingAndGlyphs">• 노트에는 2~4개' 같은 숫자가 있어요. 질문지의 설명을 그대로 옮기라는 규칙 때</text>
<text x="63.3" y="559.2" font-size="17.6" textLength="65.7" lengthAdjust="spacingAndGlyphs">문이에요.</text>
<text x="35.3" y="587.0" font-size="19.0" textLength="441.6" lengthAdjust="spacingAndGlyphs">• 슬라이드 번호는 넣지 않았어요. '숫자 없음' 기준 때문이에요.</text>
<text x="35.3" y="615.0" font-size="18.8" textLength="577.9" lengthAdjust="spacingAndGlyphs">• 규칙.md와 다른 점이 두 가지 있어요. 규칙.md는 결과 폴더 밖의 .md를 읽지 말라</text>
<text x="63.3" y="639.4" font-size="18.8" textLength="543.8" lengthAdjust="spacingAndGlyphs">고 하지만, 직접 질문지를 읽으라고 하셔서 그 말을 따랐어요. 저장 위치도 질문지</text>
<text x="63.3" y="662.8" font-size="17.6" textLength="287.1" lengthAdjust="spacingAndGlyphs">지시대로 결과 폴더가 아니라 이 폴더예요.</text>
<text x="29.2" y="708.9" font-size="18.9" textLength="588.8" lengthAdjust="spacingAndGlyphs">화면 확인은 회사 PC에 없는 글꼴 대신 비슷한 한글 글꼴로 했어요. 실제 PC에서는 글자</text>
<text x="29.2" y="733.2" font-size="18.9" textLength="368.6" lengthAdjust="spacingAndGlyphs">폭이 조금 다를 수 있으니 한 번 열어서 확인해 주세요.</text>
<text x="118.0" y="788.5" font-size="15.2" textLength="126.5" lengthAdjust="spacingAndGlyphs">정책기획보고템플릿</text>
<text x="115.6" y="809.6" font-size="12.5" textLength="114.4" lengthAdjust="spacingAndGlyphs">프레젠테이션-PPTX</text>
<text x="501.2" y="798.3" font-size="15.1" textLength="107.1" lengthAdjust="spacingAndGlyphs">다운로드 및 열기</text></g><rect x=".5" y=".5" width="690" height="875" rx="6" fill="none" stroke="#d8cfc0"/></svg>