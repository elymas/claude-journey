<svg xmlns="http://www.w3.org/2000/svg" width="542" height="960" viewBox="0 0 542 960" role="img"><title>표지 가안 A · B · C</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H542" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="530" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 표지 가안 A · B · C</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="41.5" y="130.1" font-size="20.8" textLength="298.4" lengthAdjust="spacingAndGlyphs">3대 메가프로젝트가 막힐 수 있는 지점-</text>
