<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="610" viewBox="0 0 1030 610" role="img"><title>덱에서 ‘주문서 복사’를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1030" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1018" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 덱에서 ‘주문서 복사’를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="58.3" y="107.9" font-size="16.4" textLength="70.6" lengthAdjust="spacingAndGlyphs">• 돌아가기</text>
<text x="53.9" y="173.9" font-size="14.1" textLength="98.8" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="178.2" y="174.4" font-size="41.9" textLength="345.8" lengthAdjust="spacingAndGlyphs">콘티.md — 뭘 말할지만</text>
<text x="59.8" y="263.6" font-size="18.3" textLength="82.6" lengthAdjust="spacingAndGlyphs"># 발표 콘티</text>
<text x="62.9" y="286.6" font-size="20.1" textLength="271.0" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="61.4" y="327.5" font-size="17.0" textLength="61.4" lengthAdjust="spacingAndGlyphs">#할일</text>
<text x="60.1" y="346.4" font-size="22.0" textLength="369.1" lengthAdjust="spacingAndGlyphs">1. 부를 때 받은 결과 폴더의 기획안 한 개만 읽는다.</text>
<text x="85.3" y="370.8" font-size="18.6" textLength="175.2" lengthAdjust="spacingAndGlyphs">다른 파일은 읽지 않는다.</text>
<text x="59.9" y="393.1" font-size="20.2" textLength="491.0" lengthAdjust="spacingAndGlyphs">2. 장 수는 기획안 맨 위의 발표 시간에 맞춘다 (분당 한 장 안팎, 표지</text>
<text x="62.9" y="412.8" font-size="18.7" textLength="44.9" lengthAdjust="spacingAndGlyphs">포함) .</text>
<text x="85.3" y="432.5" font-size="17.2" textLength="465.6" lengthAdjust="spacingAndGlyphs">순서: 표지 → 배경 → 쟁점 → 제안 → 다음 단계 → 기대효과(마무리).</text>
<text x="61.4" y="456.3" font-size="18.8" textLength="32.9" lengthAdjust="spacingAndGlyphs">리) .</text>
<text x="85.8" y="473.8" font-size="26.4" textLength="334.8" lengthAdjust="spacingAndGlyphs">표지 부제는 기획안 맨 위의 목표를 그대로 쓴다.</text>
<text x="61.4" y="496.5" font-size="18.7" textLength="208.1" lengthAdjust="spacingAndGlyphs">3. 장마다 아래 네 줄만 쓴다.</text>
<text x="86.8" y="518.9" font-size="18.7" textLength="413.2" lengthAdjust="spacingAndGlyphs">색·글꼴·그림·배치 같은 모양 얘기는 한 글자도 쓰지 않는다.</text>
<text x="83.8" y="538.6" font-size="17.1" textLength="462.6" lengthAdjust="spacingAndGlyphs">- 제목: 그 장의 결론 한 문장 (기획안 덩어리의 첫 줄을 그대로 쓴</text>
<text x="61.4" y="559.6" font-size="17.1" textLength="24.0" lengthAdjust="spacingAndGlyphs">다)</text>
<text x="103.3" y="580.6" font-size="17.0" textLength="130.2" lengthAdjust="spacingAndGlyphs">본문: 세 문장 이하</text>
<text x="745.5" y="173.2" font-size="18.9" textLength="97.4" lengthAdjust="spacingAndGlyphs">단 주문서 복사</text>
<text x="565.9" y="204.7" font-size="17.2" textLength="146.7" lengthAdjust="spacingAndGlyphs">새 파일 • 전부 미번</text>
<text x="723.1" y="203.7" font-size="13.9" textLength="13.5" lengthAdjust="spacingAndGlyphs">주</text>
<text x="829.4" y="205.1" font-size="14.1" textLength="25.5" lengthAdjust="spacingAndGlyphs">수는</text>
<text x="880.2" y="173.5" font-size="17.5" textLength="92.9" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="865.3" y="204.9" font-size="15.7" textLength="136.2" lengthAdjust="spacingAndGlyphs">발표 시간이 정한다</text>
<text x="625.8" y="272.1" font-size="17.1" textLength="208.1" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="622.3" y="299.5" font-size="22.0" textLength="343.3" lengthAdjust="spacingAndGlyphs">잘 수는 시간이 정한다 - 3분 보고와 15분 발표가 같</text>
<text x="625.8" y="327.1" font-size="20.1" textLength="345.8" lengthAdjust="spacingAndGlyphs">은 여섯 장일 수 없다. 5주차에 시종이 물어본 발표 시간이</text>
<text x="625.7" y="351.2" font-size="20.6" textLength="92.9" lengthAdjust="spacingAndGlyphs">여기서 쓰인다.</text>
<text x="625.8" y="385.8" font-size="18.6" textLength="342.8" lengthAdjust="spacingAndGlyphs">네 줄만 - 제목• 본문•숫자• 노트, 슬라이드 한 장에 들어</text>
<text x="625.8" y="411.3" font-size="18.7" textLength="335.3" lengthAdjust="spacingAndGlyphs">갈 것이 이 넷뿐이라서다. 이 틀이 다음 주 템플릿의 자리</text>
<text x="625.7" y="433.9" font-size="19.3" textLength="103.4" lengthAdjust="spacingAndGlyphs">와 1:1로 맞는다.</text>
<text x="622.3" y="465.9" font-size="22.0" textLength="343.3" lengthAdjust="spacingAndGlyphs">모양 얘기 금지 - 내용 쓰는 시종이 &quot;파란색으로&quot;까지</text>
<text x="625.8" y="493.2" font-size="20.3" textLength="335.3" lengthAdjust="spacingAndGlyphs">정하면 다음에 색을 바꿀 때 콘티까지 다시 뽑아야 한다.</text>
<text x="622.3" y="512.9" font-size="22.2" textLength="274.7" lengthAdjust="spacingAndGlyphs">내용과 모양을 갈라 두면 하나만 고치면 된다.</text>
<text x="625.8" y="550.6" font-size="17.1" textLength="335.3" lengthAdjust="spacingAndGlyphs">제목 = 기획안 첫 줄 - 5주차에 결론 문장을 써둔 이</text>
<text x="627.3" y="574.6" font-size="17.1" textLength="199.1" lengthAdjust="spacingAndGlyphs">유. 콘티가 새로 지어내지 않는다.</text></g><rect x=".5" y=".5" width="1029" height="609" rx="6" fill="none" stroke="#d8cfc0"/></svg>