<text x="25.6" y="448.1" font-size="26.5" textLength="966.7" lengthAdjust="spacingAndGlyphs">| 260709 제26회 차관회의록(서울-세종).pdf | 1) 2026.7.9.(08:00~08:16) 정부서울청사-세종청사 영</text>
<text x="28.6" y="479.2" font-size="29.5" textLength="971.3" lengthAdjust="spacingAndGlyphs">상으로 열린 제26회 차관회의에서 총 25건(법률안 3, 대통령령안 18, 일반안 4)을 심의해 전건 원안</text>
<text x="28.5" y="511.1" font-size="37.3" textLength="977.5" lengthAdjust="spacingAndGlyphs">의결함. &lt;br&gt;2) 국가유산수리 등에 관한 법률 등 문화유산 관련 법률 3건, 「인공지능 발전과 신뢰 기</text>
<text x="30.1" y="539.4" font-size="29.5" textLength="963.7" lengthAdjust="spacingAndGlyphs">반 조성 등에 관한 기본법」 시행령 등 각 부처 시행령 개정안, 국립대학병원 관리 기능의 교육부-&gt;</text>
<text x="30.1" y="567.1" font-size="26.8" textLength="962.2" lengthAdjust="spacingAndGlyphs">보건복지부 이관 등 조직•인력 개편 안건이 상정됨.&lt;br&gt;3) 국무조정실장은 모두말씀에서 정기국회</text>
<text x="31.6" y="599.7" font-size="29.6" textLength="977.3" lengthAdjust="spacingAndGlyphs">법안 처리 협조, 구제역 확산 방지, 장마철 재난 대응, '모두의 생리대' 시범사업 점검을 각 부처에 당</text>
<text x="30.1" y="628.4" font-size="27.9" textLength="951.7" lengthAdjust="spacingAndGlyphs">부함. | 1) 경북 지역 농가에서 올해 두 번째 구제역이 발생해 차단방역 체계 가동, 인근 축산 농가</text>
<text x="30.1" y="659.8" font-size="29.5" textLength="951.7" lengthAdjust="spacingAndGlyphs">백신접종, 방역수칙 지도•단속이 시급한 과제로 제시됨(축산물 물가 상승률도 최근 높은 수준으로</text>
<text x="30.1" y="687.3" font-size="26.4" textLength="968.2" lengthAdjust="spacingAndGlyphs">언급됨).&lt;br&gt;2) '모두의 생리대' 시범사업(서울 은평구·경기 광명시 등 12개 지역)은 시행 초기 안내</text>
<text x="28.6" y="717.4" font-size="26.5" textLength="936.6" lengthAdjust="spacingAndGlyphs">부족•비치 누락 지적이 제기돼 현장 점검과 지역별 담당관 지정 등 보완이 필요하다고 지적됨. |</text>
