<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img"><title>가상 예시 ② 기획안을 연다 — 맨 위에 내 답, 덩어리 다섯의 첫 줄이 결론</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1400" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1388" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 가상 예시 ② 기획안을 연다 — 맨 위에 내 답, 덩어리 다섯의 첫 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="50.9" y="78.8" font-size="27.2" textLength="289.0" lengthAdjust="spacingAndGlyphs">2026-10-30_기획안.md - 메모장</text>
<text x="20.3" y="128.4" font-size="21.1" textLength="158.7" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="23.3" y="195.5" font-size="35.9" textLength="478.3" lengthAdjust="spacingAndGlyphs"># 기획안 - 11월 워크숍, 빈칸 두 개만 채우면 된다</text>
<text x="28.5" y="258.6" font-size="20.9" textLength="77.3" lengthAdjust="spacingAndGlyphs">## 내 답</text>
<text x="26.5" y="294.9" font-size="23.0" textLength="464.0" lengthAdjust="spacingAndGlyphs">- 목표: 워크숍 남은 일의 담당• 기한을 오늘 정한다</text>
<text x="26.5" y="331.3" font-size="25.3" textLength="563.7" lengthAdjust="spacingAndGlyphs">- 기대효과: 미확인 2건이 사라지고, 11/13 전에 준비가 끝난다</text>
<text x="26.5" y="367.5" font-size="27.3" textLength="232.0" lengthAdjust="spacingAndGlyphs">- 대상: 팀장님, 팀원 6명</text>
<text x="26.3" y="397.6" font-size="23.1" textLength="118.4" lengthAdjust="spacingAndGlyphs">- 시간: 10분</text>
<text x="1161.8" y="74.4" font-size="20.3" textLength="75.6" lengthAdjust="spacingAndGlyphs">가상 예시</text>
<text x="1286.0" y="75.3" font-size="23.0" textLength="111.9" lengthAdjust="spacingAndGlyphs">-ㅁ x</text>
<text x="28.3" y="468.2" font-size="24.4" textLength="98.0" lengthAdjust="spacingAndGlyphs">## 1. 배경</text>
<text x="28.5" y="502.3" font-size="23.0" textLength="217.7" lengthAdjust="spacingAndGlyphs">날짜와 장소는 정해졌다.</text>
<text x="26.5" y="538.3" font-size="27.2" textLength="523.0" lengthAdjust="spacingAndGlyphs">- 11/13(금) 워크숍 확정, 장소 섭외 끝 1 10/06 회의록</text>
<text x="28.4" y="606.2" font-size="23.8" textLength="97.8" lengthAdjust="spacingAndGlyphs">## 2. 쟁점</text>
<text x="30.5" y="644.0" font-size="27.3" textLength="557.6" lengthAdjust="spacingAndGlyphs">빈칸이 두 개 남았다 - 강사 섭외 기한, 집행 내역 정리 담당.</text>
<text x="26.5" y="673.1" font-size="23.2" textLength="476.2" lengthAdjust="spacingAndGlyphs">- 예산 300만 원 중 120만 원 집행 &lt; 10/20 회의록</text>
<text x="26.4" y="744.4" font-size="23.5" textLength="99.8" lengthAdjust="spacingAndGlyphs">## 3. 제안</text>
<text x="30.5" y="778.4" font-size="25.4" textLength="386.6" lengthAdjust="spacingAndGlyphs">오늘 두 빈칸의 담당과 기한을 정하고 간다.</text>
<text x="28.5" y="845.9" font-size="23.0" textLength="136.3" lengthAdjust="spacingAndGlyphs">## 4. 기대효과</text>
<text x="30.5" y="884.0" font-size="27.4" textLength="459.9" lengthAdjust="spacingAndGlyphs">미확인 2건이 사라지고, 11/13 전에 준비가 끝난다.</text>
<text x="28.5" y="951.6" font-size="23.2" textLength="144.5" lengthAdjust="spacingAndGlyphs">## 5. 다음 단계</text>
<text x="30.5" y="987.6" font-size="27.3" textLength="600.3" lengthAdjust="spacingAndGlyphs">오늘 정한 담당• 기한을 회의록에 적고, 다음 주간회의에서 확인한다.</text></g><rect x=".5" y=".5" width="1399" height="1019" rx="6" fill="none" stroke="#d8cfc0"/></svg>