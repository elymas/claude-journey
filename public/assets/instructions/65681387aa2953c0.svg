<svg xmlns="http://www.w3.org/2000/svg" width="547" height="789" viewBox="0 0 547 789" role="img"><title>③ ctrl+A — 전체 선택</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H547" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="535" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ③ ctrl+A — 전체 선택</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="29.3" y="84.2" font-size="28.2" textLength="127.1" lengthAdjust="spacingAndGlyphs">트 규칙.md</text>
<text x="389.8" y="81.5" font-size="23.6" textLength="25.1" lengthAdjust="spacingAndGlyphs">×</text>
<text x="24.0" y="130.8" font-size="22.5" textLength="208.5" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="25.1" y="178.5" font-size="24.9" textLength="388.7" lengthAdjust="spacingAndGlyphs">- 자료에 없는 내용을 지어내지 않는다.</text>
<text x="25.1" y="219.0" font-size="24.8" textLength="345.0" lengthAdjust="spacingAndGlyphs">- 원본 파일 이름을 바꾸지 않는다.</text>
<text x="453.1" y="85.5" font-size="25.9" textLength="40.4" lengthAdjust="spacingAndGlyphs">+</text>
<text x="21.9" y="299.8" font-size="29.0" textLength="84.4" lengthAdjust="spacingAndGlyphs">## 검증</text>
<text x="25.0" y="340.4" font-size="29.0" textLength="409.5" lengthAdjust="spacingAndGlyphs">- 숫자와 날짜는 원문에서 그대로 옮긴다.</text>
<text x="43.7" y="378.4" font-size="23.7" textLength="392.0" lengthAdjust="spacingAndGlyphs">계산이 필요하면 계산식을 같이 적는다.</text>
<text x="21.9" y="418.7" font-size="29.0" textLength="443.9" lengthAdjust="spacingAndGlyphs">- 원문에 없는 값은 비워두고 ‘미확인’ 목록에</text>
<text x="44.8" y="459.0" font-size="24.9" textLength="373.4" lengthAdjust="spacingAndGlyphs">따로 적는다. 추측해서 채우지 않는다.</text>
<text x="24.0" y="497.4" font-size="23.7" textLength="388.7" lengthAdjust="spacingAndGlyphs">- 각 항목이 어느 파일 어디에서 왔는지</text>
<text x="44.8" y="538.8" font-size="24.9" textLength="197.6" lengthAdjust="spacingAndGlyphs">결과에 같이 적는다.</text>
<text x="25.0" y="617.1" font-size="24.3" textLength="131.3" lengthAdjust="spacingAndGlyphs">## 완료 조건</text>
<text x="25.0" y="659.6" font-size="29.0" textLength="409.5" lengthAdjust="spacingAndGlyphs">위 세 줄을 지킨 결과물이 나오면 끝이다.</text>
<text x="28.4" y="698.3" font-size="23.7" textLength="369.0" lengthAdjust="spacingAndGlyphs">하나라도 못 지키면 멈추고 물어본다.</text>
<text x="41.5" y="780.4" font-size="22.6" textLength="208.5" lengthAdjust="spacingAndGlyphs">줄 32, 열 22 | 507/507자</text>
<text x="353.7" y="777.6" font-size="19.5" textLength="68.9" lengthAdjust="spacingAndGlyphs">AA 포맷</text></g><rect x=".5" y=".5" width="546" height="788" rx="6" fill="none" stroke="#d8cfc0"/></svg>