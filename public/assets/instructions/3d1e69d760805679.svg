<svg xmlns="http://www.w3.org/2000/svg" width="671" height="665" viewBox="0 0 671 665" role="img"><title>결과 — 덩어리마다 한 장, 본문은 기획안 근거 줄, 노트 맨 앞에 그 장의 시간</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H671" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="659" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 결과 — 덩어리마다 한 장, 본문은 기획안 근거 줄, 노트 맨 앞에 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="0.0" y="71.1" font-size="27.2" textLength="638.8" lengthAdjust="spacingAndGlyphs">콘티: 3대 메가프로젝트가 막힐 수 있는 지점 - 부처 간 이견과 제도</text>
<text x="0.0" y="95.8" font-size="25.2" textLength="47.8" lengthAdjust="spacingAndGlyphs">공백</text>
<text x="-0.0" y="131.4" font-size="22.3" textLength="657.3" lengthAdjust="spacingAndGlyphs">근거 파일: 결과/2026-10-08_기획안.md (이 기획안 1개만 읽고 작성함) 발표 시간: 15분 (표지 1</text>
<text x="0.0" y="152.4" font-size="18.1" textLength="410.6" lengthAdjust="spacingAndGlyphs">+ 배경 2+ 쟁점 4+ 제안 3+ 다음 단계 2+ 기대효과 3= 15)</text>
<text x="-0.8" y="228.3" font-size="24.8" textLength="57.5" lengthAdjust="spacingAndGlyphs">1. 표지</text>
<text x="15.6" y="259.6" font-size="18.1" textLength="526.7" lengthAdjust="spacingAndGlyphs">• 제목: 3대 메가프로젝트가 막힐 수 있는 지점 - 부처 간 이견과 제도 공백</text>
<text x="15.6" y="287.8" font-size="19.2" textLength="642.7" lengthAdjust="spacingAndGlyphs">• 본문: 최근 회의에서 어떤 안건이 보고되고 그중 반복해서 중요하게 다뤄지는 부분이 무엇</text>
<text x="44.8" y="312.3" font-size="19.5" textLength="105.4" lengthAdjust="spacingAndGlyphs">인지 알아낸다.</text>
<text x="16.4" y="338.5" font-size="17.8" textLength="90.0" lengthAdjust="spacingAndGlyphs">• 노트: 1분</text>
<text x="0.0" y="401.6" font-size="22.3" textLength="58.5" lengthAdjust="spacingAndGlyphs">2. 배경</text>
<text x="15.6" y="435.0" font-size="19.2" textLength="476.9" lengthAdjust="spacingAndGlyphs">• 제목: 투자 성과·메가프로젝트 보고 뒤에 남은 것을 짚을 시점이다</text>
<text x="16.4" y="461.2" font-size="17.3" textLength="65.6" lengthAdjust="spacingAndGlyphs">• 본문:</text>
<text x="55.6" y="493.0" font-size="23.3" textLength="584.2" lengthAdjust="spacingAndGlyphs">• 7월 28일 국무회의 모두말씀에서 순방 성과로 &quot;9,500억 불 규모의 반도체 분야 협</text>
<text x="84.9" y="514.7" font-size="21.1" textLength="391.1" lengthAdjust="spacingAndGlyphs">력&quot;과 &quot;SGW 규모의 AI 데이터센터 투자 협력&quot;을 언급함.</text>
<text x="55.6" y="542.3" font-size="19.2" textLength="602.7" lengthAdjust="spacingAndGlyphs">• 8월 6일 차관회의 모두말씀에서 3대 메가프로젝트•부동산 정책의 부처 간 협업 강화</text>
<text x="83.8" y="566.9" font-size="19.8" textLength="74.3" lengthAdjust="spacingAndGlyphs">를 당부함.</text>
<text x="55.6" y="594.9" font-size="19.2" textLength="600.8" lengthAdjust="spacingAndGlyphs">• 8월 11일 국무회의에서 3대 메가프로젝트 상생협력 강화방안이 보고됨. 5조 원 규모</text>
<text x="83.9" y="620.8" font-size="22.1" textLength="540.3" lengthAdjust="spacingAndGlyphs">반도체 펀드 신설, 광주 군공항 임시배치와 무안 군공항 착공 동시 시행이 담김.</text>
<text x="16.6" y="653.1" font-size="22.3" textLength="394.0" lengthAdjust="spacingAndGlyphs">• 노트: 2분. 7월 28일, 8월 6일, 8월 11일 순서로 짚는다.</text></g><rect x=".5" y=".5" width="670" height="664" rx="6" fill="none" stroke="#d8cfc0"/></svg>