<svg xmlns="http://www.w3.org/2000/svg" width="567" height="1025" viewBox="0 0 567 1025" role="img"><title>표지는 가안 셋을 장단점과 함께 보여 주고 고르라고 한다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H567" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="555" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 표지는 가안 셋을 장단점과 함께 보여 주고 고르라고 한다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="9.9" y="58.3" font-size="23.8" textLength="129.1" lengthAdjust="spacingAndGlyphs">7° 시안 작성 ~</text>
<text x="28.6" y="106.9" font-size="19.3" textLength="300.7" lengthAdjust="spacingAndGlyphs">명령 4개 실행함, 파일 읽음 외 도구 2개 더 •</text>
<text x="28.6" y="146.9" font-size="20.8" textLength="489.7" lengthAdjust="spacingAndGlyphs">표지 가안 3개를 만들어 결과 폴더에 2026-10-30_표지_가안.ppbx로 저장</text>
<text x="28.6" y="168.8" font-size="17.7" textLength="488.2" lengthAdjust="spacingAndGlyphs">했습니다. 한 장에 하나씩입니다. 시안9는 고르실 때까지 그대로 두었습니</text>
<text x="28.6" y="193.1" font-size="19.4" textLength="21.5" lengthAdjust="spacingAndGlyphs">다.</text>
<text x="525.5" y="58.4" font-size="17.7" textLength="17.2" lengthAdjust="spacingAndGlyphs">④</text>
<text x="34.4" y="227.7" font-size="17.8" textLength="494.0" lengthAdjust="spacingAndGlyphs">• 가안 A (보고서 표지형): 첫 번째 캡처의 녹색 보고서 표지를 참고했습</text>
<text x="63.0" y="252.0" font-size="17.9" textLength="458.2" lengthAdjust="spacingAndGlyphs">니다. 위쪽 2/3를 남색 판으로 채우고 제목 - 흰 가로선 -&gt; 부제 순서</text>
<text x="61.6" y="276.2" font-size="19.3" textLength="452.5" lengthAdjust="spacingAndGlyphs">로 놓았습니다. 남색 판 아래에는 자주색 띠가 있고, 그 아래 흰 칸은</text>
<text x="61.6" y="299.4" font-size="17.7" textLength="463.9" lengthAdjust="spacingAndGlyphs">기관명이나 날짜를 넣는 자리입니다. 셋 중 가장 공공기관 보고서답습</text>
<text x="63.0" y="323.8" font-size="17.7" textLength="34.4" lengthAdjust="spacingAndGlyphs">니다.</text>
<text x="32.9" y="352.2" font-size="19.4" textLength="488.2" lengthAdjust="spacingAndGlyphs">• 가안 B (가운데 정렬형): SWOT 캡처의 구성을 참고했습니다. 흰 바탕</text>
<text x="61.6" y="377.6" font-size="22.3" textLength="458.2" lengthAdjust="spacingAndGlyphs">위아래에 가는 회색 선을 긋고, 제목을 가운데 정렬했습니다. 두 번째</text>
<text x="61.6" y="401.1" font-size="19.3" textLength="451.0" lengthAdjust="spacingAndGlyphs">줄 '부처 간 이견과 제도 공백만 남색으로 강조하고, 그 아래에 짧은</text>
<text x="61.6" y="424.1" font-size="19.3" textLength="425.3" lengthAdjust="spacingAndGlyphs">주황 선을 넣었습니다. 가장 단정하지만 셋 중 가장 평범합니다.</text>
<text x="32.9" y="450.2" font-size="16.3" textLength="494.0" lengthAdjust="spacingAndGlyphs">• 가안 C (좌즉 분할형): 'MAKE IT SIMPLE'의 남색 판과 'OUR VISION'의</text>
<text x="63.0" y="476.8" font-size="20.7" textLength="455.3" lengthAdjust="spacingAndGlyphs">7자 선을 섞었습니다. 왼쪽은 남색 판에 자주색 사각형을 겹쳤고, 오</text>
<text x="61.6" y="500.0" font-size="19.2" textLength="459.6" lengthAdjust="spacingAndGlyphs">른쪽은 7자 선으로 제목 묶음을 감쌌습니다. 셋 중 가장 디자인 느낌</text>
<text x="61.6" y="523.2" font-size="17.8" textLength="380.9" lengthAdjust="spacingAndGlyphs">이 나서, 보고 자리에서는 조금 가벼워 보일 수 있습니다.</text>
<text x="28.6" y="570.1" font-size="20.7" textLength="492.5" lengthAdjust="spacingAndGlyphs">모두 직선과 사각형만 썼고, 템플릿 색(남색·자주·주황·회색)과 글꼴은 바꾸</text>
<text x="28.6" y="594.7" font-size="19.2" textLength="386.6" lengthAdjust="spacingAndGlyphs">지 않았습니다. 글자는 콘티 그대로이고, 줄만 나눴습니다.</text>
<text x="27.2" y="629.3" font-size="17.7" textLength="491.1" lengthAdjust="spacingAndGlyphs">제 추천은 A입니다. 보고 대상이 정부 회의 쟁점이라 '보고서 표지' 형식이</text>
<text x="28.6" y="655.0" font-size="19.3" textLength="385.2" lengthAdjust="spacingAndGlyphs">내용과 가장 잘 맞습니다. 다만 아래 흰 칸이 비어 있어서,</text>
<text x="121.7" y="676.9" font-size="16.3" textLength="184.7" lengthAdjust="spacingAndGlyphs">를 넣어야 완성돼 보입니다.</text>
<text x="27.2" y="713.7" font-size="19.3" textLength="492.5" lengthAdjust="spacingAndGlyphs">가안을 고르시고, 표지에 기관·작성자•날짜를 넣을지 알려 주세요. 시안9에</text>
<text x="28.6" y="736.9" font-size="17.7" textLength="242.0" lengthAdjust="spacingAndGlyphs">반영해 시안 10으로 저장하겠습니다.</text>
<text x="117.4" y="791.9" font-size="14.8" textLength="120.3" lengthAdjust="spacingAndGlyphs">표지 가안 미리보기</text>
<text x="117.4" y="813.4" font-size="14.9" textLength="229.1" lengthAdjust="spacingAndGlyphs">이미지 • JPG 저장 위치: 00프로젝트 기...</text>
<text x="372.3" y="801.9" font-size="14.8" textLength="158.9" lengthAdjust="spacingAndGlyphs">• 다운로드 및 열기</text>
<text x="116.0" y="870.9" font-size="14.9" textLength="137.5" lengthAdjust="spacingAndGlyphs">2026 10 30 표지 가안</text>
<text x="116.0" y="893.8" font-size="15.1" textLength="229.1" lengthAdjust="spacingAndGlyphs">프레젠테이션· PPTX- 저장 위치: 00프로...</text>
<text x="396.6" y="880.9" font-size="14.9" textLength="136.0" lengthAdjust="spacingAndGlyphs">다운로드 및 열기 | v</text>
<text x="45.8" y="934.9" font-size="17.7" textLength="151.8" lengthAdjust="spacingAndGlyphs">메시지를 입력하세요...</text>
<text x="45.8" y="972.0" font-size="19.3" textLength="130.3" lengthAdjust="spacingAndGlyphs">+ C N 자동 ~</text>
<text x="394.9" y="973.4" font-size="21.3" textLength="133.8" lengthAdjust="spacingAndGlyphs">Opus 5.5 높음 9</text>
<text x="60.1" y="1015.7" font-size="14.9" textLength="459.6" lengthAdjust="spacingAndGlyphs">Claude는 AI이므로 실수할 수 있습니다. 응답을 다시 한번 확인해 주세요. 의견 보내기</text></g><rect x=".5" y=".5" width="566" height="1024" rx="6" fill="none" stroke="#d8cfc0"/></svg>