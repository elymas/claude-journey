<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="931" viewBox="0 0 1400 931" role="img"><title>가상 예시 — 덩어리마다 몇 분인지 묻는다. 내 발표 시간으로 답하면 한 장씩, 시간은 노트에, 모양 얘기는 없다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1400" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1388" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 가상 예시 — 덩어리마다 몇 분인지 묻는다. 내 발표 시간으로 답하면</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="20.3" y="75.3" font-size="23.0" textLength="177.0" lengthAdjust="spacingAndGlyphs">워크숍 보고 콘티</text>
<text x="1058.1" y="73.9" font-size="18.9" textLength="75.3" lengthAdjust="spacingAndGlyphs">가상 예시</text>
<text x="1212.8" y="79.3" font-size="25.4" textLength="164.8" lengthAdjust="spacingAndGlyphs">회의록_2026 연결됨</text>
<text x="781.7" y="161.2" font-size="36.2" textLength="571.7" lengthAdjust="spacingAndGlyphs">「콘티.md 읽고, 결과 폴더의 2026-10-30_기획안.md로 콘티 써줘」</text>
<text x="34.6" y="220.7" font-size="17.0" textLength="57.0" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="32.6" y="258.3" font-size="25.4" textLength="508.7" lengthAdjust="spacingAndGlyphs">덩어리마다 몇 분 쓸까요? 10분 기준으로 먼저 나눠 봤어요.</text>
<text x="32.6" y="291.4" font-size="21.2" textLength="441.6" lengthAdjust="spacingAndGlyphs">배경 1• 쟁점 3 • 제안 3• 기대효과 1• 다음 단계 2</text>
<text x="1084.6" y="361.2" font-size="29.4" textLength="262.5" lengthAdjust="spacingAndGlyphs">쟁점 2분, 제안 4분으로 바꿔줘</text>
<text x="34.5" y="418.1" font-size="17.1" textLength="59.1" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="23.3" y="458.8" font-size="36.1" textLength="682.5" lengthAdjust="spacingAndGlyphs">✓ 결과 폴더에 2026-10-30_콘티.md로 저장했어요. 덩어리마다 한 장이에요.</text>
<text x="46.8" y="506.9" font-size="21.1" textLength="185.2" lengthAdjust="spacingAndGlyphs">장 제목 (결론)</text>
<text x="48.8" y="554.3" font-size="16.8" textLength="12.2" lengthAdjust="spacingAndGlyphs">1</text>
<text x="144.5" y="557.9" font-size="21.2" textLength="189.2" lengthAdjust="spacingAndGlyphs">날짜와 장소는 정해졌다</text>
<text x="48.8" y="607.2" font-size="16.8" textLength="12.2" lengthAdjust="spacingAndGlyphs">2</text>
<text x="144.5" y="613.8" font-size="27.2" textLength="472.1" lengthAdjust="spacingAndGlyphs">빈칸이 두 개 남았다 - 강사 섭외 기한, 집행 내역 정리 담당</text>
<text x="48.8" y="658.0" font-size="16.8" textLength="12.2" lengthAdjust="spacingAndGlyphs">3</text>
<text x="144.5" y="664.6" font-size="27.4" textLength="488.4" lengthAdjust="spacingAndGlyphs">오늘 강사 섭외 기한과 집행 정리 담당, 두 빈칸을 정하고 간다</text>
<text x="48.8" y="708.9" font-size="16.8" textLength="12.2" lengthAdjust="spacingAndGlyphs">4</text>
<text x="144.5" y="710.4" font-size="21.1" textLength="394.8" lengthAdjust="spacingAndGlyphs">미확인 2건이 사라지고 11/13 전에 준비가 끝난다</text>
<text x="48.8" y="759.7" font-size="16.8" textLength="12.2" lengthAdjust="spacingAndGlyphs">5</text>
<text x="91.6" y="761.1" font-size="21.0" textLength="425.3" lengthAdjust="spacingAndGlyphs">정한 담당 • 기한은 다음 주간회의에서 확인한다</text>
<text x="32.6" y="809.6" font-size="23.2" textLength="506.7" lengthAdjust="spacingAndGlyphs">색• 배치 같은 모양 얘기는 넣지 않았어요. 시안에서 정해요.</text>
<text x="1194.5" y="505.2" font-size="19.1" textLength="36.6" lengthAdjust="spacingAndGlyphs">노트</text>
<text x="1192.4" y="556.0" font-size="18.9" textLength="32.6" lengthAdjust="spacingAndGlyphs">1분</text>
<text x="1194.5" y="608.6" font-size="21.0" textLength="32.6" lengthAdjust="spacingAndGlyphs">2분</text>
<text x="1192.4" y="659.4" font-size="21.1" textLength="32.6" lengthAdjust="spacingAndGlyphs">4분</text>
<text x="1192.4" y="710.4" font-size="21.1" textLength="32.6" lengthAdjust="spacingAndGlyphs">1분</text>
<text x="1194.5" y="760.8" font-size="23.0" textLength="32.6" lengthAdjust="spacingAndGlyphs">2분</text>
<text x="54.9" y="883.2" font-size="21.0" textLength="193.3" lengthAdjust="spacingAndGlyphs">메시지를 입력하세요…</text></g><rect x=".5" y=".5" width="1399" height="930" rx="6" fill="none" stroke="#d8cfc0"/></svg>