<svg xmlns="http://www.w3.org/2000/svg" width="401" height="519" viewBox="0 0 401 519" role="img"><title>시안1 답의 끝에서 고칠 점을 묻는다 — 대화창에 원하는 것을 구체적으로 친다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H401" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="389" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 시안1 답의 끝에서 고칠 점을 묻는다 — 대화창에 원하는 것을 구체적</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="14.0" y="59.4" font-size="16.6" textLength="110.4" lengthAdjust="spacingAndGlyphs">발표자료 제작 g=</text>
<text x="44.7" y="87.4" font-size="15.9" textLength="33.5" lengthAdjust="spacingAndGlyphs">니다.</text>
<text x="248.0" y="57.0" font-size="10.6" textLength="42.0" lengthAdjust="spacingAndGlyphs">Cowork</text>
<text x="307.4" y="58.2" font-size="15.1" textLength="18.9" lengthAdjust="spacingAndGlyphs">[</text>
<text x="335.3" y="63.5" font-size="26.6" textLength="38.4" lengthAdjust="spacingAndGlyphs">-</text>
<text x="16.8" y="128.5" font-size="17.3" textLength="309.5" lengthAdjust="spacingAndGlyphs">글꼴: 템플릿 글꼴은 이사만루체(공게임즈)입니다.</text>
<text x="16.1" y="147.6" font-size="15.9" textLength="347.2" lengthAdjust="spacingAndGlyphs">Windows 글꼴 폴더 접근이 거부돼서 이 컴퓨터에 설치돼</text>
<text x="18.2" y="168.4" font-size="17.5" textLength="341.6" lengthAdjust="spacingAndGlyphs">있는지는 확인하지 못했습니다. 설치돼 있지 않으면 맑은</text>
<text x="17.5" y="190.4" font-size="19.6" textLength="344.4" lengthAdjust="spacingAndGlyphs">고딕으로 바꿔야 하는데, 그건 제가 모르는 사실이라 시안</text>
<text x="14.0" y="211.3" font-size="20.7" textLength="234.6" lengthAdjust="spacingAndGlyphs">1에는 이사만루체를 그대로 뒀습니다.</text>
<text x="16.0" y="241.5" font-size="20.7" textLength="342.9" lengthAdjust="spacingAndGlyphs">없다면 무료로 받을 수 있습니다. 공게임즈 다운로드에서</text>
<text x="17.5" y="261.1" font-size="18.9" textLength="333.9" lengthAdjust="spacingAndGlyphs">받고, 이용 조건은 경향게임스 기사에 개인•학교•기업• 공</text>
<text x="16.0" y="279.8" font-size="18.6" textLength="338.8" lengthAdjust="spacingAndGlyphs">익단체의 상업적 사용이 가능하고 서체 판매만 금지라고</text>
<text x="18.2" y="299.3" font-size="15.9" textLength="342.3" lengthAdjust="spacingAndGlyphs">나와 있습니다. 소속 기관이 써도 되는지는 제작사에 문의</text>
<text x="17.5" y="319.3" font-size="17.3" textLength="152.3" lengthAdjust="spacingAndGlyphs">하라는 안내가 있습니다.</text>
<text x="17.5" y="348.9" font-size="15.9" textLength="336.7" lengthAdjust="spacingAndGlyphs">고칠 점이 있으면 말씀해 주세요. 반영해서 시안2로 저장</text>
<text x="16.7" y="369.2" font-size="18.1" textLength="77.0" lengthAdjust="spacingAndGlyphs">하겠습니다.</text>
<text x="15.4" y="389.4" font-size="11.5" textLength="14.0" lengthAdjust="spacingAndGlyphs">단</text>
<text x="22.1" y="439.5" font-size="22.8" textLength="376.4" lengthAdjust="spacingAndGlyphs">사진이 왜 1장씩이야? 요구한대로 내용 설명할 수 있는 이미지 2-3</text>
<text x="22.1" y="457.7" font-size="23.0" textLength="372.9" lengthAdjust="spacingAndGlyphs">개 생성해줘 슬라이드마다. 내가 원하는대로 보완요한것나 자체</text>
<text x="23.8" y="472.9" font-size="18.9" textLength="225.0" lengthAdjust="spacingAndGlyphs">수정할게.이사만룻체는 나한테 있더라.</text>
<text x="23.8" y="498.5" font-size="15.8" textLength="21.0" lengthAdjust="spacingAndGlyphs">+</text>
<text x="257.8" y="497.5" font-size="13.1" textLength="105.5" lengthAdjust="spacingAndGlyphs">Sonnet 5.5 높음~</text>
<text x="380.0" y="497.6" font-size="12.2" textLength="11.2" lengthAdjust="spacingAndGlyphs">1</text></g><rect x=".5" y=".5" width="400" height="518" rx="6" fill="none" stroke="#d8cfc0"/></svg>