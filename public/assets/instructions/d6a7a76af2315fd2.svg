<text x="180.7" y="759.7" font-size="13.2" textLength="116.7" lengthAdjust="spacingAndGlyphs">행정안전부 의정담당관</text>
<text x="1004.0" y="142.3" font-size="20.1" textLength="78.4" lengthAdjust="spacingAndGlyphs">(08시 개회)</text>
<text x="578.8" y="166.4" font-size="18.1" textLength="198.3" lengthAdjust="spacingAndGlyphs">0 국민의례(사회 : 의정담당관]</text>
<text x="593.2" y="189.3" font-size="15.0" textLength="103.9" lengthAdjust="spacingAndGlyphs">국기에 대한 경례</text>
<text x="578.8" y="231.6" font-size="19.8" textLength="62.4" lengthAdjust="spacingAndGlyphs">0 개의</text>
<text x="591.6" y="256.1" font-size="16.5" textLength="305.4" lengthAdjust="spacingAndGlyphs">국무조정실장께서 제26회 차관회의 개의를 선포함.</text>
<text x="578.8" y="297.1" font-size="19.8" textLength="92.7" lengthAdjust="spacingAndGlyphs">• 모두 말씀</text>
<text x="598.0" y="322.7" font-size="19.7" textLength="481.3" lengthAdjust="spacingAndGlyphs">이번 주 월요일부터 7월 임시국회가 시작되었음. 소관 상임위별로 법안 심의도</text>
<text x="598.0" y="345.1" font-size="20.1" textLength="481.3" lengthAdjust="spacingAndGlyphs">재개될 예정인 만큼, 주요 국정과제나 민생 법안이 최대한 신속하게 처리될 수</text>
<text x="595.8" y="367.0" font-size="28.4" textLength="490.4" lengthAdjust="spacingAndGlyphs">있도록 국회와의 소동을 한층 강화해야 하겠음. 특히, 기본사회기본법 등 올해</text>
<text x="594.8" y="389.8" font-size="19.7" textLength="484.4" lengthAdjust="spacingAndGlyphs">3분기 중점 추진법안들에 대해서는 여당과의 긴밀한 협의는 물론, 야당에도 그</text>
<text x="598.0" y="410.9" font-size="18.2" textLength="267.0" lengthAdjust="spacingAndGlyphs">필요성과 시급성을 적극 설명해주시기 바람.</text>
<text x="598.0" y="454.1" font-size="16.5" textLength="481.3" lengthAdjust="spacingAndGlyphs">지난주 경북 지역 농가에서 올해 두 번째 구제역이 발생하였음. 가축전염병은</text>
<text x="598.0" y="477.9" font-size="18.1" textLength="481.2" lengthAdjust="spacingAndGlyphs">무엇보다 초기 대응이 중요한 만큼, 차단방역 체계 가동에 만전을 기해주시기</text>
<text x="598.0" y="498.8" font-size="18.5" textLength="481.3" lengthAdjust="spacingAndGlyphs">바람. 한편, 축산물 물가 상승률이 3월 이후 최고 수준인 만큼, 구제역이 확산되지</text>
<text x="598.0" y="519.6" font-size="16.5" textLength="481.3" lengthAdjust="spacingAndGlyphs">않도록 농식품부는 지방정부와 협력하여 인근 축산 농가들에 대한 백신접종을</text>
<text x="598.0" y="543.4" font-size="18.1" textLength="481.2" lengthAdjust="spacingAndGlyphs">조속히 완료하고 방역 수칙 준수에 대한 지도와 단속도 철저히 해 주시기 바람.</text>
<text x="598.0" y="587.8" font-size="19.8" textLength="481.3" lengthAdjust="spacingAndGlyphs">이번 주 월요일부터, '모두의 생리대' 시범 사업이 서울 은평구, 경기 광명시 등</text>
<text x="594.8" y="608.9" font-size="18.1" textLength="486.0" lengthAdjust="spacingAndGlyphs">12개 지역에서 순차적으로 시작되고 있음. 현재까지 긍정적인 반응이 많지만,</text>
<text x="596.4" y="630.1" font-size="16.7" textLength="484.4" lengthAdjust="spacingAndGlyphs">싹쓸이에 대한 우려나 생리대가 비치되지 않은 곳도 있다는 지적이 제기되고 있음.</text>
<text x="596.4" y="652.2" font-size="16.6" textLength="482.8" lengthAdjust="spacingAndGlyphs">아무리 좋은 취지의 정책이라도 시행 초기 사전 준비와 안내 부족으로 불편이</text>
<text x="596.4" y="674.6" font-size="16.5" textLength="482.8" lengthAdjust="spacingAndGlyphs">발생한다면 국민들께 외면받게 될 것임. 성평등부는 설치 장소에 대한 충분한</text>
<text x="596.4" y="697.1" font-size="16.6" textLength="482.8" lengthAdjust="spacingAndGlyphs">안내가 되어 있는지, 생리대가 제때 보충되고 있는지 등을 현장 점검을 통해 직접</text>
<text x="598.0" y="719.1" font-size="18.3" textLength="481.3" lengthAdjust="spacingAndGlyphs">확인해주시고, 시범 지역별 담당관을 지정하여 제도 안착 시까지 관리하는 방안도</text>
<text x="598.0" y="741.4" font-size="18.1" textLength="123.1" lengthAdjust="spacingAndGlyphs">검토해 주시기 바람.</text>
<text x="815.4" y="790.6" font-size="9.9" textLength="27.2" lengthAdjust="spacingAndGlyphs">- 2 -</text></g><rect x=".5" y=".5" width="1099" height="799" rx="6" fill="none" stroke="#d8cfc0"/></svg>