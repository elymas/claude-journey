<svg xmlns="http://www.w3.org/2000/svg" width="1289" height="669" viewBox="0 0 1289 669" role="img"><title>덩어리에 맞는 그림 — 콘티와 회의록 발언으로 만든 도식, 아래에 출처</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1289" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1277" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 덩어리에 맞는 그림 — 콘티와 회의록 발언으로 만든 도식, 아래에 출</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="61.8" y="97.6" font-size="40.7" textLength="104.9" lengthAdjust="spacingAndGlyphs">II. 제안</text>
<text x="84.3" y="191.0" font-size="31.1" textLength="650.1" lengthAdjust="spacingAndGlyphs">핵심 요약 해결책 대신, 멈춘 쟁점과 갈린 입장을 목록으로 올려 논의하자</text>
<text x="63.7" y="251.0" font-size="29.0" textLength="464.6" lengthAdjust="spacingAndGlyphs">• 쟁점마다 '해석으로 처리됨'인지 '규정화 요구됨' 인지</text>
<text x="85.9" y="273.8" font-size="33.1" textLength="402.8" lengthAdjust="spacingAndGlyphs">나눠 적으면, B월 11일에도 정리되지 않은 해석과</text>
<text x="88.1" y="302.0" font-size="27.3" textLength="415.9" lengthAdjust="spacingAndGlyphs">시행령•노동부령의 구도가 어디서 멈췄는지 보임.</text>
<text x="59.1" y="338.9" font-size="27.8" textLength="504.9" lengthAdjust="spacingAndGlyphs">• 부처 간 입장이 갈리는 사안은 감추지 않고 입장을 나란히</text>
<text x="88.1" y="367.5" font-size="27.3" textLength="468.4" lengthAdjust="spacingAndGlyphs">적음. 대통령이 이견 노출을 자연스러운 현상이라고 말한</text>
<text x="87.8" y="392.4" font-size="29.1" textLength="111.0" lengthAdjust="spacingAndGlyphs">방향과 맞음.</text>
<text x="1126.0" y="87.6" font-size="19.6" textLength="121.8" lengthAdjust="spacingAndGlyphs">3대 메가프로젝트</text>
<text x="779.4" y="261.8" font-size="19.3" textLength="116.2" lengthAdjust="spacingAndGlyphs">쟁점 논의용 목록</text>
<text x="781.3" y="277.6" font-size="13.5" textLength="249.2" lengthAdjust="spacingAndGlyphs">해결책이 아니라, 멈춘 쟁점과 갈린 입장을 올려 두는 목록</text>
<text x="785.0" y="306.9" font-size="17.5" textLength="99.3" lengthAdjust="spacingAndGlyphs">쟁점마다 나눠 적기</text>
<text x="816.8" y="344.6" font-size="17.8" textLength="56.3" lengthAdjust="spacingAndGlyphs">쟁의 대상</text>
<text x="831.9" y="366.6" font-size="19.6" textLength="39.3" lengthAdjust="spacingAndGlyphs">기준</text>
<text x="959.3" y="325.9" font-size="15.7" textLength="86.2" lengthAdjust="spacingAndGlyphs">해석으로 처리됨</text>
<text x="938.6" y="345.0" font-size="13.6" textLength="191.1" lengthAdjust="spacingAndGlyphs">노동부장관: 행정해석으로 이미 다 내렸음</text>
<text x="964.8" y="374.7" font-size="18.2" textLength="73.3" lengthAdjust="spacingAndGlyphs">규정화 요구됨</text>
<text x="940.5" y="392.0" font-size="13.9" textLength="193.0" lengthAdjust="spacingAndGlyphs">대통령: 해석과 시행령• 노동부령은 다르다</text>
<text x="785.0" y="430.8" font-size="15.5" textLength="185.5" lengthAdjust="spacingAndGlyphs">부처 입장은 감추지 않고 나란히 적기</text>
<text x="936.7" y="466.9" font-size="14.1" textLength="61.9" lengthAdjust="spacingAndGlyphs">산업부장관</text>
<text x="1002.3" y="466.5" font-size="15.7" textLength="91.9" lengthAdjust="spacingAndGlyphs">&quot; 필요한 것 같다*</text>
<text x="809.3" y="485.1" font-size="18.0" textLength="71.3" lengthAdjust="spacingAndGlyphs">주 52시간제</text>
<text x="831.9" y="505.7" font-size="15.5" textLength="28.1" lengthAdjust="spacingAndGlyphs">도입</text>
<text x="936.8" y="520.7" font-size="15.5" textLength="197.1" lengthAdjust="spacingAndGlyphs">노동부장관 안 된다. 신중해야 된다&quot;</text>
<text x="895.6" y="584.1" font-size="17.4" textLength="217.3" lengthAdjust="spacingAndGlyphs">(그림 4&gt; 쟁점 논의용 목록 (도식)</text>
<text x="835.6" y="604.4" font-size="19.3" textLength="335.4" lengthAdjust="spacingAndGlyphs">※ 도식: 콘티, 제35회 국무회의 회의록(2026,08.11.) 기준</text></g><rect x=".5" y=".5" width="1288" height="668" rx="6" fill="none" stroke="#d8cfc0"/></svg>