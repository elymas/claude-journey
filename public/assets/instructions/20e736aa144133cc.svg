<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="554" viewBox="0 0 1100 554" role="img"><title>주문서 복사 버튼을 누른 화면</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1100" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1088" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 주문서 복사 버튼을 누른 화면</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="27.2" y="190.8" font-size="49.6" textLength="583.6" lengthAdjust="spacingAndGlyphs">지난주 파일에 두 덩이만 얹는다</text>
<text x="769.0" y="167.5" font-size="21.4" textLength="121.5" lengthAdjust="spacingAndGlyphs">다 주문서 복사</text>
<text x="930.5" y="169.1" font-size="21.4" textLength="123.1" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="924.1" y="209.5" font-size="18.2" textLength="159.9" lengthAdjust="spacingAndGlyphs">이이번 주 추가분</text>
<text x="0.0" y="284.6" font-size="18.2" textLength="24.0" lengthAdjust="spacingAndGlyphs">! 안</text>
<text x="41.5" y="284.7" font-size="18.5" textLength="100.8" lengthAdjust="spacingAndGlyphs">{ 부를 이름</text>
<text x="-0.0" y="359.6" font-size="20.1" textLength="193.5" lengthAdjust="spacingAndGlyphs">기획안을 만드는 폴더다.</text>
<text x="0.0" y="433.3" font-size="18.5" textLength="187.1" lengthAdjust="spacingAndGlyphs">t.pptx 형식으로 만든다.</text>
<text x="0.0" y="508.1" font-size="20.1" textLength="359.7" lengthAdjust="spacingAndGlyphs">은 같은 폴더에 넣는다. 원본은 건드리지 않는다.</text>
<text x="625.1" y="294.1" font-size="20.1" textLength="263.8" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="623.5" y="336.4" font-size="24.8" textLength="430.1" lengthAdjust="spacingAndGlyphs">#정책자료 기획안 - 이게 스킬을 스킬로 만든</text>
<text x="626.4" y="381.0" font-size="41.8" textLength="413.3" lengthAdjust="spacingAndGlyphs">다. 이름이 없으면 파일일 뿐이고, 매번 그 파일</text>
<text x="625.1" y="410.6" font-size="31.6" textLength="188.7" lengthAdjust="spacingAndGlyphs">읽고”를 말해야 한다.</text>
<text x="623.5" y="462.3" font-size="26.4" textLength="420.5" lengthAdjust="spacingAndGlyphs"># 절차 - 전부 동사로 끝난다. 했는지 안 했는</text>
<text x="623.2" y="497.5" font-size="28.7" textLength="183.9" lengthAdjust="spacingAndGlyphs">지 눈으로 판정된다.</text>
<text x="623.3" y="546.0" font-size="23.7" textLength="426.2" lengthAdjust="spacingAndGlyphs">나머지 항목 - 손대지 않았다. 지난주에 한 번 통</text></g><rect x=".5" y=".5" width="1099" height="553" rx="6" fill="none" stroke="#d8cfc0"/></svg>