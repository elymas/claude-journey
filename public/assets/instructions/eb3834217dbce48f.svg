<svg xmlns="http://www.w3.org/2000/svg" width="401" height="526" viewBox="0 0 401 526" role="img"><title>다음 고칠 점도 말로 — “링크가 클릭이 안 돼. 클릭 되게 바꿔줘.”</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H401" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="389" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 다음 고칠 점도 말로 — “링크가 클릭이 안 돼. 클릭 되게 바꿔줘.</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="8.5" y="63.2" font-size="16.8" textLength="109.8" lengthAdjust="spacingAndGlyphs">발표자료 제작 8=</text>
<text x="238.7" y="60.8" font-size="10.8" textLength="46.2" lengthAdjust="spacingAndGlyphs">Cowork</text>
<text x="80.8" y="83.0" font-size="8.0" textLength="58.8" lengthAdjust="spacingAndGlyphs">&quot;.~.</text>
<text x="158.7" y="82.5" font-size="8.0" textLength="19.1" lengthAdjust="spacingAndGlyphs">..</text>
<text x="14.2" y="128.0" font-size="16.2" textLength="341.5" lengthAdjust="spacingAndGlyphs">• 그림: 모두 도형으로 그린 것이라 글자와 위치를 바로</text>
<text x="39.0" y="148.2" font-size="17.6" textLength="314.6" lengthAdjust="spacingAndGlyphs">고칠 수 있어요. 글꼴은 템플릿의 이사만루체 그대로</text>
<text x="40.4" y="168.2" font-size="16.8" textLength="46.8" lengthAdjust="spacingAndGlyphs">입니다.</text>
<text x="10.1" y="191.9" font-size="19.0" textLength="336.2" lengthAdjust="spacingAndGlyphs">• 캡처: 3개는 폴더에 있는 국무회의·차관회의 회의록</text>
<text x="36.8" y="211.3" font-size="18.4" textLength="318.1" lengthAdjust="spacingAndGlyphs">PDF에서 인용 부분만 잘라 파란색으로 표시한 PNG</text>
<text x="39.7" y="231.2" font-size="17.6" textLength="319.5" lengthAdjust="spacingAndGlyphs">예요. 이 PDF는 공개 링크를 찾지 못했습니다. 정책브</text>
<text x="39.7" y="250.6" font-size="16.2" textLength="316.0" lengthAdjust="spacingAndGlyphs">리핑과 뉴스 링크는 관련 자료일 뿐 인용문 원문은 들</text>
<text x="39.7" y="272.9" font-size="19.0" textLength="304.6" lengthAdjust="spacingAndGlyphs">어 있지 않아서, 참고 자료 장에 그렇게 적어 두었어</text>
<text x="39.0" y="291.1" font-size="15.5" textLength="19.8" lengthAdjust="spacingAndGlyphs">요.</text>
<text x="14.2" y="315.1" font-size="16.1" textLength="341.5" lengthAdjust="spacingAndGlyphs">• 글꼴: 이 작업 환경에는 이사만루체가 없어서 대체 글</text>
<text x="39.0" y="335.5" font-size="17.5" textLength="314.6" lengthAdjust="spacingAndGlyphs">꼴로 확인했습니다. 선생님 컴퓨터에서 열었을 때 줄</text>
<text x="38.5" y="358.3" font-size="21.0" textLength="182.3" lengthAdjust="spacingAndGlyphs">바꿈이 어긋나면 알려 주세요.</text>
<text x="12.0" y="395.9" font-size="16.8" textLength="140.3" lengthAdjust="spacingAndGlyphs">고칠 점을 알려 주세요.</text>
<text x="330.2" y="69.7" font-size="30.7" textLength="36.8" lengthAdjust="spacingAndGlyphs">-</text>
<text x="374.1" y="62.1" font-size="14.6" textLength="15.6" lengthAdjust="spacingAndGlyphs">×</text>
<text x="19.8" y="462.2" font-size="19.0" textLength="290.5" lengthAdjust="spacingAndGlyphs">마지막으로, 링크가 클릭이 안 돼. 클릭 되게 바꿔줘.</text>
<text x="18.4" y="504.1" font-size="19.0" textLength="19.1" lengthAdjust="spacingAndGlyphs">+</text>
<text x="252.9" y="500.8" font-size="12.5" textLength="106.3" lengthAdjust="spacingAndGlyphs">Sonnet 5.5 높음 ~</text>
<text x="374.8" y="501.5" font-size="12.4" textLength="10.6" lengthAdjust="spacingAndGlyphs">1</text></g><rect x=".5" y=".5" width="400" height="525" rx="6" fill="none" stroke="#d8cfc0"/></svg>