<svg xmlns="http://www.w3.org/2000/svg" width="552" height="763" viewBox="0 0 552 763" role="img"><title>질문지 ① 색 — 팔레트 캡처 칸의 괄호를 찾는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H552" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="540" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 질문지 ① 색 — 팔레트 캡처 칸의 괄호를 찾는다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="509.9" y="55.1" font-size="13.0" textLength="26.3" lengthAdjust="spacingAndGlyphs">X</text>
<text x="12.4" y="69.4" font-size="20.4" textLength="139.5" lengthAdjust="spacingAndGlyphs">템플릿_질문지.md</text>
<text x="297.1" y="68.6" font-size="14.1" textLength="13.7" lengthAdjust="spacingAndGlyphs">+</text>
<text x="9.5" y="100.1" font-size="15.2" textLength="139.1" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="39.0" y="116.8" font-size="8.7" textLength="41.1" lengthAdjust="spacingAndGlyphs">ㄱVㄹ</text>
<text x="388.7" y="114.9" font-size="8.0" textLength="114.8" lengthAdjust="spacingAndGlyphs">DVITATET.</text>
<text x="11.6" y="136.4" font-size="19.7" textLength="387.2" lengthAdjust="spacingAndGlyphs">5. ‘템플릿 이름’ 칸의 이름 뒤에 _템플릿을 붙여 저장한다.</text>
<text x="27.4" y="157.3" font-size="20.7" textLength="316.0" lengthAdjust="spacingAndGlyphs">예: 이름이 청록보고면 → 청록보고_템플릿.pptx</text>
<text x="27.4" y="175.6" font-size="18.6" textLength="360.3" lengthAdjust="spacingAndGlyphs">이름에 이미 ‘템플릿’이 들어 있으면 또 붙이지 않는다.</text>
<text x="27.4" y="195.6" font-size="18.5" textLength="394.0" lengthAdjust="spacingAndGlyphs">저장 위치는 결과 폴더가 아니라 이 폴더(정책자료 폴더)다.</text>
<text x="27.4" y="216.4" font-size="19.6" textLength="493.0" lengthAdjust="spacingAndGlyphs">규칙.md에 ‘새 파일은 결과 폴더에’가 있어도, 이 파일만은 이 폴더에 둔다.</text>
<text x="28.4" y="234.7" font-size="17.5" textLength="392.9" lengthAdjust="spacingAndGlyphs">템플릿은 결과물이 아니라 다음 시안의 재료이기 때문이다.</text>
<text x="27.4" y="256.4" font-size="19.6" textLength="356.2" lengthAdjust="spacingAndGlyphs">같은 이름이 있으면 덮어쓰지 말고 뒤에 _2를 붙인다.</text>
<text x="11.6" y="275.6" font-size="18.6" textLength="221.2" lengthAdjust="spacingAndGlyphs">6. 다 만들면 채팅으로 보여 준다:</text>
<text x="24.2" y="294.7" font-size="17.5" textLength="245.5" lengthAdjust="spacingAndGlyphs">- 스물한 장 목록 (장 번호 / 장 종류)</text>
<text x="24.2" y="313.8" font-size="16.3" textLength="292.9" lengthAdjust="spacingAndGlyphs">- 질문지 답마다 어디에 반영했는지 한 줄씩</text>
<text x="24.2" y="336.7" font-size="19.7" textLength="331.8" lengthAdjust="spacingAndGlyphs">- ‘알아서’로 정한 값, 그리고 못 지킨 답과 그 이유</text>
<text x="10.5" y="374.1" font-size="15.2" textLength="103.2" lengthAdjust="spacingAndGlyphs">## 템플릿 이름</text>
<text x="9.5" y="394.9" font-size="17.5" textLength="187.5" lengthAdjust="spacingAndGlyphs">- 이름: ( ) ← 예: 청록보고</text>
<text x="10.5" y="434.9" font-size="17.5" textLength="57.9" lengthAdjust="spacingAndGlyphs">##① 색</text>
<text x="9.4" y="457.4" font-size="23.0" textLength="355.2" lengthAdjust="spacingAndGlyphs">- 팔레트 캡처: 디자인 폴더의 ( ) ← 예: 팔레트.png</text>
<text x="10.5" y="494.9" font-size="17.5" textLength="73.7" lengthAdjust="spacingAndGlyphs">##② 모양</text>
<text x="8.4" y="514.9" font-size="17.5" textLength="246.5" lengthAdjust="spacingAndGlyphs">- 모서리: (둥글게 / 각지게 / 알아서)</text>
<text x="9.5" y="535.0" font-size="17.4" textLength="214.9" lengthAdjust="spacingAndGlyphs">- 제목 글꼴: ( ) 본문 글꼴: ( )</text>
<text x="9.5" y="555.9" font-size="18.5" textLength="320.2" lengthAdjust="spacingAndGlyphs">- 글자 크기: 제목 ( )pt · 본문 ( )pt · 캡션 ( )pt</text>
<text x="9.5" y="575.0" font-size="17.4" textLength="105.3" lengthAdjust="spacingAndGlyphs">- 여백•정렬: ( )</text>
<text x="9.5" y="615.2" font-size="17.5" textLength="280.2" lengthAdjust="spacingAndGlyphs">## ③ 그래프 모양 — 숫자는 적지 않는다</text>
<text x="9.5" y="635.2" font-size="17.5" textLength="300.2" lengthAdjust="spacingAndGlyphs">·자주 쓰는 그래프 — 막대 / 선 / 원 / 알아서</text>
<text x="9.5" y="655.2" font-size="17.5" textLength="311.8" lengthAdjust="spacingAndGlyphs">- 색 순서: (기본색 → 보조색 → 회색 / 알아서)</text>
<text x="9.5" y="675.2" font-size="17.5" textLength="152.7" lengthAdjust="spacingAndGlyphs">·눈금선 — 옅게 / 없음</text>
<text x="9.5" y="695.1" font-size="17.5" textLength="250.7" lengthAdjust="spacingAndGlyphs">·값 표시 — 막대·점 위에 / 표시 안 함</text>
<text x="9.5" y="716.0" font-size="18.6" textLength="272.8" lengthAdjust="spacingAndGlyphs">·출처 자리 — 그래프 아래 왼쪽, 작은 글씨</text>
<text x="20.0" y="752.4" font-size="15.4" textLength="124.3" lengthAdjust="spacingAndGlyphs">줄 55, 열 38 2,832자</text>
<text x="200.2" y="750.7" font-size="11.9" textLength="72.7" lengthAdjust="spacingAndGlyphs">Ml Markdo...</text>
<text x="301.2" y="750.6" font-size="13.2" textLength="33.8" lengthAdjust="spacingAndGlyphs">100%</text>
<text x="363.4" y="750.7" font-size="11.9" textLength="89.5" lengthAdjust="spacingAndGlyphs">Windows (CRL</text>
<text x="454.0" y="749.8" font-size="10.9" textLength="40.0" lengthAdjust="spacingAndGlyphs">UTF-8</text></g><rect x=".5" y=".5" width="551" height="762" rx="6" fill="none" stroke="#d8cfc0"/></svg>