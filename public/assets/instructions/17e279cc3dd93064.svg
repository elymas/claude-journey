<svg xmlns="http://www.w3.org/2000/svg" width="536" height="874" viewBox="0 0 536 874" role="img"><title>메모장에서 파일 → 새 Markdown 탭, Ctrl + V로 붙여 넣는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H536" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="524" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 메모장에서 파일 → 새 Markdown 탭, Ctrl + V로 붙여 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="17.0" y="70.6" font-size="18.9" textLength="142.2" lengthAdjust="spacingAndGlyphs"># 템플릿_시안만들기</text>
<text x="13.4" y="102.6" font-size="15.0" textLength="139.8" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="13.4" y="146.9" font-size="20.0" textLength="142.2" lengthAdjust="spacingAndGlyphs"># 템플릿_시안만들기</text>
<text x="17.0" y="165.5" font-size="17.5" textLength="266.2" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="15.7" y="203.5" font-size="16.7" textLength="58.4" lengthAdjust="spacingAndGlyphs">## 할 일</text>
<text x="15.8" y="225.1" font-size="17.6" textLength="251.6" lengthAdjust="spacingAndGlyphs">1. 정책자료 폴더(결과 폴더 제외)에서</text>
<text x="31.6" y="246.5" font-size="20.0" textLength="373.1" lengthAdjust="spacingAndGlyphs">이름에 ‘템플릿’이나 ‘template’이 들어간 pptx를 찾는다.</text>
<text x="32.8" y="267.2" font-size="20.0" textLength="362.2" lengthAdjust="spacingAndGlyphs">여러 개면 어느 것을 쓸지 묻고, 없으면 멈추고 묻는다.</text>
<text x="14.6" y="285.6" font-size="18.9" textLength="326.9" lengthAdjust="spacingAndGlyphs">2. 그 파일을 복제해서 쓴다. 새로 그리지 않는다.</text>
<text x="31.6" y="305.2" font-size="17.6" textLength="168.9" lengthAdjust="spacingAndGlyphs">색·글꼴은 바꾸지 않는다.</text>
<text x="15.8" y="326.7" font-size="20.1" textLength="317.2" lengthAdjust="spacingAndGlyphs">3. 부를 때 받은 결과 폴더의 콘티 한 개를 읽고,</text>
<text x="32.8" y="345.4" font-size="17.7" textLength="350.0" lengthAdjust="spacingAndGlyphs">덩어리마다 템플릿에서 가장 맞는 장을 골라 넣는다.</text>
<text x="31.6" y="366.8" font-size="20.0" textLength="408.4" lengthAdjust="spacingAndGlyphs">목차 장은 덩어리 이름으로 채우고, 마무리 장은 그대로 둔다.</text>
<text x="31.6" y="384.2" font-size="17.6" textLength="271.0" lengthAdjust="spacingAndGlyphs">예시 글자는 지우고 콘티 글자만 넣는다.</text>
<text x="32.8" y="405.9" font-size="18.9" textLength="215.1" lengthAdjust="spacingAndGlyphs">노트는 슬라이드 노트에 넣는다.</text>
<text x="32.8" y="426.4" font-size="20.3" textLength="261.3" lengthAdjust="spacingAndGlyphs">대신, 노트를 설명할 수 있는 깔끔하고</text>
<text x="32.8" y="444.9" font-size="17.7" textLength="365.8" lengthAdjust="spacingAndGlyphs">템플릿 분위기/색감에 어울리는 그림을 하나씩 넣는다.</text>
<text x="32.8" y="466.4" font-size="20.0" textLength="408.4" lengthAdjust="spacingAndGlyphs">단, 그림을 넣기 전에 해당 자료가 공신력 있는 기관의 자료나</text>
<text x="31.6" y="486.1" font-size="18.8" textLength="271.0" lengthAdjust="spacingAndGlyphs">뉴스 기사로 발표된 바 있는지 찾아본다.</text>
<text x="32.8" y="504.5" font-size="17.5" textLength="320.9" lengthAdjust="spacingAndGlyphs">만약 그렇다면 해당 자료를 캡쳐해서 2-3개 넣고</text>
<text x="32.8" y="526.3" font-size="18.9" textLength="261.3" lengthAdjust="spacingAndGlyphs">어울리는 그림도 2-3개 만들어 넣는다.</text>
<text x="31.6" y="544.6" font-size="17.6" textLength="273.5" lengthAdjust="spacingAndGlyphs">캡처 아래에는 출처(기관·날짜)를 적는다.</text>
<text x="31.6" y="566.1" font-size="20.0" textLength="216.3" lengthAdjust="spacingAndGlyphs">각 이미지는 개별적이어야 한다.</text>
<text x="31.6" y="584.8" font-size="17.6" textLength="316.0" lengthAdjust="spacingAndGlyphs">사용자가 편집을 자유롭게 해야 하기 때문이다.</text>
<text x="32.8" y="604.1" font-size="17.5" textLength="268.6" lengthAdjust="spacingAndGlyphs">맨 마지막 장에는 참고 자료 장을 만들어</text>
<text x="31.6" y="624.8" font-size="17.5" textLength="317.2" lengthAdjust="spacingAndGlyphs">캡처·그림·콘티의 출처와 링크를 모두 정리한다.</text>
<text x="32.8" y="645.3" font-size="18.9" textLength="324.5" lengthAdjust="spacingAndGlyphs">템플릿에 참고 자료 장이 있으면 그 모양을 쓴다.</text>
<text x="15.8" y="667.1" font-size="20.3" textLength="427.8" lengthAdjust="spacingAndGlyphs">4. 결과 폴더에 YYYY-MM-DD_발표자료_시안N.pptx로 저장하고,</text>
<text x="31.6" y="684.4" font-size="17.7" textLength="319.7" lengthAdjust="spacingAndGlyphs">장마다 무엇을 어디에 넣었는지 짧게 보여 준 뒤</text>
<text x="31.6" y="705.1" font-size="17.7" textLength="121.5" lengthAdjust="spacingAndGlyphs">고칠 점을 묻는다.</text>
<text x="15.8" y="725.6" font-size="18.9" textLength="387.7" lengthAdjust="spacingAndGlyphs">5. 고칠 점을 말하면 그대로 반영해 다음 번호로 저장한다.</text>
<text x="31.6" y="744.0" font-size="16.3" textLength="210.3" lengthAdjust="spacingAndGlyphs">다음 발표자료에도 지킬 것이면</text>
<text x="32.8" y="764.5" font-size="17.6" textLength="295.2" lengthAdjust="spacingAndGlyphs">맨 아래 ‘## 내 수정 규칙’에 한 줄로 더한다.</text>
<text x="31.6" y="786.2" font-size="18.9" textLength="256.5" lengthAdjust="spacingAndGlyphs">한 번만 고칠 것인지 헷갈리면 묻는다.</text>
<text x="15.8" y="805.6" font-size="18.9" textLength="147.1" lengthAdjust="spacingAndGlyphs">6. 처음 부를 때 한 번:</text>
<text x="32.8" y="826.3" font-size="18.9" textLength="379.2" lengthAdjust="spacingAndGlyphs">템플릿에 쓰인 글꼴 중 이 컴퓨터에 없는 것만 알려 주고,</text>
<text x="31.6" y="844.8" font-size="17.6" textLength="356.1" lengthAdjust="spacingAndGlyphs">무료로 받는 경로와 기관에서 써도 되는지 찾아 준다.</text>
<text x="32.8" y="865.4" font-size="17.6" textLength="220.0" lengthAdjust="spacingAndGlyphs">링크는 실제로 찾은 것만 적는다.</text></g><rect x=".5" y=".5" width="535" height="873" rx="6" fill="none" stroke="#d8cfc0"/></svg>