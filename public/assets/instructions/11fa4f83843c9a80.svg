<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="628" viewBox="0 0 1030 628" role="img"><title>‘주문서 복사’를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1030" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1018" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ‘주문서 복사’를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="74.8" y="110.7" font-size="15.6" textLength="53.9" lengthAdjust="spacingAndGlyphs">돌아가기</text>
<text x="53.9" y="176.9" font-size="14.1" textLength="98.8" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="178.2" y="177.6" font-size="40.4" textLength="338.3" lengthAdjust="spacingAndGlyphs">템플릿_시안만들기.md</text>
<text x="59.9" y="266.1" font-size="17.1" textLength="139.2" lengthAdjust="spacingAndGlyphs"># 템플릿_시안만들기</text>
<text x="62.9" y="288.4" font-size="18.6" textLength="271.0" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="59.9" y="330.5" font-size="17.0" textLength="62.9" lengthAdjust="spacingAndGlyphs">#할 일</text>
<text x="59.9" y="352.8" font-size="18.5" textLength="263.5" lengthAdjust="spacingAndGlyphs">1. 정책자료 폴더(결과 폴더 제외)에서</text>
<text x="81.5" y="372.1" font-size="26.8" textLength="416.0" lengthAdjust="spacingAndGlyphs">이름에 ‘템플릿’이나 ‘template’이 들어간 pptx를 찾는다.</text>
<text x="86.8" y="396.1" font-size="20.2" textLength="375.8" lengthAdjust="spacingAndGlyphs">여러 개면 어느 것을 쓸지 묻고, 없으면 멈추고 묻는다.</text>
<text x="60.1" y="414.7" font-size="26.4" textLength="347.6" lengthAdjust="spacingAndGlyphs">2. 그 파일을 복제해서 쓴다. 새로 그리지 않는다.</text>
<text x="86.8" y="436.8" font-size="18.7" textLength="173.7" lengthAdjust="spacingAndGlyphs">색·글꼴은 바꾸지 않는다.</text>
<text x="55.8" y="457.6" font-size="26.8" textLength="343.3" lengthAdjust="spacingAndGlyphs">3. 부를 때 받은 결과 폴더의 콘티 한 개를 읽고,</text>
<text x="86.8" y="478.6" font-size="18.5" textLength="351.8" lengthAdjust="spacingAndGlyphs">덩어리마다 템플릿에서 가장 맞는 장을 골라 넣는다.</text>
<text x="86.8" y="502.0" font-size="21.8" textLength="417.7" lengthAdjust="spacingAndGlyphs">목차 장은 덩어리 이름으로 채우고, 마무리 장은 그대로 둔다.</text>
<text x="85.8" y="517.9" font-size="22.3" textLength="274.7" lengthAdjust="spacingAndGlyphs">예시 글자는 지우고 콘티 글자만 넣는다.</text>
<text x="86.8" y="542.9" font-size="18.7" textLength="215.6" lengthAdjust="spacingAndGlyphs">노트는 슬라이드 노트에 넣는다.</text>
<text x="86.8" y="565.2" font-size="20.2" textLength="263.5" lengthAdjust="spacingAndGlyphs">대신, 노트를 설명할 수 있는 깔끔하고</text>
<text x="86.8" y="583.6" font-size="17.1" textLength="365.3" lengthAdjust="spacingAndGlyphs">템플릿 분위기/색감에 어울리는 그림을 하나씩 넣는다.</text>
<text x="745.5" y="176.3" font-size="19.2" textLength="97.4" lengthAdjust="spacingAndGlyphs">다 주문서 복사</text>
<text x="747.0" y="208.1" font-size="15.8" textLength="52.5" lengthAdjust="spacingAndGlyphs">새 파밀</text>
<text x="856.3" y="206.7" font-size="13.9" textLength="13.5" lengthAdjust="spacingAndGlyphs">을</text>
<text x="880.3" y="176.5" font-size="17.2" textLength="107.8" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="878.8" y="207.9" font-size="15.7" textLength="122.8" lengthAdjust="spacingAndGlyphs">받고 말로 고친다</text>
<text x="622.3" y="274.3" font-size="22.1" textLength="210.3" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="622.3" y="304.3" font-size="22.2" textLength="351.9" lengthAdjust="spacingAndGlyphs">붙여 넣는다 - 콘티.md처럼 주문서가 정해져 있어야 누</text>
<text x="622.3" y="329.8" font-size="22.1" textLength="188.8" lengthAdjust="spacingAndGlyphs">가 돌려도 같은 시안이 나온다.</text>
<text x="622.3" y="364.0" font-size="22.0" textLength="347.6" lengthAdjust="spacingAndGlyphs">목제 - 템플릿을 새로 그리지 않고 그 서식을 쓴다. 말 스</text>
<text x="622.3" y="389.8" font-size="22.2" textLength="303.9" lengthAdjust="spacingAndGlyphs">무 개로 설명할 때 생기던 차이가 없다. 말 파일.</text>
<text x="622.3" y="423.8" font-size="22.2" textLength="343.3" lengthAdjust="spacingAndGlyphs">덩어리에 맞는 장- 쟁점은 두 칸, 기대효과는 카드 세</text>
<text x="625.8" y="449.0" font-size="17.2" textLength="241.0" lengthAdjust="spacingAndGlyphs">개처럼 템플릿에 이미 있는 장을 고른다.</text>
<text x="625.8" y="484.5" font-size="18.5" textLength="336.8" lengthAdjust="spacingAndGlyphs">그림 - 글만 있으면 장 아래가 빈다. 공신력 있는 자료가</text>
<text x="625.8" y="511.2" font-size="20.3" textLength="344.3" lengthAdjust="spacingAndGlyphs">있으면 그걸 캡처해 넣고, 어울리는 그림도 만든다. 그림은</text>
<text x="622.3" y="530.8" font-size="22.1" textLength="347.6" lengthAdjust="spacingAndGlyphs">하나씩 따로 - 내가 옮기고 지울 수 있게. 캡처 아래엔 출</text>
<text x="625.8" y="556.4" font-size="18.7" textLength="248.5" lengthAdjust="spacingAndGlyphs">처, 맨 마지막 장엔 출처와 링크를 모은다.</text>
<text x="627.3" y="589.6" font-size="17.1" textLength="347.3" lengthAdjust="spacingAndGlyphs">시안 - 말로 고친다 - 고칠 건 파워포인트가 아니라 말</text></g><rect x=".5" y=".5" width="1029" height="627" rx="6" fill="none" stroke="#d8cfc0"/></svg>