<svg xmlns="http://www.w3.org/2000/svg" width="613" height="287" viewBox="0 0 613 287" role="img"><title>Ctrl + S → ‘Markdown 파일로…’ → 정책자료 폴더에 템플릿_시안만들기.md로 저장</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H613" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="601" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · Ctrl + S → ‘Markdown 파일로…’ → 정책자료 폴더에 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="0.0" y="55.3" font-size="15.8" textLength="37.4" lengthAdjust="spacingAndGlyphs">[트는</text>
