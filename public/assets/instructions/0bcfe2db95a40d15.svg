<svg xmlns="http://www.w3.org/2000/svg" width="786" height="938" viewBox="0 0 786 938" role="img"><title>결과 — 고친 항목은 파일 맨 아래 ‘점검 기록’에 적혔다고 알려준다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H786" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="774" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 결과 — 고친 항목은 파일 맨 아래 ‘점검 기록’에 적혔다고 알려준다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="24.8" y="66.4" font-size="20.3" textLength="570.2" lengthAdjust="spacingAndGlyphs">정책자료 11건(PDF)을 모두 읽고 요약했습니다. 결과는 결과 폴더에 2026-10-08</text>
<text x="589.8" y="67.7" font-size="20.3" textLength="130.8" lengthAdjust="spacingAndGlyphs">3_자료요약.md 로 저</text>
<text x="24.8" y="90.2" font-size="18.9" textLength="378.0" lengthAdjust="spacingAndGlyphs">장했고, 원본 PDF와 규칙.md 는 크기가 그대로입니다.</text>
<text x="24.8" y="126.7" font-size="20.3" textLength="690.5" lengthAdjust="spacingAndGlyphs">표에는 파일마다 핵심요약 3줄, 쟁점 2줄, 출처(파일명·쪽)가 있습니다. 쪽은 PDF 한 면에 인쇄 쪽이 2</text>
<text x="24.8" y="150.1" font-size="20.4" textLength="691.8" lengthAdjust="spacingAndGlyphs">개씩 들어 있어서 원문 하단의 인쇄 쪽 번호를 기준으로 적었습니다. 표의 숫자•날짜•출처는 원문과 다</text>
<text x="24.8" y="173.7" font-size="20.3" textLength="494.4" lengthAdjust="spacingAndGlyphs">시 대조했습니다. 비워 둔 값은 없어서 '미확인 항목'은 해당 없음입니다.</text>
<text x="54.9" y="211.5" font-size="21.6" textLength="660.4" lengthAdjust="spacingAndGlyphs">10-02 판 오류: 전에 만든 2026-10-02_자료요약.md 에서 36건을 원문 쪽으로 고쳤습니다. 예를</text>
<text x="61.5" y="235.0" font-size="21.6" textLength="659.1" lengthAdjust="spacingAndGlyphs">들어 &quot;3,500억불&quot;은 &quot;9,500억 불&quot;로, &quot;정기국회&quot;는 &quot;7월 임시국회&quot;로 바로잡았습니다. 고친 내용</text>
<text x="61.5" y="257.2" font-size="21.7" textLength="656.5" lengthAdjust="spacingAndGlyphs">은 모두 파일 맨 아래 '점검 기록'에 무엇을/ 고치기 전 고친 후/ 근거&quot;로 적었습니다. 10-02 파</text>
<text x="61.5" y="281.2" font-size="18.9" textLength="188.3" lengthAdjust="spacingAndGlyphs">일은 덮어쓰지 않았습니다.</text>
<text x="32.7" y="308.8" font-size="17.6" textLength="121.6" lengthAdjust="spacingAndGlyphs">• 자료 간 차이:</text>
<text x="71.9" y="338.3" font-size="21.6" textLength="604.2" lengthAdjust="spacingAndGlyphs">• 석유류 8차 최고가격을 260728은 '동결, 260804는 '인하(스150원/e)'로 적고, 150원</text>
<text x="100.7" y="362.1" font-size="20.3" textLength="328.3" lengthAdjust="spacingAndGlyphs">인하가 7차의 일인지 8차의 일인지도 다릅니다.</text>
<text x="71.9" y="390.7" font-size="21.6" textLength="605.5" lengthAdjust="spacingAndGlyphs">• 경제문제 원인 자살자 2020년 수치가 260714는 3,249명, 260811은 3,429명입니다.</text>
<text x="71.9" y="418.4" font-size="20.3" textLength="575.4" lengthAdjust="spacingAndGlyphs">• 단일종목 레버리지 상품 기본예탁금 3,000만 원의 시행일이 260721은 8월 5일,</text>
<text x="99.4" y="441.9" font-size="20.2" textLength="294.3" lengthAdjust="spacingAndGlyphs">260728은 7월 31일(당초 8.5)로 다릅니다.</text>
<text x="32.7" y="469.6" font-size="18.9" textLength="678.8" lengthAdjust="spacingAndGlyphs">• 참고로 남긴 항목: 260811 안에서 민간 개발자 비율이 43%와 41%로 함께 나옵니다. 260806과</text>
<text x="58.9" y="495.3" font-size="21.6" textLength="627.8" lengthAdjust="spacingAndGlyphs">260811의 예비비 합계는 원문이 134억 5,900만 원인데 계산하면 134억 5,800만 원입니다.</text>
<text x="23.5" y="544.0" font-size="20.3" textLength="650.0" lengthAdjust="spacingAndGlyphs">Sources: C:Nusers)AIX\Desktop100프로젝트 기획_회의록의 PDF 11건과 시종.md , 규칙 .md</text>
