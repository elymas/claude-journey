<text x="23.5" y="659.8" font-size="14.8" textLength="133.4" lengthAdjust="spacingAndGlyphs">단 데 C ? 39분 전</text>
<text x="26.2" y="845.2" font-size="17.6" textLength="154.3" lengthAdjust="spacingAndGlyphs">메시지를 입력하세요...</text>
