<text x="164.8" y="930.6" font-size="14.9" textLength="444.7" lengthAdjust="spacingAndGlyphs">Claude는 AI이므로 실수할 수 있습니다. 응답을 다시 한번 확인해 주세요. 의견 보내기</text></g><rect x=".5" y=".5" width="785" height="937" rx="6" fill="none" stroke="#d8cfc0"/></svg>