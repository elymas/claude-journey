<svg xmlns="http://www.w3.org/2000/svg" width="718" height="797" viewBox="0 0 718 797" role="img"><title>② 할 일에 한 줄 더하고 저장</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H718" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="706" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ② 할 일에 한 줄 더하고 저장</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="27.6" y="89.4" font-size="26.1" textLength="21.0" lengthAdjust="spacingAndGlyphs">트</text>
<text x="80.5" y="90.1" font-size="21.7" textLength="73.9" lengthAdjust="spacingAndGlyphs">시종.md</text>
<text x="22.0" y="138.7" font-size="25.1" textLength="145.8" lengthAdjust="spacingAndGlyphs">파일 편집</text>
<text x="450.0" y="93.4" font-size="28.4" textLength="27.6" lengthAdjust="spacingAndGlyphs">+</text>
<text x="178.7" y="138.4" font-size="22.7" textLength="52.9" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="27.6" y="250.0" font-size="59.1" textLength="354.0" lengthAdjust="spacingAndGlyphs">정책자료 요약</text>
<text x="25.3" y="308.9" font-size="29.5" textLength="389.0" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="27.6" y="378.6" font-size="54.7" textLength="112.5" lengthAdjust="spacingAndGlyphs">할 일</text>
<text x="19.0" y="438.1" font-size="32.6" textLength="544.0" lengthAdjust="spacingAndGlyphs">1. 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="63.3" y="476.5" font-size="29.5" textLength="311.8" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="24.3" y="517.0" font-size="28.6" textLength="478.7" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="22.1" y="555.5" font-size="29.3" textLength="651.6" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="66.2" y="597.4" font-size="29.6" textLength="527.2" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="66.2" y="633.4" font-size="25.1" textLength="426.8" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="23.2" y="678.1" font-size="29.7" textLength="401.5" lengthAdjust="spacingAndGlyphs">4. 의견, 제안, 방향 제시를 하지 않는다.</text>
<text x="28.7" y="747.1" font-size="54.6" textLength="329.8" lengthAdjust="spacingAndGlyphs">다 됐다는 기준</text>
<text x="39.7" y="787.2" font-size="21.7" textLength="195.2" lengthAdjust="spacingAndGlyphs">줄 11, 열 1| 23/296자</text>
<text x="347.4" y="784.3" font-size="19.5" textLength="70.6" lengthAdjust="spacingAndGlyphs">AA 포맷</text>
<text x="552.6" y="783.7" font-size="15.9" textLength="46.3" lengthAdjust="spacingAndGlyphs">100%</text>
<text x="655.1" y="783.8" font-size="16.2" textLength="61.8" lengthAdjust="spacingAndGlyphs">Window</text></g><rect x=".5" y=".5" width="717" height="796" rx="6" fill="none" stroke="#d8cfc0"/></svg>