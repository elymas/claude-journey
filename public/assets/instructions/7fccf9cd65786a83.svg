<text x="78.5" y="636.0" font-size="17.1" textLength="511.5" lengthAdjust="spacingAndGlyphs">• 미확인 항목 1건(260811 자살예방 목표 수치 토의 세부내용) 별도 기재</text>
<text x="78.5" y="667.0" font-size="21.8" textLength="633.7" lengthAdjust="spacingAndGlyphs">• 원본 11개 PDF는 파일명•내용 변경 없음, 기존 2026-09-24_자료요약. md 도 그대로 보존</text>
