<text x="78.5" y="536.3" font-size="18.9" textLength="654.8" lengthAdjust="spacingAndGlyphs">• 표 아래에 '자료 간 차이' 항목 추가: 260728(제33회 국무회의록) 3~4쪽은 8차 최고가격 동</text>
