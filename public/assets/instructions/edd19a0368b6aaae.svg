<svg xmlns="http://www.w3.org/2000/svg" width="694" height="654" viewBox="0 0 694 654" role="img"><title>③ 붙여넣고 'ctrl + s'로 저장하기</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H694" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="682" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ③ 붙여넣고 'ctrl + s'로 저장하기</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="12.1" y="83.9" font-size="23.9" textLength="39.3" lengthAdjust="spacingAndGlyphs">=</text>
<text x="52.5" y="83.5" font-size="19.7" textLength="140.2" lengthAdjust="spacingAndGlyphs">정책자료 요약</text>
<text x="443.8" y="86.5" font-size="27.0" textLength="27.2" lengthAdjust="spacingAndGlyphs">+</text>
<text x="10.1" y="131.6" font-size="21.8" textLength="224.9" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="14.1" y="196.8" font-size="24.0" textLength="164.4" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="18.2" y="228.2" font-size="24.0" textLength="390.4" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="15.1" y="285.9" font-size="23.5" textLength="88.9" lengthAdjust="spacingAndGlyphs">## 할 일</text>
<text x="17.1" y="317.7" font-size="25.1" textLength="522.5" lengthAdjust="spacingAndGlyphs">1. 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="40.3" y="349.0" font-size="25.1" textLength="304.6" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="14.9" y="385.1" font-size="40.9" textLength="458.5" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="16.1" y="409.1" font-size="27.2" textLength="635.5" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="40.5" y="448.8" font-size="38.7" textLength="529.2" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="18.2" y="468.0" font-size="25.1" textLength="426.7" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="14.1" y="526.4" font-size="25.1" textLength="185.6" lengthAdjust="spacingAndGlyphs">## 다 됐다는 기준</text>
<text x="11.6" y="563.0" font-size="29.9" textLength="378.8" lengthAdjust="spacingAndGlyphs">- 결과 폴더에 자료요약.md가 생겼다.</text>
<text x="14.1" y="588.0" font-size="23.9" textLength="302.6" lengthAdjust="spacingAndGlyphs">- 표의 모든 줄에 출처가 있다.</text>
<text x="11.6" y="620.7" font-size="30.0" textLength="370.1" lengthAdjust="spacingAndGlyphs">- 하나라도 안 되면 멈추고 물어본다.</text></g><rect x=".5" y=".5" width="693" height="653" rx="6" fill="none" stroke="#d8cfc0"/></svg>