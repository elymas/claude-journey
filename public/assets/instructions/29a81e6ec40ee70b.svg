<svg xmlns="http://www.w3.org/2000/svg" width="620" height="438" viewBox="0 0 620 438" role="img"><title>칸2의 ‘✦ 마법 주문 제작 — 규칙.md 7주차 버전’을 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H620" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="608" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 칸2의 ‘✦ 마법 주문 제작 — 규칙.md 7주차 버전’을 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="33.3" y="101.7" font-size="13.9" textLength="122.6" lengthAdjust="spacingAndGlyphs">STEP 03 · 돌발</text>
<text x="179.2" y="101.6" font-size="37.8" textLength="394.0" lengthAdjust="spacingAndGlyphs">그래프 규칙을 파일로 새긴다</text>
<text x="45.0" y="168.2" font-size="10.6" textLength="47.8" lengthAdjust="spacingAndGlyphs">STEPS</text>
<text x="97.3" y="170.8" font-size="15.9" textLength="115.3" lengthAdjust="spacingAndGlyphs">• 네모는 체크,</text>
<text x="165.3" y="170.0" font-size="16.1" textLength="144.7" lengthAdjust="spacingAndGlyphs">체크. 제목은 펼치기</text>
<text x="74.8" y="211.2" font-size="11.1" textLength="20.7" lengthAdjust="spacingAndGlyphs">01</text>
<text x="93.7" y="211.8" font-size="19.6" textLength="274.9" lengthAdjust="spacingAndGlyphs">그래프.md를 새 파일로 붙여 저장한다</text>
<text x="73.9" y="254.5" font-size="10.3" textLength="16.2" lengthAdjust="spacingAndGlyphs">02</text>
<text x="99.1" y="256.6" font-size="21.4" textLength="259.5" lengthAdjust="spacingAndGlyphs">규칙.md를 7주차 버전으로 덮어쓴다</text>
<text x="74.9" y="288.6" font-size="16.1" textLength="410.8" lengthAdjust="spacingAndGlyphs">규칙. md를 열고 Ctrl+A-&gt; Ctrl+V로 통째로 덮어쓴다. 주황색 셋이 이번 주</text>
<text x="73.9" y="313.5" font-size="19.6" textLength="423.5" lengthAdjust="spacingAndGlyphs">추가분 - 자료가 아닌 것, 템플릿, 그래프. 모든 시종이 규칙.md부터 읽으니,</text>
<text x="74.9" y="334.6" font-size="18.6" textLength="364.3" lengthAdjust="spacingAndGlyphs">여기 한 줄이면 그래프를 그리는 시종은 전부 그래프.md를 읽는다.</text>
<text x="84.7" y="378.6" font-size="18.7" textLength="258.6" lengthAdjust="spacingAndGlyphs">✦ 마법 주문 제작 — 규칙.md 7주차 버전</text>
<text x="577.6" y="168.5" font-size="13.1" textLength="41.5" lengthAdjust="spacingAndGlyphs">작업 호</text>
<text x="86.5" y="428.3" font-size="11.3" textLength="93.7" lengthAdjust="spacingAndGlyphs">JUDGE 1/ 1</text></g><rect x=".5" y=".5" width="619" height="437" rx="6" fill="none" stroke="#d8cfc0"/></svg>