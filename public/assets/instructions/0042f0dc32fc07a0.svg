<svg xmlns="http://www.w3.org/2000/svg" width="1019" height="931" viewBox="0 0 1019 931" role="img"><title>기관 홈페이지의 CI(전용 색상) 화면을 캡처한다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1019" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1007" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 기관 홈페이지의 CI(전용 색상) 화면을 캡처한다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="32.6" y="79.6" font-size="20.1" textLength="20.7" lengthAdjust="spacingAndGlyphs">1이</text>
<text x="69.6" y="79.4" font-size="21.6" textLength="257.7" lengthAdjust="spacingAndGlyphs">kist.re.kr/ko/intro/kist-ci.do</text>
<text x="31.0" y="133.6" font-size="17.8" textLength="78.7" lengthAdjust="spacingAndGlyphs">V Claude</text>
<text x="136.3" y="133.3" font-size="16.8" textLength="59.2" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="519.9" y="135.4" font-size="22.9" textLength="306.6" lengthAdjust="spacingAndGlyphs">AIX-추진 | AIX전략...⑤ ChatGPT</text>
<text x="879.7" y="136.1" font-size="20.6" textLength="118.6" lengthAdjust="spacingAndGlyphs">Jehyun's Apps</text>
<text x="60.7" y="181.9" font-size="18.3" textLength="68.1" lengthAdjust="spacingAndGlyphs">전용색상</text>
<text x="60.7" y="215.2" font-size="13.9" textLength="68.2" lengthAdjust="spacingAndGlyphs">Main Color</text>
<text x="60.7" y="239.0" font-size="13.9" textLength="915.3" lengthAdjust="spacingAndGlyphs">전용색상은 워드마크와 로고타입 및 각종 매체에 적용하여 KIST의 고유한 색상을 형성하고 일관성 있는 이미지를 전달하는 기능을 합니다. 주색인 KIST Red는 천담과학의 정점을</text>
<text x="60.7" y="262.1" font-size="16.8" textLength="559.9" lengthAdjust="spacingAndGlyphs">상징하고, KIST의 역동적, 도전적, 진취적, 선도적 이미지를 내포하고 있으며, 젊은 빼기와 열정을 나타냅니다.</text>
<text x="74.0" y="376.9" font-size="12.3" textLength="57.8" lengthAdjust="spacingAndGlyphs">KIST RED</text>
<text x="77.0" y="400.5" font-size="13.9" textLength="112.6" lengthAdjust="spacingAndGlyphs">Pantone : 1788C 2X</text>
<text x="77.0" y="417.9" font-size="15.3" textLength="300.7" lengthAdjust="spacingAndGlyphs">Process Color : Cyan 5% Magenta 90% Yellow 100%</text>
<text x="77.0" y="430.2" font-size="12.4" textLength="118.5" lengthAdjust="spacingAndGlyphs">RGB : R228 G65 B38</text>
<text x="420.6" y="376.8" font-size="12.2" textLength="105.2" lengthAdjust="spacingAndGlyphs">KIST DARK GRAY</text>
<text x="422.1" y="400.5" font-size="13.9" textLength="91.8" lengthAdjust="spacingAndGlyphs">Pantone: 425C</text>
<text x="423.6" y="417.9" font-size="15.3" textLength="293.3" lengthAdjust="spacingAndGlyphs">Process Color : Magenta 5% Yellow 10% Black 70%</text>
<text x="423.6" y="430.2" font-size="12.4" textLength="124.4" lengthAdjust="spacingAndGlyphs">RGB : R109 G110 8103</text>
<text x="60.6" y="491.2" font-size="13.2" textLength="62.4" lengthAdjust="spacingAndGlyphs">Sub Color</text>
<text x="60.7" y="515.7" font-size="15.5" textLength="694.6" lengthAdjust="spacingAndGlyphs">메인칼라를 기본으로 응용항목에서 사용되며 Gold, Silver의 사용은 고급스러움을 표현할 때 적절한 표현기법으로 활용할 수 있습니다.</text>
<text x="72.6" y="590.2" font-size="12.4" textLength="68.1" lengthAdjust="spacingAndGlyphs">KIST GRAY</text>
<text x="77.0" y="613.8" font-size="12.4" textLength="90.3" lengthAdjust="spacingAndGlyphs">Pantone : 423C</text>
<text x="77.0" y="630.0" font-size="13.9" textLength="154.0" lengthAdjust="spacingAndGlyphs">Process Color : Black 40%</text>
<text x="77.0" y="644.7" font-size="13.7" textLength="122.9" lengthAdjust="spacingAndGlyphs">RGB : RI7 G173 B176</text>
<text x="303.6" y="590.0" font-size="13.9" textLength="77.0" lengthAdjust="spacingAndGlyphs">KIST SILVER</text>
<text x="308.1" y="613.8" font-size="12.4" textLength="88.9" lengthAdjust="spacingAndGlyphs">Pantone : 877C</text>
<text x="534.7" y="590.2" font-size="12.4" textLength="69.6" lengthAdjust="spacingAndGlyphs">KIST GOLD</text>
<text x="539.1" y="613.8" font-size="12.4" textLength="88.9" lengthAdjust="spacingAndGlyphs">Pantone : 873C</text>
<text x="60.7" y="705.5" font-size="13.9" textLength="81.5" lengthAdjust="spacingAndGlyphs">Accent Color</text>
<text x="60.7" y="728.9" font-size="15.3" textLength="371.8" lengthAdjust="spacingAndGlyphs">메인 칼라를 기본으로 응용항목에서 사용되며 적절한 규제가 필요합니다.</text>
<text x="60.7" y="751.0" font-size="17.0" textLength="389.5" lengthAdjust="spacingAndGlyphs">프로모션 제품(이벤트)이나 홍보용 아이템에서 사용하는 것이 효과적입니다.</text>
<text x="74.1" y="825.7" font-size="12.4" textLength="84.4" lengthAdjust="spacingAndGlyphs">KIST YELLOW</text>
<text x="78.5" y="847.7" font-size="12.4" textLength="85.9" lengthAdjust="spacingAndGlyphs">Pantone : 173C</text>
<text x="77.0" y="866.7" font-size="15.5" textLength="171.8" lengthAdjust="spacingAndGlyphs">Process Color : Magenta 35%</text>
<text x="74.1" y="878.9" font-size="12.2" textLength="74.1" lengthAdjust="spacingAndGlyphs">Yellow 100%</text>
<text x="77.0" y="895.2" font-size="12.4" textLength="109.6" lengthAdjust="spacingAndGlyphs">RGB : R255 G16 BO</text>
<text x="305.1" y="825.2" font-size="15.5" textLength="74.1" lengthAdjust="spacingAndGlyphs">KIST GREEN</text>
<text x="308.1" y="849.0" font-size="13.9" textLength="88.9" lengthAdjust="spacingAndGlyphs">Pantone : 376C</text>
<text x="308.1" y="865.5" font-size="13.9" textLength="151.1" lengthAdjust="spacingAndGlyphs">Process Color : Cyan 50%</text>
<text x="305.1" y="880.3" font-size="14.1" textLength="74.1" lengthAdjust="spacingAndGlyphs">Yellow 100%</text>
<text x="308.1" y="896.5" font-size="13.9" textLength="124.4" lengthAdjust="spacingAndGlyphs">RGB : R140 G200 B70</text></g><rect x=".5" y=".5" width="1018" height="930" rx="6" fill="none" stroke="#d8cfc0"/></svg>