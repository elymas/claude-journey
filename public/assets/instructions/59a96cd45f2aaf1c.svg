<svg xmlns="http://www.w3.org/2000/svg" width="685" height="777" viewBox="0 0 685 777" role="img"><title>Ctrl + S → ‘Markdown 파일로…’를 고르고, 정책자료 폴더에 콘티.md로 저장한다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H685" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="673" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · Ctrl + S → ‘Markdown 파일로…’를 고르고, 정책자료 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="95.6" y="345.3" font-size="22.3" textLength="357.5" lengthAdjust="spacingAndGlyphs">서식을 유지하려면 Markdown으로 저장</text>
<text x="95.6" y="377.0" font-size="17.7" textLength="497.1" lengthAdjust="spacingAndGlyphs">텍스트 파일입니다. 굵게 및 제목 등의 현재 서식을 유지하려면 Markdown 파일</text>
<text x="93.4" y="396.3" font-size="17.7" textLength="128.8" lengthAdjust="spacingAndGlyphs">(.md)로 저장합니다.</text>
<text x="95.6" y="416.6" font-size="18.8" textLength="343.6" lengthAdjust="spacingAndGlyphs">일반 텍스트 파일로 저장하면 모든 서식이 손실됩니다.</text>
<text x="112.7" y="488.9" font-size="16.6" textLength="127.8" lengthAdjust="spacingAndGlyphs">Markdown 파일로</text>
<text x="284.5" y="487.9" font-size="15.5" textLength="121.3" lengthAdjust="spacingAndGlyphs">텍스트 파일로 저장</text>
<text x="497.1" y="489.9" font-size="17.8" textLength="30.1" lengthAdjust="spacingAndGlyphs">취소</text></g><rect x=".5" y=".5" width="684" height="776" rx="6" fill="none" stroke="#d8cfc0"/></svg>