<svg xmlns="http://www.w3.org/2000/svg" width="788" height="739" viewBox="0 0 788 739" role="img"><title>호출 — 요약에 주제가 없어서 멈추고 물어본다 (다 됐다는 기준 마지막 줄)</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H788" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="776" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 호출 — 요약에 주제가 없어서 멈추고 물어본다 (다 됐다는 기준 마지</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="367.7" y="125.4" font-size="20.0" textLength="374.5" lengthAdjust="spacingAndGlyphs">“기획안.md 읽고, 결과 폴더의 자료요약.md로 기획안 써줘”를 친다</text>
<text x="26.3" y="207.9" font-size="19.0" textLength="250.8" lengthAdjust="spacingAndGlyphs">도구 3개 사용함, 로드된 도구, 파일 읽음</text>
<text x="69.9" y="255.5" font-size="14.1" textLength="60.7" lengthAdjust="spacingAndGlyphs">질문 중...</text>
<text x="22.9" y="344.1" font-size="18.9" textLength="572.7" lengthAdjust="spacingAndGlyphs">기획안.md는 '요약에 없는 내용을 써야 하면 멈추고 물어본다'고 되어 있는데, 요약 파일에는 기</text>
<text x="21.8" y="364.7" font-size="19.0" textLength="357.3" lengthAdjust="spacingAndGlyphs">획안의 주제가 정해져 있지 않습니다. 어떤 주제로 쓸까요?</text>
<text x="616.2" y="352.8" font-size="14.2" textLength="138.6" lengthAdjust="spacingAndGlyphs">&lt; 2개중 1개 &gt; X</text>
<text x="59.6" y="402.6" font-size="17.8" textLength="247.4" lengthAdjust="spacingAndGlyphs">회의록 수치 교차검증 (Recommended)</text>
<text x="33.2" y="418.4" font-size="10.6" textLength="5.7" lengthAdjust="spacingAndGlyphs">1</text>
<text x="58.4" y="425.0" font-size="20.0" textLength="689.5" lengthAdjust="spacingAndGlyphs">요약의 '자료 간 차이 (8차 최고가격 동결/인하, 자살자 2020년 3,249/3,429명, 예탁금 시행일 등)를 쟁점으로 삼아, 자</text>
<text x="60.7" y="440.2" font-size="17.7" textLength="373.4" lengthAdjust="spacingAndGlyphs">료 간 숫자를 대조하는 업무 절차를 제안. 요약에 근거가 가장 많음.</text>
<text x="59.6" y="470.1" font-size="16.6" textLength="119.1" lengthAdjust="spacingAndGlyphs">자살예방 대책 추진</text>
<text x="30.9" y="487.6" font-size="14.1" textLength="21.8" lengthAdjust="spacingAndGlyphs">2</text>
<text x="52.7" y="492.7" font-size="18.9" textLength="665.4" lengthAdjust="spacingAndGlyphs">260714260728260811에 걸친 자살예방 보고(자살자 수, 2030년 목표 수치, 부처간 정보공유 문제)를 쟁점으로 삼는</text>
<text x="59.4" y="508.4" font-size="17.9" textLength="74.7" lengthAdjust="spacingAndGlyphs">정책 기획안.</text>
<text x="30.9" y="547.5" font-size="11.8" textLength="9.2" lengthAdjust="spacingAndGlyphs">3</text>
<text x="60.7" y="538.8" font-size="16.5" textLength="107.7" lengthAdjust="spacingAndGlyphs">폭염 등 재난 대응</text>
<text x="59.6" y="559.3" font-size="16.5" textLength="515.4" lengthAdjust="spacingAndGlyphs">260804•260811의 폭염 피해 누적 수치와 취약계층 점검 지시를 쟁점으로 삼는 대응 기획안.</text>
<text x="29.8" y="595.2" font-size="14.3" textLength="58.5" lengthAdjust="spacingAndGlyphs">• 기타</text>
<text x="691.8" y="595.0" font-size="15.5" textLength="56.2" lengthAdjust="spacingAndGlyphs">건너뛰기</text>
<text x="27.5" y="663.2" font-size="17.7" textLength="112.2" lengthAdjust="spacingAndGlyphs">또는 직접 답장...</text>
<text x="28.6" y="702.6" font-size="22.4" textLength="21.8" lengthAdjust="spacingAndGlyphs">+</text>
<text x="124.8" y="699.1" font-size="15.4" textLength="44.7" lengthAdjust="spacingAndGlyphs">수동 v</text>
<text x="562.4" y="700.5" font-size="13.1" textLength="104.2" lengthAdjust="spacingAndGlyphs">Sonnet 5.5 높음</text></g><rect x=".5" y=".5" width="787" height="738" rx="6" fill="none" stroke="#d8cfc0"/></svg>