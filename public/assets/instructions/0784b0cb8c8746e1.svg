<svg xmlns="http://www.w3.org/2000/svg" width="691" height="920" viewBox="0 0 691 920" role="img"><title>기획안 — 배경 / 쟁점. 첫 줄은 결론 한 문장, 괄호엔 요약의 어느 항목인지</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H691" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="679" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 기획안 — 배경 / 쟁점. 첫 줄은 결론 한 문장, 괄호엔 요약의 어</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="21.8" y="78.0" font-size="25.2" textLength="330.1" lengthAdjust="spacingAndGlyphs">기획안: 회의록 수치 교차검증 절차</text>
<text x="21.8" y="112.8" font-size="24.0" textLength="642.4" lengthAdjust="spacingAndGlyphs">근거 파일: 결과/2026-10-08_자료요약.md (이 요약 1개만 읽고 작성함. 정책자료 원본 PDF는</text>
<text x="23.0" y="134.9" font-size="21.3" textLength="629.6" lengthAdjust="spacingAndGlyphs">읽지 않음.) 표기 규칙: 숫자•날짜 뒤 괄호는 요약 파일에서 그 값이 나온 항목임. 요약 '점검 기</text>
<text x="21.8" y="158.2" font-size="19.8" textLength="270.0" lengthAdjust="spacingAndGlyphs">록'에서 고친 항목은 고친 후의 값을 씀.</text>
<text x="20.5" y="206.5" font-size="22.4" textLength="55.0" lengthAdjust="spacingAndGlyphs">1. 배경</text>
<text x="21.8" y="243.5" font-size="23.8" textLength="652.6" lengthAdjust="spacingAndGlyphs">차관회의록·국무회의록을 이어 읽다 보면 같은 주제의 수치가 자료마다 달리 적힌 곳이 있어서,</text>
<text x="21.8" y="265.7" font-size="21.1" textLength="275.1" lengthAdjust="spacingAndGlyphs">지금 수치를 대조하는 절차가 필요하다.</text>
<text x="33.3" y="301.6" font-size="21.3" textLength="625.7" lengthAdjust="spacingAndGlyphs">• 이번 요약의 대상은 차관회의록과 국무회의록을 합친 정책자료 11건이다. (요약 머리말</text>
<text x="58.9" y="323.6" font-size="19.8" textLength="142.0" lengthAdjust="spacingAndGlyphs">'대상 파일 수: 11건)</text>
<text x="33.3" y="353.1" font-size="19.9" textLength="636.0" lengthAdjust="spacingAndGlyphs">• 같은 주제가 여러 회의에 걸쳐 나온다. 석유류 최고가격은 260721260728•260804 세 자</text>
<text x="62.7" y="378.6" font-size="21.3" textLength="616.8" lengthAdjust="spacingAndGlyphs">료에, 경제문제 원인 자살자 수는 260714•260811 두 자료에 나온다. (요약 '자료 간 차이' 첫</text>
<text x="61.3" y="401.0" font-size="19.3" textLength="96.1" lengthAdjust="spacingAndGlyphs">째•둘째 항목)</text>
<text x="34.6" y="429.9" font-size="21.3" textLength="637.3" lengthAdjust="spacingAndGlyphs">• 요약을 만드는 중에도 수치를 원문 쪽으로 고친 항목이 있었다. 예: 260728의 반도체 분야</text>
<text x="62.7" y="454.0" font-size="22.7" textLength="618.1" lengthAdjust="spacingAndGlyphs">협력 규모는 고친 후 9,500억 불이다. (요약'점검 기록' 260728'순방 성과 수치; 260728 제</text>
<text x="61.4" y="476.3" font-size="18.5" textLength="153.6" lengthAdjust="spacingAndGlyphs">33회 국무회의록 3쪽)</text>
<text x="20.5" y="538.5" font-size="22.5" textLength="55.0" lengthAdjust="spacingAndGlyphs">2. 쟁점</text>
<text x="21.8" y="573.2" font-size="22.4" textLength="606.5" lengthAdjust="spacingAndGlyphs">같은 주제인데 자료마다 숫자나 서술이 어긋나는데, 어느 쪽 값을 쓸지 정할 기준이 없다.</text>
<text x="33.3" y="606.7" font-size="21.1" textLength="638.5" lengthAdjust="spacingAndGlyphs">• 석유류 8차 최고가격을 260728은 '동결;, 260804는 '인하(스150원/e)'로 적는다. 150원 인</text>
<text x="62.7" y="632.3" font-size="21.1" textLength="604.0" lengthAdjust="spacingAndGlyphs">하는 260728(산업통상부차관 발언)에서는 7차 때의 일, 260804에서는 8차의 일로 서술</text>
<text x="62.7" y="656.5" font-size="22.4" textLength="606.5" lengthAdjust="spacingAndGlyphs">된다. (요약'자료 간 차이' 첫째 항목, 260728 제 33회 6쪽, 260804 제34회 11쪽 ※ 점검기</text>
<text x="62.7" y="678.8" font-size="19.9" textLength="128.0" lengthAdjust="spacingAndGlyphs">록으로 고친 후 쪽)</text>
<text x="33.3" y="708.0" font-size="21.1" textLength="641.1" lengthAdjust="spacingAndGlyphs">• 경제문제 원인 자살자 수의 2020년 값이 260714는 3,249명, 260811은 3,429명이다(비중</text>
<text x="61.4" y="732.3" font-size="21.1" textLength="595.0" lengthAdjust="spacingAndGlyphs">25.4%는 같음). (요약'자료 간 차이' 둘째 항목, 260714 36쪽, 260811 11쪽) 기본예탁금</text>
<text x="61.4" y="755.4" font-size="21.1" textLength="619.3" lengthAdjust="spacingAndGlyphs">3,000만 원의 시행일은 260721이 8월 5일, 260728이 7.31일이고, 260728은 '당초 8.5일'이</text>
<text x="62.7" y="779.6" font-size="22.5" textLength="583.5" lengthAdjust="spacingAndGlyphs">라고 함께 적어 일정 변경으로도 읽힌다. (요약 '자료 간 차이' 셋째 항목, 260721 13쪽,</text>
<text x="61.4" y="802.1" font-size="19.0" textLength="90.9" lengthAdjust="spacingAndGlyphs">260728 6쪽)</text>
<text x="34.6" y="831.2" font-size="19.8" textLength="618.1" lengthAdjust="spacingAndGlyphs">• 같은 자료 안에서도 다른 곳이 있다. 260811은 민간 개발자 비율을 43%와 41%로 적고</text>
<text x="60.1" y="856.7" font-size="21.1" textLength="615.5" lengthAdjust="spacingAndGlyphs">(260811 34쪽), 260806•260811의 예비비 합계 표기는 134억 5,900만 원인데 90억 1,800</text>
<text x="62.7" y="880.8" font-size="22.4" textLength="609.1" lengthAdjust="spacingAndGlyphs">만 원과 44억 4,000만 원을 더하면 134억 5,800만 원이어서 100만 원이 차이 난다. (요약</text>
<text x="58.9" y="901.8" font-size="19.9" textLength="175.3" lengthAdjust="spacingAndGlyphs">'자료 간 차이' 넷째 항목)</text></g><rect x=".5" y=".5" width="690" height="919" rx="6" fill="none" stroke="#d8cfc0"/></svg>