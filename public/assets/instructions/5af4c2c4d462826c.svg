<svg xmlns="http://www.w3.org/2000/svg" width="828" height="613" viewBox="0 0 828 613" role="img"><title>템플릿 이름 칸의 괄호에 이름을 적는다 — 이름에 ‘템플릿’이 있으면 그대로 쓴다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H828" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="816" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 템플릿 이름 칸의 괄호에 이름을 적는다 — 이름에 ‘템플릿’이 있으면</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="69.8" y="93.7" font-size="22.3" textLength="169.7" lengthAdjust="spacingAndGlyphs">템플릿_질문지.md</text>
<text x="458.5" y="91.8" font-size="18.6" textLength="19.3" lengthAdjust="spacingAndGlyphs">+</text>
<text x="758.2" y="73.8" font-size="18.6" textLength="62.6" lengthAdjust="spacingAndGlyphs">X</text>
<text x="3.6" y="141.6" font-size="23.5" textLength="231.1" lengthAdjust="spacingAndGlyphs">• 파일 편집 보기</text>
<text x="738.9" y="138.3" font-size="22.5" textLength="80.6" lengthAdjust="spacingAndGlyphs">8 $</text>
<text x="64.9" y="174.1" font-size="28.9" textLength="700.6" lengthAdjust="spacingAndGlyphs">확인날 수 없으면 바+시 밀고, 모고에 글을 확인 곳 암이다고 식은나.</text>
<text x="28.8" y="205.9" font-size="32.9" textLength="576.4" lengthAdjust="spacingAndGlyphs">5. ‘템플릿 이름’ 칸의 이름 뒤에 _템플릿을 붙여 저장한다.</text>
<text x="54.2" y="235.7" font-size="31.2" textLength="467.0" lengthAdjust="spacingAndGlyphs">예: 이름이 청록보고면 → 청록보고_템플릿.pptx</text>
<text x="51.8" y="264.0" font-size="32.1" textLength="534.8" lengthAdjust="spacingAndGlyphs">이름에 이미 ‘템플릿’이 들어 있으면 또 붙이지 않는다.</text>
<text x="53.0" y="291.7" font-size="26.1" textLength="583.7" lengthAdjust="spacingAndGlyphs">저장 위치는 결과 폴더가 아니라 이 폴더(정책자료 폴더)다.</text>
<text x="54.2" y="324.8" font-size="29.9" textLength="737.7" lengthAdjust="spacingAndGlyphs">규칙.md에 ‘새 파일은 결과 폴더에’가 있어도, 이 파일만은 이 폴더에 둔다.</text>
<text x="55.4" y="350.7" font-size="26.1" textLength="584.9" lengthAdjust="spacingAndGlyphs">템플릿은 결과물이 아니라 다음 시안의 재료이기 때문이다.</text>
<text x="54.2" y="384.0" font-size="28.6" textLength="529.0" lengthAdjust="spacingAndGlyphs">같은 이름이 있으면 덮어쓰지 말고 뒤에 _2를 붙인다.</text>
<text x="28.9" y="410.9" font-size="24.8" textLength="329.8" lengthAdjust="spacingAndGlyphs">6. 다 만들면 채팅으로 보여 준다:</text>
<text x="49.3" y="441.0" font-size="24.9" textLength="365.9" lengthAdjust="spacingAndGlyphs">- 스물한 장 목록 (장 번호 / 장 종류)</text>
<text x="50.5" y="469.9" font-size="24.8" textLength="432.1" lengthAdjust="spacingAndGlyphs">- 질문지 답마다 어디에 반영했는지 한 줄씩</text>
<text x="50.5" y="503.0" font-size="28.6" textLength="494.6" lengthAdjust="spacingAndGlyphs">- ‘알아서’로 정한 값, 그리고 못 지킨 답과 그 이유</text>
<text x="27.7" y="559.2" font-size="22.4" textLength="152.8" lengthAdjust="spacingAndGlyphs">## 템플릿 이름</text>
<text x="25.3" y="591.2" font-size="26.1" textLength="481.4" lengthAdjust="spacingAndGlyphs">- 이름: ( 정책기획보고템플릿) 예: 청록보고</text></g><rect x=".5" y=".5" width="827" height="612" rx="6" fill="none" stroke="#d8cfc0"/></svg>