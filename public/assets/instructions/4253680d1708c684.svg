<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="825" viewBox="0 0 1400 825" role="img"><title>칸2를 펴고 ‘✦ 마법 주문 제작’을 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1400" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1388" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 칸2를 펴고 ‘✦ 마법 주문 제작’을 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="85.5" y="149.8" font-size="14.9" textLength="59.0" lengthAdjust="spacingAndGlyphs">STEP</text>
<text x="144.5" y="149.8" font-size="14.9" textLength="34.6" lengthAdjust="spacingAndGlyphs">02</text>
<text x="210.0" y="158.6" font-size="54.3" textLength="437.5" lengthAdjust="spacingAndGlyphs">모양을 파일로 짓는다</text>
<text x="653.3" y="158.6" font-size="54.3" textLength="303.3" lengthAdjust="spacingAndGlyphs">- 템플릿 하나</text>
<text x="1037.8" y="152.9" font-size="21.1" textLength="289.0" lengthAdjust="spacingAndGlyphs">20 MIN · 제목을 누르면 펼쳐짐</text>
<text x="99.6" y="243.7" font-size="15.7" textLength="61.3" lengthAdjust="spacingAndGlyphs">STEPS</text>
<text x="175.0" y="248.4" font-size="21.1" textLength="278.8" lengthAdjust="spacingAndGlyphs">• 네모는 체크, 제목은 펼치기</text>
<text x="168.9" y="304.5" font-size="27.3" textLength="309.3" lengthAdjust="spacingAndGlyphs">템플릿 나무에서 하나를 딴다</text>
<text x="175.0" y="367.2" font-size="29.4" textLength="506.7" lengthAdjust="spacingAndGlyphs">폴더에 템플릿_시안만들기.md 새 파일을 만들고</text>
<text x="175.0" y="398.0" font-size="27.3" textLength="173.0" lengthAdjust="spacingAndGlyphs">주문서를 붙인다</text>
<text x="140.0" y="447.6" font-size="30.1" textLength="583.3" lengthAdjust="spacingAndGlyphs">콘티.md 때와 같다. 메모장 새 Markdown 탭&gt;&gt; 주문서 붙여넣기</text>
<text x="140.4" y="478.4" font-size="21.1" textLength="588.1" lengthAdjust="spacingAndGlyphs">정책자료 폴더에 템플릿_시안만들기.md로 저장. 첫 줄이 '# 템플릿_시안</text>
<text x="140.4" y="510.6" font-size="23.2" textLength="354.1" lengthAdjust="spacingAndGlyphs">만들기'라 저장 이름 칸이 알아서 채워진다.</text>
<text x="145.8" y="564.1" font-size="30.0" textLength="414.2" lengthAdjust="spacingAndGlyphs">✦ 마법 주문 제작 — 템플릿_시안만들기.md</text>
<text x="138.4" y="635.5" font-size="17.0" textLength="22.4" lengthAdjust="spacingAndGlyphs">03</text>
<text x="173.0" y="637.7" font-size="29.4" textLength="439.5" lengthAdjust="spacingAndGlyphs">&quot;템플릿_시안만들기.md 읽고, 결과 폴더의</text>
<text x="175.0" y="669.1" font-size="30.1" textLength="525.0" lengthAdjust="spacingAndGlyphs">YYYYMM-DD_콘티.md로 시안 만들어줘”를 친다</text>
<text x="163.3" y="732.3" font-size="36.1" textLength="513.3" lengthAdjust="spacingAndGlyphs">시안을 파워포인트로 열어 템플릿 파일과 나란히 본다</text>
<text x="834.3" y="246.7" font-size="19.1" textLength="134.3" lengthAdjust="spacingAndGlyphs">작업 화면 예시</text>
<text x="999.1" y="510.9" font-size="21.1" textLength="124.1" lengthAdjust="spacingAndGlyphs">작업 화면 예시</text></g><rect x=".5" y=".5" width="1399" height="824" rx="6" fill="none" stroke="#d8cfc0"/></svg>