<svg xmlns="http://www.w3.org/2000/svg" width="931" height="486" viewBox="0 0 931 486" role="img"><title>Markdown 파일로 저장을 고른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H931" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="919" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · Markdown 파일로 저장을 고른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="82.5" y="168.0" font-size="36.4" textLength="549.4" lengthAdjust="spacingAndGlyphs">서식을 유지하려면 Markdown으로 저장</text>
<text x="85.3" y="215.6" font-size="28.2" textLength="744.8" lengthAdjust="spacingAndGlyphs">텍스트 파일입니다. 굵게 및 제목 등의 현재 서식을 유지하려면 Markdown 파일</text>
<text x="79.8" y="245.3" font-size="26.6" textLength="193.5" lengthAdjust="spacingAndGlyphs">(.md)로 저장합니다.</text>
<text x="82.5" y="273.6" font-size="28.2" textLength="515.6" lengthAdjust="spacingAndGlyphs">일반 텍스트 파일로 저장하면 모든 서식이 손실됩니다.</text>
<text x="111.0" y="382.5" font-size="23.9" textLength="186.7" lengthAdjust="spacingAndGlyphs">Markdown 파일로</text>
<text x="365.4" y="383.7" font-size="25.2" textLength="182.7" lengthAdjust="spacingAndGlyphs">텍스트 파일로 저장</text>
<text x="687.4" y="383.7" font-size="25.2" textLength="41.9" lengthAdjust="spacingAndGlyphs">취소</text></g><rect x=".5" y=".5" width="930" height="485" rx="6" fill="none" stroke="#d8cfc0"/></svg>