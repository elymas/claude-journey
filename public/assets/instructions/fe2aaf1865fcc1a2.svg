<svg xmlns="http://www.w3.org/2000/svg" width="1069" height="645" viewBox="0 0 1069 645" role="img"><title>칸1의 ✦ 마법 주문 제작 버튼을 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1069" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1057" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 칸1의 ✦ 마법 주문 제작 버튼을 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="63.7" y="132.6" font-size="13.0" textLength="74.6" lengthAdjust="spacingAndGlyphs">STEP 01</text>
<text x="163.1" y="131.9" font-size="38.6" textLength="326.3" lengthAdjust="spacingAndGlyphs">질문지 세 칸을 채운다</text>
<text x="77.7" y="204.0" font-size="11.2" textLength="46.6" lengthAdjust="spacingAndGlyphs">STEPS</text>
<text x="153.8" y="207.9" font-size="18.0" textLength="195.8" lengthAdjust="spacingAndGlyphs">네모는 체크, 제목은 펼치기</text>
<text x="108.8" y="250.4" font-size="12.8" textLength="15.5" lengthAdjust="spacingAndGlyphs">91</text>
<text x="129.2" y="247.3" font-size="22.8" textLength="351.9" lengthAdjust="spacingAndGlyphs">템플릿_질문지.md를 새 파일로 붙여 저장한다</text>
<text x="106.9" y="282.8" font-size="22.8" textLength="423.1" lengthAdjust="spacingAndGlyphs">정책자료 폴더에 새 메모장을 열고 주문서를 붙여 넣는다. 저장 이름 칸이</text>
<text x="106.9" y="309.4" font-size="22.9" textLength="378.6" lengthAdjust="spacingAndGlyphs">'템플릿_질문지'로 채워지는지 본다 - 첫 줄 제목이 이름이 된다.</text>
<text x="115.8" y="353.7" font-size="22.8" textLength="280.6" lengthAdjust="spacingAndGlyphs">✦ 마법 주문 제작 — 템플릿_질문지.md</text>
<text x="119.6" y="411.1" font-size="17.7" textLength="101.0" lengthAdjust="spacingAndGlyphs">JUDGE 1/ 1</text>
<text x="278.1" y="431.0" font-size="21.3" textLength="108.9" lengthAdjust="spacingAndGlyphs">저장하고 보니?</text>
<text x="227.2" y="460.1" font-size="23.2" textLength="209.3" lengthAdjust="spacingAndGlyphs">폴더에 템플릿_질문지.md가 생겼다</text>
<text x="253.9" y="499.9" font-size="22.9" textLength="155.9" lengthAdjust="spacingAndGlyphs">이름이 엉뚱하게 저장됐다</text>
<text x="108.8" y="569.1" font-size="9.8" textLength="15.5" lengthAdjust="spacingAndGlyphs">B2</text>
<text x="160.0" y="570.3" font-size="22.4" textLength="351.2" lengthAdjust="spacingAndGlyphs">① 색 — 고른 화면을 캡처해 디자인 폴더에 넣는다</text>
<text x="781.6" y="133.6" font-size="16.2" textLength="230.0" lengthAdjust="spacingAndGlyphs">20 MIN · 제목을 누르면 펼쳐짐</text>
<text x="635.5" y="205.1" font-size="14.6" textLength="107.2" lengthAdjust="spacingAndGlyphs">작업 화면 예시</text>
<text x="710.1" y="394.0" font-size="17.6" textLength="202.0" lengthAdjust="spacingAndGlyphs">미 단계 화면 예시는 아직 없어.</text>
<text x="724.1" y="417.4" font-size="17.7" textLength="172.5" lengthAdjust="spacingAndGlyphs">이미지를 주면 여기 들어가.</text></g><rect x=".5" y=".5" width="1068" height="644" rx="6" fill="none" stroke="#d8cfc0"/></svg>