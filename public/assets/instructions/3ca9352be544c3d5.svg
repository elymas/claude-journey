<svg xmlns="http://www.w3.org/2000/svg" width="806" height="808" viewBox="0 0 806 808" role="img"><title>네 가지를 내 말로 답한다. 목표 / 현실적인 기대효과 / 보고 대상 / 15분. 덮어쓰라고 하면 덮어쓴다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H806" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="794" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 네 가지를 내 말로 답한다. 목표 / 현실적인 기대효과 / 보고 대상</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="52.7" y="77.3" font-size="19.4" textLength="164.0" lengthAdjust="spacingAndGlyphs">도구 2개 사용함, 파일 읽음</text>
<text x="52.7" y="108.0" font-size="18.2" textLength="687.7" lengthAdjust="spacingAndGlyphs">쓰기 전에 정책자료 기획안.md 에 적힌 네 가지를 먼저 답해 주세요. 답을 받기 전에는 쓰지 않습니다.</text>
<text x="63.3" y="145.0" font-size="20.6" textLength="254.2" lengthAdjust="spacingAndGlyphs">1. 이 기획안의 목표는 무엇인가요?</text>
<text x="63.3" y="172.3" font-size="18.2" textLength="269.4" lengthAdjust="spacingAndGlyphs">2. 얻고 싶은 기대효과는 무엇인가요?</text>
<text x="63.3" y="200.4" font-size="18.2" textLength="183.9" lengthAdjust="spacingAndGlyphs">3. 누구에게 보고하나요?</text>
<text x="63.3" y="228.3" font-size="19.3" textLength="206.2" lengthAdjust="spacingAndGlyphs">4. 발표 시간은 몇 분인가요?</text>
<text x="52.7" y="277.4" font-size="20.7" textLength="698.3" lengthAdjust="spacingAndGlyphs">답해 주시면 요약에서 목표에 맞는 주제 후보를 2~3개 골라 근거 항목과 함께 보여드리고, 고르시면 쓰</text>
<text x="52.7" y="300.9" font-size="19.3" textLength="153.5" lengthAdjust="spacingAndGlyphs">겠습니다. 결과 폴더에</text>
<text x="203.8" y="299.4" font-size="13.4" textLength="97.2" lengthAdjust="spacingAndGlyphs">2026-10-08</text>
<text x="299.9" y="301.8" font-size="20.5" textLength="353.8" lengthAdjust="spacingAndGlyphs">_기획안,md 가 이미 있어서, 새 파일은 2026-10-08</text>
<text x="650.2" y="302.3" font-size="18.4" textLength="97.6" lengthAdjust="spacingAndGlyphs">_ 기획안 2.md</text>
<text x="52.7" y="324.2" font-size="19.3" textLength="137.1" lengthAdjust="spacingAndGlyphs">로 저장하겠습니다.</text>
<text x="50.4" y="502.0" font-size="20.6" textLength="719.3" lengthAdjust="spacingAndGlyphs">1. 최근 이슈/이 회의들에서 어떤 안건들이 보고되고, 그 중 자꾸 중요하게 다뤄지는 부분이 뭔지 알아내야 해. 그</text>
<text x="53.9" y="521.8" font-size="20.5" textLength="722.8" lengthAdjust="spacingAndGlyphs">리고 그걸 해결하거나 그 이슈로부터 앞으로 일어날 거 같은 일에 대비하는 예방책이라던가. 그런걸 발견하고 논</text>
<text x="52.7" y="542.8" font-size="22.0" textLength="724.0" lengthAdjust="spacingAndGlyphs">의하는 차원의 기획안이야. 내가 진짜 해결책을 낸다기보다는, 내 기획안을 통해 내가 어떤 인사이트를 끌어내는</text>
<text x="52.7" y="560.8" font-size="18.1" textLength="260.1" lengthAdjust="spacingAndGlyphs">사람인지를 리더들이 보고싶은 거 같아.</text>
<text x="52.7" y="603.6" font-size="21.7" textLength="717.0" lengthAdjust="spacingAndGlyphs">2. 기대효과... 현실적이었으면 좋겠어. 정부 정책에 대한 제이니까. 뜬구름 잡는 대안은 아무나 하는 헛소리와</text>
<text x="53.9" y="621.5" font-size="19.3" textLength="150.0" lengthAdjust="spacingAndGlyphs">다를 바 없다고 생각해.</text>
<text x="51.5" y="665.2" font-size="24.1" textLength="365.5" lengthAdjust="spacingAndGlyphs">3. 최종적으로 기술정책연구 소장님께 볶고드릴 거야.</text>
<text x="51.5" y="704.2" font-size="23.5" textLength="131.3" lengthAdjust="spacingAndGlyphs">4. 발표시갔은 15분.</text>
<text x="53.9" y="743.8" font-size="22.9" textLength="513.1" lengthAdjust="spacingAndGlyphs">아, 결과폴더에 있는 기획안 그냥 동일 이름으로 덮어버려. 그거 쓸모 없어 이제.</text>
<text x="57.4" y="778.5" font-size="18.1" textLength="52.7" lengthAdjust="spacingAndGlyphs">+ A</text>
<text x="132.4" y="776.6" font-size="14.5" textLength="62.1" lengthAdjust="spacingAndGlyphs">1 수동 v</text>
<text x="588.1" y="777.9" font-size="14.6" textLength="104.3" lengthAdjust="spacingAndGlyphs">Sonnet 5.5 높음</text>
<text x="722.8" y="776.6" font-size="14.5" textLength="11.7" lengthAdjust="spacingAndGlyphs">0</text>
<text x="760.3" y="779.6" font-size="18.1" textLength="16.4" lengthAdjust="spacingAndGlyphs">7</text></g><rect x=".5" y=".5" width="805" height="807" rx="6" fill="none" stroke="#d8cfc0"/></svg>