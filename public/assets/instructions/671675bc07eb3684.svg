<svg xmlns="http://www.w3.org/2000/svg" width="695" height="977" viewBox="0 0 695 977" role="img"><title>제안 / 다음 단계, 그리고 맨 아래 점검 기록</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H695" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="683" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 제안 / 다음 단계, 그리고 맨 아래 점검 기록</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="20.4" y="75.7" font-size="22.7" textLength="55.9" lengthAdjust="spacingAndGlyphs">3. 제안</text>
<text x="20.4" y="112.5" font-size="22.5" textLength="651.4" lengthAdjust="spacingAndGlyphs">회의록 수치를 쓰기 전에 같은 주제의 다른 회의록 값과 대조하고, 어긋나면 한쪽으로 고르지 않</text>
<text x="20.4" y="134.6" font-size="21.1" textLength="298.4" lengthAdjust="spacingAndGlyphs">고 출처와 함께 나란히 적는 절차를 정하자.</text>
<text x="32.7" y="171.5" font-size="21.3" textLength="640.5" lengthAdjust="spacingAndGlyphs">• 어긋난 곳은 요약의 '자료 간 차이' 형식 그대로, 어느 자료가 무엇이라 하는지 파일명•쪽과</text>
<text x="61.3" y="194.6" font-size="21.1" textLength="354.3" lengthAdjust="spacingAndGlyphs">함께 나란히 적는다. (요약 '자료 간 차이' 항목 구성)</text>
<text x="32.7" y="223.3" font-size="21.1" textLength="631.0" lengthAdjust="spacingAndGlyphs">• 폭염 사망자•온열질환자 누적 수치, 유가•환율처럼 회의 시점에 따라 값이 바뀌는 보고는</text>
<text x="57.2" y="246.5" font-size="21.3" textLength="384.3" lengthAdjust="spacingAndGlyphs">'자료 간 차이'에서 뺀다. (요약'자료 간 차이' 마지막 줄)</text>
<text x="32.7" y="273.8" font-size="21.3" textLength="631.0" lengthAdjust="spacingAndGlyphs">• 요약만으로는 어느 쪽 값이 맞는지 알 수 없으므로 판정은 하지 않는다. 고친 것은 요약의</text>
<text x="61.3" y="297.2" font-size="19.7" textLength="599.6" lengthAdjust="spacingAndGlyphs">점검 기록처럼 '무엇을/ 고치기전〉 고친 후/ 근거(파일명•쪽)'로 남긴다. (요약 '점검기</text>
<text x="61.3" y="320.4" font-size="19.7" textLength="62.7" lengthAdjust="spacingAndGlyphs">록'형식)</text>
<text x="20.2" y="383.5" font-size="24.8" textLength="95.9" lengthAdjust="spacingAndGlyphs">4. 다음 단계</text>
<text x="20.4" y="440.4" font-size="21.3" textLength="75.0" lengthAdjust="spacingAndGlyphs">를 만든다.</text>
<text x="32.7" y="505.6" font-size="22.5" textLength="358.4" lengthAdjust="spacingAndGlyphs">• 언제까지: 10월 31일 (사용자 지정, 요약에 없음)</text>
<text x="32.7" y="534.3" font-size="22.5" textLength="635.0" lengthAdjust="spacingAndGlyphs">• 무엇을: 석유류 8차 최고가격, 경제문제 원인 자살자 2020년 수치, 기본예탁금 시행일, 같</text>
<text x="61.3" y="556.4" font-size="21.3" textLength="564.2" lengthAdjust="spacingAndGlyphs">은 자료 안의 43%•41%와 예비비 합계 항목을 대상으로 한다. (요약 '자료 간 차이)</text>
<text x="20.4" y="615.0" font-size="21.3" textLength="76.3" lengthAdjust="spacingAndGlyphs">점검 기록</text>
<text x="21.8" y="649.3" font-size="19.7" textLength="154.0" lengthAdjust="spacingAndGlyphs">반영한 요약 점검 기록</text>
<text x="32.7" y="684.9" font-size="19.9" textLength="520.6" lengthAdjust="spacingAndGlyphs">• 260804 '자료 간 차이의 출처 쪽' 9~10쪽 &gt; 11쪽: 기획안에는 11쪽을 씀.</text>
<text x="32.7" y="714.5" font-size="22.7" textLength="579.9" lengthAdjust="spacingAndGlyphs">• 260728 순방 성과 수치' 3,500억불 &gt; 9,500억 불: 기획안에는 9,500억 불을 씀.</text>
<text x="32.7" y="743.1" font-size="22.7" textLength="637.6" lengthAdjust="spacingAndGlyphs">• '자료 간 차이' 중 2020년 수치, 기본예탁금 시행일, 43% 41%, 합계 100만 원 차이는 점검</text>
<text x="61.3" y="765.3" font-size="19.7" textLength="332.5" lengthAdjust="spacingAndGlyphs">기록에서 추가된 항목: 기획안 쟁점에 그대로 씀.</text>
<text x="21.8" y="813.2" font-size="19.9" textLength="324.3" lengthAdjust="spacingAndGlyphs">기획안의 숫자 대조 (기획안 값 / 요약 값/ 결과)</text>
<text x="32.7" y="848.8" font-size="18.3" textLength="378.8" lengthAdjust="spacingAndGlyphs">• 11건 (배경)/ 요약 머리말 '대상 파일 수: 11건'/ 일치</text>
<text x="32.7" y="877.2" font-size="19.7" textLength="569.6" lengthAdjust="spacingAndGlyphs">• 260721•260728•260804 (배경)/ 요약 '자료 간 차이' 첫째 항목 출처 파일 / 일치</text>
<text x="32.7" y="904.5" font-size="19.7" textLength="508.3" lengthAdjust="spacingAndGlyphs">• 260714•260811 (배경) / 요약'자료 간 차이' 둘째 항목 출처 파일 / 일치</text>
<text x="32.7" y="934.3" font-size="21.1" textLength="515.1" lengthAdjust="spacingAndGlyphs">• 9,500억 불 (배경)/ 요약'점검 기록' 260728 고친 후' 9,500억 불 / 일치</text>
<text x="32.7" y="960.5" font-size="19.7" textLength="494.7" lengthAdjust="spacingAndGlyphs">• 260728 제33회 3쪽 (배경) / 요약 '점검 기록' 260728 근거 3쪽 / 일치</text></g><rect x=".5" y=".5" width="694" height="976" rx="6" fill="none" stroke="#d8cfc0"/></svg>