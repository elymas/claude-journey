<svg xmlns="http://www.w3.org/2000/svg" width="686" height="777" viewBox="0 0 686 777" role="img"><title>맨 아래 — 점검 기록. 반영한 요약 점검 세 건, 숫자 대조 전부 일치, 내가 준 값 둘은 ‘대조 불가’</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H686" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="674" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 맨 아래 — 점검 기록. 반영한 요약 점검 세 건, 숫자 대조 전부 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="56.9" y="72.1" font-size="17.8" textLength="126.7" lengthAdjust="spacingAndGlyphs">2026-10-08_기획안.md</text>
<text x="302.7" y="71.4" font-size="14.4" textLength="14.0" lengthAdjust="spacingAndGlyphs">+</text>
<text x="15.0" y="103.4" font-size="15.5" textLength="139.6" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="15.0" y="146.5" font-size="14.4" textLength="80.5" lengthAdjust="spacingAndGlyphs">## 점검 기록</text>
<text x="17.2" y="180.7" font-size="15.5" textLength="132.0" lengthAdjust="spacingAndGlyphs">반영한 요약 점검 기록</text>
<text x="15.0" y="199.8" font-size="17.7" textLength="478.1" lengthAdjust="spacingAndGlyphs">- 260728 순방 성과 수치' 3,500억불 - 9,500억 불: 기획안에는 9,500억 불을 씀.</text>
<text x="15.0" y="216.1" font-size="16.8" textLength="637.0" lengthAdjust="spacingAndGlyphs">- 260811 노동쟁의 논의 위치 : 광주 반도체 공장 관련 노조 쟁의 주장 논의는 260721 제31회 40~42쪽이고,</text>
<text x="16.1" y="233.2" font-size="16.6" textLength="651.6" lengthAdjust="spacingAndGlyphs">260811에서는 자살예방 보고 토의의 노란봉투법 쟁의 대상 기준 논의임. 기획안은 7월 21일과 8월 11일로 나눠</text>
<text x="17.2" y="249.6" font-size="15.8" textLength="32.2" lengthAdjust="spacingAndGlyphs">적음.</text>
<text x="15.0" y="265.6" font-size="15.5" textLength="649.5" lengthAdjust="spacingAndGlyphs">- 260811 '펀드 표현' 반도체 소부장펀드 5조원 - &quot;반도체 4소 투자 스케일업을 위한 5조 원 규모 반도체 펀드</text>
<text x="17.2" y="283.8" font-size="16.8" textLength="171.8" lengthAdjust="spacingAndGlyphs">신설&quot;: 기획안에는 후자를 씀.</text>
<text x="17.2" y="317.1" font-size="16.8" textLength="285.6" lengthAdjust="spacingAndGlyphs">기획안의 숫자 대조 (기획안 값/ 요약 값/ 결과)</text>
<text x="16.1" y="334.5" font-size="14.5" textLength="315.6" lengthAdjust="spacingAndGlyphs">- 7월 28일 (배경) / 요약 260728 2026. 07. 28.&quot;/ 일치</text>
<text x="16.1" y="351.6" font-size="15.6" textLength="308.1" lengthAdjust="spacingAndGlyphs">- 8월 6일 (배경) / 요약 260806 2026. 08. 06. / 일치</text>
<text x="16.1" y="368.7" font-size="15.6" textLength="344.6" lengthAdjust="spacingAndGlyphs">- 8월 11일 (배경•쟁점) / 요약 260811 2026. 08. 11. / 일치</text>
<text x="16.1" y="385.9" font-size="15.5" textLength="315.6" lengthAdjust="spacingAndGlyphs">- 7월 21일 (쟁점) / 요약 260721 2026. 07. 21./ 일치</text>
<text x="16.1" y="403.1" font-size="16.8" textLength="497.1" lengthAdjust="spacingAndGlyphs">- 9,500억 불 / 요약 260728 핵심요약 3 9,500억 불 규모의 반도체 분야 협력&quot; / 일치</text>
<text x="16.1" y="419.4" font-size="14.4" textLength="483.1" lengthAdjust="spacingAndGlyphs">- 5GW / 요약 260728 핵심요약 3&quot;5GW 규모의 AI 데이터센터 투자 협력&quot; / 일치</text>
<text x="16.1" y="437.5" font-size="15.6" textLength="525.0" lengthAdjust="spacingAndGlyphs">- 3대 (메가프로젝트) / 요약 260806 쟁점 1, 260811 핵심요약 2 3대 메가프로젝트'/ 일치</text>
<text x="16.1" y="453.6" font-size="15.5" textLength="250.1" lengthAdjust="spacingAndGlyphs">- 5조 원 / 요약 260811 핵심요약 2 5조 원</text>
<text x="264.1" y="453.4" font-size="16.6" textLength="184.7" lengthAdjust="spacingAndGlyphs">! 규모 반도체 펀드 신설' / 일치</text>
<text x="16.1" y="470.9" font-size="15.6" textLength="252.3" lengthAdjust="spacingAndGlyphs">- 주 52시간제 / 요약 260811 쟁점 2/ 일치</text>
<text x="16.1" y="487.0" font-size="14.4" textLength="368.2" lengthAdjust="spacingAndGlyphs">- 260728 제33회 3쪽 / 요약 점검 기록 260728 근거 3쪽 / 일치</text>
<text x="16.1" y="504.3" font-size="14.5" textLength="459.5" lengthAdjust="spacingAndGlyphs">- 260806 제30회 2~3쪽/ 요약 260806 쟁점 1 출처 간 2~3쪽(모두말씀) / 일치</text>
<text x="16.1" y="521.4" font-size="14.5" textLength="397.2" lengthAdjust="spacingAndGlyphs">- 260811 제35회 7~10쪽 / 요약 260811 핵심요약 2 7~10쪽' / 일치</text>
<text x="15.0" y="538.3" font-size="16.8" textLength="477.7" lengthAdjust="spacingAndGlyphs">- 260721 제31회 40~44쪽 / 요약 260721 핵심요약 3 회의 말미(40~44쪽)'/ 일치</text>
<text x="16.1" y="555.6" font-size="15.6" textLength="384.3" lengthAdjust="spacingAndGlyphs">- 260811 제35회 29~30쪽 / 요약 260811 쟁점 1 29~30쪽'/ 일치</text>
<text x="16.1" y="572.8" font-size="15.5" textLength="384.3" lengthAdjust="spacingAndGlyphs">- 260811 제35회 39~40쪽 / 요약 260811 쟁점 2 39~40쪽'/ 일치</text>
<text x="16.1" y="588.9" font-size="15.5" textLength="507.8" lengthAdjust="spacingAndGlyphs">- 40~42쪽 (점검 기록 인용) / 요약 점검 기록 260811 노동쟁의 논의 위치' 근거 / 일치</text>
<text x="15.0" y="607.0" font-size="16.6" textLength="601.2" lengthAdjust="spacingAndGlyphs">- 10월 31일 (다음 단계) / 요약에 없음. 사용자가 이번 대화에서 직접 입력한 값 / 요약 기준 대조 불가</text>
<text x="17.2" y="655.7" font-size="14.5" textLength="25.8" lengthAdjust="spacingAndGlyphs">주의</text>
<text x="16.1" y="673.8" font-size="15.5" textLength="649.5" lengthAdjust="spacingAndGlyphs">- 쟁점 결론의 &quot;정리되지 않은 지점이 남아 있는 것으로 보인다&quot;와 기대효과의 '(추정)' 줄은 요약 사실에서 끌어</text>
<text x="18.3" y="691.1" font-size="15.8" textLength="253.4" lengthAdjust="spacingAndGlyphs">낸 해석·추정이며 요약에 적힌 내용이 아님.</text>
<text x="16.1" y="708.1" font-size="15.5" textLength="651.6" lengthAdjust="spacingAndGlyphs">- 요약 260811 쟁점 2의 주 52시간제 논의가 3대 메가프로젝트와 관련된 것인지는 요약에 적혀 있지 않음. 기획</text>
<text x="18.3" y="725.4" font-size="15.6" textLength="211.5" lengthAdjust="spacingAndGlyphs">안은 부처 간 입장자의 사례로만 씀.</text>
<text x="25.8" y="768.6" font-size="14.5" textLength="121.3" lengthAdjust="spacingAndGlyphs">출 1, 열 1 4,230자</text>
