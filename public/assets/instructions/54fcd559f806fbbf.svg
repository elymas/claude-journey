<svg xmlns="http://www.w3.org/2000/svg" width="794" height="238" viewBox="0 0 794 238" role="img"><title>③ 그래프 모양 — 채우기 전</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H794" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="782" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ③ 그래프 모양 — 채우기 전</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="0.0" y="70.9" font-size="31.8" textLength="420.7" lengthAdjust="spacingAndGlyphs">## ③ 그래프 모양 — 숫자는 적지 않는다</text>
<text x="0.0" y="102.6" font-size="30.6" textLength="449.9" lengthAdjust="spacingAndGlyphs">·자주 쓰는 그래프 — 막대 / 선 / 원 / 알아서</text>
<text x="0.0" y="131.9" font-size="30.4" textLength="466.5" lengthAdjust="spacingAndGlyphs">- 색 순서: (기본색 → 보조색 → 회색 / 알아서)</text>
<text x="0.0" y="159.4" font-size="24.9" textLength="230.8" lengthAdjust="spacingAndGlyphs">·눈금선 — 옅게 / 없음</text>
<text x="0.0" y="191.0" font-size="30.4" textLength="380.5" lengthAdjust="spacingAndGlyphs">·값 표시 — 막대·점 위에 / 표시 안 함</text>
<text x="0.0" y="222.1" font-size="29.2" textLength="409.9" lengthAdjust="spacingAndGlyphs">·출처 자리 — 그래프 아래 왼쪽, 작은 글씨</text></g><rect x=".5" y=".5" width="793" height="237" rx="6" fill="none" stroke="#d8cfc0"/></svg>