<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img"><title>가상 예시 ① 부르면 먼저 묻는다 — 목표·기대효과·대상·시간. 내 진짜 발표로 답하고, 주제는 내가 고른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1400" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1388" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 가상 예시 ① 부르면 먼저 묻는다 — 목표·기대효과·대상·시간. 내 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="20.3" y="75.3" font-size="23.1" textLength="195.3" lengthAdjust="spacingAndGlyphs">~ 워크숍 보고 기획안</text>
<text x="1058.1" y="74.0" font-size="19.1" textLength="75.3" lengthAdjust="spacingAndGlyphs">가상 예시</text>
<text x="1212.8" y="79.3" font-size="25.4" textLength="164.8" lengthAdjust="spacingAndGlyphs">회의록_2026 연결됨</text>
<text x="710.2" y="162.2" font-size="27.3" textLength="634.9" lengthAdjust="spacingAndGlyphs">기획안.md 읽고, 결과 폴더의 2026-10-30_회의록정리.md로 기획안 써줘</text>
<text x="32.5" y="222.6" font-size="19.1" textLength="59.1" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="32.6" y="258.6" font-size="23.2" textLength="262.5" lengthAdjust="spacingAndGlyphs">쓰기 전에 네 가지를 물을게요.</text>
<text x="32.4" y="296.0" font-size="31.7" textLength="476.5" lengthAdjust="spacingAndGlyphs">1. 목표 - 발표가 끝나면 무엇이 정해져 있어야 하나요?</text>
<text x="30.5" y="325.6" font-size="23.2" textLength="364.2" lengthAdjust="spacingAndGlyphs">2. 기대효과 - 그래서 무엇이 나아지나요?</text>
<text x="30.5" y="359.9" font-size="25.4" textLength="205.5" lengthAdjust="spacingAndGlyphs">3. 대상 - 누가 듣나요?</text>
<text x="30.5" y="394.6" font-size="25.2" textLength="203.5" lengthAdjust="spacingAndGlyphs">4. 시간 - 몇 분인가요?</text>
<text x="899.4" y="459.8" font-size="25.3" textLength="390.7" lengthAdjust="spacingAndGlyphs">1. 워크숍 남은 일의 담당 • 기한을 오늘 정한다</text>
<text x="899.4" y="494.3" font-size="25.2" textLength="447.7" lengthAdjust="spacingAndGlyphs">2. 미확인 2건이 사라지고 11/13 전에 준비가 끝난다</text>
<text x="899.4" y="530.3" font-size="29.4" textLength="166.9" lengthAdjust="spacingAndGlyphs">3. 팀장님, 팀원 6명</text>
<text x="899.3" y="561.7" font-size="25.9" textLength="65.4" lengthAdjust="spacingAndGlyphs">4. 10분</text>
<text x="32.5" y="623.6" font-size="19.4" textLength="59.2" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="32.6" y="661.3" font-size="25.3" textLength="175.0" lengthAdjust="spacingAndGlyphs">주제 후보 셋이에요.</text>
<text x="32.6" y="697.2" font-size="29.4" textLength="358.1" lengthAdjust="spacingAndGlyphs">1 11월 워크숍, 빈칸 두 개만 채우면 된다</text>
<text x="32.6" y="726.6" font-size="23.2" textLength="258.4" lengthAdjust="spacingAndGlyphs">② 10월 회의 결정사항 한눈에</text>
<text x="32.6" y="760.9" font-size="25.3" textLength="280.8" lengthAdjust="spacingAndGlyphs">③ 워크숍 준비 현황과 남은 과제</text>
<text x="32.5" y="795.0" font-size="29.8" textLength="160.8" lengthAdjust="spacingAndGlyphs">어느 걸로 쓸까요?</text>
<text x="1261.6" y="859.0" font-size="23.5" textLength="85.6" lengthAdjust="spacingAndGlyphs">①로 써줘</text>
<text x="32.6" y="923.0" font-size="17.0" textLength="59.0" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="30.5" y="962.1" font-size="27.3" textLength="482.3" lengthAdjust="spacingAndGlyphs">✓ 결과 폴더에 2026-10-30_기획안.md로 저장했어요.</text>
<text x="54.9" y="1036.1" font-size="23.3" textLength="195.3" lengthAdjust="spacingAndGlyphs">메시지를 입력하세요…•</text></g><rect x=".5" y=".5" width="1399" height="1079" rx="6" fill="none" stroke="#d8cfc0"/></svg>