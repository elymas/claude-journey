<svg xmlns="http://www.w3.org/2000/svg" width="1319" height="725" viewBox="0 0 1319 725" role="img"><title>기대효과는 템플릿의 카드 세 개 장에</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1319" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1307" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 기대효과는 템플릿의 카드 세 개 장에</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="55.5" y="99.0" font-size="44.5" textLength="169.0" lengthAdjust="spacingAndGlyphs">V. 기대효과</text>
<text x="1123.5" y="87.1" font-size="17.7" textLength="120.8" lengthAdjust="spacingAndGlyphs">3대 메가프로젝트</text>
<text x="82.4" y="185.4" font-size="25.6" textLength="638.4" lengthAdjust="spacingAndGlyphs">핵심 요약 정책 변화 대신 반복 쟁점과 멈춘 곳이 보이길 기대한다(추정)</text>
<text x="226.2" y="283.8" font-size="33.5" textLength="34.5" lengthAdjust="spacingAndGlyphs">미</text>
<text x="88.2" y="346.2" font-size="25.8" textLength="216.6" lengthAdjust="spacingAndGlyphs">O (추정) 쟁점을 목록으로</text>
<text x="111.2" y="369.5" font-size="23.8" textLength="178.3" lengthAdjust="spacingAndGlyphs">관리하면 7월 21일과</text>
<text x="111.2" y="394.5" font-size="23.9" textLength="197.5" lengthAdjust="spacingAndGlyphs">8월 11일 회의처럼 같은</text>
<text x="111.2" y="419.2" font-size="23.8" textLength="163.0" lengthAdjust="spacingAndGlyphs">구도의 논의가 다시</text>
<text x="113.1" y="443.8" font-size="25.8" textLength="222.4" lengthAdjust="spacingAndGlyphs">시작되는 것을 빨리 알아볼</text>
<text x="111.2" y="470.5" font-size="27.8" textLength="72.9" lengthAdjust="spacingAndGlyphs">수 있음.</text>
<text x="623.1" y="283.8" font-size="33.7" textLength="53.7" lengthAdjust="spacingAndGlyphs">02</text>
<text x="494.6" y="346.2" font-size="25.8" textLength="241.6" lengthAdjust="spacingAndGlyphs">O(추정) 부처 입장을 나란히</text>
<text x="519.5" y="371.2" font-size="25.8" textLength="182.1" lengthAdjust="spacingAndGlyphs">적으면 이견이 드러난</text>
<text x="519.5" y="399.2" font-size="29.6" textLength="203.2" lengthAdjust="spacingAndGlyphs">채로 정리되어, 대통령이</text>
<text x="519.5" y="419.2" font-size="23.8" textLength="205.1" lengthAdjust="spacingAndGlyphs">말한 이견 노출의 취지와</text>
<text x="519.5" y="445.8" font-size="25.9" textLength="128.5" lengthAdjust="spacingAndGlyphs">어긋나지 않음.</text>
<text x="1031.4" y="283.8" font-size="33.7" textLength="53.7" lengthAdjust="spacingAndGlyphs">03</text>
<text x="901.1" y="346.2" font-size="25.8" textLength="174.5" lengthAdjust="spacingAndGlyphs">0 한계: 쟁의 기준이</text>
<text x="926.0" y="369.5" font-size="23.8" textLength="159.1" lengthAdjust="spacingAndGlyphs">정해지거나 투자가</text>
<text x="926.0" y="394.5" font-size="23.9" textLength="159.1" lengthAdjust="spacingAndGlyphs">빨라진다는 효과는</text>
<text x="925.8" y="421.0" font-size="29.0" textLength="128.7" lengthAdjust="spacingAndGlyphs">보장하지 않음.</text>
<text x="237.7" y="554.0" font-size="17.7" textLength="67.1" lengthAdjust="spacingAndGlyphs">7월 21일</text>
<text x="201.3" y="595.0" font-size="25.6" textLength="141.9" lengthAdjust="spacingAndGlyphs">쟁의 범위 논의</text>
<text x="425.4" y="552.4" font-size="21.4" textLength="73.3" lengthAdjust="spacingAndGlyphs">같은 구도</text>
<text x="624.9" y="554.2" font-size="18.4" textLength="67.3" lengthAdjust="spacingAndGlyphs">8월 11일</text>
<text x="563.6" y="595.0" font-size="25.6" textLength="189.8" lengthAdjust="spacingAndGlyphs">쟁의 대상 기준 논의</text>
<text x="835.9" y="551.8" font-size="19.8" textLength="32.6" lengthAdjust="spacingAndGlyphs">목록</text>
<text x="394.9" y="649.3" font-size="22.1" textLength="510.0" lengthAdjust="spacingAndGlyphs">한계: 쟁의 기준이 정해지거나 투자가 빨라진다는 효과는 보장하지 않음</text>
<text x="462.0" y="687.7" font-size="19.7" textLength="377.7" lengthAdjust="spacingAndGlyphs">(그림 6&gt; 반복 쟁점이 보이는 흐름 (도식) ※ 도식: 콘티 기준</text>
<text x="970.1" y="553.7" font-size="19.7" textLength="134.2" lengthAdjust="spacingAndGlyphs">목록으로 관리하면</text>
<text x="922.1" y="596.6" font-size="27.6" textLength="232.0" lengthAdjust="spacingAndGlyphs">반복 쟁점이 보임 (추정)</text></g><rect x=".5" y=".5" width="1318" height="724" rx="6" fill="none" stroke="#d8cfc0"/></svg>