<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="807" viewBox="0 0 1035 807" role="img"><title>① 시종.md를 연다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1035" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1023" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ① 시종.md를 연다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="31.5" y="89.0" font-size="26.1" textLength="128.1" lengthAdjust="spacingAndGlyphs">트 시종.md</text>
<text x="25.6" y="137.1" font-size="23.4" textLength="210.6" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="454.3" y="93.9" font-size="29.5" textLength="27.1" lengthAdjust="spacingAndGlyphs">+</text>
<text x="334.0" y="136.3" font-size="18.8" textLength="383.6" lengthAdjust="spacingAndGlyphs">H1V VB1Sg.</text>
<text x="29.8" y="252.8" font-size="65.2" textLength="355.5" lengthAdjust="spacingAndGlyphs">정책자료 요약</text>
<text x="30.2" y="308.5" font-size="31.0" textLength="392.4" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="30.1" y="378.0" font-size="52.7" textLength="112.8" lengthAdjust="spacingAndGlyphs">할 일</text>
<text x="25.9" y="433.0" font-size="31.0" textLength="539.1" lengthAdjust="spacingAndGlyphs">1. 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="66.2" y="473.7" font-size="26.4" textLength="308.4" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="28.6" y="516.8" font-size="29.5" textLength="470.9" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="25.9" y="553.5" font-size="31.2" textLength="655.5" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="70.7" y="597.9" font-size="31.4" textLength="528.0" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="69.2" y="637.4" font-size="38.8" textLength="425.7" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="33.1" y="706.0" font-size="52.7" textLength="334.0" lengthAdjust="spacingAndGlyphs">다 됐다는 기준</text>
<text x="25.6" y="756.3" font-size="18.8" textLength="389.6" lengthAdjust="spacingAndGlyphs">• 결과 포더에 자르오야 m가 생겼다</text>
<text x="34.6" y="788.6" font-size="23.3" textLength="176.0" lengthAdjust="spacingAndGlyphs">줄 9, 열 25| 273자</text>
<text x="333.7" y="785.5" font-size="21.0" textLength="87.7" lengthAdjust="spacingAndGlyphs">AA 포맷</text>
<text x="556.6" y="785.2" font-size="15.6" textLength="46.6" lengthAdjust="spacingAndGlyphs">100%</text>
<text x="658.9" y="786.3" font-size="18.7" textLength="132.4" lengthAdjust="spacingAndGlyphs">Windows (CRLF)</text>
<text x="853.0" y="785.2" font-size="15.6" textLength="48.1" lengthAdjust="spacingAndGlyphs">UTF-8</text></g><rect x=".5" y=".5" width="1034" height="806" rx="6" fill="none" stroke="#d8cfc0"/></svg>