<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1040" viewBox="0 0 950 1040" role="img"><title>규칙.md에 주문서를 붙여넣은 화면</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H950" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="938" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 규칙.md에 주문서를 붙여넣은 화면</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="126.6" y="104.0" font-size="27.1" textLength="413.2" lengthAdjust="spacingAndGlyphs">4 :s.trl Note.txt 새 텍스트 문</text>
<text x="721.4" y="103.0" font-size="28.3" textLength="113.8" lengthAdjust="spacingAndGlyphs">규칙.no</text>
<text x="29.1" y="169.1" font-size="30.0" textLength="202.2" lengthAdjust="spacingAndGlyphs">파일 편집</text>
<text x="231.3" y="169.1" font-size="30.0" textLength="77.1" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="440.8" y="163.7" font-size="27.1" textLength="503.4" lengthAdjust="spacingAndGlyphs">H1V := vBTS .</text>
<text x="29.0" y="259.1" font-size="35.5" textLength="202.4" lengthAdjust="spacingAndGlyphs"># 이 폴더 규칙</text>
<text x="30.5" y="362.5" font-size="33.4" textLength="180.5" lengthAdjust="spacingAndGlyphs">## 이 폴더는</text>
<text x="29.2" y="420.1" font-size="43.1" textLength="854.2" lengthAdjust="spacingAndGlyphs">회의록을 요약하고 쟁점을 분석해서 발표자료를 만드는 폴더다.</text>
<text x="32.0" y="517.3" font-size="30.6" textLength="145.6" lengthAdjust="spacingAndGlyphs">## 시킬 일</text>
<text x="34.9" y="574.3" font-size="37.5" textLength="833.6" lengthAdjust="spacingAndGlyphs">폴더 안 회의록을 읽고, 아래 차례대로 발표자료 5장을 만든다.</text>
<text x="33.5" y="624.3" font-size="34.7" textLength="560.1" lengthAdjust="spacingAndGlyphs">1. 표지 - 폴더 내 문서 요약 및 쟁점 분석</text>
<text x="33.5" y="675.5" font-size="33.1" textLength="93.1" lengthAdjust="spacingAndGlyphs">2. 목차</text>
<text x="33.5" y="727.7" font-size="34.5" textLength="232.8" lengthAdjust="spacingAndGlyphs">3. 문서 요약 내용</text>
<text x="32.0" y="778.9" font-size="33.0" textLength="231.3" lengthAdjust="spacingAndGlyphs">4. 문서 쟁점 정리</text>
<text x="33.2" y="832.5" font-size="36.7" textLength="183.9" lengthAdjust="spacingAndGlyphs">5. 감사합니다</text>
<text x="31.8" y="933.1" font-size="32.5" textLength="177.9" lengthAdjust="spacingAndGlyphs">## 파일 이름</text>
<text x="29.2" y="995.5" font-size="47.3" textLength="612.5" lengthAdjust="spacingAndGlyphs">Y-MM_회의록_요약.pptx 형식으로 만든다.</text></g><rect x=".5" y=".5" width="949" height="1039" rx="6" fill="none" stroke="#d8cfc0"/></svg>