<text x="24.1" y="206.2" font-size="17.0" textLength="681.7" lengthAdjust="spacingAndGlyphs">• 260811(제35회 국무회의록) 자살예방대책 관련 목표수치 토의 세부내용은 원문에서 명확히 확</text>
