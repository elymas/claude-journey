<text x="626.6" y="937.9" font-size="22.1" textLength="54.6" lengthAdjust="spacingAndGlyphs">100%</text>
<text x="741.9" y="938.1" font-size="20.1" textLength="188.7" lengthAdjust="spacingAndGlyphs">Windows (CRLF)</text>
