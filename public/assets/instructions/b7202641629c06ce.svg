<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="952" viewBox="0 0 1100 952" role="img"><title>규칙.md의 결과물 위치 항목에 폴더 경로를 붙여넣은 화면</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1100" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1088" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 규칙.md의 결과물 위치 항목에 폴더 경로를 붙여넣은 화면</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="59.2" y="97.4" font-size="21.6" textLength="396.5" lengthAdjust="spacingAndGlyphs">4 s.tl Note.txt 새 텍스트 문</text>
<text x="612.3" y="95.5" font-size="23.5" textLength="100.8" lengthAdjust="spacingAndGlyphs">규칙.no</text>
<text x="22.4" y="152.4" font-size="26.5" textLength="236.6" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="340.6" y="148.1" font-size="23.2" textLength="463.7" lengthAdjust="spacingAndGlyphs">H1V :=✓BTS .</text>
<text x="24.0" y="183.7" font-size="19.8" textLength="127.9" lengthAdjust="spacingAndGlyphs">## 시즌 일</text>
<text x="25.6" y="232.7" font-size="34.7" textLength="709.9" lengthAdjust="spacingAndGlyphs">폴더 안 회의록을 읽고, 아래 차례대로 발표자료 5장을 만든다.</text>
<text x="25.6" y="272.0" font-size="28.0" textLength="476.5" lengthAdjust="spacingAndGlyphs">1. 표지 - 폴더 내 문서 요약 및 쟁점 분석</text>
<text x="24.0" y="317.9" font-size="31.4" textLength="79.9" lengthAdjust="spacingAndGlyphs">2. 목차</text>
<text x="25.6" y="361.3" font-size="29.6" textLength="198.3" lengthAdjust="spacingAndGlyphs">3. 문서 요약 내용</text>
<text x="22.4" y="406.2" font-size="29.9" textLength="199.9" lengthAdjust="spacingAndGlyphs">4. 문서 쟁점 정리</text>
<text x="23.8" y="451.5" font-size="31.8" textLength="158.7" lengthAdjust="spacingAndGlyphs">5. 감사합니다</text>
<text x="826.6" y="100.6" font-size="31.3" textLength="33.6" lengthAdjust="spacingAndGlyphs">+</text>
<text x="967.3" y="71.7" font-size="9.9" textLength="32.0" lengthAdjust="spacingAndGlyphs">-</text>
<text x="904.9" y="147.9" font-size="24.7" textLength="123.1" lengthAdjust="spacingAndGlyphs">8~ g</text>
<text x="22.2" y="537.9" font-size="29.7" textLength="153.8" lengthAdjust="spacingAndGlyphs">## 파일 이름</text>
<text x="22.4" y="587.2" font-size="36.2" textLength="533.9" lengthAdjust="spacingAndGlyphs">YYYY-MM_기획안.pptx 형식으로 만든다.</text>
<text x="20.8" y="669.9" font-size="28.0" textLength="179.1" lengthAdjust="spacingAndGlyphs">## 결과물 위치</text>
<text x="25.6" y="717.2" font-size="33.0" textLength="1072.8" lengthAdjust="spacingAndGlyphs">새로 만든 파일은 /C:#Users#AIX#Desktop#00프로젝트 안에 넣는다. 원본은 건드리지 않는다.</text>
<text x="20.8" y="802.5" font-size="28.0" textLength="163.1" lengthAdjust="spacingAndGlyphs">## 하지 말 것</text>
<text x="20.8" y="848.4" font-size="31.4" textLength="1042.4" lengthAdjust="spacingAndGlyphs">- 자료에 없는 내용을 지어내지 않는다. 근거가 없으면 빈칸으로 두고 목록으로 알려준다.</text>
<text x="20.8" y="891.8" font-size="29.6" textLength="399.7" lengthAdjust="spacingAndGlyphs">- 원본 파일 이름을 바꾸지 않는다.</text>
<text x="41.6" y="941.8" font-size="26.4" textLength="195.1" lengthAdjust="spacingAndGlyphs">출 18, 열 39| 359자</text>
