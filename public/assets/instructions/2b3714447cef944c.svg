<svg xmlns="http://www.w3.org/2000/svg" width="688" height="576" viewBox="0 0 688 576" role="img"><title>주문서로 덮어쓴 규칙.md — 맨 위에 이름 줄이 생겼다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H688" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="676" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 주문서로 덮어쓴 규칙.md — 맨 위에 이름 줄이 생겼다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="17.0" y="71.3" font-size="18.5" textLength="17.0" lengthAdjust="spacingAndGlyphs">트</text>
<text x="13.0" y="103.8" font-size="15.5" textLength="29.0" lengthAdjust="spacingAndGlyphs">파일</text>
<text x="57.0" y="69.9" font-size="14.4" textLength="46.0" lengthAdjust="spacingAndGlyphs">규칙.md</text>
<text x="57.0" y="103.8" font-size="15.5" textLength="41.0" lengthAdjust="spacingAndGlyphs">편집</text>
<text x="117.0" y="102.9" font-size="14.4" textLength="37.0" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="14.0" y="149.3" font-size="18.5" textLength="127.0" lengthAdjust="spacingAndGlyphs"># 정책자료 기획안</text>
<text x="301.0" y="71.7" font-size="15.5" textLength="15.0" lengthAdjust="spacingAndGlyphs">+</text>
<text x="219.0" y="101.0" font-size="13.4" textLength="256.0" lengthAdjust="spacingAndGlyphs">H1vvBTSC</text>
<text x="12.9" y="201.8" font-size="18.4" textLength="92.2" lengthAdjust="spacingAndGlyphs">## 이 폴더는</text>
<text x="17.0" y="227.5" font-size="17.5" textLength="280.0" lengthAdjust="spacingAndGlyphs">정책자료를 읽고 기획안을 만드는 폴더다.</text>
<text x="13.0" y="278.8" font-size="16.9" textLength="92.1" lengthAdjust="spacingAndGlyphs">## 파일 이름</text>
<text x="15.0" y="307.2" font-size="19.6" textLength="272.0" lengthAdjust="spacingAndGlyphs">YYYY-MM_기획안.pptx 형식으로 만든다.</text>
<text x="13.0" y="356.6" font-size="16.5" textLength="106.0" lengthAdjust="spacingAndGlyphs">## 결과물 위치</text>
<text x="17.2" y="384.1" font-size="20.7" textLength="424.3" lengthAdjust="spacingAndGlyphs">새로 만든 파일은 같은 폴더에 넣는다. 원본은 건드리지 않는다.</text>
<text x="13.9" y="434.8" font-size="16.9" textLength="56.1" lengthAdjust="spacingAndGlyphs">## 절차</text>
<text x="17.2" y="461.4" font-size="20.7" textLength="329.7" lengthAdjust="spacingAndGlyphs">1. 이 폴더의 정책자료를 파일별로 끝까지 읽는다.</text>
<text x="16.0" y="489.2" font-size="19.6" textLength="307.0" lengthAdjust="spacingAndGlyphs">2. 자료마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="14.3" y="513.0" font-size="20.7" textLength="326.8" lengthAdjust="spacingAndGlyphs">3. 요약과 쟁점을 바탕으로 기획안 5장을 만든다.</text>
<text x="14.3" y="538.7" font-size="20.6" textLength="384.1" lengthAdjust="spacingAndGlyphs">4. 근거가 없는 항목은 빈칸으로 두고 목록으로 알려준다.</text>
<text x="25.0" y="567.8" font-size="15.5" textLength="130.0" lengthAdjust="spacingAndGlyphs">줄 1, 열 11 10/309자</text>
<text x="222.0" y="565.1" font-size="13.4" textLength="55.0" lengthAdjust="spacingAndGlyphs">AA 포맷</text>
<text x="366.9" y="565.5" font-size="11.6" textLength="31.1" lengthAdjust="spacingAndGlyphs">100%</text>
<text x="431.0" y="566.0" font-size="13.4" textLength="95.0" lengthAdjust="spacingAndGlyphs">Windows (CRLF)</text>
<text x="559.9" y="564.7" font-size="11.0" textLength="37.2" lengthAdjust="spacingAndGlyphs">UTF-8</text></g><rect x=".5" y=".5" width="687" height="575" rx="6" fill="none" stroke="#d8cfc0"/></svg>