<svg xmlns="http://www.w3.org/2000/svg" width="529" height="904" viewBox="0 0 529 904" role="img"><title>빈 탭에 Ctrl + V로 붙여 넣는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H529" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="517" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 빈 탭에 Ctrl + V로 붙여 넣는다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="16.1" y="68.0" font-size="19.9" textLength="84.7" lengthAdjust="spacingAndGlyphs">를 규칙.md</text>
<text x="265.1" y="66.4" font-size="13.1" textLength="30.2" lengthAdjust="spacingAndGlyphs">콘티</text>
<text x="12.6" y="100.0" font-size="15.8" textLength="139.5" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="13.8" y="139.2" font-size="14.4" textLength="39.0" lengthAdjust="spacingAndGlyphs"># 콘티</text>
<text x="16.3" y="156.7" font-size="15.8" textLength="232.5" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="13.8" y="189.7" font-size="14.8" textLength="52.9" lengthAdjust="spacingAndGlyphs">## 할 일</text>
<text x="13.8" y="207.2" font-size="14.4" textLength="307.9" lengthAdjust="spacingAndGlyphs">1. 부를 때 받은 결과 폴더의 기획안 한 개만 읽는다.</text>
<text x="30.2" y="224.5" font-size="15.6" textLength="149.5" lengthAdjust="spacingAndGlyphs">다른 파일은 읽지 않는다.</text>
<text x="13.8" y="242.2" font-size="15.6" textLength="428.5" lengthAdjust="spacingAndGlyphs">2. 쓰기 전에 묻는다. 기획안에 적힌 발표 시간(N분)을 표지와 덩어리마다</text>
<text x="31.4" y="259.6" font-size="16.9" textLength="399.6" lengthAdjust="spacingAndGlyphs">몇 분씩 쓸지 나눈 안을 먼저 보여 주고, 그대로 갈지 고칠지 묻는다.</text>
<text x="31.4" y="275.1" font-size="14.3" textLength="179.7" lengthAdjust="spacingAndGlyphs">답을 받기 전에는 쓰지 않는다.</text>
<text x="13.8" y="292.5" font-size="15.6" textLength="121.9" lengthAdjust="spacingAndGlyphs">3. 덩어리마다 한 장.</text>
<text x="30.2" y="309.1" font-size="14.3" textLength="411.6" lengthAdjust="spacingAndGlyphs">순서: 표지 → 배경 → 쟁점 → 제안 → 다음 단계 → 기대효과(마무리).</text>
<text x="30.2" y="327.6" font-size="16.9" textLength="334.2" lengthAdjust="spacingAndGlyphs">장을 나누지 않는다. 시간은 장 수가 아니라 노트에 쓴다.</text>
<text x="30.2" y="343.9" font-size="16.9" textLength="150.8" lengthAdjust="spacingAndGlyphs">표지 제목은 기획안 제목.</text>
<text x="30.2" y="360.5" font-size="15.6" textLength="330.5" lengthAdjust="spacingAndGlyphs">표지 부제는 기획안 맨 위의 목표에서 한 문장만 고른다.</text>
<text x="30.2" y="378.1" font-size="15.6" textLength="270.2" lengthAdjust="spacingAndGlyphs">새로 쓰지 않고, 말투만 보고서체로 다듬는다.</text>
<text x="13.8" y="395.5" font-size="16.9" textLength="170.9" lengthAdjust="spacingAndGlyphs">4. 장마다 아래 세 줄만 쓴다.</text>
<text x="31.4" y="411.9" font-size="17.2" textLength="348.6" lengthAdjust="spacingAndGlyphs">색·글꼴·그림·배치 같은 모양 얘기는 한 글자도 쓰지 않는다.</text>
<text x="27.6" y="428.5" font-size="15.6" textLength="247.5" lengthAdjust="spacingAndGlyphs">- 제목: 기획안 덩어리의 첫 줄(결론 문장).</text>
<text x="40.2" y="446.1" font-size="15.6" textLength="329.2" lengthAdjust="spacingAndGlyphs">제목은 한 줄(30자 안팎). 길면 뜻을 바꾸지 않고 줄인다.</text>
<text x="27.6" y="463.5" font-size="16.9" textLength="371.9" lengthAdjust="spacingAndGlyphs">- 본문: 기획안 덩어리의 근거 줄을 한 줄에 하나씩, 세 줄 이하.</text>
<text x="40.2" y="479.0" font-size="14.3" textLength="202.3" lengthAdjust="spacingAndGlyphs">제목을 그대로 되풀이하지 않는다.</text>
<text x="27.6" y="496.4" font-size="15.6" textLength="227.4" lengthAdjust="spacingAndGlyphs">- 노트: 맨 앞에 이 장의 발표 시간(분),</text>
<text x="40.2" y="514.1" font-size="15.6" textLength="265.1" lengthAdjust="spacingAndGlyphs">그 뒤에 발표할 때만 덧붙일 말 두 문장 이하.</text>
<text x="41.5" y="530.4" font-size="15.6" textLength="378.2" lengthAdjust="spacingAndGlyphs">읽는 사람이 꼭 알아야 할 내용은 노트에 넣지 않고 본문에 쓴다.</text>
<text x="41.5" y="546.8" font-size="15.6" textLength="361.5" lengthAdjust="spacingAndGlyphs">덧붙일 말이 없으면 시간만 적는다. ‘없음’이라고 쓰지 않는다.</text>
<text x="27.6" y="563.3" font-size="14.3" textLength="304.1" lengthAdjust="spacingAndGlyphs">‘요약에 없다’ ‘확인되지 않는다’ 같은 확인용 메모는</text>
<text x="30.2" y="582.1" font-size="15.6" textLength="168.4" lengthAdjust="spacingAndGlyphs">꼭 알아야 할 내용이 아니다.</text>
<text x="30.2" y="598.4" font-size="15.6" textLength="304.1" lengthAdjust="spacingAndGlyphs">본문·노트에 쓰지 않고 맨 아래 ‘미확인’에만 적는다.</text>
<text x="13.8" y="614.7" font-size="15.6" textLength="223.7" lengthAdjust="spacingAndGlyphs">5. 기획안에 없는 말은 만들지 않는다.</text>
<text x="30.2" y="632.4" font-size="15.6" textLength="334.2" lengthAdjust="spacingAndGlyphs">문장을 줄이거나 말투를 보고서체로 다듬을 수는 있지만,</text>
<text x="30.2" y="650.0" font-size="15.8" textLength="149.5" lengthAdjust="spacingAndGlyphs">새 내용을 쓰지는 않는다.</text>
<text x="13.8" y="667.5" font-size="17.0" textLength="300.3" lengthAdjust="spacingAndGlyphs">6. 결과 폴더에 YYYY-MM-DD_콘티.md로 저장한다.</text>
<text x="30.2" y="682.9" font-size="14.4" textLength="158.3" lengthAdjust="spacingAndGlyphs">슬라이드는 만들지 않는다.</text>
<text x="13.8" y="715.6" font-size="14.3" textLength="110.6" lengthAdjust="spacingAndGlyphs">## 다 됐다는 기준</text>
<text x="12.6" y="734.4" font-size="15.8" textLength="218.6" lengthAdjust="spacingAndGlyphs">- 쓰기 전에 덩어리별 시간을 물었다.</text>
<text x="13.8" y="751.9" font-size="17.0" textLength="309.1" lengthAdjust="spacingAndGlyphs">- 덩어리마다 한 장(표지까지 여섯 장), 장마다 세 줄.</text>
<text x="13.8" y="767.2" font-size="14.4" textLength="311.6" lengthAdjust="spacingAndGlyphs">- 노트 맨 앞의 시간을 모두 더하면 발표 시간과 같다.</text>
<text x="13.8" y="784.7" font-size="15.6" textLength="318.4" lengthAdjust="spacingAndGlyphs">- 본문·노트에 ‘요약에 없다’ 같은 확인용 메모가 없다.</text>
<text x="13.8" y="802.4" font-size="15.8" textLength="116.9" lengthAdjust="spacingAndGlyphs">- 모양 얘기가 없다.</text>
<text x="13.8" y="818.7" font-size="15.8" textLength="173.4" lengthAdjust="spacingAndGlyphs">- 기획안에 없는 숫자가 없다.</text>
<text x="13.8" y="836.4" font-size="15.8" textLength="321.7" lengthAdjust="spacingAndGlyphs">- 노트를 가려도 제목·본문만으로 그 장의 뜻이 통한다.</text>
<text x="13.8" y="852.9" font-size="14.4" textLength="373.2" lengthAdjust="spacingAndGlyphs">- 본문이 세 줄을 넘길 것 같으면 늘리지 말고 멈춰서 물어본다.</text>
<text x="483.8" y="67.2" font-size="15.6" textLength="13.8" lengthAdjust="spacingAndGlyphs">+</text></g><rect x=".5" y=".5" width="528" height="903" rx="6" fill="none" stroke="#d8cfc0"/></svg>