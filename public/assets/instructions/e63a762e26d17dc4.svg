<svg xmlns="http://www.w3.org/2000/svg" width="511" height="656" viewBox="0 0 511 656" role="img"><title>파일 → 새 Markdown 탭</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H511" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="499" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 파일 → 새 Markdown 탭</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="53.8" y="70.0" font-size="14.9" textLength="46.6" lengthAdjust="spacingAndGlyphs">규칙.md</text>
<text x="68.1" y="103.9" font-size="16.8" textLength="27.8" lengthAdjust="spacingAndGlyphs">편집</text>
<text x="255.5" y="68.3" font-size="13.9" textLength="12.6" lengthAdjust="spacingAndGlyphs">×</text>
<text x="297.6" y="71.4" font-size="17.6" textLength="17.9" lengthAdjust="spacingAndGlyphs">+</text>
<text x="11.7" y="102.9" font-size="16.7" textLength="28.7" lengthAdjust="spacingAndGlyphs">파일</text>
<text x="122.8" y="102.9" font-size="16.7" textLength="28.7" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="420.5" y="96.6" font-size="8.0" textLength="19.7" lengthAdjust="spacingAndGlyphs">...</text>
<text x="17.0" y="138.0" font-size="16.7" textLength="34.1" lengthAdjust="spacingAndGlyphs">새 탭</text>
<text x="17.0" y="171.2" font-size="16.8" textLength="35.0" lengthAdjust="spacingAndGlyphs">새창</text>
<text x="17.9" y="202.9" font-size="14.8" textLength="104.9" lengthAdjust="spacingAndGlyphs">새 Markdown 탭</text>
<text x="18.8" y="237.5" font-size="17.6" textLength="26.9" lengthAdjust="spacingAndGlyphs">열기</text>
<text x="17.9" y="269.7" font-size="18.7" textLength="29.6" lengthAdjust="spacingAndGlyphs">최근</text>
<text x="17.0" y="302.1" font-size="18.7" textLength="30.5" lengthAdjust="spacingAndGlyphs">저장</text>
<text x="17.9" y="335.5" font-size="17.6" textLength="122.8" lengthAdjust="spacingAndGlyphs">다른 이름으로 저장</text>
<text x="16.9" y="368.2" font-size="17.5" textLength="62.1" lengthAdjust="spacingAndGlyphs">모두 저작</text>
<text x="17.0" y="404.8" font-size="18.1" textLength="76.3" lengthAdjust="spacingAndGlyphs">페이지 설정</text>
<text x="17.9" y="437.7" font-size="18.6" textLength="29.6" lengthAdjust="spacingAndGlyphs">인쇄</text>
<text x="18.8" y="472.5" font-size="14.9" textLength="45.7" lengthAdjust="spacingAndGlyphs">탭 닫기</text>
<text x="17.9" y="505.6" font-size="16.2" textLength="46.8" lengthAdjust="spacingAndGlyphs">창 닫기</text>
<text x="163.1" y="137.1" font-size="12.7" textLength="38.8" lengthAdjust="spacingAndGlyphs">Ctrl+N</text>
<text x="163.1" y="170.1" font-size="13.3" textLength="70.9" lengthAdjust="spacingAndGlyphs">Ctrl+Shift+N</text>
<text x="249.2" y="200.8" font-size="17.6" textLength="44.8" lengthAdjust="spacingAndGlyphs">들더다.</text>
<text x="163.2" y="235.7" font-size="12.1" textLength="37.7" lengthAdjust="spacingAndGlyphs">Ctrl+O</text>
<text x="245.6" y="278.7" font-size="18.6" textLength="208.0" lengthAdjust="spacingAndGlyphs">폴더에 넣는다. 없으면 만든다.</text>
<text x="162.2" y="302.0" font-size="14.2" textLength="36.9" lengthAdjust="spacingAndGlyphs">Ctrl+S</text>
<text x="163.2" y="333.2" font-size="21.4" textLength="126.6" lengthAdjust="spacingAndGlyphs">ctrlshift-s 는다.</text>
<text x="244.7" y="358.4" font-size="20.4" textLength="158.7" lengthAdjust="spacingAndGlyphs">에_2를 붙여 저장한다.</text>
<text x="162.2" y="369.0" font-size="15.9" textLength="60.1" lengthAdjust="spacingAndGlyphs">Ctrl+Alt+S</text>
<text x="162.2" y="437.5" font-size="15.3" textLength="36.9" lengthAdjust="spacingAndGlyphs">Ctrl+P</text>
<text x="247.4" y="435.2" font-size="17.6" textLength="27.8" lengthAdjust="spacingAndGlyphs">:다.</text>
<text x="163.2" y="471.1" font-size="11.1" textLength="43.0" lengthAdjust="spacingAndGlyphs">Ctrl+W</text>
<text x="249.2" y="485.6" font-size="16.7" textLength="176.6" lengthAdjust="spacingAndGlyphs">인정보 표시가 있는 파일은</text>
<text x="163.2" y="511.2" font-size="19.4" textLength="174.8" lengthAdjust="spacingAndGlyphs">Ctrl+Shit+W 내가 거른다.</text>
<text x="17.9" y="538.9" font-size="14.8" textLength="27.8" lengthAdjust="spacingAndGlyphs">종료</text>
<text x="12.5" y="563.9" font-size="17.0" textLength="54.8" lengthAdjust="spacingAndGlyphs">## 검증</text>
<text x="11.7" y="590.6" font-size="17.6" textLength="278.8" lengthAdjust="spacingAndGlyphs">- 숫자와 날짜는 원문에서 그대로 옮긴다.</text>
<text x="24.2" y="616.7" font-size="17.9" textLength="265.4" lengthAdjust="spacingAndGlyphs">계산이 필요하면 계산식을 같이 적는다.</text>
<text x="11.7" y="641.0" font-size="16.7" textLength="299.4" lengthAdjust="spacingAndGlyphs">- 원문에 없는 값은 비워두고 ‘미확인’ 목록에</text></g><rect x=".5" y=".5" width="510" height="655" rx="6" fill="none" stroke="#d8cfc0"/></svg>