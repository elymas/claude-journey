<svg xmlns="http://www.w3.org/2000/svg" width="767" height="291" viewBox="0 0 767 291" role="img"><title>템플릿이 둘이면 묻는다 — 방금 만든 정책기획보고템플릿을 고른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H767" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="755" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 템플릿이 둘이면 묻는다 — 방금 만든 정책기획보고템플릿을 고른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="19.2" y="73.5" font-size="19.8" textLength="572.1" lengthAdjust="spacingAndGlyphs">주문서(템플릿_시안만들기.md)에 따라 템플릿이 여러 개라 여쭙니다. 폴더에 템플릿 pptx가</text>
<text x="19.0" y="92.4" font-size="17.5" textLength="279.6" lengthAdjust="spacingAndGlyphs">두 개 있어요. 어느 것으로 시안을 만들까요?</text>
<text x="614.0" y="81.1" font-size="15.2" textLength="139.3" lengthAdjust="spacingAndGlyphs">&lt; 2개 중 1개 》 X</text>
<text x="57.0" y="131.4" font-size="17.4" textLength="199.4" lengthAdjust="spacingAndGlyphs">정책기획보고템플릿.pptx (추천)</text>
<text x="51.1" y="153.6" font-size="19.9" textLength="671.1" lengthAdjust="spacingAndGlyphs">표지•목자 간지•마무리(감사합니다)참고 자료 장 + 세로/가로/격자 카드, 순환, 피라미드, 깔때기, 방사형 등 도식 장</text>
<text x="57.0" y="170.1" font-size="19.7" textLength="607.7" lengthAdjust="spacingAndGlyphs">다수. 주문서의 목자=덩어리 이름, 마무리 그대로, 참고 자료 장 구조와 딱 맞고 가장 최근에 고친 파일.</text>
<text x="57.0" y="201.9" font-size="18.5" textLength="184.6" lengthAdjust="spacingAndGlyphs">예시자료_기획안_템플릿.pptx</text>
<text x="28.5" y="219.9" font-size="17.4" textLength="675.2" lengthAdjust="spacingAndGlyphs">2 6장짜리 보고서식(DO- 개조식). 표지·목자•추진배경(그림+출처)•현황/문제점·추진계획(일정표)기대효과.마무리</text>
<text x="57.0" y="237.0" font-size="16.5" textLength="183.6" lengthAdjust="spacingAndGlyphs">장과 참고 자료 장이 따로 없음.</text>
<text x="26.4" y="272.1" font-size="14.2" textLength="90.7" lengthAdjust="spacingAndGlyphs">7 직접 입력</text>
