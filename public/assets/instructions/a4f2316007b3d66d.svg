<svg xmlns="http://www.w3.org/2000/svg" width="787" height="966" viewBox="0 0 787 966" role="img"><title>후보 3까지 보고 고른다. 기대효과는 근거 없으면 ‘추정’으로 적겠다고 먼저 말한다 — “2번으로 가자”</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H787" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="775" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 후보 3까지 보고 고른다. 기대효과는 근거 없으면 ‘추정’으로 적겠다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="40.4" y="78.3" font-size="19.5" textLength="285.7" lengthAdjust="spacingAndGlyphs">• 기술정책연구소와 가장 잘 맞습니다.</text>
<text x="40.4" y="105.6" font-size="20.2" textLength="102.6" lengthAdjust="spacingAndGlyphs">• 근거 항목:</text>
<text x="79.5" y="134.8" font-size="20.8" textLength="494.6" lengthAdjust="spacingAndGlyphs">• 260728 핵심요약 3:9,500억 불 규모 반도체 협력, 5GW 데이터센터</text>
<text x="80.9" y="160.8" font-size="18.1" textLength="292.4" lengthAdjust="spacingAndGlyphs">• 260806 쟁점 1: 부처 간 협업 강화 당부</text>
<text x="80.8" y="192.0" font-size="23.4" textLength="609.2" lengthAdjust="spacingAndGlyphs">• 260811 핵심요약 2:5조 원 규모 반도체 펀드, 광주 군공항 임시배치와 무안 군공항 착</text>
<text x="107.8" y="213.2" font-size="19.6" textLength="86.2" lengthAdjust="spacingAndGlyphs">공 동시 시행</text>
<text x="103.8" y="241.5" font-size="19.6" textLength="367.9" lengthAdjust="spacingAndGlyphs">260811 쟁점 2: 주 52시간제를 둘러싼 부처 간 엇박자</text>
<text x="105.1" y="268.7" font-size="18.2" textLength="381.4" lengthAdjust="spacingAndGlyphs">260721 핵심요약 3: 삼성전자 광주 공장 관련 노조 주장</text>
<text x="40.4" y="298.2" font-size="19.6" textLength="281.6" lengthAdjust="spacingAndGlyphs">• 후보 1과 노동쟁의 사례가 겹칩니다.</text>
<text x="32.3" y="345.5" font-size="19.6" textLength="443.4" lengthAdjust="spacingAndGlyphs">후보 3. 자살예방 대책이 세 번 보고됐는데 막히는 곳은 정보 공유</text>
<text x="40.3" y="381.5" font-size="18.4" textLength="100.0" lengthAdjust="spacingAndGlyphs">• 근거 항목:</text>
<text x="79.5" y="409.0" font-size="18.2" textLength="289.7" lengthAdjust="spacingAndGlyphs">• 260714 쟁점 2: 면책 기준의 지역 편차</text>
<text x="103.8" y="437.2" font-size="19.6" textLength="592.9" lengthAdjust="spacingAndGlyphs">260728 쟁점 1: 지방정부가 형사사법정보에 접근하지 못하고 경찰청이 협조하지 않는</text>
<text x="109.2" y="461.5" font-size="19.6" textLength="31.0" lengthAdjust="spacingAndGlyphs">문제</text>
<text x="79.5" y="488.7" font-size="18.2" textLength="481.1" lengthAdjust="spacingAndGlyphs">• 260811 핵심요약 2: 복지사각지대 지원율'25년 64%&gt;'30년 70%</text>
<text x="80.9" y="518.2" font-size="19.6" textLength="343.6" lengthAdjust="spacingAndGlyphs">• 자료 간 차이: 2020년 수치 3,249명과 3,429명</text>
<text x="40.4" y="545.3" font-size="18.2" textLength="485.1" lengthAdjust="spacingAndGlyphs">• 보고가 가장 일관되게 이어지지만 기술정책과의 연결이 약합니다.</text>
<text x="32.3" y="594.7" font-size="20.8" textLength="694.0" lengthAdjust="spacingAndGlyphs">폭염(여섯 번 회의)과 중동전쟁(다섯 번 회의)이 가장 자주 나오지만, 요약에는 상황 보고 위주로만 담</text>
<text x="32.3" y="617.8" font-size="19.6" textLength="591.6" lengthAdjust="spacingAndGlyphs">겨 있어 제안으로 이어갈 근거가 얇아 뺐습니다. 이쪽이 낫다고 보시면 말씀해 주세요.</text>
<text x="32.3" y="655.2" font-size="22.2" textLength="688.6" lengthAdjust="spacingAndGlyphs">기대효과는 현실적이어야 한다는 말씀에 맞춰, 요약에 근거가 없는 효과는 숫자 없이 '추정'이라고 적</text>
<text x="32.3" y="679.5" font-size="22.4" textLength="691.3" lengthAdjust="spacingAndGlyphs">겠습니다. 과장된 효과는 쓰지 않습니다. 저장은 말씀하신 대로 결과/2026-10-08_기획안. md 를 덮어</text>
<text x="32.3" y="701.6" font-size="19.7" textLength="86.3" lengthAdjust="spacingAndGlyphs">쓰겠습니다.</text>
<text x="32.3" y="737.7" font-size="20.8" textLength="696.7" lengthAdjust="spacingAndGlyphs">그리고 요약 파일의 260811 행에 표 칸이 하나 더 끼어 있는 것을 발견했습니다. 제가 앞서 고치다 생긴</text>
<text x="32.3" y="763.1" font-size="22.4" textLength="687.3" lengthAdjust="spacingAndGlyphs">서식 오류이고 내용은 그대로입니다. 마크다운으로 열면 출처 열이 밀려 보일 수 있어서, 원하시면 고</text>
<text x="32.3" y="785.4" font-size="20.2" textLength="86.4" lengthAdjust="spacingAndGlyphs">치겠습니다.</text>
<text x="30.9" y="815.6" font-size="16.0" textLength="85.0" lengthAdjust="spacingAndGlyphs">S A</text>
<text x="32.3" y="904.8" font-size="22.3" textLength="390.8" lengthAdjust="spacingAndGlyphs">2번으로 가자. 최종 보고자에게 올리기 가장 적합한 거 같아.</text>
<text x="111.8" y="939.6" font-size="15.7" textLength="63.4" lengthAdjust="spacingAndGlyphs">1 수동 v</text>
<text x="567.3" y="939.5" font-size="15.3" textLength="103.8" lengthAdjust="spacingAndGlyphs">Sonnet 5.5 높음</text></g><rect x=".5" y=".5" width="786" height="965" rx="6" fill="none" stroke="#d8cfc0"/></svg>