<svg xmlns="http://www.w3.org/2000/svg" width="704" height="582" viewBox="0 0 704 582" role="img"><title>보고 ① — 저장 위치 · 스물한 장 목록 · 답을 반영한 곳</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H704" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="692" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 보고 ① — 저장 위치 · 스물한 장 목록 · 답을 반영한 곳</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="27.6" y="68.0" font-size="19.0" textLength="327.4" lengthAdjust="spacingAndGlyphs">명령 4개 실행함, 3개 파일 읽음 외 도구 4개 더•</text>
<text x="26.4" y="108.0" font-size="21.1" textLength="580.8" lengthAdjust="spacingAndGlyphs">템플릿을 만들어 이 폴더(00프로젝트 기획_회의록)에 정책기획보고템플릿.pptx로 저장</text>
<text x="26.6" y="132.2" font-size="20.1" textLength="585.3" lengthAdjust="spacingAndGlyphs">했어요. 이름에 '템플릿'이 이미 들어 있어서 뒤에 또 붙이지 않았고, 같은 이름의 파일은</text>
<text x="26.5" y="154.4" font-size="16.8" textLength="64.8" lengthAdjust="spacingAndGlyphs">없었어요.</text>
<text x="25.6" y="189.1" font-size="15.8" textLength="99.3" lengthAdjust="spacingAndGlyphs">장 목록 (21장)</text>
<text x="25.6" y="212.7" font-size="15.9" textLength="586.3" lengthAdjust="spacingAndGlyphs">1 표지 • 2 목차 • 3 간지 • 4 마무리 • 5 참고 자료 · 6 세로 카드 • 7 가로 카드 • 8 격자 카</text>
<text x="26.6" y="237.0" font-size="16.9" textLength="580.2" lengthAdjust="spacingAndGlyphs">드 • 9 원형 순환 • 10 삼각형 · 11 깔때기 • 12 방사형 · 13 벤 다이어그램 · 14 화살표 단</text>
<text x="25.6" y="260.7" font-size="15.8" textLength="581.2" lengthAdjust="spacingAndGlyphs">계· 15 타임라인 • 16 그래프 설명형 • 17 큰 숫자형 · 18 표형 · 19 좌우 분할 20 VS 비</text>
<text x="25.6" y="284.3" font-size="14.9" textLength="95.2" lengthAdjust="spacingAndGlyphs">교 . 21 사분면</text>
<text x="25.6" y="320.9" font-size="16.9" textLength="150.4" lengthAdjust="spacingAndGlyphs">질문지 답을 반영한 곳</text>
<text x="31.7" y="356.6" font-size="16.9" textLength="579.2" lengthAdjust="spacingAndGlyphs">• 색: 고르신 B안 그대로 썼어요. 기본색 •#225560은 표지•마무리 바탕과 카드 머리</text>
<text x="58.7" y="380.0" font-size="21.1" textLength="551.5" lengthAdjust="spacingAndGlyphs">에, 보조색•#310020은 간지 바탕과 둘째 계열에 들어갔어요. 강조색 O#F0803c</text>
<text x="59.3" y="406.4" font-size="20.3" textLength="429.8" lengthAdjust="spacingAndGlyphs">는 장마다 한 곳에만 썼고, 배경은 흰색, 글자는 #171219 예요.</text>
<text x="31.7" y="432.3" font-size="16.9" textLength="359.3" lengthAdjust="spacingAndGlyphs">• 모서리: 카드 칸 전부 같은 크기로 둥글게 했어요.</text>
<text x="31.7" y="461.5" font-size="20.0" textLength="438.0" lengthAdjust="spacingAndGlyphs">• 글자 크기: 모든 장에서 제목 32pt, 본문 18pt, 캡션 12pt예요.</text>
<text x="30.7" y="488.2" font-size="19.0" textLength="575.1" lengthAdjust="spacingAndGlyphs">• 그래프 (16번 장): 도형으로 막대만 그렸어요. 색은 기본색 - 보조색- 회색 순서</text>
<text x="58.3" y="514.6" font-size="21.3" textLength="540.3" lengthAdjust="spacingAndGlyphs">이고, 눈금선은 옅은 점선이에요. 막대 위에 '값' 자리를 두고, 출처는 그래프 아래</text>
<text x="59.3" y="535.6" font-size="16.9" textLength="150.4" lengthAdjust="spacingAndGlyphs">왼쪽에 작게 넣었어요.</text>
<text x="31.7" y="563.2" font-size="16.9" textLength="406.2" lengthAdjust="spacingAndGlyphs">• 노트: 21장 모두 질문지의 쓰임 설명을 그대로 넣었어요.</text></g><rect x=".5" y=".5" width="703" height="581" rx="6" fill="none" stroke="#d8cfc0"/></svg>