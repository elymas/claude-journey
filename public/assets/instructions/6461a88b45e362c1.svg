<svg xmlns="http://www.w3.org/2000/svg" width="484" height="744" viewBox="0 0 484 744" role="img"><title>④ ctrl+V — 덮어쓴 결과</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H484" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="472" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ④ ctrl+V — 덮어쓴 결과</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="81.0" y="84.9" font-size="23.3" textLength="68.7" lengthAdjust="spacingAndGlyphs">규칙.md</text>
<text x="17.4" y="131.1" font-size="23.3" textLength="124.1" lengthAdjust="spacingAndGlyphs">파일 편집</text>
<text x="448.1" y="83.9" font-size="23.3" textLength="30.8" lengthAdjust="spacingAndGlyphs">+</text>
<text x="179.4" y="131.2" font-size="22.2" textLength="46.1" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="326.1" y="126.9" font-size="16.9" textLength="138.4" lengthAdjust="spacingAndGlyphs">H1 v:=v</text>
<text x="18.4" y="191.7" font-size="17.5" textLength="100.6" lengthAdjust="spacingAndGlyphs"># 이 폴더 규칙</text>
<text x="18.5" y="243.0" font-size="15.9" textLength="90.2" lengthAdjust="spacingAndGlyphs">## 이 폴더는</text>
<text x="20.5" y="269.5" font-size="16.9" textLength="279.9" lengthAdjust="spacingAndGlyphs">정책자료를 읽고 기획안을 만드는 폴더다.</text>
<text x="19.5" y="321.0" font-size="15.9" textLength="103.6" lengthAdjust="spacingAndGlyphs">## 결과물 위치</text>
<text x="21.5" y="348.4" font-size="18.0" textLength="437.9" lengthAdjust="spacingAndGlyphs">새로 만든 파일은 이 폴더 안 ‘결과’ 폴더에 넣는다. 없으면 만든다.</text>
<text x="21.5" y="373.3" font-size="15.9" textLength="164.1" lengthAdjust="spacingAndGlyphs">원본은 건드리지 않는다.</text>
<text x="18.5" y="424.7" font-size="15.9" textLength="94.3" lengthAdjust="spacingAndGlyphs">## 하지 말 것</text>
<text x="18.5" y="452.2" font-size="17.0" textLength="263.5" lengthAdjust="spacingAndGlyphs">- 자료에 없는 내용을 지어내지 않는다.</text>
<text x="18.5" y="477.9" font-size="17.0" textLength="233.8" lengthAdjust="spacingAndGlyphs">- 원본 파일 이름을 바꾸지 않는다.</text>
<text x="19.4" y="528.6" font-size="15.3" textLength="53.4" lengthAdjust="spacingAndGlyphs">## 검증</text>
<text x="18.5" y="555.9" font-size="17.0" textLength="278.9" lengthAdjust="spacingAndGlyphs">- 숫자와 날짜는 원문에서 그대로 옮긴다.</text>
<text x="30.8" y="582.4" font-size="18.0" textLength="265.6" lengthAdjust="spacingAndGlyphs">계산이 필요하면 계산식을 같이 적는다.</text>
<text x="18.5" y="607.2" font-size="17.2" textLength="298.4" lengthAdjust="spacingAndGlyphs">- 원문에 없는 값은 비워두고 ‘미확인’ 목록에</text>
<text x="30.8" y="634.7" font-size="18.0" textLength="253.3" lengthAdjust="spacingAndGlyphs">따로 적는다. 추측해서 채우지 않는다.</text>
<text x="18.5" y="658.6" font-size="16.1" textLength="262.5" lengthAdjust="spacingAndGlyphs">- 각 항목이 어느 파일 어디에서 왔는지</text>
<text x="30.8" y="686.0" font-size="18.2" textLength="134.3" lengthAdjust="spacingAndGlyphs">결과에 같이 적는다.</text></g><rect x=".5" y=".5" width="483" height="743" rx="6" fill="none" stroke="#d8cfc0"/></svg>