<svg xmlns="http://www.w3.org/2000/svg" width="583" height="589" viewBox="0 0 583 589" role="img"><title>② 지난주 시종.md가 열린다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H583" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="571" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ② 지난주 시종.md가 열린다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="57.6" y="69.9" font-size="14.1" textLength="46.6" lengthAdjust="spacingAndGlyphs">시종.md</text>
<text x="261.0" y="67.8" font-size="10.5" textLength="9.3" lengthAdjust="spacingAndGlyphs">X</text>
<text x="301.7" y="71.4" font-size="14.8" textLength="15.3" lengthAdjust="spacingAndGlyphs">+</text>
<text x="14.4" y="104.3" font-size="15.8" textLength="28.8" lengthAdjust="spacingAndGlyphs">파일</text>
<text x="71.2" y="103.4" font-size="15.7" textLength="27.1" lengthAdjust="spacingAndGlyphs">편집</text>
<text x="127.1" y="103.4" font-size="15.7" textLength="27.1" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="15.2" y="146.9" font-size="21.5" textLength="111.1" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="17.8" y="186.9" font-size="18.5" textLength="264.4" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="15.3" y="225.2" font-size="16.6" textLength="59.3" lengthAdjust="spacingAndGlyphs">##할 일</text>
<text x="16.9" y="265.7" font-size="17.5" textLength="352.5" lengthAdjust="spacingAndGlyphs">1. 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="16.1" y="286.0" font-size="17.5" textLength="207.6" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="16.1" y="307.6" font-size="20.1" textLength="310.1" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="16.9" y="326.5" font-size="18.3" textLength="426.2" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="17.8" y="347.7" font-size="19.3" textLength="368.6" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="17.8" y="366.3" font-size="18.3" textLength="288.1" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="16.1" y="387.3" font-size="19.2" textLength="263.5" lengthAdjust="spacingAndGlyphs">4. 의견, 제안, 방향 제시를 하지 않는다.</text>
<text x="16.1" y="424.2" font-size="15.8" textLength="123.7" lengthAdjust="spacingAndGlyphs">## 다 됐다는 기준</text>
<text x="14.4" y="465.5" font-size="17.5" textLength="255.1" lengthAdjust="spacingAndGlyphs">- 결과 폴더에 자료요약.md가 생겼다.</text>
<text x="14.3" y="485.5" font-size="19.6" textLength="205.4" lengthAdjust="spacingAndGlyphs">- 표의 모든 줄에 출처가 있다.</text>
<text x="14.4" y="505.2" font-size="17.5" textLength="250.0" lengthAdjust="spacingAndGlyphs">- 하나라도 안 되면 멈추고 물어본다.</text></g><rect x=".5" y=".5" width="582" height="588" rx="6" fill="none" stroke="#d8cfc0"/></svg>