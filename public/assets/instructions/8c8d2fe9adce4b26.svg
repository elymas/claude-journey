<svg xmlns="http://www.w3.org/2000/svg" width="748" height="840" viewBox="0 0 748 840" role="img"><title>요약에서 목표에 맞는 주제 후보 셋을 근거 항목과 함께 낸다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H748" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="736" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 요약에서 목표에 맞는 주제 후보 셋을 근거 항목과 함께 낸다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="142.1" y="74.9" font-size="19.2" textLength="512.6" lengthAdjust="spacingAndGlyphs">아, 결과폴더에 있는 기획안 그냥 동일 이름으로 덮어버려. 그거 쓸모 없어 이제.</text>
<text x="18.6" y="153.8" font-size="15.0" textLength="60.7" lengthAdjust="spacingAndGlyphs">파일 읽음</text>
<text x="21.0" y="190.1" font-size="20.4" textLength="687.4" lengthAdjust="spacingAndGlyphs">말씀하신 목표, 기대효과, 보고 대상, 발표 시간을 기준으로 요약에서 주제 후보 3개를 골랐습니다. 하</text>
<text x="19.8" y="212.7" font-size="18.2" textLength="172.4" lengthAdjust="spacingAndGlyphs">나 고르시면 쓰겠습니다.</text>
<text x="19.8" y="248.5" font-size="19.2" textLength="467.2" lengthAdjust="spacingAndGlyphs">후보 1. 법이 바뀐 뒤 '기준'은 누가 언제 정하나 (제가 추천하는 후보)</text>
<text x="26.8" y="284.8" font-size="18.0" textLength="679.3" lengthAdjust="spacingAndGlyphs">• 같은 지적이 네 번의 회의에서 반복됩니다. 대통령은 시행령•규칙•지침으로 먼저 기준을 정하라</text>
<text x="55.9" y="310.1" font-size="20.4" textLength="379.8" lengthAdjust="spacingAndGlyphs">고 하는데, 부처는 행정해석으로 이미 했다고 답합니다.</text>
<text x="28.0" y="335.2" font-size="16.9" textLength="101.4" lengthAdjust="spacingAndGlyphs">• 근거 항목:</text>
<text x="89.7" y="364.1" font-size="18.0" textLength="264.5" lengthAdjust="spacingAndGlyphs">260724 쟁점 1: 소극적 업무 행태 지적</text>
<text x="90.9" y="391.2" font-size="16.9" textLength="295.9" lengthAdjust="spacingAndGlyphs">260721 핵심요약 3: 노조법 쟁의 범위 기준</text>
<text x="67.6" y="422.0" font-size="20.4" textLength="475.4" lengthAdjust="spacingAndGlyphs">• 260811 쟁점 1: 노란봉투법 쟁의 대상, 행정해석과 시행령의 차이</text>
<text x="87.4" y="448.0" font-size="18.0" textLength="302.9" lengthAdjust="spacingAndGlyphs">260714 쟁점 2: 시행령 또는 법원 규칙 검토</text>
<text x="28.0" y="478.0" font-size="20.6" textLength="679.3" lengthAdjust="spacingAndGlyphs">• 추천 이유는 반복 횟수와 직접 발언 근거가 가장 탄탄하고, 현실적인 제안으로 끝낼 수 있어서입</text>
<text x="57.1" y="500.5" font-size="18.0" textLength="36.1" lengthAdjust="spacingAndGlyphs">니다.</text>
<text x="19.8" y="548.3" font-size="18.2" textLength="504.5" lengthAdjust="spacingAndGlyphs">후보 2. 3대 메가프로젝트가 막힐 수 있는 지점은 부처 간 이견과 제도 공백</text>
<text x="28.0" y="584.2" font-size="19.3" textLength="283.1" lengthAdjust="spacingAndGlyphs">• 기술정책연구소와 가장 잘 맞습니다.</text>
<text x="28.0" y="611.5" font-size="17.0" textLength="101.4" lengthAdjust="spacingAndGlyphs">• 근거 항목:</text>
<text x="67.6" y="642.4" font-size="20.4" textLength="492.8" lengthAdjust="spacingAndGlyphs">• 260728 핵심요약 3:9,500억 불 규모 반도체 협력, 5GW 데이터센터</text>
<text x="67.6" y="667.3" font-size="17.0" textLength="292.4" lengthAdjust="spacingAndGlyphs">• 260806 쟁점 1: 부처 간 협업 강화 당부</text>
<text x="67.6" y="698.3" font-size="20.6" textLength="609.4" lengthAdjust="spacingAndGlyphs">• 260811 핵심요약 2: 5조 원 규모 반도체 펀드, 광주 군공항 임시배치와 무안 군공항 착</text>
<text x="93.2" y="719.9" font-size="17.1" textLength="87.4" lengthAdjust="spacingAndGlyphs">공동시 시행</text>
<text x="67.6" y="748.8" font-size="18.0" textLength="390.3" lengthAdjust="spacingAndGlyphs">• 260811 쟁점 2: 주 52시간제를 둘러싼 부처 간 엇박자</text>
<text x="67.6" y="775.9" font-size="16.9" textLength="405.5" lengthAdjust="spacingAndGlyphs">• 260721 핵심요약 3: 삼성전자 광주 공장 관련 노조 주장</text>
<text x="26.8" y="804.7" font-size="18.0" textLength="278.5" lengthAdjust="spacingAndGlyphs">• 후보 1과 노동쟁의 사례가 겹칩니다.</text></g><rect x=".5" y=".5" width="747" height="839" rx="6" fill="none" stroke="#d8cfc0"/></svg>