<svg xmlns="http://www.w3.org/2000/svg" width="770" height="318" viewBox="0 0 770 318" role="img"><title>쓰기 전에 덩어리별 시간 배분안을 보여 주고 묻는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H770" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="758" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 쓰기 전에 덩어리별 시간 배분안을 보여 주고 묻는다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="17.9" y="67.6" font-size="19.7" textLength="486.8" lengthAdjust="spacingAndGlyphs">15분을 표지와 다섯 덩어리에 이렇게 나눌까요? (대상: 2026-10-08_기획안.md)</text>
<text x="59.3" y="106.3" font-size="16.3" textLength="174.6" lengthAdjust="spacingAndGlyphs">이 안대로 (Recommended)</text>
<text x="31.3" y="123.5" font-size="12.7" textLength="13.4" lengthAdjust="spacingAndGlyphs">1</text>
<text x="42.5" y="126.4" font-size="16.2" textLength="670.4" lengthAdjust="spacingAndGlyphs">표지 1분 / 배경 2분 / 쟁점 4분 / 제안 4분 / 다음 단계 2분 / 기대효과 2분 = 15분. 인사이트를 보여 줄 쟁점·제안에 시간</text>
<text x="59.3" y="143.2" font-size="16.3" textLength="86.2" lengthAdjust="spacingAndGlyphs">을 몰았습니다.</text>
<text x="59.3" y="174.4" font-size="17.5" textLength="118.6" lengthAdjust="spacingAndGlyphs">기대효과를 늘린 안</text>
<text x="28.9" y="193.7" font-size="23.1" textLength="686.6" lengthAdjust="spacingAndGlyphs">2 표지 1분 / 배경 2분 / 쟁점 4분/ 제안 3분/ 다음 단계 2분 / 기대효과 3분 = 15분. 소장님이 현실성을 따질 기대효과에 1</text>
<text x="58.2" y="211.5" font-size="16.3" textLength="78.4" lengthAdjust="spacingAndGlyphs">분 더 씁니다.</text>
<text x="30.2" y="251.2" font-size="12.7" textLength="9.0" lengthAdjust="spacingAndGlyphs">3</text>
<text x="59.3" y="242.9" font-size="16.3" textLength="72.8" lengthAdjust="spacingAndGlyphs">고쳐서 진행</text>
<text x="57.1" y="263.0" font-size="16.2" textLength="256.3" lengthAdjust="spacingAndGlyphs">'Other'에 장별 분(합계 15분)을 적어 주세요.</text>
<text x="29.1" y="299.1" font-size="15.2" textLength="60.5" lengthAdjust="spacingAndGlyphs">8 기타</text>
<text x="691.7" y="299.1" font-size="15.1" textLength="54.8" lengthAdjust="spacingAndGlyphs">건너뛰기</text></g><rect x=".5" y=".5" width="769" height="317" rx="6" fill="none" stroke="#d8cfc0"/></svg>