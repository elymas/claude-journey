<svg xmlns="http://www.w3.org/2000/svg" width="714" height="902" viewBox="0 0 714 902" role="img"><title>점검 기록 — 기획안 값 / 요약 값 / 일치. 요약에 없는 값은 ‘대조 불가’로 남는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H714" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="702" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 점검 기록 — 기획안 값 / 요약 값 / 일치. 요약에 없는 값은 ‘</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="12.5" y="71.2" font-size="22.1" textLength="77.8" lengthAdjust="spacingAndGlyphs">점검 기록</text>
<text x="15.1" y="104.2" font-size="19.4" textLength="153.1" lengthAdjust="spacingAndGlyphs">반영한 요약 점검 기록</text>
<text x="25.1" y="140.5" font-size="20.8" textLength="522.0" lengthAdjust="spacingAndGlyphs">• 260804 '자료 간 차이의 출처 쪽' 9~10쪽 &gt; 11쪽: 기획안에는 11쪽을 씀.</text>
<text x="25.1" y="170.5" font-size="22.0" textLength="577.2" lengthAdjust="spacingAndGlyphs">• 260728'순방 성과 수치' 3,500억불 &gt; 9,500억 불: 기획안에는 9,500억 불을 씀.</text>
<text x="25.1" y="199.4" font-size="22.3" textLength="638.7" lengthAdjust="spacingAndGlyphs">• '자료 간 차이' 중 2020년 수치, 기본예탁금 시행일, 43%•41%, 합계 100만 원 차이는 점검</text>
<text x="54.0" y="221.2" font-size="19.6" textLength="333.8" lengthAdjust="spacingAndGlyphs">기록에서 추가된 항목: 기획안 쟁점에 그대로 씀.</text>
<text x="13.8" y="267.7" font-size="18.2" textLength="325.0" lengthAdjust="spacingAndGlyphs">기획안의 숫자 대조 (기획안 값/ 요약값 / 결과)</text>
<text x="25.1" y="303.9" font-size="19.4" textLength="380.2" lengthAdjust="spacingAndGlyphs">• 11건 (배경)/ 요약 머리말 '대상 파일 수: 11건'/ 일치</text>
<text x="25.1" y="332.8" font-size="19.6" textLength="570.9" lengthAdjust="spacingAndGlyphs">• 260721260728•260804 (배경)/ 요약 '자료 간 차이' 첫째 항목 출처 파일 / 일치</text>
<text x="25.1" y="360.5" font-size="19.6" textLength="509.5" lengthAdjust="spacingAndGlyphs">• 260714260811 (배경) / 요약 '자료 간 차이' 둘째 항목 출처 파일 / 일치</text>
<text x="25.1" y="390.0" font-size="23.4" textLength="517.0" lengthAdjust="spacingAndGlyphs">• 9,500억 불 (배경)/ 요약'점검 기록' 260728'고친 후 9,500억 불/ 일치</text>
<text x="25.1" y="415.8" font-size="19.6" textLength="495.7" lengthAdjust="spacingAndGlyphs">• 260728 제33회 3쪽 (배경) / 요약 '점검 기록' 260728 근거 3쪽 / 일치</text>
<text x="25.1" y="444.4" font-size="20.7" textLength="448.0" lengthAdjust="spacingAndGlyphs">• 스150원/t, 150원 (쟁점)/ 요약 '자료 간 차이' 첫째 항목 / 일치</text>
<text x="25.1" y="472.2" font-size="19.4" textLength="384.0" lengthAdjust="spacingAndGlyphs">• 7차•8차 (쟁점) / 요약 '자료 간 차이' 첫째 항목 / 일치</text>
<text x="23.8" y="501.9" font-size="22.1" textLength="565.9" lengthAdjust="spacingAndGlyphs">• 260728 6쪽, 260804 11쪽 (쟁점)/ 요약 '자료 간 차이' 첫째 항목 출처 쪽 / 일치</text>
<text x="23.8" y="529.6" font-size="22.1" textLength="446.7" lengthAdjust="spacingAndGlyphs">• 3,249명 (260714 36쪽) / 요약'자료 간 차이' 둘째 항목 / 일치</text>
<text x="25.1" y="557.4" font-size="20.7" textLength="441.7" lengthAdjust="spacingAndGlyphs">• 3,429명 (260811 11쪽) / 요약 '자료 간 차이' 둘째 항목 / 일치</text>
<text x="26.4" y="584.0" font-size="19.4" textLength="375.2" lengthAdjust="spacingAndGlyphs">• 25.4% (쟁점) / 요약 '자료 간 차이' 둘째 항목 / 일치</text>
<text x="25.1" y="613.8" font-size="22.1" textLength="409.1" lengthAdjust="spacingAndGlyphs">• 3,000만 원 (쟁점) / 요약 '자료 간 차이' 셋째 항목 / 일치</text>
<text x="25.1" y="640.3" font-size="20.7" textLength="503.2" lengthAdjust="spacingAndGlyphs">• 8월 5일 (260721 13쪽) / 요약'자료 간 차이' 셋째 항목 8월 5일'/ 일치</text>
<text x="25.1" y="669.1" font-size="22.1" textLength="646.2" lengthAdjust="spacingAndGlyphs">• 7.31일, 당초 8.5일 (260728 6쪽) / 요약'자료 간 차이' 셋째 항목 '7.31일, 당초 8.5일'/ 일치</text>
<text x="25.1" y="697.7" font-size="23.4" textLength="463.0" lengthAdjust="spacingAndGlyphs">• 43%, 41% (260811 34쪽) / 요약'자료 간 차이' 넷째 항목 / 일치</text>
<text x="26.4" y="725.5" font-size="22.0" textLength="459.3" lengthAdjust="spacingAndGlyphs">• 134억 5,900만 원/ 요약 넷째 항목 '총 134억 5,900만 원'/ 일치</text>
<text x="25.1" y="753.3" font-size="20.7" textLength="424.1" lengthAdjust="spacingAndGlyphs">• 90억 1,800만 원, 44억 4,000만 원/ 요약 넷째 항목 / 일치</text>
<text x="26.4" y="781.0" font-size="20.7" textLength="513.2" lengthAdjust="spacingAndGlyphs">• 134억 5,800만 원, 100만 원 / 요약 넷째 항목의 계산 결과와 차이 / 일치</text>
<text x="26.4" y="808.6" font-size="20.9" textLength="631.2" lengthAdjust="spacingAndGlyphs">• 10월 31일 (다음 단계)/ 요약에 없음. 사용자가 이번 대화에서 직접 입력한 값 / 요약 기준</text>
<text x="55.1" y="831.9" font-size="19.2" textLength="66.8" lengthAdjust="spacingAndGlyphs">대조 불가</text>
<text x="54.0" y="883.0" font-size="18.2" textLength="32.6" lengthAdjust="spacingAndGlyphs">불가</text></g><rect x=".5" y=".5" width="713" height="901" rx="6" fill="none" stroke="#d8cfc0"/></svg>