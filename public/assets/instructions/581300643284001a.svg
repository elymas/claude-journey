<svg xmlns="http://www.w3.org/2000/svg" width="797" height="502" viewBox="0 0 797 502" role="img"><title>같은 호출을 다시 친다 — 이번엔 쓰기 전에 네 가지를 먼저 묻는다. 같은 이름이 있어서 _2로 저장하겠다고 한다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H797" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="785" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 같은 호출을 다시 친다 — 이번엔 쓰기 전에 네 가지를 먼저 묻는다.</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="162.2" y="88.4" font-size="20.4" textLength="580.4" lengthAdjust="spacingAndGlyphs">기획안.md 업데이트했어. 다시 해보자. 기획안.md 읽고, 결과 폴더의 자료요약.md로 기획</text>
<text x="162.0" y="106.3" font-size="18.9" textLength="53.6" lengthAdjust="spacingAndGlyphs">안 써줘.</text>
<text x="27.8" y="189.4" font-size="18.0" textLength="163.3" lengthAdjust="spacingAndGlyphs">도구 2개 사용함, 파일 읽음</text>
<text x="27.8" y="220.5" font-size="18.0" textLength="688.1" lengthAdjust="spacingAndGlyphs">쓰기 전에 정책자료 기획안.md 에 적힌 네 가지를 먼저 답해 주세요. 답을 받기 전에는 쓰지 않습니다.</text>
<text x="38.2" y="257.4" font-size="19.1" textLength="253.7" lengthAdjust="spacingAndGlyphs">1. 이 기획안의 목표는 무엇인가요?</text>
<text x="36.5" y="283.7" font-size="20.6" textLength="272.3" lengthAdjust="spacingAndGlyphs">2. 얻고 싶은 기대효과는 무엇인가요?</text>
<text x="38.2" y="312.9" font-size="19.1" textLength="184.2" lengthAdjust="spacingAndGlyphs">3. 누구에게 보고하나요?</text>
<text x="38.2" y="340.9" font-size="18.0" textLength="205.0" lengthAdjust="spacingAndGlyphs">4. 발표 시간은 몇 분인가요?</text>
<text x="26.6" y="389.7" font-size="20.6" textLength="700.7" lengthAdjust="spacingAndGlyphs">답해 주시면 요약에서 목표에 맞는 주제 후보를 2~3개 골라 근거 항목과 함께 보여드리고, 고르시면 쓰</text>
<text x="26.6" y="412.8" font-size="20.5" textLength="697.4" lengthAdjust="spacingAndGlyphs">겠습니다. 결과 폴더에 2026-10-08_기획안. md 가 이미 있어서, 새 파일은 2026-10-08_기획안_2. md</text>
<text x="27.8" y="435.9" font-size="16.8" textLength="136.7" lengthAdjust="spacingAndGlyphs">로 저장하겠습니다.</text></g><rect x=".5" y=".5" width="796" height="501" rx="6" fill="none" stroke="#d8cfc0"/></svg>