<svg xmlns="http://www.w3.org/2000/svg" width="730" height="626" viewBox="0 0 730 626" role="img"><title>규칙대로 자료별 핵심요약 3줄과 쟁점 2줄을 뽑아낸 응답 화면</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H730" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="718" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 규칙대로 자료별 핵심요약 3줄과 쟁점 2줄을 뽑아낸 응답 화면</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="7.4" y="67.6" font-size="23.1" textLength="266.3" lengthAdjust="spacingAndGlyphs">2. 자료별 핵심요약 3줄 + 쟁점 2줄</text>
<text x="8.5" y="99.0" font-size="18.6" textLength="299.2" lengthAdjust="spacingAndGlyphs">① 260709 제26회 차관회의록(서울-세종)</text>
<text x="17.0" y="137.6" font-size="23.0" textLength="687.6" lengthAdjust="spacingAndGlyphs">• 25개 안건(법률안 3, 대통령령안 18, 일반안 4)을 08:0008:16 16분간 심의, 전원 이견 없이 원안</text>
<text x="41.4" y="158.6" font-size="17.6" textLength="35.0" lengthAdjust="spacingAndGlyphs">의결</text>
<text x="17.0" y="189.6" font-size="23.0" textLength="683.3" lengthAdjust="spacingAndGlyphs">• 국가유산수리법, AI기본법 시행령, 고등교육법 시행령, 상법 시행령 등 다수 부처의 시행령 정비</text>
<text x="44.4" y="210.8" font-size="19.7" textLength="83.0" lengthAdjust="spacingAndGlyphs">안건이 중심</text>
<text x="17.0" y="240.0" font-size="20.9" textLength="678.0" lengthAdjust="spacingAndGlyphs">• 모두말씀에서 3가지 현안 지시: 구제역 확산 방지 위한 백신접종•방역 ②'모두의 생리대' 시범</text>
<text x="45.6" y="262.1" font-size="22.0" textLength="453.2" lengthAdjust="spacingAndGlyphs">사업(12개 지역) 현장점검 ③장마철 극한호우 대비 선제 대피•통제</text>
<text x="9.5" y="308.4" font-size="16.4" textLength="64.7" lengthAdjust="spacingAndGlyphs">쟁점 2줄:</text>
<text x="15.9" y="349.2" font-size="23.5" textLength="680.2" lengthAdjust="spacingAndGlyphs">• '모두의 생리대' 시범사업 초기 운영 미비(생리대 미비치, 싹쓸이 우려)가 지적되어 담당관제 등</text>
<text x="41.4" y="372.6" font-size="20.9" textLength="179.3" lengthAdjust="spacingAndGlyphs">안착 방안 검토 필요 (p.2)</text>
<text x="17.0" y="399.2" font-size="19.7" textLength="676.9" lengthAdjust="spacingAndGlyphs">• 경북 지역 올해 두 번째 구제역 발생 + 축산물 물가 3월 이후 최고 수준으로 방역•물가 이중 리스</text>
<text x="42.4" y="424.8" font-size="20.1" textLength="57.4" lengthAdjust="spacingAndGlyphs">크 (P.2)</text>
<text x="8.5" y="470.4" font-size="18.7" textLength="276.9" lengthAdjust="spacingAndGlyphs">② 260714 제30회 국무회의록(청와대)</text>
<text x="17.0" y="510.2" font-size="23.0" textLength="622.8" lengthAdjust="spacingAndGlyphs">• 32개 안건(법률공포안 3, 대통령령안 18, 일반안 6, 부처보고 5) 심의, 10:00~13:22 진행</text>
<text x="15.9" y="535.1" font-size="19.9" textLength="683.3" lengthAdjust="spacingAndGlyphs">• 부처보고 5건:①촉법소년 연령기준 공론화 결과 ②NATO 정상회의•몽골 방문 성과 ③중동전쟁</text>
<text x="45.6" y="556.1" font-size="22.0" textLength="489.7" lengthAdjust="spacingAndGlyphs">비상대응 2026 하반기 경제성장전략 경제적 위기자 자살예방 대책</text>
<text x="15.9" y="589.7" font-size="23.1" textLength="691.8" lengthAdjust="spacingAndGlyphs">• 대통령 주재 토의에서 촉법소년 연령 하향, 부동산 세제 개편, 임신중단 약물 허용, 빛 문제로 인한</text>
<text x="44.6" y="610.6" font-size="18.7" textLength="212.2" lengthAdjust="spacingAndGlyphs">자살 방지책 등 심층 토의 진행</text></g><rect x=".5" y=".5" width="729" height="625" rx="6" fill="none" stroke="#d8cfc0"/></svg>