<svg xmlns="http://www.w3.org/2000/svg" width="534" height="173" viewBox="0 0 534 173" role="img"><title>채운 뒤 — 칸마다 보기를 하나만 남겼다. 둘 이상 남기면 시종이 다시 묻는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H534" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="522" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 채운 뒤 — 칸마다 보기를 하나만 남겼다. 둘 이상 남기면 시종이 다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="-0.0" y="62.4" font-size="17.5" textLength="283.3" lengthAdjust="spacingAndGlyphs">## ③ 그래프 모양 — 숫자는 적지 않는다</text>
<text x="-0.0" y="81.8" font-size="16.9" textLength="187.8" lengthAdjust="spacingAndGlyphs">자주 쓰는 그래프</text>
<text x="-0.0" y="101.1" font-size="16.9" textLength="253.8" lengthAdjust="spacingAndGlyphs">·색 순서 — 기본색 → 보조색 → 회색</text>
<text x="-0.0" y="121.4" font-size="16.1" textLength="111.0" lengthAdjust="spacingAndGlyphs">- 눈금선: (옅게)</text>
<text x="-0.1" y="141.5" font-size="20.9" textLength="168.0" lengthAdjust="spacingAndGlyphs">- 값 표시: (막대점 위에</text>
<text x="0.0" y="163.3" font-size="19.2" textLength="276.3" lengthAdjust="spacingAndGlyphs">·출처 자리 — 그래프 아래 왼쪽, 작은 글씨</text></g><rect x=".5" y=".5" width="533" height="172" rx="6" fill="none" stroke="#d8cfc0"/></svg>