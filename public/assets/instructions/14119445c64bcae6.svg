<svg xmlns="http://www.w3.org/2000/svg" width="408" height="335" viewBox="0 0 408 335" role="img"><title>오인턴이 친 주문 — 키워드 스무 개, 말로만</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H408" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="396" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 오인턴이 친 주문 — 키워드 스무 개, 말로만</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="8.0" y="63.7" font-size="16.0" textLength="58.7" lengthAdjust="spacingAndGlyphs">빠른 작업</text>
<text x="279.3" y="62.0" font-size="10.9" textLength="41.5" lengthAdjust="spacingAndGlyphs">Cowork</text>
<text x="334.7" y="66.6" font-size="23.3" textLength="28.0" lengthAdjust="spacingAndGlyphs">-</text>
<text x="375.3" y="63.8" font-size="15.1" textLength="14.0" lengthAdjust="spacingAndGlyphs">×</text>
<text x="21.3" y="118.3" font-size="15.8" textLength="372.7" lengthAdjust="spacingAndGlyphs">아래 키워드로 발표자료 템플릿 규칙을 템플릿.md 형식으로 써줘.</text>
<text x="22.0" y="137.5" font-size="16.5" textLength="143.3" lengthAdjust="spacingAndGlyphs">내용은 넣지 말고 모양만.</text>
<text x="21.3" y="158.5" font-size="18.5" textLength="361.3" lengthAdjust="spacingAndGlyphs">정책자료 폴더에 말로_템플릿.md로 저장하고, 그 규칙대로 결과</text>
<text x="21.3" y="176.6" font-size="17.8" textLength="218.7" lengthAdjust="spacingAndGlyphs">폴더에 말로_템플릿.pptx도 만들어줘.</text>
<text x="21.3" y="215.1" font-size="18.5" textLength="349.3" lengthAdjust="spacingAndGlyphs">분위기: 신뢰감 있는, 깔끔한, 세련된, 차분한, 정책 보고서 느낌</text>
<text x="20.4" y="233.8" font-size="19.3" textLength="324.7" lengthAdjust="spacingAndGlyphs">색: 블루, 네이비, 오렌지 포인트, 그라데이션 배경, 밝은 톤</text>
<text x="21.3" y="253.6" font-size="19.2" textLength="297.3" lengthAdjust="spacingAndGlyphs">글자: 고딕체, 굵은 제목, 큰 숫자 강조, 읽기 편한 본문</text>
<text x="21.3" y="271.8" font-size="17.8" textLength="294.0" lengthAdjust="spacingAndGlyphs">배치: 왼쪽 정렬, 넉넉한 여백, 카드형 상자, 사진 자리</text>
<text x="21.3" y="291.1" font-size="17.8" textLength="242.0" lengthAdjust="spacingAndGlyphs">마무리: 페이지 번호, 마지막 장 감사합니다</text>
<text x="264.7" y="314.9" font-size="14.4" textLength="97.3" lengthAdjust="spacingAndGlyphs">Opus 5.5 · 높음 이상</text>
