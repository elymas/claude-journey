<svg xmlns="http://www.w3.org/2000/svg" width="555" height="687" viewBox="0 0 555 687" role="img"><title>Ctrl+V로 통째로 덮어쓰고 저장 — 끝에 ## 템플릿 · ## 그래프가 보이면 된다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H555" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="543" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · Ctrl+V로 통째로 덮어쓰고 저장 — 끝에 ## 템플릿 · ## 그</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="438.2" y="57.0" font-size="8.0" textLength="8.5" lengthAdjust="spacingAndGlyphs">-</text>
<text x="523.0" y="58.7" font-size="13.6" textLength="17.0" lengthAdjust="spacingAndGlyphs">X</text>
<text x="39.6" y="71.8" font-size="14.8" textLength="72.6" lengthAdjust="spacingAndGlyphs">그래프.md</text>
<text x="201.6" y="70.8" font-size="14.8" textLength="46.2" lengthAdjust="spacingAndGlyphs">규칙.md</text>
<text x="312.8" y="68.5" font-size="10.7" textLength="10.4" lengthAdjust="spacingAndGlyphs">X</text>
<text x="354.3" y="73.3" font-size="16.5" textLength="15.1" lengthAdjust="spacingAndGlyphs">+</text>
<text x="12.2" y="103.8" font-size="14.8" textLength="138.5" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="25.4" y="124.5" font-size="14.6" textLength="231.8" lengthAdjust="spacingAndGlyphs">계산이 필요아낸 계산식을 같이 석는나.</text>
<text x="13.2" y="140.6" font-size="14.6" textLength="262.9" lengthAdjust="spacingAndGlyphs">- 원문에 없는 값은 비워두고 ‘미확인’ 목록에</text>
<text x="25.4" y="158.4" font-size="15.5" textLength="222.4" lengthAdjust="spacingAndGlyphs">따로 적는다. 추측해서 채우지 않는다.</text>
<text x="13.2" y="174.5" font-size="14.6" textLength="229.9" lengthAdjust="spacingAndGlyphs">- 각 항목이 어느 파일 어디에서 왔는지</text>
<text x="24.5" y="192.3" font-size="15.5" textLength="118.7" lengthAdjust="spacingAndGlyphs">결과에 같이 적는다.</text>
<text x="13.2" y="211.0" font-size="17.6" textLength="282.7" lengthAdjust="spacingAndGlyphs">- 읽지 못한 파일은 건너뛰지 말고, 결과 맨 아래</text>
<text x="21.7" y="226.3" font-size="15.6" textLength="233.7" lengthAdjust="spacingAndGlyphs">‘못 읽은 파일’ 목록에 파일명을 적는다.</text>
<text x="13.2" y="243.3" font-size="15.6" textLength="356.2" lengthAdjust="spacingAndGlyphs">- ‘미확인’·‘못 읽은 파일’ 목록은 .md 결과의 맨 아래에 쓴다.</text>
<text x="24.5" y="261.1" font-size="16.6" textLength="224.3" lengthAdjust="spacingAndGlyphs">pptx에는 넣지 않고 채팅 보고에 쓴다.</text>
<text x="13.2" y="277.3" font-size="15.6" textLength="361.8" lengthAdjust="spacingAndGlyphs">- ‘(추정)’ 표시는 확인용 메모가 아니다. 지우거나 옮기지 않고</text>
<text x="25.4" y="293.4" font-size="14.6" textLength="122.5" lengthAdjust="spacingAndGlyphs">그 줄에 그대로 둔다.</text>
<text x="453.2" y="102.7" font-size="15.5" textLength="19.8" lengthAdjust="spacingAndGlyphs">5</text>
<text x="13.2" y="326.6" font-size="13.8" textLength="61.3" lengthAdjust="spacingAndGlyphs">## 템플릿</text>
<text x="13.2" y="346.1" font-size="16.8" textLength="408.0" lengthAdjust="spacingAndGlyphs">- 이름에 ‘템플릿’이나 ‘template’이 들어간 pptx는 결과 폴더가 아니라</text>
<text x="25.4" y="362.2" font-size="15.8" textLength="315.7" lengthAdjust="spacingAndGlyphs">이 폴더에 둔다. 결과물이 아니라 다음 시안의 재료다.</text>
<text x="13.2" y="379.2" font-size="15.8" textLength="205.4" lengthAdjust="spacingAndGlyphs">- 템플릿을 복제해 시안을 만들 때:</text>
<text x="22.6" y="396.2" font-size="15.8" textLength="343.0" lengthAdjust="spacingAndGlyphs">· 콘티 한 장은 시안에서도 한 장이다. 장을 나누지 않는다.</text>
<text x="22.6" y="412.3" font-size="14.8" textLength="340.2" lengthAdjust="spacingAndGlyphs">· 콘티의 장마다 내용에 가장 맞는 모양의 장을 골라 쓴다.</text>
<text x="34.9" y="430.2" font-size="15.8" textLength="216.7" lengthAdjust="spacingAndGlyphs">같은 모양을 다른 장에 또 써도 된다.</text>
<text x="22.6" y="447.0" font-size="15.6" textLength="410.4" lengthAdjust="spacingAndGlyphs">· 순서: 표지 → 목차 → 콘티 순서대로 → 마무리 → 참고 자료(맨 끝).</text>
<text x="34.9" y="464.0" font-size="15.6" textLength="385.4" lengthAdjust="spacingAndGlyphs">콘티의 기대효과는 내용 장으로 넣는다. 마무리 장은 그대로 둔다.</text>
<text x="33.9" y="481.0" font-size="15.6" textLength="167.7" lengthAdjust="spacingAndGlyphs">간지는 내가 말할 때만 쓴다.</text>
<text x="22.6" y="498.1" font-size="14.6" textLength="190.3" lengthAdjust="spacingAndGlyphs">· 쓰지 않은 템플릿 장은 지운다.</text>
<text x="22.6" y="514.9" font-size="15.6" textLength="305.3" lengthAdjust="spacingAndGlyphs">· 카드·단계·칸 개수는 내용에 맞게 늘리거나 줄인다.</text>
<text x="34.9" y="531.9" font-size="15.5" textLength="191.3" lengthAdjust="spacingAndGlyphs">색·글꼴·모서리는 바꾸지 않는다.</text>
<text x="22.6" y="548.1" font-size="14.6" textLength="344.9" lengthAdjust="spacingAndGlyphs">· 복제한 장의 노트(언제 쓰는 장인지)와 ‘그래프 자리’ 같은</text>
<text x="34.9" y="567.6" font-size="16.5" textLength="253.5" lengthAdjust="spacingAndGlyphs">자리 글자는 지우고, 콘티의 노트만 남긴다.</text>
<text x="13.1" y="599.3" font-size="14.1" textLength="61.3" lengthAdjust="spacingAndGlyphs">## 그래프</text>
<text x="13.2" y="616.8" font-size="15.5" textLength="306.2" lengthAdjust="spacingAndGlyphs">- 시안을 만들거나 고칠 때는 그래프를 넣든 안 넣든</text>
<text x="25.4" y="633.9" font-size="14.6" textLength="245.9" lengthAdjust="spacingAndGlyphs">이 폴더의 그래프.md를 먼저 읽고 따른다.</text>
<text x="12.2" y="653.3" font-size="18.6" textLength="342.0" lengthAdjust="spacingAndGlyphs">- 그래프.md가 없으면 그래프를 넣지 말고 멈추고 묻는다.</text>
<text x="23.6" y="677.3" font-size="14.6" textLength="123.4" lengthAdjust="spacingAndGlyphs">줄 65, 열 34| 1,601자</text>
<text x="203.5" y="675.8" font-size="12.7" textLength="72.6" lengthAdjust="spacingAndGlyphs">Ml Markdo...</text>
<text x="305.3" y="675.0" font-size="11.9" textLength="25.5" lengthAdjust="spacingAndGlyphs">90%</text>
<text x="367.4" y="675.7" font-size="15.4" textLength="80.2" lengthAdjust="spacingAndGlyphs">Windows (CRI</text>
<text x="461.7" y="675.1" font-size="10.8" textLength="35.8" lengthAdjust="spacingAndGlyphs">UTF-8</text></g><rect x=".5" y=".5" width="554" height="686" rx="6" fill="none" stroke="#d8cfc0"/></svg>