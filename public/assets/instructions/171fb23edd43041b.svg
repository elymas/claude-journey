<svg xmlns="http://www.w3.org/2000/svg" width="710" height="774" viewBox="0 0 710 774" role="img"><title>덮어쓴 시종.md — 할 일 4번이 붙었다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H710" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="698" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 덮어쓴 시종.md — 할 일 4번이 붙었다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="16.9" y="68.4" font-size="18.7" textLength="85.9" lengthAdjust="spacingAndGlyphs">플 시종.md</text>
<text x="203.2" y="71.1" font-size="15.5" textLength="294.1" lengthAdjust="spacingAndGlyphs">2026-09-24_자료요약.md 2026-10-02_자료요약_1.n</text>
<text x="12.8" y="101.1" font-size="15.5" textLength="140.1" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="13.9" y="144.7" font-size="16.6" textLength="119.8" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="16.0" y="166.1" font-size="17.9" textLength="287.6" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="13.8" y="207.0" font-size="17.2" textLength="65.4" lengthAdjust="spacingAndGlyphs">## 할 일</text>
<text x="15.0" y="230.0" font-size="18.7" textLength="387.1" lengthAdjust="spacingAndGlyphs">1. 폴더 안 정책자료가 몇 건인지 먼저 세어 알려준다.</text>
<text x="34.2" y="249.4" font-size="17.7" textLength="421.3" lengthAdjust="spacingAndGlyphs">그 다음 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="31.0" y="270.8" font-size="17.6" textLength="227.8" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="13.9" y="293.7" font-size="22.3" textLength="334.7" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="15.0" y="313.4" font-size="18.7" textLength="461.9" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="29.9" y="335.8" font-size="19.9" textLength="388.1" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="15.0" y="355.2" font-size="18.9" textLength="310.1" lengthAdjust="spacingAndGlyphs">4. 표 아래에 ‘자료 간 차이’ 목록을 만든다.</text>
<text x="34.2" y="376.6" font-size="18.9" textLength="437.3" lengthAdjust="spacingAndGlyphs">같은 주제를 두고 자료끼리 숫자나 입장이 다른 지점을 찾아,</text>
<text x="34.2" y="397.1" font-size="17.9" textLength="414.9" lengthAdjust="spacingAndGlyphs">어느 자료가 무엇이라 하는지 출처와 함께 나란히 적는다.</text>
<text x="34.2" y="418.1" font-size="19.9" textLength="309.0" lengthAdjust="spacingAndGlyphs">어긋나는 곳이 없으면 ‘없음’이라고 적는다.</text>
<text x="16.0" y="438.8" font-size="17.7" textLength="311.2" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="13.9" y="480.5" font-size="17.6" textLength="135.8" lengthAdjust="spacingAndGlyphs">## 다 됐다는 기준</text>
<text x="12.8" y="501.9" font-size="17.6" textLength="275.9" lengthAdjust="spacingAndGlyphs">- 결과 폴더에 자료요약.md가 생겼다.</text>
<text x="13.9" y="523.1" font-size="18.7" textLength="221.3" lengthAdjust="spacingAndGlyphs">- 표의 모든 줄에 출처가 있다.</text>
<text x="12.8" y="544.4" font-size="20.0" textLength="269.5" lengthAdjust="spacingAndGlyphs">- 하나라도 안 되면 멈추고 물어본다.</text>
<text x="505.8" y="68.9" font-size="15.4" textLength="18.2" lengthAdjust="spacingAndGlyphs">+</text>
<text x="546.4" y="99.0" font-size="14.3" textLength="46.0" lengthAdjust="spacingAndGlyphs">¼~</text>
<text x="646.9" y="98.3" font-size="12.1" textLength="11.8" lengthAdjust="spacingAndGlyphs">8</text>
