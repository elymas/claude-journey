<svg xmlns="http://www.w3.org/2000/svg" width="556" height="777" viewBox="0 0 556 777" role="img"><title>파일 → 다른 이름으로 저장</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H556" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="544" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 파일 → 다른 이름으로 저장</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="52.6" y="67.7" font-size="17.8" textLength="100.9" lengthAdjust="spacingAndGlyphs">새 텍스트 문서.bxt</text>
<text x="66.5" y="101.9" font-size="18.9" textLength="29.0" lengthAdjust="spacingAndGlyphs">편집</text>
<text x="122.4" y="101.0" font-size="17.8" textLength="30.1" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="238.3" y="64.5" font-size="10.0" textLength="30.1" lengthAdjust="spacingAndGlyphs">.</text>
<text x="297.3" y="68.7" font-size="17.7" textLength="17.2" lengthAdjust="spacingAndGlyphs">+</text>
<text x="9.7" y="101.0" font-size="17.8" textLength="31.1" lengthAdjust="spacingAndGlyphs">파일</text>
<text x="16.1" y="137.1" font-size="20.0" textLength="35.4" lengthAdjust="spacingAndGlyphs">새 탭</text>
<text x="17.2" y="168.5" font-size="18.9" textLength="34.3" lengthAdjust="spacingAndGlyphs">새창</text>
<text x="161.0" y="136.5" font-size="17.9" textLength="40.9" lengthAdjust="spacingAndGlyphs">Ctrl+N</text>
<text x="162.0" y="169.1" font-size="17.4" textLength="72.1" lengthAdjust="spacingAndGlyphs">Ctrl+ Shift+N</text>
<text x="244.7" y="161.3" font-size="16.6" textLength="34.3" lengthAdjust="spacingAndGlyphs">른다.</text>
<text x="17.2" y="202.0" font-size="17.8" textLength="106.3" lengthAdjust="spacingAndGlyphs">새 Markdown 탭</text>
<text x="249.0" y="201.2" font-size="15.5" textLength="12.9" lengthAdjust="spacingAndGlyphs">분</text>
<text x="18.2" y="235.3" font-size="17.8" textLength="27.9" lengthAdjust="spacingAndGlyphs">열기</text>
<text x="17.2" y="267.3" font-size="18.8" textLength="30.1" lengthAdjust="spacingAndGlyphs">최근</text>
<text x="16.1" y="299.6" font-size="17.9" textLength="31.1" lengthAdjust="spacingAndGlyphs">저장</text>
<text x="162.0" y="233.6" font-size="14.6" textLength="39.8" lengthAdjust="spacingAndGlyphs">Ctrl+O</text>
<text x="224.3" y="264.7" font-size="14.4" textLength="9.7" lengthAdjust="spacingAndGlyphs">&gt;</text>
<text x="162.0" y="298.1" font-size="14.8" textLength="37.7" lengthAdjust="spacingAndGlyphs">Ctrl+S</text>
<text x="249.0" y="322.3" font-size="18.0" textLength="66.6" lengthAdjust="spacingAndGlyphs">지 읽는다.</text>
<text x="17.2" y="332.9" font-size="17.8" textLength="123.4" lengthAdjust="spacingAndGlyphs">다른 이름으로 저장</text>
<text x="17.1" y="365.3" font-size="17.9" textLength="62.3" lengthAdjust="spacingAndGlyphs">모두 저장</text>
<text x="163.1" y="331.6" font-size="15.2" textLength="68.9" lengthAdjust="spacingAndGlyphs">Ctrl+Shift+S</text>
<text x="249.0" y="343.5" font-size="19.0" textLength="136.3" lengthAdjust="spacingAndGlyphs">남은 칸은 빈칸이다.</text>
<text x="163.1" y="363.9" font-size="13.8" textLength="60.2" lengthAdjust="spacingAndGlyphs">Ctrl+Alt+S</text>
<text x="249.0" y="362.1" font-size="18.0" textLength="67.7" lengthAdjust="spacingAndGlyphs">지 않는다.</text>
<text x="249.0" y="382.5" font-size="16.6" textLength="183.5" lengthAdjust="spacingAndGlyphs">=다. 지어서 채우지 않는다.</text>
<text x="16.1" y="402.7" font-size="19.0" textLength="77.3" lengthAdjust="spacingAndGlyphs">페이지 설정</text>
<text x="252.0" y="405.3" font-size="22.2" textLength="241.9" lengthAdjust="spacingAndGlyphs">고, 정한 값을 마지막 보고에 적는다.</text>
<text x="17.2" y="434.8" font-size="19.0" textLength="29.0" lengthAdjust="spacingAndGlyphs">인쇄</text>
<text x="163.0" y="433.8" font-size="14.2" textLength="36.8" lengthAdjust="spacingAndGlyphs">Ctrl+P</text>
<text x="245.8" y="445.2" font-size="22.3" textLength="30.1" lengthAdjust="spacingAndGlyphs">!다.</text>
<text x="247.9" y="461.7" font-size="19.0" textLength="215.9" lengthAdjust="spacingAndGlyphs">브이면 그 글자를 그대로 옮긴다.</text>
<text x="17.2" y="471.4" font-size="18.9" textLength="47.2" lengthAdjust="spacingAndGlyphs">탭 닫기</text>
<text x="16.1" y="503.9" font-size="17.8" textLength="48.3" lengthAdjust="spacingAndGlyphs">창 닫기</text>
<text x="163.2" y="469.9" font-size="14.4" textLength="40.8" lengthAdjust="spacingAndGlyphs">Ctrl+W</text>
<text x="246.9" y="483.2" font-size="18.8" textLength="253.3" lengthAdjust="spacingAndGlyphs">• 뽑고, '캡처에서 뽑음'이라고 적는다.</text>
<text x="163.2" y="502.2" font-size="13.4" textLength="74.1" lengthAdjust="spacingAndGlyphs">Ctrl+Shift+W</text>
<text x="249.0" y="502.7" font-size="17.7" textLength="183.5" lengthAdjust="spacingAndGlyphs">=다. 색을 지어내지 않는다.</text>
<text x="246.9" y="522.0" font-size="17.7" textLength="163.2" lengthAdjust="spacingAndGlyphs">| 않고 기본색으로 쓴다.</text>
<text x="16.1" y="537.2" font-size="17.9" textLength="31.1" lengthAdjust="spacingAndGlyphs">종료</text>
<text x="238.3" y="544.1" font-size="21.0" textLength="235.1" lengthAdjust="spacingAndGlyphs">겨 주고, 내가 좋다고 하면 만든다.</text>
<text x="39.7" y="561.8" font-size="17.8" textLength="435.5" lengthAdjust="spacingAndGlyphs">색 코드 / 쓰임/ 어디서 왔나(캡처 글자• 캡처에서 뽑음 회사색)</text>
<text x="39.7" y="582.2" font-size="17.8" textLength="449.7" lengthAdjust="spacingAndGlyphs">쓰임은 기본색 · 강조색 · 배경색 · 글자색 · 보조색. 강조색은 하나만.</text>
<text x="39.7" y="602.6" font-size="17.7" textLength="414.3" lengthAdjust="spacingAndGlyphs">글자색과 배경색은 대비가 충분한지 확인해 표에 같이 적는다.</text>
<text x="14.0" y="621.9" font-size="17.7" textLength="470.1" lengthAdjust="spacingAndGlyphs">3. 아래 ‘장 종류’ 스물한 장을 빠짐없이 한 장씩 만든다. 고르지 않는다.</text>
<text x="12.9" y="642.3" font-size="17.7" textLength="122.4" lengthAdjust="spacingAndGlyphs">4. 장마다 지킬 것:</text>
<text x="27.9" y="663.5" font-size="19.9" textLength="373.5" lengthAdjust="spacingAndGlyphs">- 글자 자리엔 자리 이름만 둔다. (예: 제목, 본문, 항목 1)</text>
<text x="39.7" y="682.1" font-size="17.8" textLength="478.8" lengthAdjust="spacingAndGlyphs">예외: 마무리 장엔 ‘감사합니다’를 넣는다. 시안에서 그대로 쓰는 장이다.</text>
<text x="26.8" y="702.4" font-size="17.8" textLength="366.0" lengthAdjust="spacingAndGlyphs">- 도형과 글상자로 만든다. 그림 파일로 붙이지 않는다.</text>
<text x="39.7" y="722.7" font-size="19.0" textLength="441.2" lengthAdjust="spacingAndGlyphs">카드·단계·칸은 하나씩 따로 둬서 개수를 늘리고 줄이기 쉽게 한다.</text>
<text x="27.9" y="742.2" font-size="17.7" textLength="148.1" lengthAdjust="spacingAndGlyphs">- 숫자를 넣지 않는다.</text>
<text x="22.5" y="771.5" font-size="15.6" textLength="124.5" lengthAdjust="spacingAndGlyphs">출 11, 열 10 2,832자</text>
<text x="205.0" y="769.6" font-size="14.6" textLength="63.4" lengthAdjust="spacingAndGlyphs">일반 텍스트</text>
<text x="304.8" y="769.0" font-size="11.3" textLength="36.5" lengthAdjust="spacingAndGlyphs">100%</text>
<text x="366.0" y="769.9" font-size="12.4" textLength="133.1" lengthAdjust="spacingAndGlyphs">Windows (CRL UTF-8</text></g><rect x=".5" y=".5" width="555" height="776" rx="6" fill="none" stroke="#d8cfc0"/></svg>