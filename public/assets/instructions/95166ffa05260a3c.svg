<svg xmlns="http://www.w3.org/2000/svg" width="364" height="572" viewBox="0 0 364 572" role="img"><title>파일 → 다른 이름으로 저장</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H364" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="352" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 파일 → 다른 이름으로 저장</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="56.7" y="75.3" font-size="16.1" textLength="99.3" lengthAdjust="spacingAndGlyphs">새 텍스트 문서.txt</text>
<text x="71.4" y="108.4" font-size="17.6" textLength="27.9" lengthAdjust="spacingAndGlyphs">편집</text>
<text x="126.5" y="108.4" font-size="17.6" textLength="29.5" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="298.0" y="79.4" font-size="24.8" textLength="23.3" lengthAdjust="spacingAndGlyphs">+</text>
<text x="14.0" y="108.4" font-size="17.6" textLength="29.5" lengthAdjust="spacingAndGlyphs">파일</text>
<text x="21.0" y="142.6" font-size="16.9" textLength="33.4" lengthAdjust="spacingAndGlyphs">새 탭</text>
<text x="21.0" y="176.6" font-size="18.5" textLength="34.1" lengthAdjust="spacingAndGlyphs">새 창</text>
<text x="21.0" y="208.8" font-size="16.0" textLength="104.8" lengthAdjust="spacingAndGlyphs">새 Markdown 탭</text>
<text x="21.7" y="241.3" font-size="16.2" textLength="27.9" lengthAdjust="spacingAndGlyphs">열기</text>
<text x="21.0" y="273.9" font-size="16.8" textLength="29.5" lengthAdjust="spacingAndGlyphs">최근</text>
<text x="21.0" y="307.1" font-size="17.6" textLength="29.5" lengthAdjust="spacingAndGlyphs">저장</text>
<text x="21.7" y="340.0" font-size="16.1" textLength="121.1" lengthAdjust="spacingAndGlyphs">다른 이름으로 저장</text>
<text x="20.9" y="372.8" font-size="15.7" textLength="61.4" lengthAdjust="spacingAndGlyphs">모두 저작</text>
<text x="20.1" y="409.7" font-size="18.1" textLength="76.2" lengthAdjust="spacingAndGlyphs">페이지 설정</text>
<text x="21.7" y="442.1" font-size="17.6" textLength="27.9" lengthAdjust="spacingAndGlyphs">인쇄</text>
<text x="21.7" y="478.1" font-size="16.0" textLength="46.6" lengthAdjust="spacingAndGlyphs">탭 닫기</text>
<text x="21.0" y="511.2" font-size="17.6" textLength="48.1" lengthAdjust="spacingAndGlyphs">창 닫기</text>
<text x="21.0" y="544.1" font-size="16.0" textLength="28.7" lengthAdjust="spacingAndGlyphs">종료</text>
<text x="16.3" y="568.9" font-size="16.9" textLength="173.1" lengthAdjust="spacingAndGlyphs">3. 빈 값을 채우지 않는다.</text>
<text x="219.6" y="104.6" font-size="12.0" textLength="34.1" lengthAdjust="spacingAndGlyphs">H1 v</text>
<text x="195.5" y="142.1" font-size="12.9" textLength="39.1" lengthAdjust="spacingAndGlyphs">Ctrl+N</text>
<text x="162.0" y="175.0" font-size="23.1" textLength="117.6" lengthAdjust="spacingAndGlyphs">Ctrl+shift+N 른다.</text>
<text x="270.9" y="105.1" font-size="13.6" textLength="40.4" lengthAdjust="spacingAndGlyphs">:=~</text>
<text x="329.1" y="102.8" font-size="8.0" textLength="16.3" lengthAdjust="spacingAndGlyphs">...</text>
<text x="243.7" y="229.0" font-size="16.1" textLength="119.5" lengthAdjust="spacingAndGlyphs">로는 그래프 • 차트</text>
<text x="195.0" y="252.6" font-size="27.7" textLength="168.8" lengthAdjust="spacingAndGlyphs">Ctrl+0 같은 .md 결과물의</text>
<text x="236.7" y="269.9" font-size="16.9" textLength="126.5" lengthAdjust="spacingAndGlyphs">로지.md가 정한다</text>
<text x="249.1" y="292.2" font-size="19.5" textLength="114.1" lengthAdjust="spacingAndGlyphs">지 않고 넣고, 아리</text>
<text x="199.5" y="305.7" font-size="11.3" textLength="34.9" lengthAdjust="spacingAndGlyphs">Ctrl+S</text>
<text x="244.5" y="329.1" font-size="16.0" textLength="118.7" lengthAdjust="spacingAndGlyphs">을 그린 그림을 캡</text>
<text x="169.2" y="338.4" font-size="11.3" textLength="73.7" lengthAdjust="spacingAndGlyphs">Ctrl+Shift+S</text>
<text x="242.9" y="349.3" font-size="16.1" textLength="120.3" lengthAdjust="spacingAndGlyphs">적고 보고에 알린</text>
<text x="171.5" y="371.4" font-size="18.4" textLength="173.9" lengthAdjust="spacingAndGlyphs">Ctrl+Alt+s 옮기지 않는다.</text>
<text x="247.6" y="390.3" font-size="16.9" textLength="114.9" lengthAdjust="spacingAndGlyphs">숫자를 넣지 않는</text>
<text x="198.6" y="440.7" font-size="12.3" textLength="35.8" lengthAdjust="spacingAndGlyphs">Ctrl+P</text>
<text x="194.8" y="476.5" font-size="11.2" textLength="39.6" lengthAdjust="spacingAndGlyphs">Ctrl+W</text>
<text x="160.6" y="510.5" font-size="14.2" textLength="73.8" lengthAdjust="spacingAndGlyphs">Ctrl+Shift+W</text>
<text x="242.9" y="450.8" font-size="17.9" textLength="100.9" lengthAdjust="spacingAndGlyphs">. 숫자만 쓴다.</text>
<text x="247.6" y="469.7" font-size="16.1" textLength="114.1" lengthAdjust="spacingAndGlyphs">쓰기 전에 묻는다</text>
<text x="252.9" y="490.6" font-size="17.5" textLength="49.1" lengthAdjust="spacingAndGlyphs">않는다.</text>
<text x="246.8" y="529.2" font-size="16.8" textLength="116.4" lengthAdjust="spacingAndGlyphs">구 . 비율 계산을 하</text>
<text x="244.5" y="549.5" font-size="16.0" textLength="118.7" lengthAdjust="spacingAndGlyphs">1산식과 결과를 보</text></g><rect x=".5" y=".5" width="363" height="571" rx="6" fill="none" stroke="#d8cfc0"/></svg>