<svg xmlns="http://www.w3.org/2000/svg" width="807" height="697" viewBox="0 0 807 697" role="img"><title>① 지난주와 같은 문장으로 친다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H807" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="795" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ① 지난주와 같은 문장으로 친다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="32.8" y="60.2" font-size="16.9" textLength="66.9" lengthAdjust="spacingAndGlyphs">내용 요약</text>
<text x="32.8" y="99.6" font-size="20.7" textLength="682.7" lengthAdjust="spacingAndGlyphs">차관회의록(7.9)은 25건 안건(법률안 3•대통령령안 18•일반안 4)을 전건 원안 의결했고, 국무조정실</text>
<text x="32.8" y="123.0" font-size="20.6" textLength="687.4" lengthAdjust="spacingAndGlyphs">장이 구제역 확산 방지와 장마철 재난대응, '모두의 생리대' 시범사업 보완을 당부한 내용이 핵심입니</text>
<text x="34.0" y="144.6" font-size="16.9" textLength="21.1" lengthAdjust="spacingAndGlyphs">다.</text>
<text x="30.3" y="182.4" font-size="24.4" textLength="699.4" lengthAdjust="spacingAndGlyphs">국무회의록(7.14)은 32건 안건에 더해 촉법소년 연령 기준, 부동산정책 의견수렴, NATO•몽골 순방 성</text>
<text x="32.8" y="206.4" font-size="19.4" textLength="690.9" lengthAdjust="spacingAndGlyphs">과, 중동전쟁 대응•하반기 경제성장전략, 자살예방대책까지 5건의 부처보고가 있었고, 촉법소년 연령</text>
<text x="32.8" y="228.9" font-size="18.2" textLength="697.9" lengthAdjust="spacingAndGlyphs">하향 방식과 고금리 불법사채 처벌 공백이 쟁점으로 남아 대통령이 추가 의견수렴을 지시한 게 눈에 띕</text>
<text x="34.0" y="253.6" font-size="18.2" textLength="36.4" lengthAdjust="spacingAndGlyphs">니다.</text>
<text x="32.8" y="291.7" font-size="22.0" textLength="697.9" lengthAdjust="spacingAndGlyphs">방금 보내드린 파일로 먼저 확인해보시고, 사용자님 컴퓨터의 00프로젝트 기획_회의록|결과 폴더에도</text>
<text x="32.8" y="313.3" font-size="18.2" textLength="222.9" lengthAdjust="spacingAndGlyphs">같은 파일이 저장되어 있습니다.</text>
<text x="120.8" y="356.1" font-size="14.5" textLength="130.2" lengthAdjust="spacingAndGlyphs">2026 09 24 자료요약</text>
<text x="120.8" y="376.4" font-size="12.4" textLength="52.8" lengthAdjust="spacingAndGlyphs">문서 • MD</text>
<text x="612.2" y="369.0" font-size="16.4" textLength="91.6" lengthAdjust="spacingAndGlyphs">Google Drive</text>
<text x="723.7" y="365.1" font-size="8.5" textLength="10.6" lengthAdjust="spacingAndGlyphs">~</text>
<text x="32.8" y="619.8" font-size="23.1" textLength="219.3" lengthAdjust="spacingAndGlyphs">- 「시종.md 읽고, 정책자료 요약해줘」</text>
