<text x="17.0" y="156.9" font-size="18.1" textLength="96.4" lengthAdjust="spacingAndGlyphs">## 하지 말 것</text>
<text x="17.2" y="184.3" font-size="20.7" textLength="264.5" lengthAdjust="spacingAndGlyphs">- 자료에 없는 내용을 지어내지 않는다.</text>
<text x="17.2" y="210.1" font-size="20.7" textLength="232.9" lengthAdjust="spacingAndGlyphs">- 원본 파일 이름을 바꾸지 않는다.</text>
<text x="15.0" y="262.3" font-size="21.7" textLength="59.2" lengthAdjust="spacingAndGlyphs">## 검증</text>
<text x="18.1" y="286.0" font-size="16.6" textLength="278.8" lengthAdjust="spacingAndGlyphs">- 숫자와 날짜는 원문에서 그대로 옮긴다.</text>
<text x="31.6" y="313.5" font-size="20.8" textLength="261.6" lengthAdjust="spacingAndGlyphs">계산이 필요하면 계산식을 같이 적는다.</text>
<text x="18.1" y="337.2" font-size="16.6" textLength="298.9" lengthAdjust="spacingAndGlyphs">- 원문에 없는 값은 비워두고 ‘미확인’ 목록에</text>
<text x="28.8" y="365.1" font-size="20.8" textLength="255.9" lengthAdjust="spacingAndGlyphs">따로 적는다. 추측해서 채우지 않는다.</text>
<text x="17.2" y="391.0" font-size="20.7" textLength="264.5" lengthAdjust="spacingAndGlyphs">- 각 항목이 어느 파일 어디에서 왔는지</text>
<text x="31.1" y="416.2" font-size="17.6" textLength="135.4" lengthAdjust="spacingAndGlyphs">결과에 같이 적는다.</text>
<text x="18.9" y="467.8" font-size="17.8" textLength="88.5" lengthAdjust="spacingAndGlyphs">## 완료 조건</text>
<text x="21.1" y="494.4" font-size="17.9" textLength="274.8" lengthAdjust="spacingAndGlyphs">위 세 줄을 지킨 결과물이 나오면 끝이다.</text>
<text x="20.1" y="523.2" font-size="25.9" textLength="249.7" lengthAdjust="spacingAndGlyphs">하나라도 못 지키면 멈추고 물어본다.</text>
