<text x="302.9" y="70.4" font-size="18.6" textLength="19.1" lengthAdjust="spacingAndGlyphs">+</text>
<text x="126.4" y="101.0" font-size="14.5" textLength="31.1" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="222.6" y="99.2" font-size="13.5" textLength="261.8" lengthAdjust="spacingAndGlyphs">H1V v815C.</text>
