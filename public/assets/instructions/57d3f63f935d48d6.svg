<svg xmlns="http://www.w3.org/2000/svg" width="690" height="572" viewBox="0 0 690 572" role="img"><title>규칙.md에 검증 세 줄과 완료 조건을 붙인 화면</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H690" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="678" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 규칙.md에 검증 세 줄과 완료 조건을 붙인 화면</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="21.1" y="69.4" font-size="18.6" textLength="14.0" lengthAdjust="spacingAndGlyphs">트</text>
