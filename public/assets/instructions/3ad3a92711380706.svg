<svg xmlns="http://www.w3.org/2000/svg" width="558" height="761" viewBox="0 0 558 761" role="img"><title>괄호 안에 캡처 파일 이름을 적는다 — ( 컬러팔레트.png )</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H558" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="546" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 괄호 안에 캡처 파일 이름을 적는다 — ( 컬러팔레트.png )</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="441.4" y="54.4" font-size="11.0" textLength="55.7" lengthAdjust="spacingAndGlyphs">-.</text>
<text x="508.6" y="55.0" font-size="13.0" textLength="38.9" lengthAdjust="spacingAndGlyphs">X</text>
<text x="19.7" y="69.9" font-size="21.0" textLength="139.2" lengthAdjust="spacingAndGlyphs">템플릿_질문지.md</text>
<text x="304.7" y="67.6" font-size="13.0" textLength="12.6" lengthAdjust="spacingAndGlyphs">+</text>
<text x="15.8" y="99.9" font-size="15.2" textLength="139.8" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="45.2" y="116.5" font-size="10.0" textLength="39.9" lengthAdjust="spacingAndGlyphs">ㄱㄴㅌ</text>
<text x="96.7" y="117.3" font-size="10.8" textLength="8.4" lengthAdjust="spacingAndGlyphs">1</text>
<text x="17.9" y="137.0" font-size="20.6" textLength="387.6" lengthAdjust="spacingAndGlyphs">5. ‘템플릿 이름’ 칸의 이름 뒤에 _템플릿을 붙여 저장한다.</text>
<text x="33.6" y="157.1" font-size="19.6" textLength="317.4" lengthAdjust="spacingAndGlyphs">예: 이름이 청록보고면 → 청록보고_템플릿.pptx</text>
<text x="34.7" y="175.1" font-size="18.4" textLength="360.4" lengthAdjust="spacingAndGlyphs">이름에 이미 ‘템플릿’이 들어 있으면 또 붙이지 않는다.</text>
<text x="33.6" y="195.2" font-size="17.3" textLength="395.1" lengthAdjust="spacingAndGlyphs">저장 위치는 결과 폴더가 아니라 이 폴더(정책자료 폴더)다.</text>
<text x="34.7" y="216.9" font-size="20.7" textLength="497.5" lengthAdjust="spacingAndGlyphs">규칙.md에 ‘새 파일은 결과 폴더에’가 있어도, 이 파일만은 이 폴더에 둔다.</text>
<text x="34.7" y="235.1" font-size="17.3" textLength="394.1" lengthAdjust="spacingAndGlyphs">템플릿은 결과물이 아니라 다음 시안의 재료이기 때문이다.</text>
<text x="33.6" y="257.0" font-size="19.7" textLength="354.1" lengthAdjust="spacingAndGlyphs">같은 이름이 있으면 덮어쓰지 말고 뒤에 _2를 붙인다.</text>
<text x="17.9" y="275.1" font-size="17.3" textLength="221.0" lengthAdjust="spacingAndGlyphs">6. 다 만들면 채팅으로 보여 준다:</text>
<text x="30.5" y="294.2" font-size="16.3" textLength="246.9" lengthAdjust="spacingAndGlyphs">- 스물한 장 목록 (장 번호 / 장 종류)</text>
<text x="31.5" y="314.2" font-size="16.3" textLength="292.1" lengthAdjust="spacingAndGlyphs">- 질문지 답마다 어디에 반영했는지 한 줄씩</text>
<text x="31.5" y="335.8" font-size="18.6" textLength="332.1" lengthAdjust="spacingAndGlyphs">- ‘알아서’로 정한 값, 그리고 못 지킨 답과 그 이유</text>
<text x="15.8" y="374.1" font-size="16.5" textLength="105.1" lengthAdjust="spacingAndGlyphs">## 템플릿 이름</text>
<text x="16.8" y="395.0" font-size="17.5" textLength="187.1" lengthAdjust="spacingAndGlyphs">- 이름: ( ) ← 예: 청록보고</text>
<text x="16.7" y="435.9" font-size="19.0" textLength="59.0" lengthAdjust="spacingAndGlyphs">## ① 색</text>
<text x="15.8" y="456.6" font-size="19.6" textLength="459.2" lengthAdjust="spacingAndGlyphs">- 팔레트 캡처: 디자인 폴더의 ( 컬러팔레트.png) + 예: 팔레트.png</text>
<text x="16.7" y="495.8" font-size="19.0" textLength="74.8" lengthAdjust="spacingAndGlyphs">## ② 모양</text>
<text x="16.8" y="514.7" font-size="17.3" textLength="243.8" lengthAdjust="spacingAndGlyphs">- 모서리: (둥글게 / 각지게 / 알아서)</text>
<text x="16.8" y="534.6" font-size="17.3" textLength="216.5" lengthAdjust="spacingAndGlyphs">- 제목 글꼴: ( ) 본문 글꼴: ( )</text>
<text x="16.8" y="556.6" font-size="18.4" textLength="320.5" lengthAdjust="spacingAndGlyphs">- 글자 크기: 제목 ( )pt · 본문 ( )pt · 캡션 ( )pt</text>
<text x="16.8" y="574.6" font-size="17.3" textLength="104.0" lengthAdjust="spacingAndGlyphs">- 여백·정렬: ( )</text>
<text x="14.7" y="616.3" font-size="19.6" textLength="282.7" lengthAdjust="spacingAndGlyphs">## ③ 그래프 모양 — 숫자는 적지 않는다</text>
<text x="15.8" y="634.5" font-size="17.5" textLength="300.5" lengthAdjust="spacingAndGlyphs">·자주 쓰는 그래프 — 막대 / 선 / 원 / 알아서</text>
<text x="16.8" y="655.3" font-size="18.5" textLength="312.1" lengthAdjust="spacingAndGlyphs">- 색 순서: (기본색 → 보조색 → 회색 / 알아서)</text>
<text x="16.8" y="674.6" font-size="16.5" textLength="152.4" lengthAdjust="spacingAndGlyphs">·눈금선 — 옅게 / 없음</text>
<text x="16.8" y="695.3" font-size="18.5" textLength="251.2" lengthAdjust="spacingAndGlyphs">·값 표시 — 막대·점 위에 / 표시 안 함</text>
<text x="16.8" y="716.3" font-size="18.5" textLength="273.2" lengthAdjust="spacingAndGlyphs">·출처 자리 — 그래프 아래 왼쪽, 작은 글씨</text>
<text x="27.3" y="752.6" font-size="14.1" textLength="252.2" lengthAdjust="spacingAndGlyphs">술 55, 열 31 10/2,841사 Ma Markdo...</text>
<text x="308.9" y="750.6" font-size="14.4" textLength="32.7" lengthAdjust="spacingAndGlyphs">100%</text>
