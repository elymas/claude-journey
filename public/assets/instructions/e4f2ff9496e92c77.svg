<text x="50.9" y="292.2" font-size="21.7" textLength="599.2" lengthAdjust="spacingAndGlyphs">(171219225560.EDF060 F0803C:310D20, 캡처 글자 그대로)이 전부 진하거나 형광이라, 흰 바탕</text>
