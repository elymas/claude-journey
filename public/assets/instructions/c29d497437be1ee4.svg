<svg xmlns="http://www.w3.org/2000/svg" width="800" height="488" viewBox="0 0 800 488" role="img"><title>시안2 쟁점 장 — 발언 캡처 2개와 도식 3개</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H800" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="788" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 시안2 쟁점 장 — 발언 캡처 2개와 도식 3개</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="37.2" y="71.8" font-size="24.1" textLength="64.0" lengthAdjust="spacingAndGlyphs">11. 쟁점</text>
<text x="689.5" y="66.6" font-size="12.1" textLength="74.4" lengthAdjust="spacingAndGlyphs">3대 메가프로젝트</text>
<text x="50.0" y="125.5" font-size="17.2" textLength="406.7" lengthAdjust="spacingAndGlyphs">핵심 요약 쟁의 범위 쟁점이 되풀이되어 미정리 지점이 남은 듯하다(해석)</text>
<text x="39.5" y="166.0" font-size="15.8" textLength="322.1" lengthAdjust="spacingAndGlyphs">0 7월 21일: 대통령이 쟁의 범위 기준을 시행령•규칙•지침으로</text>
<text x="54.7" y="183.1" font-size="18.0" textLength="297.7" lengthAdjust="spacingAndGlyphs">미리 정할 필요를 지적했고, 고용노동부장관은 해석 지침을</text>
<text x="53.3" y="198.3" font-size="20.6" textLength="296.7" lengthAdjust="spacingAndGlyphs">이미 내렸다고 답함. 삼성전자 광주 반도체 공장 관련 노조</text>
<text x="54.7" y="211.4" font-size="15.8" textLength="104.7" lengthAdjust="spacingAndGlyphs">주장이 사례로 나옴.</text>
<text x="39.5" y="235.5" font-size="16.8" textLength="288.4" lengthAdjust="spacingAndGlyphs">O B월 11일: 노란봉투법 쟁의 대상 기준을 명확히 하라는</text>
<text x="54.7" y="252.7" font-size="19.2" textLength="268.6" lengthAdjust="spacingAndGlyphs">비판에 노동부장관은 &quot;시행령으로 만들 것은 아니고,</text>
<text x="58.0" y="267.2" font-size="22.0" textLength="303.8" lengthAdjust="spacingAndGlyphs">행정해석으로 이미 다 내렸음&quot;이라고 답함, 대통령은 해석과</text>
<text x="53.3" y="282.2" font-size="17.2" textLength="253.3" lengthAdjust="spacingAndGlyphs">시행령•노동부령은 다르다며 적극 검토를 당부함.</text>
<text x="39.5" y="305.5" font-size="15.6" textLength="308.1" lengthAdjust="spacingAndGlyphs">• 같은 날 대통령은 주 52시간제 도입을 두고 산업부장관은</text>
<text x="53.5" y="322.3" font-size="20.6" textLength="305.8" lengthAdjust="spacingAndGlyphs">&quot;필요한 것 같다&quot;, 노동부장관은 &quot;안 된다. 신중해야 된다&quot;는</text>
<text x="54.7" y="337.7" font-size="18.0" textLength="290.7" lengthAdjust="spacingAndGlyphs">의견을 냈다며, 부처 간 이견이 드러나는 것은 자연스러운</text>
<text x="54.6" y="352.0" font-size="17.3" textLength="89.6" lengthAdjust="spacingAndGlyphs">현상이라고 말함.</text>
<text x="44.2" y="380.7" font-size="11.0" textLength="61.6" lengthAdjust="spacingAndGlyphs">그림7 7월 리일</text>
<text x="253.5" y="379.6" font-size="9.6" textLength="60.5" lengthAdjust="spacingAndGlyphs">그림 8 8월 11일</text>
<text x="76.7" y="401.7" font-size="9.7" textLength="22.1" lengthAdjust="spacingAndGlyphs">대통령</text>
<text x="166.3" y="401.7" font-size="9.7" textLength="51.2" lengthAdjust="spacingAndGlyphs">고용노동부생관</text>
<text x="66.1" y="411.5" font-size="10.9" textLength="43.3" lengthAdjust="spacingAndGlyphs">기준을 미리</text>
<text x="169.8" y="411.0" font-size="9.7" textLength="43.0" lengthAdjust="spacingAndGlyphs">해석 지침을</text>
<text x="62.8" y="421.6" font-size="9.7" textLength="51.2" lengthAdjust="spacingAndGlyphs">정찰 필요 지적</text>
<text x="158.1" y="421.6" font-size="9.7" textLength="67.4" lengthAdjust="spacingAndGlyphs">이미 내렸다고 답함</text>
<text x="45.3" y="438.1" font-size="8.0" textLength="143.0" lengthAdjust="spacingAndGlyphs">삼성전자 광주 반도체 공장 관한 노조 주장이 사례</text>
<text x="295.3" y="401.9" font-size="8.4" textLength="22.1" lengthAdjust="spacingAndGlyphs">대통령</text>
<text x="269.8" y="410.3" font-size="8.0" textLength="73.3" lengthAdjust="spacingAndGlyphs">해석과 사천점• 노름부정은</text>
<text x="277.9" y="420.3" font-size="9.7" textLength="55.8" lengthAdjust="spacingAndGlyphs">다르다, 적극 검도</text>
<text x="254.7" y="438.1" font-size="8.0" textLength="107.0" lengthAdjust="spacingAndGlyphs">정의 대상 기준을 명확히 하라는 비판</text>
<text x="391.8" y="400.8" font-size="8.5" textLength="34.9" lengthAdjust="spacingAndGlyphs">노톰부잠관</text>
<text x="386.0" y="411.1" font-size="9.7" textLength="45.4" lengthAdjust="spacingAndGlyphs">평점해석으로</text>
<text x="383.7" y="420.3" font-size="9.7" textLength="50.0" lengthAdjust="spacingAndGlyphs">이미 다 내렸음</text>
<text x="489.5" y="173.9" font-size="9.7" textLength="94.2" lengthAdjust="spacingAndGlyphs">• 고몸노동부장관 김업훈</text>
<text x="504.7" y="185.8" font-size="8.6" textLength="250.0" lengthAdjust="spacingAndGlyphs">법이 만들어지면 그에 대한 해석 지침과 가이드라민을 전파하고 있음.</text>
<text x="503.5" y="199.2" font-size="10.8" textLength="250.0" lengthAdjust="spacingAndGlyphs">예를 들어 대통령님께서 말씀하신 삼성전자 초기업 노조 건에 대해서도</text>
<text x="526.7" y="216.6" font-size="12.1" textLength="176.7" lengthAdjust="spacingAndGlyphs">(그림 5&gt; 7월 21일 국무회의 쟁의 범위 논의</text>
<text x="532.6" y="229.3" font-size="12.0" textLength="170.7" lengthAdjust="spacingAndGlyphs">※ 출처: 국무회의 최의 제 31회, 2026.07.21.</text>
<text x="474.4" y="251.7" font-size="9.7" textLength="66.3" lengthAdjust="spacingAndGlyphs">• 대통령 이재임</text>
<text x="488.4" y="265.5" font-size="10.8" textLength="267.4" lengthAdjust="spacingAndGlyphs">기사에서 &quot;노란봉투법에 의한 정의 대상인지 아닌지에 대해 사례나 규정을</text>
<text x="488.4" y="279.3" font-size="12.0" textLength="262.8" lengthAdjust="spacingAndGlyphs">명확하게 해야 하는데, 아직 만 만들고 있다.&quot;라고 하는 비판이 있었음.</text>
<text x="474.4" y="306.2" font-size="10.8" textLength="100.0" lengthAdjust="spacingAndGlyphs">* 고용노동부장관 김영혼</text>
<text x="488.4" y="320.0" font-size="12.1" textLength="224.4" lengthAdjust="spacingAndGlyphs">시생령으로 만들 것은 아니고, 생경해식으로 이미 다 내렸음.</text>
<text x="518.6" y="341.1" font-size="10.8" textLength="194.2" lengthAdjust="spacingAndGlyphs">(그림 6) 8월 11일 국무회의 쟁의 대상 기준 논의</text>
<text x="532.6" y="353.9" font-size="10.8" textLength="166.3" lengthAdjust="spacingAndGlyphs">※ 출처: 국무회의 회의록 제35회, 2026.08.11,</text>
<text x="476.7" y="379.6" font-size="9.6" textLength="109.3" lengthAdjust="spacingAndGlyphs">그림 9 같은 날: 주 52시간제</text>
<text x="608.1" y="402.6" font-size="12.0" textLength="103.5" lengthAdjust="spacingAndGlyphs">산업부장관 &quot;필요한 것 같다&quot;</text>
<text x="488.3" y="411.0" font-size="11.3" textLength="52.4" lengthAdjust="spacingAndGlyphs">주 52시간제</text>
<text x="505.8" y="421.4" font-size="11.0" textLength="17.4" lengthAdjust="spacingAndGlyphs">도입</text>
<text x="591.7" y="430.9" font-size="15.7" textLength="135.3" lengthAdjust="spacingAndGlyphs">노동부집과 &quot;안 된다. 신중해야 된다&quot;</text>
<text x="744.2" y="469.4" font-size="8.6" textLength="19.8" lengthAdjust="spacingAndGlyphs">- 4-</text></g><rect x=".5" y=".5" width="799" height="487" rx="6" fill="none" stroke="#d8cfc0"/></svg>