<svg xmlns="http://www.w3.org/2000/svg" width="527" height="878" viewBox="0 0 527 878" role="img"><title>시안1 — 표지 → 목차 → 덩어리마다 한 장, 장마다 그림이 따로</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H527" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="515" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 시안1 — 표지 → 목차 → 덩어리마다 한 장, 장마다 그림이 따로</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="0.0" y="641.7" font-size="12.6" textLength="11.0" lengthAdjust="spacingAndGlyphs">3</text>
<text x="70.8" y="106.2" font-size="10.3" textLength="53.7" lengthAdjust="spacingAndGlyphs">3대 메가프로젝드</text>
<text x="58.6" y="142.3" font-size="21.4" textLength="285.5" lengthAdjust="spacingAndGlyphs">3대 메가프로젝트가 막힐 수 있는 지점</text>
<text x="59.8" y="163.6" font-size="19.0" textLength="207.4" lengthAdjust="spacingAndGlyphs">- 부처 간 이견과 제도 공백</text>
<text x="59.8" y="192.7" font-size="11.4" textLength="148.8" lengthAdjust="spacingAndGlyphs">최근 회의에서 어떤 안건이 보고되고</text>
<text x="59.8" y="205.9" font-size="12.6" textLength="248.9" lengthAdjust="spacingAndGlyphs">그 반복해서 중요하게 다뤄지는 부분이 무엇인지 알아낸다.</text>
<text x="58.5" y="266.3" font-size="10.8" textLength="46.5" lengthAdjust="spacingAndGlyphs">2026. 10. 23.</text>
<text x="47.6" y="360.6" font-size="15.2" textLength="24.4" lengthAdjust="spacingAndGlyphs">목차</text>
<text x="439.1" y="358.2" font-size="10.0" textLength="46.6" lengthAdjust="spacingAndGlyphs">3대 메가프로젝드</text>
<text x="133.0" y="400.3" font-size="11.5" textLength="19.5" lengthAdjust="spacingAndGlyphs">배김</text>
<text x="131.8" y="430.7" font-size="11.4" textLength="19.5" lengthAdjust="spacingAndGlyphs">쨈점</text>
<text x="131.8" y="462.4" font-size="11.4" textLength="19.5" lengthAdjust="spacingAndGlyphs">제안</text>
<text x="131.8" y="494.3" font-size="11.5" textLength="41.5" lengthAdjust="spacingAndGlyphs">다음 단계</text>
<text x="131.7" y="524.8" font-size="11.4" textLength="39.1" lengthAdjust="spacingAndGlyphs">기대효과</text>
<text x="101.3" y="555.3" font-size="11.4" textLength="18.3" lengthAdjust="spacingAndGlyphs">붙임</text>
<text x="131.7" y="555.3" font-size="11.4" textLength="41.5" lengthAdjust="spacingAndGlyphs">참고 자료</text>
<text x="47.5" y="599.9" font-size="8.0" textLength="36.7" lengthAdjust="spacingAndGlyphs">NET AD전특실</text>
<text x="472.1" y="600.0" font-size="8.0" textLength="14.6" lengthAdjust="spacingAndGlyphs">-E-</text>
<text x="48.8" y="654.8" font-size="15.1" textLength="39.0" lengthAdjust="spacingAndGlyphs">1 . 배경</text>
<text x="440.4" y="649.9" font-size="8.0" textLength="47.6" lengthAdjust="spacingAndGlyphs">3대 메가프로젝드</text>
<text x="58.6" y="686.4" font-size="8.9" textLength="235.4" lengthAdjust="spacingAndGlyphs">핵심 요약 두자 성과·메가프로젝트 보고 뒤에 남은 것을 짚을 시점이다</text>
<text x="51.2" y="709.5" font-size="8.8" textLength="151.3" lengthAdjust="spacingAndGlyphs">• 7월 28월 국무회의 모두말씀에서 순방 섬괴로</text>
<text x="59.8" y="718.2" font-size="8.0" textLength="128.1" lengthAdjust="spacingAndGlyphs">*9.500역 물 규모의 반도체 분야 입력' 과</text>
<text x="61.0" y="727.8" font-size="8.8" textLength="154.9" lengthAdjust="spacingAndGlyphs">&quot;5GW 규모의 AI 데이터센터 두자 입력'을 연급한.</text>
<text x="50.0" y="744.5" font-size="11.5" textLength="190.3" lengthAdjust="spacingAndGlyphs">0 9월 6일 차관회의 모두말쏜에서 3대 메가프로젝트 •부동산</text>
<text x="59.8" y="752.2" font-size="8.8" textLength="109.8" lengthAdjust="spacingAndGlyphs">정책의 부치 간 집업 강화를 담부함.</text>
<text x="51.2" y="766.8" font-size="8.8" textLength="164.7" lengthAdjust="spacingAndGlyphs">0 8월 11일 국무회의에서 3대 메가프로젝트 상생각</text>
<text x="59.8" y="775.4" font-size="8.9" textLength="168.3" lengthAdjust="spacingAndGlyphs">감화방안이 보고된, 5조 원 규모 반도체 펀드 신설, 광주</text>
<text x="58.6" y="786.2" font-size="10.1" textLength="167.1" lengthAdjust="spacingAndGlyphs">군공항 임시배치와 무안 군공항 착공 동시 시행이 담김</text>
<text x="307.4" y="712.2" font-size="8.0" textLength="31.7" lengthAdjust="spacingAndGlyphs">0 모두 있을</text>
<text x="312.3" y="720.6" font-size="8.0" textLength="168.3" lengthAdjust="spacingAndGlyphs">대용량인에서 7와 10일 일명으로 대리 대한에 이어서 남의 해가들을 소장하고</text>
<text x="312.3" y="728.1" font-size="8.0" textLength="168.3" lengthAdjust="spacingAndGlyphs">특성. 비번 미국 방문을 블랙이 비리로 기법과 면서 재배달라지 메트바일은 2</text>
<text x="312.3" y="735.5" font-size="8.0" textLength="140.3" lengthAdjust="spacingAndGlyphs">전화 하려, 34 에스프로젝트 식성이 교도록 실행이를 한송 농업증</text>
<text x="312.3" y="742.8" font-size="8.0" textLength="168.3" lengthAdjust="spacingAndGlyphs">오한 330이 불 사교과 편에 분식 블랙과 128 공의 A 아서트콜터 부곡</text>
<text x="312.3" y="751.2" font-size="8.0" textLength="107.4" lengthAdjust="spacingAndGlyphs">클리를 주인하기로 하는 성실적인 일어도 가두없을</text>
<text x="353.8" y="763.3" font-size="8.0" textLength="86.6" lengthAdjust="spacingAndGlyphs">2컵 1 제3회 국무회의 모두말한</text>
<text x="345.2" y="771.9" font-size="8.0" textLength="104.3" lengthAdjust="spacingAndGlyphs">※ 봉사: 국영화리 헤이트 제836, 80T6.07.BB.</text>
<text x="357.4" y="779.2" font-size="8.0" textLength="78.1" lengthAdjust="spacingAndGlyphs">※ 파란 불리은 신문에서 진출한 부분</text></g><rect x=".5" y=".5" width="526" height="877" rx="6" fill="none" stroke="#d8cfc0"/></svg>