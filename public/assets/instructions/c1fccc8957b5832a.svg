<svg xmlns="http://www.w3.org/2000/svg" width="1053" height="624" viewBox="0 0 1053 624" role="img"><title>③ 주문서 복사를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1053" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1041" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ③ 주문서 복사를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="87.2" y="119.9" font-size="15.8" textLength="53.6" lengthAdjust="spacingAndGlyphs">돌아가기</text>
<text x="67.3" y="184.6" font-size="12.9" textLength="98.0" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="189.8" y="183.7" font-size="39.7" textLength="387.2" lengthAdjust="spacingAndGlyphs">시종.md — 읽기 전에 센다</text>
<text x="782.1" y="185.4" font-size="17.5" textLength="70.4" lengthAdjust="spacingAndGlyphs">✓ 복사됐어</text>
<text x="892.3" y="185.4" font-size="17.5" textLength="110.2" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="838.7" y="216.2" font-size="16.0" textLength="174.5" lengthAdjust="spacingAndGlyphs">주황색이 이번 주 추가분</text>
<text x="71.9" y="269.0" font-size="11.0" textLength="76.5" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="73.5" y="282.6" font-size="12.9" textLength="182.8" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="71.9" y="322.3" font-size="12.6" textLength="251.0" lengthAdjust="spacingAndGlyphs">1. 폴더 안 정책자료가 몇 건인지 먼저 세어 알려준다.</text>
<text x="90.2" y="336.1" font-size="12.8" textLength="266.5" lengthAdjust="spacingAndGlyphs">그 다음 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="90.3" y="348.5" font-size="11.0" textLength="145.4" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="71.9" y="362.1" font-size="12.9" textLength="220.4" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="71.9" y="374.5" font-size="11.0" textLength="315.3" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="90.3" y="389.6" font-size="12.9" textLength="232.6" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="73.5" y="401.8" font-size="12.6" textLength="199.0" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="73.5" y="428.1" font-size="11.0" textLength="85.7" lengthAdjust="spacingAndGlyphs">## 다 됐다는 기준</text>
<text x="73.5" y="441.6" font-size="12.9" textLength="175.0" lengthAdjust="spacingAndGlyphs">- 결과 폴더에 자료요약.md가 생겼다.</text>
<text x="73.5" y="455.4" font-size="12.6" textLength="143.9" lengthAdjust="spacingAndGlyphs">- 표의 모든 줄에 출처가 있다.</text>
<text x="71.9" y="467.9" font-size="11.1" textLength="172.9" lengthAdjust="spacingAndGlyphs">- 하나라도 안 되면 멈추고 물어본다.</text>
<text x="638.2" y="283.4" font-size="17.5" textLength="208.2" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="638.2" y="314.0" font-size="17.5" textLength="338.2" lengthAdjust="spacingAndGlyphs">몇 건인지 먼저 - 이 한 줄이 실습 1의 전부다. 숫자를</text>
<text x="638.2" y="341.0" font-size="20.6" textLength="280.1" lengthAdjust="spacingAndGlyphs">먼저 말하게 하면, 빠뜨렸을 때 내가 바로 안다.</text>
<text x="638.2" y="373.6" font-size="17.3" textLength="342.8" lengthAdjust="spacingAndGlyphs">(결과 폴더와 md 파일은 제외)- 지난주 줄 그대로.</text>
<text x="638.2" y="401.5" font-size="25.4" textLength="350.5" lengthAdjust="spacingAndGlyphs">이제 &quot;세는 것&quot;에도 걸려서, 지난달 결과물과 규칙 • 시종 파</text>
<text x="638.2" y="422.3" font-size="19.2" textLength="197.4" lengthAdjust="spacingAndGlyphs">일이 자료로 둔갑하는 걸 막는다.</text>
<text x="638.2" y="457.7" font-size="19.1" textLength="345.9" lengthAdjust="spacingAndGlyphs">나머지 전부 - 3주차 시종.md와 한 글자도 안 다르다. 3</text>
<text x="636.2" y="480.8" font-size="22.7" textLength="324.7" lengthAdjust="spacingAndGlyphs">주차 때 직접 고친 줄이 있으면 덮어쓴 뒤 다시 넣는다.</text>
<text x="638.2" y="517.2" font-size="19.1" textLength="264.8" lengthAdjust="spacingAndGlyphs">시종.md를 열고 ctrl+A, ctrl+V로 덮어쓴다.</text>
<text x="254.1" y="577.4" font-size="15.9" textLength="65.8" lengthAdjust="spacingAndGlyphs">Ctrl +</text>
<text x="329.1" y="577.6" font-size="14.2" textLength="12.2" lengthAdjust="spacingAndGlyphs">A</text>
<text x="358.1" y="583.6" font-size="27.0" textLength="232.6" lengthAdjust="spacingAndGlyphs">로 규칙 파일 전체를 잡고,</text>
<text x="604.4" y="578.9" font-size="20.4" textLength="90.6" lengthAdjust="spacingAndGlyphs">Ctrl + V</text>
<text x="704.0" y="582.4" font-size="26.1" textLength="125.7" lengthAdjust="spacingAndGlyphs">로 덮어 쓰자.</text></g><rect x=".5" y=".5" width="1052" height="623" rx="6" fill="none" stroke="#d8cfc0"/></svg>