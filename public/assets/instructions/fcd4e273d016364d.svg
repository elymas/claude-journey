<svg xmlns="http://www.w3.org/2000/svg" width="707" height="421" viewBox="0 0 707 421" role="img"><title>① 차이 목록에서 한 항목을 고른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H707" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="695" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ① 차이 목록에서 한 항목을 고른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="14.2" y="71.7" font-size="35.7" textLength="172.0" lengthAdjust="spacingAndGlyphs">자료 간 차이</text>
<text x="11.8" y="102.7" font-size="21.2" textLength="665.8" lengthAdjust="spacingAndGlyphs">• 석유류 &quot;8차 최고가격&quot; 조치의 성격이 두 자료에서 다르게 기술됨.&lt;br&gt;- 260728 제33회 국무회의록(서울-세</text>
<text x="41.2" y="126.2" font-size="21.3" textLength="655.9" lengthAdjust="spacingAndGlyphs">총).pdf. 3~4쪽: 민생부담 등 감안해 석유류 8차 최고가격 동결 및 유류세 인하 2개월 연장(7.25)&quot;&lt;br&gt;- 260804</text>
<text x="42.1" y="147.5" font-size="16.9" textLength="641.2" lengthAdjust="spacingAndGlyphs">제34회 국무회의록(청와대).pdf, 9~10쪽: 8자 최고가격 인하(스150원/0)를 통해 7월 물가상승률 40.0%p 완화</text>
<text x="43.2" y="170.1" font-size="17.0" textLength="646.4" lengthAdjust="spacingAndGlyphs">효과&quot;&lt;br&gt;- 같은 8차&quot; 조치를 한쪽은 &quot;동결&quot;, 다른 쪽은 150원/&amp; 인하&quot;로 서술해 표현이 상충함. 원문 그대로</text>
<text x="42.1" y="191.8" font-size="16.1" textLength="200.4" lengthAdjust="spacingAndGlyphs">이며 추가 설명·추정은 하지 않음.</text>
<text x="32.4" y="215.2" font-size="18.3" textLength="654.0" lengthAdjust="spacingAndGlyphs">그 외 반복 언급된 주제(폭염 피해 누적 수치, 단일종목 레버리지 상품 대책 등)는 회의가 열린 시점에 따라 수</text>
<text x="40.1" y="238.8" font-size="17.0" textLength="647.4" lengthAdjust="spacingAndGlyphs">치가 달라지는 시간 경과형 보고로 확인되어, 동일 시점을 두고 자료끼리 다르게 말하는 경우로는 분류하지 않</text>
<text x="43.2" y="261.6" font-size="15.9" textLength="17.5" lengthAdjust="spacingAndGlyphs">음.</text>
<text x="16.4" y="307.2" font-size="33.8" textLength="160.3" lengthAdjust="spacingAndGlyphs">미확인 항목</text>
<text x="12.3" y="338.4" font-size="18.2" textLength="673.1" lengthAdjust="spacingAndGlyphs">• 260811 제35회 국무회의록(세종).pdf - 자살예방대책 관련 목표 수치(복지사각지대 지원율, 사회적 고립도)를</text>
<text x="41.2" y="362.4" font-size="18.2" textLength="642.2" lengthAdjust="spacingAndGlyphs">둘러싼 토의 세부 내용(찬반 발언자, 논의 경과)은 원문에서 명확한 토의 기록을 확인하지 못해 미확인으로 둠.</text>
<text x="11.8" y="385.6" font-size="21.3" textLength="465.4" lengthAdjust="spacingAndGlyphs">• 그 외 항목의 수치:일자는 모두 원문에서 그대로 확인 가능한 값만 반영함,</text>
<text x="23.6" y="412.7" font-size="16.1" textLength="124.3" lengthAdjust="spacingAndGlyphs">줄 82, 열 42 7,764자</text>
<text x="237.4" y="409.9" font-size="12.8" textLength="47.3" lengthAdjust="spacingAndGlyphs">AA 포맷</text>
<text x="380.2" y="409.9" font-size="12.8" textLength="25.7" lengthAdjust="spacingAndGlyphs">90%</text>
<text x="441.8" y="413.1" font-size="15.8" textLength="57.0" lengthAdjust="spacingAndGlyphs">Unix (LF)</text>
<text x="582.6" y="409.2" font-size="10.7" textLength="32.9" lengthAdjust="spacingAndGlyphs">UTF-8</text></g><rect x=".5" y=".5" width="706" height="420" rx="6" fill="none" stroke="#d8cfc0"/></svg>