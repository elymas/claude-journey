<svg xmlns="http://www.w3.org/2000/svg" width="369" height="356" viewBox="0 0 369 356" role="img"><title>시안2를 만들고 무엇을 바꿨는지 알려 준 뒤, 다시 고칠 점을 묻는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H369" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="357" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 시안2를 만들고 무엇을 바꿨는지 알려 준 뒤, 다시 고칠 점을 묻는다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="10.0" y="57.0" font-size="15.8" textLength="341.7" lengthAdjust="spacingAndGlyphs">• 그림: 모두 도형으로 그린 것이라 글자와 위치를 바로</text>
<text x="35.3" y="77.5" font-size="17.2" textLength="313.7" lengthAdjust="spacingAndGlyphs">고칠 수 있어요. 글꼴은 템플릿의 이사만루체 그대로</text>
<text x="36.6" y="97.5" font-size="17.2" textLength="46.6" lengthAdjust="spacingAndGlyphs">입니다.</text>
<text x="10.0" y="120.2" font-size="17.2" textLength="334.4" lengthAdjust="spacingAndGlyphs">• 캡처: 3개는 폴더에 있는 국무회의•차관회의 회의록</text>
<text x="33.3" y="139.7" font-size="15.8" textLength="317.0" lengthAdjust="spacingAndGlyphs">PDF에서 인용 부분만 잘라 파란색으로 표시한 PNG</text>
<text x="35.3" y="160.8" font-size="17.2" textLength="319.7" lengthAdjust="spacingAndGlyphs">예요. 이 PDF는 공개 링크를 찾지 못했습니다. 정책브</text>
<text x="36.0" y="179.1" font-size="15.1" textLength="315.0" lengthAdjust="spacingAndGlyphs">리핑과 뉴스 링크는 관련 자료일 뿐 인용문 원문은 들</text>
<text x="35.3" y="202.3" font-size="20.6" textLength="305.7" lengthAdjust="spacingAndGlyphs">어 있지 않아서, 참고 자료 장에 그렇게 적어 두었어</text>
<text x="35.3" y="220.5" font-size="15.1" textLength="19.3" lengthAdjust="spacingAndGlyphs">요.</text>
<text x="9.3" y="245.3" font-size="18.5" textLength="343.0" lengthAdjust="spacingAndGlyphs">• 글꼴: 이 작업 환경에는 이사만루체가 없어서 대체 글</text>
<text x="35.3" y="264.7" font-size="17.9" textLength="314.4" lengthAdjust="spacingAndGlyphs">꼴로 확인했습니다. 선생님 컴퓨터에서 열었을 때 줄</text>
<text x="36.0" y="284.3" font-size="16.5" textLength="181.8" lengthAdjust="spacingAndGlyphs">바꿈이 어긋나면 알려 주세요.</text>
<text x="8.7" y="324.9" font-size="16.5" textLength="139.9" lengthAdjust="spacingAndGlyphs">고칠 점을 알려 주세요.</text>
<text x="6.6" y="346.3" font-size="12.6" textLength="71.3" lengthAdjust="spacingAndGlyphs">단 g 10분 전</text></g><rect x=".5" y=".5" width="368" height="355" rx="6" fill="none" stroke="#d8cfc0"/></svg>