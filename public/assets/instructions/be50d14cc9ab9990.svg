<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="814" viewBox="0 0 1400 814" role="img"><title>가상 예시 ② 숫자 하나는 출처를 묻고 원문과 대 본다. 고칠 곳은 장 번호·개수·이유로, 고친 시안은 다음 번호로</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1400" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1388" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 가상 예시 ② 숫자 하나는 출처를 묻고 원문과 대 본다. 고칠 곳은 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="20.3" y="75.3" font-size="23.0" textLength="177.0" lengthAdjust="spacingAndGlyphs">워크숍 보고 시안</text>
<text x="34.5" y="220.5" font-size="17.1" textLength="57.1" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="29.2" y="260.3" font-size="36.1" textLength="573.0" lengthAdjust="spacingAndGlyphs">2026-10-20_주간업무회의록.hwpx의 3. 예산 집행 점검'이에요.</text>
<text x="32.6" y="292.3" font-size="25.2" textLength="417.2" lengthAdjust="spacingAndGlyphs">원문: &quot;현재 집행액 120만 원(예산 300만 원 중)&quot;</text>
<text x="34.5" y="553.8" font-size="17.4" textLength="59.2" lengthAdjust="spacingAndGlyphs">Claude</text>
<text x="30.5" y="592.6" font-size="27.4" textLength="449.7" lengthAdjust="spacingAndGlyphs">✓ 결과 폴더에 발표자료_시안2.pptx로 저장했어요.</text>
<text x="28.5" y="624.8" font-size="29.5" textLength="423.9" lengthAdjust="spacingAndGlyphs">- 3장 제목: 오늘 두 빈칸을 정하고 간다&quot; (15자)</text>
<text x="28.5" y="658.0" font-size="25.1" textLength="166.9" lengthAdjust="spacingAndGlyphs">- 4정: 11/13' 굵게</text>
<text x="30.5" y="690.8" font-size="23.0" textLength="221.8" lengthAdjust="spacingAndGlyphs">- 1•2•5장은 그대로예요.</text>
<text x="54.9" y="766.4" font-size="21.1" textLength="193.3" lengthAdjust="spacingAndGlyphs">메시지를 입력하세요…</text>
<text x="1058.1" y="73.9" font-size="19.1" textLength="75.3" lengthAdjust="spacingAndGlyphs">가상 예시</text>
<text x="1212.8" y="79.0" font-size="25.1" textLength="164.8" lengthAdjust="spacingAndGlyphs">회의록_2026 연결됨</text>
<text x="1035.8" y="162.0" font-size="27.3" textLength="309.3" lengthAdjust="spacingAndGlyphs">2장 그래프의 120만 원, 출처 보여줘</text>
<text x="789.5" y="360.5" font-size="31.5" textLength="187.2" lengthAdjust="spacingAndGlyphs">원문 열어 봤어, 같아.</text>
<text x="789.5" y="392.2" font-size="26.0" textLength="144.6" lengthAdjust="spacingAndGlyphs">고칠 곳 두 군데:</text>
<text x="787.5" y="426.4" font-size="25.3" textLength="561.6" lengthAdjust="spacingAndGlyphs">- 3장 제목이 두 줄로 넘어가. 한 줄로 읽히게 20자 안으로 줄여줘.</text>
<text x="787.5" y="458.9" font-size="25.3" textLength="318.5" lengthAdjust="spacingAndGlyphs">- 4장 11/13'은 워크숍 날짜라 굵게.</text>
<text x="787.5" y="494.6" font-size="30.1" textLength="385.0" lengthAdjust="spacingAndGlyphs">다른 장은 건드리지 말고 시안2로 저장해줘.</text></g><rect x=".5" y=".5" width="1399" height="813" rx="6" fill="none" stroke="#d8cfc0"/></svg>