<text x="22.3" y="241.0" font-size="18.3" textLength="681.4" lengthAdjust="spacingAndGlyphs">• 미확인으로 뺀 내용: 기획안에 &quot; 요약에 적혀 있지 않다&quot;고 한 부분은 본문과 노트에서 빼고 맨 아</text>
