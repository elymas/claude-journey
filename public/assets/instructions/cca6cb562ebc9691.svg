<text x="22.3" y="166.0" font-size="19.7" textLength="689.4" lengthAdjust="spacingAndGlyphs">• 폴더 규칙 위반: 기획안은 2026-10-08_기획안.md 한 개만 읽는다는 규칙을 어겼습니다. 폴더 규</text>
