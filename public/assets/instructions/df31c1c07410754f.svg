<svg xmlns="http://www.w3.org/2000/svg" width="512" height="502" viewBox="0 0 512 502" role="img"><title>⑤ ctrl+V — 할 일 1번에 세는 줄이 생겼다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H512" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="500" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ⑤ ctrl+V — 할 일 1번에 세는 줄이 생겼다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="58.0" y="69.5" font-size="13.2" textLength="46.1" lengthAdjust="spacingAndGlyphs">시종.md</text>
<text x="302.9" y="71.9" font-size="17.6" textLength="17.1" lengthAdjust="spacingAndGlyphs">+</text>
<text x="15.6" y="103.3" font-size="16.1" textLength="29.0" lengthAdjust="spacingAndGlyphs">파일</text>
<text x="72.2" y="103.3" font-size="16.1" textLength="27.5" lengthAdjust="spacingAndGlyphs">편집</text>
<text x="128.0" y="103.4" font-size="15.4" textLength="28.3" lengthAdjust="spacingAndGlyphs">보기</text>
<text x="15.6" y="144.8" font-size="17.6" textLength="112.4" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="17.1" y="167.1" font-size="19.9" textLength="264.5" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="15.6" y="206.2" font-size="19.3" textLength="60.3" lengthAdjust="spacingAndGlyphs">## 할 일</text>
<text x="14.9" y="226.8" font-size="19.9" textLength="358.4" lengthAdjust="spacingAndGlyphs">1. 폴더 안 정책자료가 몇 건인지 먼저 세어 알려준다.</text>
<text x="34.2" y="245.3" font-size="16.2" textLength="389.2" lengthAdjust="spacingAndGlyphs">그 다음 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="21.3" y="267.1" font-size="19.7" textLength="217.6" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="14.9" y="288.1" font-size="22.0" textLength="307.2" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="17.9" y="306.1" font-size="17.6" textLength="426.4" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="33.5" y="328.7" font-size="20.7" textLength="355.0" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="18.6" y="346.2" font-size="17.7" textLength="289.5" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="16.4" y="384.4" font-size="16.2" textLength="125.0" lengthAdjust="spacingAndGlyphs">## 다 됐다는 기준</text>
<text x="16.4" y="405.8" font-size="17.6" textLength="254.5" lengthAdjust="spacingAndGlyphs">- 결과 폴더에 자료요약.md가 생겼다.</text>
<text x="14.9" y="424.6" font-size="16.2" textLength="204.7" lengthAdjust="spacingAndGlyphs">- 표의 모든 줄에 출처가 있다.</text>
<text x="15.6" y="445.3" font-size="16.9" textLength="251.5" lengthAdjust="spacingAndGlyphs">- 하나라도 안 되면 멈추고 물어본다.</text></g><rect x=".5" y=".5" width="511" height="501" rx="6" fill="none" stroke="#d8cfc0"/></svg>