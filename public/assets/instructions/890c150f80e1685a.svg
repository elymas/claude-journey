<svg xmlns="http://www.w3.org/2000/svg" width="558" height="783" viewBox="0 0 558 783" role="img"><title>열어서 붙여 넣는다 — 첫 줄이 # 그래프</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H558" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="546" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 열어서 붙여 넣는다 — 첫 줄이 # 그래프</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="520.1" y="58.8" font-size="13.4" textLength="29.3" lengthAdjust="spacingAndGlyphs">X</text>
<text x="18.4" y="70.1" font-size="17.8" textLength="137.6" lengthAdjust="spacingAndGlyphs">플 새 텍스트 문서.txt</text>
<text x="301.2" y="72.4" font-size="16.7" textLength="16.3" lengthAdjust="spacingAndGlyphs">+</text>
<text x="15.2" y="103.0" font-size="14.6" textLength="139.8" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="218.9" y="101.2" font-size="12.4" textLength="36.8" lengthAdjust="spacingAndGlyphs">H1 w</text>
<text x="270.9" y="100.3" font-size="11.3" textLength="48.8" lengthAdjust="spacingAndGlyphs">:=~</text>
<text x="496.2" y="100.6" font-size="8.9" textLength="10.8" lengthAdjust="spacingAndGlyphs">몬</text>
<text x="15.1" y="145.3" font-size="16.2" textLength="60.8" lengthAdjust="spacingAndGlyphs"># 그래프</text>
<text x="18.4" y="166.4" font-size="17.9" textLength="265.5" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="15.2" y="204.7" font-size="15.6" textLength="106.2" lengthAdjust="spacingAndGlyphs">## 언제 따르나</text>
<text x="15.2" y="227.8" font-size="20.1" textLength="490.8" lengthAdjust="spacingAndGlyphs">- 따른다: 시안(pptx)에 새로 그려 넣는 그래프 · 차트 · 표, 숫자가 든 도식.</text>
<text x="15.2" y="247.5" font-size="19.0" textLength="383.6" lengthAdjust="spacingAndGlyphs">- 따르지 않는다: 요약·기획안·콘티 같은 .md 결과물의 표,</text>
<text x="28.2" y="267.9" font-size="20.2" textLength="346.7" lengthAdjust="spacingAndGlyphs">그리고 템플릿 만들기(템플릿_질문지.md가 정한다).</text>
<text x="15.2" y="288.5" font-size="20.1" textLength="515.7" lengthAdjust="spacingAndGlyphs">- 캡처: 기관 자료·기사 캡처는 손대지 않고 넣고, 아래에 출처(기관·날짜)를 단다.</text>
<text x="17.3" y="306.1" font-size="17.8" textLength="20.6" lengthAdjust="spacingAndGlyphs">다.</text>
<text x="28.2" y="326.7" font-size="17.9" textLength="476.7" lengthAdjust="spacingAndGlyphs">실제로 찍은 화면만 넣는다. 제목을 그린 그림을 캡처라고 넣지 않는다.</text>
<text x="28.2" y="345.3" font-size="16.7" textLength="359.7" lengthAdjust="spacingAndGlyphs">못 찍으면 링크만 참고 자료 장에 적고 보고에 알린다.</text>
<text x="28.2" y="365.8" font-size="16.7" textLength="318.5" lengthAdjust="spacingAndGlyphs">캡처 속 숫자를 그래프·본문으로 옮기지 않는다.</text>
<text x="15.2" y="385.4" font-size="16.8" textLength="369.5" lengthAdjust="spacingAndGlyphs">- 새로 만드는 그림(일러스트)에는 숫자를 넣지 않는다.</text>
<text x="16.2" y="424.6" font-size="15.9" textLength="88.9" lengthAdjust="spacingAndGlyphs">## 숫자 규칙</text>
<text x="17.3" y="446.7" font-size="19.0" textLength="327.2" lengthAdjust="spacingAndGlyphs">1. 숫자는 부를 때 받은 콘티에 적힌 숫자만 쓴다.</text>
<text x="33.6" y="465.5" font-size="16.7" textLength="334.8" lengthAdjust="spacingAndGlyphs">콘티에 없는 숫자가 필요하면 그리기 전에 묻는다.</text>
<text x="33.6" y="485.9" font-size="17.8" textLength="268.7" lengthAdjust="spacingAndGlyphs">자료를 새로 찾아 숫자를 더하지 않는다.</text>
<text x="17.3" y="506.5" font-size="17.9" textLength="166.9" lengthAdjust="spacingAndGlyphs">2. 숫자를 바꾸지 않는다.</text>
<text x="33.6" y="525.9" font-size="17.9" textLength="406.3" lengthAdjust="spacingAndGlyphs">반올림 · 단위 바꾸기 · 합계 · 평균 · 비율 계산을 하지 않는다.</text>
<text x="32.5" y="546.3" font-size="19.0" textLength="472.4" lengthAdjust="spacingAndGlyphs">꼭 계산해야 하면 그리기 전에 계산식과 결과를 보여 주고 확인받는다.</text>
<text x="17.3" y="566.0" font-size="17.8" textLength="172.3" lengthAdjust="spacingAndGlyphs">3. 빈 값을 채우지 않는다.</text>
<text x="33.6" y="586.6" font-size="17.9" textLength="471.3" lengthAdjust="spacingAndGlyphs">한 항목이라도 숫자가 없으면 그 그래프는 그리지 않고 멈추고 묻는다.</text>
<text x="33.6" y="606.1" font-size="17.9" textLength="265.5" lengthAdjust="spacingAndGlyphs">예시값 · 어림값 · 추정값을 넣지 않는다.</text>
<text x="16.3" y="627.6" font-size="19.0" textLength="475.7" lengthAdjust="spacingAndGlyphs">4. 단위와 기준(언제, 무엇의 숫자인지)을 그래프 제목이나 축에 적는다.</text>
<text x="33.6" y="646.1" font-size="17.8" textLength="149.5" lengthAdjust="spacingAndGlyphs">콘티에 없으면 묻는다.</text>
<text x="17.3" y="666.8" font-size="17.9" textLength="321.8" lengthAdjust="spacingAndGlyphs">5. 그래프 아래 왼쪽에 작은 글씨로 출처를 단다.</text>
<text x="32.5" y="686.2" font-size="17.9" textLength="376.0" lengthAdjust="spacingAndGlyphs">콘티에서 그 숫자 옆 괄호에 적힌 출처를 그대로 옮긴다.</text>
<text x="33.6" y="705.8" font-size="17.9" textLength="481.1" lengthAdjust="spacingAndGlyphs">콘티에 ‘사용자 지정’·‘직접 입력’으로 적힌 값은 출처에도 그렇게 적는다.</text>
<text x="32.5" y="725.3" font-size="16.7" textLength="490.8" lengthAdjust="spacingAndGlyphs">콘티에 출처가 없는 숫자는 다른 파일에서 찾지 말고 그리기 전에 묻는다.</text>
<text x="25.9" y="775.7" font-size="15.1" textLength="69.5" lengthAdjust="spacingAndGlyphs">줄 48, 열 28</text>
<text x="108.3" y="772.0" font-size="8.9" textLength="7.6" lengthAdjust="spacingAndGlyphs">1</text>
<text x="113.8" y="775.5" font-size="14.6" textLength="36.8" lengthAdjust="spacingAndGlyphs">1,335자</text>
<text x="208.0" y="773.6" font-size="12.3" textLength="69.3" lengthAdjust="spacingAndGlyphs">밀반 텍스트</text>
<text x="306.6" y="773.7" font-size="12.4" textLength="55.3" lengthAdjust="spacingAndGlyphs">100%</text>
