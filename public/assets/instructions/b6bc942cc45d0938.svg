<text x="501.9" y="567.8" font-size="13.8" textLength="52.9" lengthAdjust="spacingAndGlyphs">1) 족법소년</text>
<text x="499.8" y="582.5" font-size="13.1" textLength="59.2" lengthAdjust="spacingAndGlyphs">&quot;감력증대반</text>
<text x="499.8" y="598.8" font-size="13.7" textLength="55.0" lengthAdjust="spacingAndGlyphs">일괄 하향&quot;</text>
<text x="502.1" y="614.7" font-size="11.3" textLength="55.8" lengthAdjust="spacingAndGlyphs">관은 부분 예</text>
<text x="502.0" y="630.6" font-size="12.4" textLength="56.9" lengthAdjust="spacingAndGlyphs">취지로 발언</text>
<text x="502.1" y="646.6" font-size="12.2" textLength="54.7" lengthAdjust="spacingAndGlyphs">하지는 맡고</text>
<text x="502.1" y="662.7" font-size="12.2" textLength="56.9" lengthAdjust="spacingAndGlyphs">큰조사도 해!</text>
