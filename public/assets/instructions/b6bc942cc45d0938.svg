<text x="246.7" y="218.6" font-size="12.2" textLength="170.6" lengthAdjust="spacingAndGlyphs">요약함. 기획안•의견은 작성하지 않음.</text>
<text x="243.5" y="235.6" font-size="14.5" textLength="277.9" lengthAdjust="spacingAndGlyphs">있어. 아래 쪽은 원문 하단에 인쇄된 쪽 번호(°-N -) 기준임.</text>
<text x="260.6" y="255.4" font-size="11.7" textLength="40.9" lengthAdjust="spacingAndGlyphs">핵심요약</text>
<text x="502.1" y="256.0" font-size="13.4" textLength="20.4" lengthAdjust="spacingAndGlyphs">쟁점</text>
<text x="261.8" y="278.5" font-size="13.3" textLength="216.7" lengthAdjust="spacingAndGlyphs">1) 2026. 07. 09.(목) 08:00~08:16 정부서울#세</text>
<text x="260.7" y="293.7" font-size="12.2" textLength="212.4" lengthAdjust="spacingAndGlyphs">증청사 영상으로 열린 제26회 차관회의에서 총</text>
<text x="259.6" y="310.7" font-size="13.4" textLength="221.0" lengthAdjust="spacingAndGlyphs">25건(법률안 3, 대등령령안 18, 일반 4)을 심의</text>
<text x="260.7" y="327.7" font-size="14.5" textLength="224.2" lengthAdjust="spacingAndGlyphs">했고, 기독된 토의는 모두 이견 없음, 의결은 원</text>
<text x="261.8" y="342.9" font-size="13.3" textLength="218.9" lengthAdjust="spacingAndGlyphs">안 의결 임.&lt;br&gt;2) 의안은 문화유산 관련 법률 3</text>
<text x="261.6" y="361.1" font-size="20.5" textLength="214.9" lengthAdjust="spacingAndGlyphs">건(의안 제1186~1188호), 「인공지능 발전과 신</text>
<text x="260.7" y="375.0" font-size="13.4" textLength="217.8" lengthAdjust="spacingAndGlyphs">뢰 기반 조성 등에 관한 기본법』 시행령(제1189</text>
<text x="260.6" y="390.9" font-size="15.8" textLength="226.5" lengthAdjust="spacingAndGlyphs">후) 교육부•보건복지부 직제 개정(제11941195호:</text>
<text x="260.7" y="405.2" font-size="12.2" textLength="214.6" lengthAdjust="spacingAndGlyphs">국립대학병원•·국립대학치과병원의 관리 및 지원</text>
<text x="260.7" y="422.2" font-size="13.3" textLength="221.0" lengthAdjust="spacingAndGlyphs">기능을 교육부에서 보건복지부로 이관), 한국철도</text>
<text x="260.7" y="438.4" font-size="13.4" textLength="221.0" lengthAdjust="spacingAndGlyphs">공사에 대한 국유재산 현물출자(안)(제1208호: 정</text>
<text x="260.7" y="453.5" font-size="12.4" textLength="193.1" lengthAdjust="spacingAndGlyphs">부 브유 (쥬에스 주식 3,590억원 규모) 등</text>
<text x="261.8" y="469.6" font-size="12.2" textLength="215.6" lengthAdjust="spacingAndGlyphs">임.&lt;br&gt;3) 국무조정실장 모두말씀: 이번 주 필요</text>
<text x="261.8" y="485.7" font-size="12.2" textLength="215.6" lengthAdjust="spacingAndGlyphs">일부터 7월 임시국회가 시작되어 국회와의 소등</text>
<text x="260.7" y="501.9" font-size="12.4" textLength="219.9" lengthAdjust="spacingAndGlyphs">을 강화하고 기본사회기본법 등 용해 3분기 중점</text>
<text x="260.7" y="517.9" font-size="12.4" textLength="221.0" lengthAdjust="spacingAndGlyphs">주진법안에 대해 여야 협조를 구할 것. 구제역 차</text>
<text x="260.7" y="533.6" font-size="14.5" textLength="224.2" lengthAdjust="spacingAndGlyphs">단방역, 모두의 생리대' 시범사업 현장 점점, 잠마</text>
<text x="261.7" y="550.2" font-size="12.6" textLength="66.6" lengthAdjust="spacingAndGlyphs">대비를 담부함.</text>
<text x="260.7" y="574.7" font-size="12.2" textLength="212.4" lengthAdjust="spacingAndGlyphs">1) 2026. 07. 14.(화) 10:00~13:22 청와대 본관</text>
<text x="261.8" y="590.9" font-size="12.4" textLength="216.7" lengthAdjust="spacingAndGlyphs">세증실에서 열린 제30회 국무회의는 종 32건(법</text>
<text x="260.7" y="606.9" font-size="12.2" textLength="214.6" lengthAdjust="spacingAndGlyphs">들공프만 3, 대등령령안 18, 일반안 6, 부처보고</text>
<text x="260.7" y="623.0" font-size="12.2" textLength="217.8" lengthAdjust="spacingAndGlyphs">5)을 상정함. 의안심의 27건(의안 제1186~1212</text>
<text x="260.7" y="638.0" font-size="12.2" textLength="219.9" lengthAdjust="spacingAndGlyphs">호)은 므두 원안 의결됨.&lt;br&gt;2) 부쳐보고 5건: 형</text>
<text x="260.7" y="655.2" font-size="12.4" textLength="215.6" lengthAdjust="spacingAndGlyphs">사미성년자(족법소년) 연령 기준 공론화 결과(집</text>
<text x="260.7" y="671.1" font-size="13.4" textLength="223.1" lengthAdjust="spacingAndGlyphs">증트의, 성평등가족부), 부동산정책 국민의견 수</text>
<text x="260.7" y="687.2" font-size="13.3" textLength="221.0" lengthAdjust="spacingAndGlyphs">계획(재정경제부), NATO 정상회의용골 국빈방문</text>
<text x="260.7" y="702.4" font-size="12.2" textLength="219.9" lengthAdjust="spacingAndGlyphs">성과 및 후속조치, 중동전쟁 대용현황 및 2026년</text>
<text x="260.7" y="719.4" font-size="13.4" textLength="221.0" lengthAdjust="spacingAndGlyphs">하반기 경제성장전략(재정경제부), 경제적 위기자</text>
<text x="260.7" y="734.6" font-size="12.2" textLength="225.3" lengthAdjust="spacingAndGlyphs">자살예방 대책(금융위원회)xbr&gt;3) 의안 제1186~</text>
<text x="375.5" y="744.2" font-size="8.0" textLength="34.3" lengthAdjust="spacingAndGlyphs">게..~</text>
<text x="306.8" y="764.4" font-size="13.4" textLength="48.3" lengthAdjust="spacingAndGlyphs">AA 포맷</text>
<text x="502.1" y="342.9" font-size="13.3" textLength="56.9" lengthAdjust="spacingAndGlyphs">1) 구제역: 저</text>
<text x="502.0" y="358.1" font-size="14.0" textLength="54.9" lengthAdjust="spacingAndGlyphs">째 구제역이</text>
<text x="502.0" y="373.4" font-size="11.7" textLength="57.0" lengthAdjust="spacingAndGlyphs">될 이후 최고</text>
<text x="502.0" y="390.6" font-size="13.1" textLength="57.1" lengthAdjust="spacingAndGlyphs">인근 축산 능</text>
<text x="501.0" y="405.4" font-size="11.0" textLength="57.9" lengthAdjust="spacingAndGlyphs">수칙 지도•단</text>
<text x="499.9" y="421.4" font-size="12.3" textLength="58.0" lengthAdjust="spacingAndGlyphs">&quot;모두의 생리</text>
<text x="502.0" y="437.5" font-size="12.4" textLength="56.9" lengthAdjust="spacingAndGlyphs">시 등 12개</text>
