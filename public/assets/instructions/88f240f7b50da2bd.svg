<svg xmlns="http://www.w3.org/2000/svg" width="557" height="940" viewBox="0 0 557 940" role="img"><title>보고 — 글꼴은 확인 못 함 · 못 찾은 기사는 미확인으로 · 고칠 점을 묻는다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H557" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="545" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 보고 — 글꼴은 확인 못 함 · 못 찾은 기사는 미확인으로 · 고칠 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="17.0" y="64.2" font-size="19.2" textLength="486.2" lengthAdjust="spacingAndGlyphs">글꼴: 템플릿은 KoPubWorld돋음체 Bold/Medium을 씁니다. 이 컴퓨터에</text>
<text x="18.3" y="86.6" font-size="17.6" textLength="492.8" lengthAdjust="spacingAndGlyphs">설치돼 있는지 확인하려고 글꼴 폴더 열람을 요청했는데 거부되어 확인하</text>
<text x="17.0" y="111.3" font-size="18.9" textLength="499.3" lengthAdjust="spacingAndGlyphs">지 못했습니다. 파일에는 일단 이 글꼴을 그대로 두었습니다. 산돌구름에서</text>
<text x="17.0" y="137.4" font-size="20.3" textLength="486.2" lengthAdjust="spacingAndGlyphs">무료로 받을 수 있고, 별도 허가 없이 모든 사용자가 쓸 수 있다고 안내돼</text>
<text x="18.3" y="161.0" font-size="20.4" textLength="503.3" lengthAdjust="spacingAndGlyphs">있습니다. 인쇄•웹·영상에 쓸 수 있고, 기관만 따로 다룬 조항은 없습니다. 링</text>
<text x="17.0" y="182.6" font-size="16.5" textLength="217.6" lengthAdjust="spacingAndGlyphs">크: 산돌구름 KoPubWorld 돋움체</text>
<text x="18.3" y="217.8" font-size="17.7" textLength="491.5" lengthAdjust="spacingAndGlyphs">미확인: 콘티 3장 8/6 차관회의의 협업 당부를 보도한 기사는 찾지 못했습</text>
<text x="18.3" y="242.4" font-size="19.0" textLength="490.2" lengthAdjust="spacingAndGlyphs">니다. 또 8/11 뉴시스 기사에는 '반도체 펀드'와 '광주 군공항' 내용이 없습</text>
<text x="18.3" y="266.0" font-size="19.0" textLength="406.3" lengthAdjust="spacingAndGlyphs">니다. 광주 군공항 쪽은 국방일보 8/10 기사로 대신했습니다.</text>
<text x="17.0" y="301.4" font-size="19.0" textLength="483.6" lengthAdjust="spacingAndGlyphs">고칠 점이 있으면 알려 주세요. 특히 아래 셋은 정해 주시면 좋겠습니다.</text>
<text x="26.1" y="337.3" font-size="18.4" textLength="68.3" lengthAdjust="spacingAndGlyphs">1. 표지에</text>
<text x="314.5" y="335.8" font-size="17.8" textLength="89.2" lengthAdjust="spacingAndGlyphs">를 넣을까요?</text>
<text x="26.2" y="366.5" font-size="21.7" textLength="356.9" lengthAdjust="spacingAndGlyphs">2. 마무리 장의 연락처'는 그대로 둘까요, 지울까요?</text>
<text x="26.2" y="390.8" font-size="17.6" textLength="481.0" lengthAdjust="spacingAndGlyphs">3. KoPubWorld돋음체가 설치돼 있지 않다면 맑은 고딕으로 바꿀까요?</text>
<text x="15.7" y="438.3" font-size="14.9" textLength="57.7" lengthAdjust="spacingAndGlyphs">Sources:</text>
<text x="23.6" y="473.4" font-size="17.7" textLength="305.4" lengthAdjust="spacingAndGlyphs">• 정책브리핑 제33회 국무회의 결과 브리핑</text>
