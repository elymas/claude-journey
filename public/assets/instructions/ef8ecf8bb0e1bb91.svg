<svg xmlns="http://www.w3.org/2000/svg" width="778" height="681" viewBox="0 0 778 681" role="img"><title>2단계 아코디언 안의 마법 주문 제작 버튼</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H778" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="766" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 2단계 아코디언 안의 마법 주문 제작 버튼</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="89.3" y="159.1" font-size="15.2" textLength="186.6" lengthAdjust="spacingAndGlyphs">SETUP 03• D 0</text>
<text x="309.8" y="161.1" font-size="54.7" textLength="467.0" lengthAdjust="spacingAndGlyphs">규칙 파일을 스킬로 승격</text>
<text x="105.2" y="257.4" font-size="22.1" textLength="365.3" lengthAdjust="spacingAndGlyphs">Steps · 네모는 체크, 제목은 펼치기</text>
<text x="145.9" y="315.3" font-size="29.2" textLength="270.3" lengthAdjust="spacingAndGlyphs">01 지난주 규칙.md를 연다</text>
<text x="147.0" y="376.0" font-size="15.1" textLength="21.5" lengthAdjust="spacingAndGlyphs">02</text>
<text x="182.1" y="375.9" font-size="31.6" textLength="295.1" lengthAdjust="spacingAndGlyphs">맨 위에 ‘이름’ 한 줄을 붙인다</text>
<text x="145.9" y="424.1" font-size="25.6" textLength="617.4" lengthAdjust="spacingAndGlyphs">부를 이름이 있어야 스킬이다. &quot;정책자료 기획안&quot;처럼 내가 실제로 입 밖에 낼 말</text>
<text x="148.1" y="456.1" font-size="23.4" textLength="491.9" lengthAdjust="spacingAndGlyphs">로 짓는다. 영어 약자나 코드번호는 다음 달에 내가 못 떠올린다.</text>
<text x="180.9" y="515.0" font-size="23.6" textLength="134.6" lengthAdjust="spacingAndGlyphs">마법 주문 제작</text>
<text x="147.0" y="587.4" font-size="14.0" textLength="21.5" lengthAdjust="spacingAndGlyphs">03</text>
<text x="178.7" y="587.1" font-size="31.6" textLength="349.4" lengthAdjust="spacingAndGlyphs">‘절차’ 항목을 3~4단계로 덧붙인다</text>
<text x="142.6" y="650.8" font-size="30.0" textLength="356.6" lengthAdjust="spacingAndGlyphs">04 새 대화를 열고 이름만 불러본다</text></g><rect x=".5" y=".5" width="777" height="680" rx="6" fill="none" stroke="#d8cfc0"/></svg>