<svg xmlns="http://www.w3.org/2000/svg" width="381" height="407" viewBox="0 0 381 407" role="img"><title>수정사항을 메모장에 미리 적어둔다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H381" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="369" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 수정사항을 메모장에 미리 적어둔다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="11.3" y="96.2" font-size="16.5" textLength="153.2" lengthAdjust="spacingAndGlyphs">아래 수정사항 반영해줘.</text>
<text x="10.7" y="139.4" font-size="17.2" textLength="357.0" lengthAdjust="spacingAndGlyphs">1. 표지의 그림이 지금 내 콘티랑 안 맞아. 공공기관 보고스</text>
<text x="9.8" y="165.8" font-size="26.8" textLength="354.0" lengthAdjust="spacingAndGlyphs">럽게 도형? 모양? 좀 적절히 직선적으로 표지 슬라이드 디</text>
<text x="11.3" y="187.9" font-size="17.8" textLength="344.4" lengthAdjust="spacingAndGlyphs">자인해봐. 가안 3개 만들어오고, 내가 캡쳐해준 슬라이드</text>
<text x="11.3" y="212.7" font-size="17.2" textLength="48.0" lengthAdjust="spacingAndGlyphs">참고해.</text>
<text x="10.7" y="255.2" font-size="17.8" textLength="352.4" lengthAdjust="spacingAndGlyphs">2. 그래프가 각기 다른 색이었으면 좋겠고, 이거 템플릿 적</text>
<text x="11.3" y="279.3" font-size="17.2" textLength="125.2" lengthAdjust="spacingAndGlyphs">용 규칙에도 넣어줘.</text>
<text x="10.7" y="323.1" font-size="17.8" textLength="343.0" lengthAdjust="spacingAndGlyphs">3. 왜 규칙에 있는 단위 묻기를 하지 않았고, 눈금선도 안</text>
<text x="11.3" y="346.9" font-size="19.2" textLength="344.4" lengthAdjust="spacingAndGlyphs">보여? 이유 확인하고 적용해서 수정해. 이유를 찾았을 때</text>
<text x="12.0" y="370.0" font-size="16.5" textLength="251.8" lengthAdjust="spacingAndGlyphs">네가 해결할 수 있으면 해결까지 해서 와.</text></g><rect x=".5" y=".5" width="380" height="406" rx="6" fill="none" stroke="#d8cfc0"/></svg>