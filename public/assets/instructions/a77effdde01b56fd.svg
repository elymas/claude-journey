<svg xmlns="http://www.w3.org/2000/svg" width="989" height="741" viewBox="0 0 989 741" role="img"><title>결과 파일 맨 아래 ‘점검 기록’ — 무엇을 / 고치기 전 → 고친 후 / 근거(파일명·쪽)</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H989" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="977" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 결과 파일 맨 아래 ‘점검 기록’ — 무엇을 / 고치기 전 → 고친 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="879.7" y="54.2" font-size="8.0" textLength="14.4" lengthAdjust="spacingAndGlyphs">-</text>
<text x="17.2" y="68.8" font-size="18.8" textLength="85.0" lengthAdjust="spacingAndGlyphs">플 시종.md</text>
<text x="12.9" y="101.8" font-size="16.3" textLength="139.4" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="258.8" y="71.4" font-size="17.8" textLength="175.4" lengthAdjust="spacingAndGlyphs">※ 2026-10-08_자료요약.md</text>
<text x="333.5" y="99.4" font-size="13.4" textLength="47.4" lengthAdjust="spacingAndGlyphs">H1 v</text>
<text x="263.1" y="123.7" font-size="13.5" textLength="219.9" lengthAdjust="spacingAndGlyphs">두말씀: 국균형발전과 세증 명칭 20주년. 10일</text>
<text x="263.1" y="139.7" font-size="13.4" textLength="221.4" lengthAdjust="spacingAndGlyphs">기준 폭염 사망자 28명•누적 은열질환자 3,237명</text>
<text x="263.1" y="155.4" font-size="13.4" textLength="217.1" lengthAdjust="spacingAndGlyphs">기후 재난 시대 최저 주거 기준 개정 검토 및 고</text>
<text x="263.1" y="171.3" font-size="13.5" textLength="225.7" lengthAdjust="spacingAndGlyphs">시원•비닐하우스판잣집 등 주택 이외의 거처 개선</text>
<text x="263.0" y="188.5" font-size="15.5" textLength="46.2" lengthAdjust="spacingAndGlyphs">을 언급함</text>
<text x="500.3" y="67.9" font-size="11.8" textLength="10.1" lengthAdjust="spacingAndGlyphs">.</text>
<text x="955.9" y="56.2" font-size="13.3" textLength="31.6" lengthAdjust="spacingAndGlyphs">X</text>
<text x="541.9" y="70.1" font-size="16.3" textLength="14.4" lengthAdjust="spacingAndGlyphs">+</text>
<text x="587.9" y="100.8" font-size="13.3" textLength="12.9" lengthAdjust="spacingAndGlyphs">H</text>
<text x="610.9" y="97.1" font-size="8.9" textLength="10.1" lengthAdjust="spacingAndGlyphs">~</text>
<text x="806.4" y="106.2" font-size="25.2" textLength="30.2" lengthAdjust="spacingAndGlyphs">⅛</text>
<text x="15.8" y="224.1" font-size="27.1" textLength="129.5" lengthAdjust="spacingAndGlyphs">자료 간 차이</text>
<text x="12.9" y="246.0" font-size="13.4" textLength="294.7" lengthAdjust="spacingAndGlyphs">• 석유큐 8차 최고가격' 및 '150원'의 서술이 자료마다 다듬</text>
<text x="69.0" y="263.1" font-size="14.9" textLength="909.9" lengthAdjust="spacingAndGlyphs">260721 제31회 국무회의특(청와대).pdf. 7쪽: 7자 최고가격 인하 가격반영 측진 위해 주유소 특별점점(3,000개소). 국제유가:민생부담 등 감안해 8자 최고가격 및 유류세 관련 결정(7.24): 8쪽 재정경</text>
<text x="67.6" y="277.6" font-size="13.4" textLength="237.3" lengthAdjust="spacingAndGlyphs">제부장관 지난번 150원 내린 가격으로 유지 중임.&quot;</text>
<text x="41.7" y="291.4" font-size="8.0" textLength="11.5" lengthAdjust="spacingAndGlyphs">.</text>
<text x="67.6" y="294.7" font-size="14.9" textLength="912.8" lengthAdjust="spacingAndGlyphs">260728 제33회 국무회의류(서울-세증).pdf, 6쪽: 석유류 8자 최고가격 동결 (725) 및 유류세 인하 2개월 연장 (~9.30): 산업등상부차관 8차 최고 가격제가 동결된 상태에서 발표되었고, 7차 최고 가격</text>
<text x="67.6" y="310.4" font-size="14.8" textLength="196.9" lengthAdjust="spacingAndGlyphs">제 때 리터당 150원 내린 것이 반영돼서...&quot;</text>
<text x="41.7" y="324.2" font-size="8.9" textLength="8.6" lengthAdjust="spacingAndGlyphs">.</text>
<text x="64.7" y="326.3" font-size="15.1" textLength="564.4" lengthAdjust="spacingAndGlyphs">260804 제34회 국무회의류(청와대)pdf, 11쪽: 8차 최고가격 인하(A150원)를 등해 7월 가상승률 40.0%p 완화 효과•</text>
<text x="40.3" y="342.1" font-size="14.8" textLength="854.4" lengthAdjust="spacingAndGlyphs">• 어긋나는 지점: 8차 최고가격을 260728은 동결: 260804는 인하(스150원)로 적고, 150원 인하는 260728(산업등상부차관 발언)이 7차 때의 일로, 260804가 8차의 일로 서슬함.</text>
<text x="14.4" y="355.9" font-size="8.9" textLength="8.6" lengthAdjust="spacingAndGlyphs">.</text>
<text x="41.7" y="358.2" font-size="13.5" textLength="560.4" lengthAdjust="spacingAndGlyphs">경제문제 원인 자살자 수 2020년' 수치가 다음 (같은 등계 계열의 2015년 2024년 수지와 비중 25.4%는 두 자료가 같용)</text>
<text x="67.6" y="373.9" font-size="13.4" textLength="517.5" lengthAdjust="spacingAndGlyphs">260714 제30회 국무회의독(청와대).pdf, 36쪽: (15) 3,089명(23.0) - (20) 3,249명(25.4) - (24) 4,398명(29.6)</text>
<text x="66.1" y="390.8" font-size="16.5" textLength="530.4" lengthAdjust="spacingAndGlyphs">260811 제35회 국무회의류(세증)pdf 11쪽: (15) 3.089명(23.09) - (20) 3,429명(25.49) -(24) 4,398명(29.696)</text>
<text x="41.7" y="405.5" font-size="13.4" textLength="320.6" lengthAdjust="spacingAndGlyphs">단일종목 레버리지 상품 기본예금 3,000만 원의 시행일 서술이 다듬</text>
<text x="67.6" y="422.6" font-size="14.9" textLength="912.8" lengthAdjust="spacingAndGlyphs">260721 제31회 국무회의류(청와대).pdf, 13쪽: 금융위원장 두자자 예탁금을 기본적으로 3,000만 원을 갖고 있어야 투자할 수 있는 방안을 지난주 목요일에 발표했음&quot; 시행 시기는 전산 문제로 인해 8</text>
<text x="69.0" y="437.2" font-size="13.4" textLength="125.1" lengthAdjust="spacingAndGlyphs">월 5일부터 시행된 예정임.</text>
<text x="66.1" y="455.4" font-size="16.5" textLength="813.6" lengthAdjust="spacingAndGlyphs">260728 제33회 국무회의록(서울-세증)pdf 6쪽: 기본예탁금 강화 조기시행(8월중-7.31일): 기본예탁금 1.000만 원-+3.000만 원 상향(당초 8.5일) 및 현금만 인정(당초 8.19일)</text>
<text x="14.4" y="468.0" font-size="8.9" textLength="10.1" lengthAdjust="spacingAndGlyphs">.</text>
<text x="41.7" y="470.2" font-size="13.4" textLength="184.0" lengthAdjust="spacingAndGlyphs">같은 자료 안에서 숫자가 다른 곳 (참고)</text>
<text x="40.2" y="487.3" font-size="14.8" textLength="928.6" lengthAdjust="spacingAndGlyphs">• 260811제35회 국무회의득(세증),pdf, 34쪽: 과기정등부장관이 국민 AI 서비스 혁신 추진단을 전체 인력의 43%을 민간 개발자로 구성 한다고 말한 뒤 같은 쪽 답변에서 민간 개발자들 41% 정도 채</text>
<text x="69.0" y="501.8" font-size="13.4" textLength="196.9" lengthAdjust="spacingAndGlyphs">용 이라고 말함. 35쪽 36쪽도 41%로 적힘</text>
<text x="67.6" y="518.9" font-size="14.9" textLength="915.3" lengthAdjust="spacingAndGlyphs">260806 제30회 자관회의류(서울-세증)pdf, 14쪽과 260811제35회 국무회의독(세증),pdf, 52쪽(의안 제1323호): 원문 90억 1,800만 원과 44억 4,000만 원'을 지원하는 총 134억 5,900만 원'. 계산:</text>
<text x="67.6" y="534.7" font-size="14.9" textLength="632.5" lengthAdjust="spacingAndGlyphs">90억 1,800만 + 44억 4,000만 = 134억 5,800만원이어서 원문 합계(134억 5,900만 원)와 100만 원 차이가 남(두 자료 표기는 서로 같음)</text>
<text x="12.9" y="549.3" font-size="13.3" textLength="894.3" lengthAdjust="spacingAndGlyphs">• 그외 반복해서 나오는 주제(폭염 사망자•은영질환자 누적 수치, 유가 환율 등)는 회의 시점에 따라 값이 바뀌는 보고로, 같은 시점을 두고 다르게 말하는 경우가 아니어서 위 목에 넣지 않음.</text>
<text x="15.7" y="585.2" font-size="26.0" textLength="123.8" lengthAdjust="spacingAndGlyphs">미확인 항목</text>
<text x="12.9" y="606.8" font-size="13.4" textLength="258.7" lengthAdjust="spacingAndGlyphs">• 해당 없음. 원문에서 찾지 못해 비워 든 값은 없음.</text>
<text x="15.8" y="641.0" font-size="25.2" textLength="100.6" lengthAdjust="spacingAndGlyphs">점검 기록</text>
<text x="12.9" y="664.2" font-size="15.1" textLength="940.1" lengthAdjust="spacingAndGlyphs">• 260709/ 모두말씀의 국회 일정: 정기국회 법안 처리 협조•- 7월 임시국회 시작, 국회와의 소등 강화•기본사회기본법 등 3분기 중점 추진법안 협조•/ 260709 제26회 차관회의특(서울-세증).pdf 2쪽</text>
<text x="12.9" y="680.1" font-size="13.4" textLength="553.4" lengthAdjust="spacingAndGlyphs">• 260709/ 축산을 유가 최근 높은 수준 -&quot;3월 이후 최고 수준/ 260709 제26회 자관회의독(서울-세증).pdf 2쪽</text>
<text x="12.9" y="696.1" font-size="13.5" textLength="881.2" lengthAdjust="spacingAndGlyphs">• 260709/ 모두의 생리대' 지적: 시행 초기 안내 부족비지 누락 지적 - 싹들이에 대한 우려, 생리대가 비지되지 않은 곳이 있다는 지적•/ 260709 제26회 자관회의록(서울-세증).pdf 2쪽</text>
<text x="12.9" y="711.7" font-size="13.4" textLength="468.6" lengthAdjust="spacingAndGlyphs">• 260709/ 모두말씀 쪽: 1~2쪽 + 2~3쪽/ 260709 제26회 차관회의독(서울-세증)pdf 2~3쪽</text>
<text x="14.4" y="726.3" font-size="11.8" textLength="557.8" lengthAdjust="spacingAndGlyphs">• 260714/ 법률 시행령 안전 심의 쪽: 43~74쪽 +&quot;61~75쪽•/ 260714 제30회 국무회의득(청와대).pdf 61쪽, 75쪽</text>
<text x="366.6" y="738.6" font-size="8.0" textLength="485.8" lengthAdjust="spacingAndGlyphs">        </text></g><rect x=".5" y=".5" width="988" height="740" rx="6" fill="none" stroke="#d8cfc0"/></svg>