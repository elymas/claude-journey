<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="663" viewBox="0 0 1100 663" role="img"><title>② 주문서 복사를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1100" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1088" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ② 주문서 복사를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="57.6" y="108.9" font-size="18.1" textLength="60.8" lengthAdjust="spacingAndGlyphs">돌아가기</text>
<text x="35.2" y="179.8" font-size="15.0" textLength="107.1" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="169.5" y="180.2" font-size="44.5" textLength="302.2" lengthAdjust="spacingAndGlyphs">정책자료 요약 시종</text>
<text x="41.6" y="271.0" font-size="13.4" textLength="87.9" lengthAdjust="spacingAndGlyphs"># 정책자료 요약</text>
<text x="43.2" y="284.3" font-size="11.8" textLength="115.1" lengthAdjust="spacingAndGlyphs">미 폴더의 규칙.md를</text>
<text x="155.1" y="286.8" font-size="14.9" textLength="99.1" lengthAdjust="spacingAndGlyphs">먼저 읽고 따른다.</text>
<text x="41.6" y="329.9" font-size="15.1" textLength="286.2" lengthAdjust="spacingAndGlyphs">1. 이 폴더의 정책자료 파일을 하나씩 끝까지 읽는다.</text>
<text x="59.2" y="345.7" font-size="16.6" textLength="169.5" lengthAdjust="spacingAndGlyphs">(결과 폴더와 .md 파일은 제외)</text>
<text x="41.6" y="360.1" font-size="16.5" textLength="254.2" lengthAdjust="spacingAndGlyphs">2. 파일마다 핵심요약 3줄, 쟁점 2줄을 뽑는다.</text>
<text x="40.0" y="374.6" font-size="16.6" textLength="362.9" lengthAdjust="spacingAndGlyphs">3. 자료명 / 핵심요약 / 쟁점 / 출처(파일명·쪽) 네 열 표로 만들어</text>
<text x="60.8" y="389.1" font-size="16.7" textLength="268.6" lengthAdjust="spacingAndGlyphs">결과 폴더에 YYYY-MM-DD_자료요약.md로 저장한다.</text>
<text x="41.6" y="403.2" font-size="16.6" textLength="235.0" lengthAdjust="spacingAndGlyphs">기획안은 쓰지 않는다. 의견도 달지 않는다.</text>
<text x="41.6" y="430.8" font-size="15.0" textLength="99.1" lengthAdjust="spacingAndGlyphs"># 다 됐다는 기준</text>
<text x="41.6" y="446.8" font-size="15.0" textLength="203.1" lengthAdjust="spacingAndGlyphs">- 결과 폴더에 자료요약.md가 생겼다.</text>
<text x="41.6" y="460.8" font-size="16.7" textLength="167.9" lengthAdjust="spacingAndGlyphs">- 표의 모든 줄에 출처가 있다.</text>
<text x="40.0" y="475.2" font-size="16.6" textLength="203.1" lengthAdjust="spacingAndGlyphs">- 하나라도 안 되면 멈추고 물어본다.</text>
<text x="789.7" y="179.4" font-size="21.0" textLength="105.7" lengthAdjust="spacingAndGlyphs">모 주문서 복사</text>
<text x="936.9" y="179.6" font-size="16.6" textLength="118.3" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="944.9" y="214.6" font-size="16.5" textLength="126.3" lengthAdjust="spacingAndGlyphs">주황색이 핵심 줄</text>
<text x="655.4" y="285.6" font-size="23.7" textLength="220.0" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="660.0" y="317.6" font-size="23.7" textLength="362.1" lengthAdjust="spacingAndGlyphs">둘째 줄- 이 줄이 규칙.md를 끌어온다. 호출은 『시</text>
<text x="660.3" y="347.9" font-size="24.9" textLength="295.8" lengthAdjust="spacingAndGlyphs">종.md 읽고, OO해줘」 하나로 충분해진다.</text>
<text x="658.7" y="382.3" font-size="18.2" textLength="378.9" lengthAdjust="spacingAndGlyphs">할 일 . 출처 열- 이 한 열이 있으면 나중에 원문과 맞</text>
<text x="658.7" y="409.1" font-size="21.9" textLength="91.2" lengthAdjust="spacingAndGlyphs">춰볼 수 있다.</text>
<text x="660.0" y="445.2" font-size="23.5" textLength="385.0" lengthAdjust="spacingAndGlyphs">‘할 일’ 마지막 줄 “기획안은 쓰지 않는다”가 오늘의 핵심이다.</text>
<text x="660.3" y="472.9" font-size="21.6" textLength="346.9" lengthAdjust="spacingAndGlyphs">핵심. 여기서 멈춰야 내가 요약을 보고 방향을 정한다.</text>
<text x="658.7" y="510.1" font-size="18.3" textLength="225.4" lengthAdjust="spacingAndGlyphs">같은 폴더에 시종.md로 저장한다.</text>
<text x="658.7" y="535.4" font-size="21.6" textLength="246.2" lengthAdjust="spacingAndGlyphs">원하는 부분은 편하게 수정해도 된다.</text></g><rect x=".5" y=".5" width="1099" height="662" rx="6" fill="none" stroke="#d8cfc0"/></svg>