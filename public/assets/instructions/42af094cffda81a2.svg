<svg xmlns="http://www.w3.org/2000/svg" width="847" height="513" viewBox="0 0 847 513" role="img"><title>수정사항을 복붙해서 클로드에게 보낸다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H847" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="835" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 수정사항을 복붙해서 클로드에게 보낸다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="38.2" y="80.3" font-size="14.1" textLength="105.9" lengthAdjust="spacingAndGlyphs">시안 작성 v</text>
<text x="148.2" y="130.3" font-size="18.3" textLength="180.0" lengthAdjust="spacingAndGlyphs">2026 1030 발표자료 시안</text>
<text x="150.2" y="151.3" font-size="16.6" textLength="339.8" lengthAdjust="spacingAndGlyphs">프레젠테이션• PPTX • 저장 위치: 00프로젝트 기획_회의록/결과</text>
<text x="631.6" y="139.0" font-size="16.6" textLength="107.1" lengthAdjust="spacingAndGlyphs">다운로드 및 열기</text>
<text x="183.5" y="256.5" font-size="21.8" textLength="170.6" lengthAdjust="spacingAndGlyphs">아래 수정사항 반영해줘.</text>
<text x="199.4" y="287.5" font-size="19.0" textLength="577.4" lengthAdjust="spacingAndGlyphs">1. 표지의 그림이 지금 내 콘티랑 안 맞아. 공공기관 보고스럽게 도형? 모양? 좀 적절히</text>
<text x="216.7" y="313.0" font-size="21.6" textLength="557.7" lengthAdjust="spacingAndGlyphs">직선적으로 표지 슬라이드 디자인해봐. 가안 3개 만들어오고, 내가 캡쳐해준 슬라이</text>
<text x="216.6" y="335.7" font-size="19.6" textLength="74.0" lengthAdjust="spacingAndGlyphs">드 참고해.</text>
<text x="197.6" y="358.6" font-size="22.0" textLength="522.3" lengthAdjust="spacingAndGlyphs">2. 그래프가 각기 다른 색이었으면 좋겠고, 이거 템플릿 적용 규칙에도 넣어줘.</text>
<text x="197.6" y="383.2" font-size="22.0" textLength="575.3" lengthAdjust="spacingAndGlyphs">3. 왜 규칙에 있는 단위 묻기를 하지 않았고, 눈금선도 안 보여? 이유 확인하고 적용해</text>
<text x="215.3" y="404.8" font-size="18.2" textLength="472.9" lengthAdjust="spacingAndGlyphs">서 수정해. 이유를 찾았을 때 네가 해결할 수 있으면 해결까지 해서 와.</text>
<text x="62.8" y="474.8" font-size="9.0" textLength="18.5" lengthAdjust="spacingAndGlyphs">•&quot;</text>
<text x="89.9" y="477.4" font-size="16.6" textLength="54.2" lengthAdjust="spacingAndGlyphs">작업 중</text></g><rect x=".5" y=".5" width="846" height="512" rx="6" fill="none" stroke="#d8cfc0"/></svg>