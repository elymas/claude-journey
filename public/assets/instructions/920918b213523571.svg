<svg xmlns="http://www.w3.org/2000/svg" width="1037" height="661" viewBox="0 0 1037 661" role="img"><title>덱에서 '주문서 복사'를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1037" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1025" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 덱에서 '주문서 복사'를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="46.6" y="142.8" font-size="16.3" textLength="71.0" lengthAdjust="spacingAndGlyphs">• 돌아가기</text>
<text x="43.7" y="207.7" font-size="12.4" textLength="98.0" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="167.3" y="208.2" font-size="40.3" textLength="453.7" lengthAdjust="spacingAndGlyphs">기획안.md — 요약 위에 세운다</text>
<text x="735.5" y="208.3" font-size="18.6" textLength="95.0" lengthAdjust="spacingAndGlyphs">단 주문서 복사</text>
<text x="780.8" y="238.9" font-size="15.6" textLength="48.2" lengthAdjust="spacingAndGlyphs">새파용</text>
<text x="869.7" y="207.3" font-size="15.5" textLength="91.9" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="860.6" y="238.9" font-size="15.6" textLength="129.6" lengthAdjust="spacingAndGlyphs">전부 미번 주 내용</text>
<text x="49.7" y="297.5" font-size="17.2" textLength="125.1" lengthAdjust="spacingAndGlyphs"># 정책자료 기획안</text>
<text x="51.2" y="319.8" font-size="18.7" textLength="271.3" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="49.7" y="362.1" font-size="17.0" textLength="61.8" lengthAdjust="spacingAndGlyphs">#할일</text>
<text x="49.7" y="384.4" font-size="18.7" textLength="388.9" lengthAdjust="spacingAndGlyphs">1. 부를 때 받은 결과 폴더의 요약 파일 한 개만 읽는다.</text>
<text x="75.2" y="405.3" font-size="20.3" textLength="202.2" lengthAdjust="spacingAndGlyphs">정책자료 원본은 읽지 않는다.</text>
<text x="49.7" y="426.7" font-size="19.1" textLength="313.5" lengthAdjust="spacingAndGlyphs">2. 요약 맨 아래의 ‘점검 기록’을 먼저 본다.</text>
<text x="75.4" y="446.3" font-size="18.8" textLength="287.9" lengthAdjust="spacingAndGlyphs">고친 항목이 있으면 고친 후의 값을 쓴다.</text>
<text x="49.7" y="468.5" font-size="20.3" textLength="214.0" lengthAdjust="spacingAndGlyphs">3. 기획안은 네 덩어리로 쓴다.</text>
<text x="75.4" y="489.6" font-size="20.2" textLength="414.5" lengthAdjust="spacingAndGlyphs">덩어리마다 첫 줄은 결론 한 문장, 그 아래 근거 세 줄 이하.</text>
<text x="73.9" y="508.0" font-size="17.0" textLength="236.6" lengthAdjust="spacingAndGlyphs">- 배경: 왜 지금 이 얘기를 하는가</text>
<text x="73.9" y="529.1" font-size="17.1" textLength="293.9" lengthAdjust="spacingAndGlyphs">- 쟁점: 무엇이 문제인가 (숫자 하나 이상)</text>
<text x="73.9" y="551.7" font-size="17.2" textLength="254.7" lengthAdjust="spacingAndGlyphs">- 제안: 그래서 무엇을 하자는 것인가</text>
<text x="73.9" y="572.7" font-size="17.2" textLength="241.2" lengthAdjust="spacingAndGlyphs">- 다음 단계: 누가 언제까지 무엇을</text>
<text x="49.7" y="595.2" font-size="19.1" textLength="486.8" lengthAdjust="spacingAndGlyphs">4. 숫자·날짜마다 괄호 안에 요약 파일의 어느 항목에서 왔는지 적는다.</text>
<text x="75.4" y="615.0" font-size="17.2" textLength="224.6" lengthAdjust="spacingAndGlyphs">요약에 없는 숫자는 쓰지 않는다.</text>
<text x="615.0" y="306.5" font-size="17.2" textLength="208.0" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="616.5" y="335.2" font-size="15.5" textLength="349.7" lengthAdjust="spacingAndGlyphs">요약 파일 한 개만 - 원본을 다시 읽으면 요약 시종이 한</text>
<text x="615.0" y="361.6" font-size="20.1" textLength="334.6" lengthAdjust="spacingAndGlyphs">점검이 헛일이 된다. 둘째 시종은 첫째의 결과만 믿는다.</text>
<text x="615.0" y="395.2" font-size="17.2" textLength="343.7" lengthAdjust="spacingAndGlyphs">점검 기록을 먼저 - 요약에서 고친 값이 있으면 그 값으</text>
<text x="615.0" y="422.0" font-size="18.8" textLength="245.7" lengthAdjust="spacingAndGlyphs">로 쓴다. 오늘 STEP 01이 여기서 쓰인다.</text>
<text x="615.0" y="455.5" font-size="17.2" textLength="343.7" lengthAdjust="spacingAndGlyphs">첫 좋은 결론 한 문장 - 다음 주 발표자료의 장 제목이</text>
<text x="615.0" y="480.8" font-size="18.7" textLength="351.2" lengthAdjust="spacingAndGlyphs">이 문장 그대로다. 여기서 못 쓰면 슬라이드에서도 못 쓴다.</text>
<text x="615.0" y="514.1" font-size="17.0" textLength="346.7" lengthAdjust="spacingAndGlyphs">요약에 없는 숫자 - 기획안 시종이 Mr.그럴듯이 되는 자</text>
<text x="615.0" y="540.9" font-size="18.7" textLength="174.8" lengthAdjust="spacingAndGlyphs">리. 괄호 출처가 그걸 막는다.</text>
<text x="616.5" y="575.5" font-size="18.8" textLength="192.9" lengthAdjust="spacingAndGlyphs">빈 기획안.md에 ctrl+V, ctrl+S.</text></g><rect x=".5" y=".5" width="1036" height="660" rx="6" fill="none" stroke="#d8cfc0"/></svg>