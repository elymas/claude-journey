<svg xmlns="http://www.w3.org/2000/svg" width="1306" height="776" viewBox="0 0 1306 776" role="img"><title>쟁점 장 — 회의록 PDF의 발언을 캡처해 넣었다. 본문에서 인용한 부분은 파란 음영, 아래에 그림 번호와 출처(회의록 회차·날짜)</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1306" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1294" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 쟁점 장 — 회의록 PDF의 발언을 캡처해 넣었다. 본문에서 인용한 </text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="60.7" y="91.3" font-size="39.3" textLength="104.4" lengthAdjust="spacingAndGlyphs">11. 쟁점</text>
<text x="83.5" y="180.1" font-size="27.4" textLength="654.9" lengthAdjust="spacingAndGlyphs">핵심 요약 쟁의 범위 쟁점이 되풀이되어 미정리 지점이 남은 듯하다(해석)</text>
<text x="59.9" y="245.6" font-size="27.9" textLength="533.3" lengthAdjust="spacingAndGlyphs">• 7월 리일: 대통령이 쟁의 범위 기준을 시행령•규칙•지침으로</text>
<text x="87.3" y="272.8" font-size="29.4" textLength="486.0" lengthAdjust="spacingAndGlyphs">미리 정할 필요를 지적했고, 고용노동부장관은 해석 지침을</text>
<text x="87.3" y="296.0" font-size="27.8" textLength="478.4" lengthAdjust="spacingAndGlyphs">이미 내렸다고 답함. 삼성전자 광주 반도체 공장 관련 노조</text>
<text x="87.3" y="318.9" font-size="25.4" textLength="170.8" lengthAdjust="spacingAndGlyphs">주장이 사례로 나옴.</text>
<text x="62.6" y="358.8" font-size="25.5" textLength="468.9" lengthAdjust="spacingAndGlyphs">• B월 11일: 노란봉투법 쟁의 대상 기준을 명확히 하라는</text>
<text x="87.0" y="388.4" font-size="37.6" textLength="439.2" lengthAdjust="spacingAndGlyphs">비판에 노동부장관은 &quot;시행령으로 만들 것은 아니고,</text>
<text x="92.8" y="410.1" font-size="35.9" textLength="497.8" lengthAdjust="spacingAndGlyphs">행정해석으로 이미 다 내렸음&quot;이라고 답함. 대통령은 해석과</text>
<text x="87.3" y="435.9" font-size="29.6" textLength="415.7" lengthAdjust="spacingAndGlyphs">시행령• 노동부령은 다르다며 적극 검토를 당부함.</text>
<text x="59.9" y="473.5" font-size="27.9" textLength="506.1" lengthAdjust="spacingAndGlyphs">• 같은 날 대통령은 주 52시간제 도입을 두고 산업부장관은</text>
<text x="85.4" y="500.2" font-size="31.3" textLength="499.2" lengthAdjust="spacingAndGlyphs">&quot;필요한 것 같다&quot;, 노동부장관은 &quot;안 된다. 신중해야 된다&quot;는</text>
<text x="87.3" y="525.5" font-size="27.5" textLength="472.7" lengthAdjust="spacingAndGlyphs">의견을 냈다며, 부처 간 이견이 드러나는 것은 자연스러운</text>
<text x="87.2" y="548.5" font-size="28.5" textLength="146.4" lengthAdjust="spacingAndGlyphs">현상이라고 말함.</text>
<text x="1123.8" y="81.0" font-size="17.6" textLength="121.5" lengthAdjust="spacingAndGlyphs">3대 메가프로젝트</text>
<text x="801.1" y="256.1" font-size="13.7" textLength="151.9" lengthAdjust="spacingAndGlyphs">• 고용노동부장관 김영훈</text>
<text x="823.8" y="277.0" font-size="13.9" textLength="406.2" lengthAdjust="spacingAndGlyphs">법이 만들어지면 그에 대한 해석 지침과 가이드라인을 전화하고 있음.</text>
<text x="823.8" y="298.0" font-size="13.9" textLength="404.3" lengthAdjust="spacingAndGlyphs">예를 들어 대통령님께서 말씀하신 삼성전자 초기업 노조 전에 대해서도</text>
<text x="820.0" y="318.4" font-size="15.6" textLength="410.0" lengthAdjust="spacingAndGlyphs">&quot;근로 조건에 영향을 미치는 사업 경영상 결정에 해당하는지&quot;를 저희가</text>
<text x="823.8" y="337.7" font-size="13.7" textLength="404.3" lengthAdjust="spacingAndGlyphs">여러 사례를 중심으로 해석 지침을 내렸는데, 그 기준에는 해당하지 않는</text>
<text x="821.9" y="361.9" font-size="18.0" textLength="108.2" lengthAdjust="spacingAndGlyphs">것으로 판단하였음.</text>
<text x="859.9" y="395.6" font-size="19.6" textLength="288.5" lengthAdjust="spacingAndGlyphs">(그림 2&gt; 7월 21일 국무회의 쟁의 범위 논의</text>
<text x="867.5" y="416.6" font-size="19.7" textLength="273.3" lengthAdjust="spacingAndGlyphs">※ 출처: 국무회의 회의록 제31회, 2026.07.21.</text>
<text x="897.9" y="433.9" font-size="17.7" textLength="210.7" lengthAdjust="spacingAndGlyphs">※ 파란 음영은 본문에서 인용한 부분</text>
<text x="774.5" y="475.6" font-size="17.7" textLength="108.2" lengthAdjust="spacingAndGlyphs">• 대통령 이재명</text>
<text x="797.3" y="496.7" font-size="15.6" textLength="438.5" lengthAdjust="spacingAndGlyphs">기사에서 &quot;노란봉투법에 의한 쟁의 대상인지 아닌지에 대해 사례나 규정을</text>
<text x="799.2" y="517.7" font-size="16.0" textLength="427.1" lengthAdjust="spacingAndGlyphs">명확하게 해야 하는데, 아직 안 만들고 있다.&quot;라고 하는 비판이 있었음.</text>
<text x="776.4" y="561.5" font-size="13.9" textLength="161.4" lengthAdjust="spacingAndGlyphs">• 고용노동부장관 김영훈</text>
<text x="797.3" y="587.2" font-size="19.6" textLength="366.4" lengthAdjust="spacingAndGlyphs">시행령으로 만들 것은 아니고, 행정해석으로 이미 다 내렸음.</text>
<text x="844.7" y="623.3" font-size="19.7" textLength="318.9" lengthAdjust="spacingAndGlyphs">〈그림 3&gt; 8월 11일 국무회의 쟁의 대상 기준 논의</text>
<text x="871.3" y="642.8" font-size="15.6" textLength="269.6" lengthAdjust="spacingAndGlyphs">※ 출처: 국무회의 회의록 제35회, 2026.08.11.</text>
<text x="901.7" y="661.8" font-size="15.6" textLength="206.9" lengthAdjust="spacingAndGlyphs">※ 파란 음영은 본문에서 인용한 부분</text>
<text x="1213.0" y="740.3" font-size="11.9" textLength="34.2" lengthAdjust="spacingAndGlyphs">-4-</text></g><rect x=".5" y=".5" width="1305" height="775" rx="6" fill="none" stroke="#d8cfc0"/></svg>