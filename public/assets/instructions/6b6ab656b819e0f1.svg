<text x="16.1" y="103.4" font-size="15.6" textLength="139.3" lengthAdjust="spacingAndGlyphs">파일 편집 보기</text>
<text x="15.0" y="143.0" font-size="15.6" textLength="464.0" lengthAdjust="spacingAndGlyphs"># 기획안: 3대 메가프로젝트가 막힐 수 있는 지점 - 부처 간 이견과 제도 공백</text>
<text x="18.2" y="179.0" font-size="17.8" textLength="609.7" lengthAdjust="spacingAndGlyphs">근거 파일: 결과/2026-10-08_자료요약.md (이 요약 1개만 읽고 작성함. 정책자료 원본 PDF는 읽지 않음.)</text>
<text x="18.2" y="194.3" font-size="15.5" textLength="646.1" lengthAdjust="spacingAndGlyphs">표기 규칙: 숫자 날짜 뒤 괄호는 요약 파일에서 그 값이 나온 항목임. 요약 '점검 기록'에서 고친 항목은 고친 후</text>
<text x="18.2" y="211.4" font-size="15.5" textLength="278.6" lengthAdjust="spacingAndGlyphs">의 값을 씀. '(추정)'은 요약에 근거가 없는 줄임.</text>
<text x="16.1" y="244.7" font-size="15.5" textLength="177.9" lengthAdjust="spacingAndGlyphs">## 기획 조건 (답하신 그대로)</text>
<text x="16.1" y="280.7" font-size="17.7" textLength="653.6" lengthAdjust="spacingAndGlyphs">- 목표: 최근 이슈/이 회의들에서 어떤 안건들이 보고되고, 그 중 자꾸 중요하게 다뤄지는 부분이 뭔지 알아내야</text>
<text x="18.2" y="297.0" font-size="16.6" textLength="648.3" lengthAdjust="spacingAndGlyphs">해. 그리고 그걸 해결하거나 그 이슈로부터 앞으로 일어날 거 같은 일에 대비하는 예방책이라던가. 그런걸 발견</text>
<text x="18.2" y="315.0" font-size="17.7" textLength="642.9" lengthAdjust="spacingAndGlyphs">하고 논의하는 자원의 기획안이야. 내가 진짜 해결책을 낸다기보다는, 내 기획안을 통해 내가 어떤 인사이트를</text>
<text x="18.2" y="331.2" font-size="16.6" textLength="290.4" lengthAdjust="spacingAndGlyphs">끌어내는 사람인지를 리더들이 보고싶은 거 같아.</text>
<text x="17.1" y="348.3" font-size="17.8" textLength="648.3" lengthAdjust="spacingAndGlyphs">- 기대효과: 기대효과... 현실적이었으면 좋겠어. 정부 정책에 대한 제언이니까. 뜬구름 잡는 대안은 아무나 하는</text>
<text x="18.2" y="365.4" font-size="17.7" textLength="195.0" lengthAdjust="spacingAndGlyphs">헛소리와 다를 바 없다고 생각해.</text>
<text x="16.1" y="380.7" font-size="15.5" textLength="357.9" lengthAdjust="spacingAndGlyphs">- 대상: 최종적으로 기술정책연구소 소장님께 보고드릴 거야.</text>
<text x="17.1" y="397.9" font-size="15.5" textLength="147.9" lengthAdjust="spacingAndGlyphs">- 시간: 발표시간은 15분.</text>
<text x="17.1" y="432.4" font-size="14.5" textLength="62.1" lengthAdjust="spacingAndGlyphs">## 1. 배경</text>
<text x="17.1" y="468.2" font-size="17.8" textLength="639.7" lengthAdjust="spacingAndGlyphs">**7월 28일부터 8월 11일 회의까지 반도체•AI 투자 성과와 3대 메가프로젝트 보고가 이어지고 있어서, 보고된</text>
<text x="18.2" y="482.7" font-size="14.4" textLength="283.5" lengthAdjust="spacingAndGlyphs">성과 뒤에 무엇이 남아 있는지 짚을 시점이다.**\</text>
<text x="16.1" y="517.7" font-size="16.6" textLength="650.4" lengthAdjust="spacingAndGlyphs">- 7월 28일 국무회의 모두말씀에서 순방 성과로 &quot;9,500억 불 규모의 반도체 분야 협력&quot;과 &quot;5GW 규모의 AI 데이</text>
<text x="19.3" y="534.8" font-size="16.6" textLength="441.5" lengthAdjust="spacingAndGlyphs">터센터 투자 협력&quot;이 언급됨. (요약 260728 핵심요약 3, 260728 제33회 3쪽)</text>
<text x="17.1" y="551.0" font-size="15.6" textLength="657.9" lengthAdjust="spacingAndGlyphs">- 8월 6일 차관회의 모두말씀에서 3대 메가프로젝트•부동산 정책에서 부처 간 협업 강화를 당부함. (요약 260806</text>
<text x="18.2" y="570.1" font-size="16.6" textLength="177.9" lengthAdjust="spacingAndGlyphs">쟁점 1, 260806 제30회 2~3쪽)</text>
<text x="17.1" y="585.3" font-size="15.6" textLength="646.1" lengthAdjust="spacingAndGlyphs">- 8월 11일 국무회의에서 3대 메가프로젝트 상생협력 강화방안이 보고됨. 반도체 중소기업 투자 스케일업을 위</text>
<text x="19.3" y="603.2" font-size="17.7" textLength="654.7" lengthAdjust="spacingAndGlyphs">한 5조 원 규모 반도체 펀드 신설, 광주 군공항 임시배치와 무안 군공항 착공 동시 시행이 담김. (요약 260811 핵</text>
<text x="18.2" y="620.5" font-size="16.6" textLength="198.2" lengthAdjust="spacingAndGlyphs">심요약 2, 260811 제35회 7~10쪽)</text>
<text x="16.0" y="653.8" font-size="16.8" textLength="64.3" lengthAdjust="spacingAndGlyphs">## 2. 쟁점</text>
<text x="16.1" y="688.9" font-size="17.7" textLength="649.4" lengthAdjust="spacingAndGlyphs">**큰 투자 보고와 별개로, 7월 21일과 8월 11일 회의에서 쟁의 범위 기준이 같은 구도(행정해석 대 시행령•노동</text>
<text x="18.2" y="706.1" font-size="17.8" textLength="635.4" lengthAdjust="spacingAndGlyphs">부령)로 다시 올라왔고 부처 간 입장도 갈려 있어서, 정리되지 않은 지점이 남아 있는 것으로 보인다(해석).**</text>
<text x="17.1" y="738.5" font-size="15.5" textLength="639.7" lengthAdjust="spacingAndGlyphs">- 7월 21일: 대통령이 노조법 개정에 따른 쟁의 범위 기준을 시행령•규칙•지침으로 미리 정할 필요를 지적했고</text>
<text x="26.6" y="769.1" font-size="15.9" textLength="63.5" lengthAdjust="spacingAndGlyphs">줄 1, 열 1</text>
