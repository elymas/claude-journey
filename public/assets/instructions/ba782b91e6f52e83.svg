<svg xmlns="http://www.w3.org/2000/svg" width="390" height="521" viewBox="0 0 390 521" role="img"><title>시안3 — 링크를 클릭되게 바꿨고, 시안1·2는 그대로 둔다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H390" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="378" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 시안3 — 링크를 클릭되게 바꿨고, 시안1·2는 그대로 둔다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="4.2" y="63.3" font-size="21.6" textLength="117.5" lengthAdjust="spacingAndGlyphs">발표자료 제작 6</text>
<text x="8.4" y="91.8" font-size="16.8" textLength="139.8" lengthAdjust="spacingAndGlyphs">고칠 점을 알려 주세요.</text>
<text x="238.9" y="61.0" font-size="11.0" textLength="42.2" lengthAdjust="spacingAndGlyphs">Cowork</text>
<text x="298.6" y="62.5" font-size="15.2" textLength="15.5" lengthAdjust="spacingAndGlyphs">[</text>
<text x="331.0" y="65.3" font-size="19.5" textLength="24.6" lengthAdjust="spacingAndGlyphs">-</text>
<text x="370.3" y="62.1" font-size="13.0" textLength="14.8" lengthAdjust="spacingAndGlyphs">×</text>
<text x="80.4" y="147.7" font-size="20.7" textLength="293.5" lengthAdjust="spacingAndGlyphs">마지막으로, 링크가 클릭이 안 돼. 클릭 되게 바꿔</text>
<text x="82.2" y="163.5" font-size="16.8" textLength="20.4" lengthAdjust="spacingAndGlyphs">줘.</text>
<text x="8.4" y="230.8" font-size="16.8" textLength="151.8" lengthAdjust="spacingAndGlyphs">명령 3개 실행함, 도구 사용함</text>
<text x="8.4" y="257.1" font-size="18.9" textLength="343.6" lengthAdjust="spacingAndGlyphs">참고 자료 장의 링크 5개(정책브리핑 2개, YTN, SBS Biz,</text>
<text x="7.7" y="275.2" font-size="16.1" textLength="347.1" lengthAdjust="spacingAndGlyphs">MTN)를 클릭되게 바꿔 결과 폴더에 2026-10-23_발표자</text>
<text x="8.4" y="297.1" font-size="18.9" textLength="333.8" lengthAdjust="spacingAndGlyphs">료_시만3.pptx 로 저장했어요. 파일 검증은 통과했지만,</text>
<text x="8.0" y="317.1" font-size="18.9" textLength="197.0" lengthAdjust="spacingAndGlyphs">실제로 클릭해 보지는 못했어요.</text>
<text x="6.0" y="347.2" font-size="18.7" textLength="343.8" lengthAdjust="spacingAndGlyphs">PowerPoint에서는 편집 화면에서 Ctrl을 누른 채 클릭하</text>
<text x="8.4" y="367.9" font-size="19.6" textLength="255.1" lengthAdjust="spacingAndGlyphs">거나, 슬라이드쇼에서 클릭하면 열립니다.</text>
<text x="7.7" y="395.7" font-size="16.6" textLength="210.8" lengthAdjust="spacingAndGlyphs">시안1과 시안2는 그대로 두었어요.</text>
<text x="14.8" y="459.8" font-size="15.2" textLength="151.8" lengthAdjust="spacingAndGlyphs">Claude에게 질문하세요...</text>
<text x="16.2" y="503.2" font-size="16.8" textLength="46.4" lengthAdjust="spacingAndGlyphs">+ H</text>
<text x="249.5" y="500.8" font-size="13.1" textLength="105.4" lengthAdjust="spacingAndGlyphs">Sonnet 5.5 높음 ✓</text></g><rect x=".5" y=".5" width="389" height="520" rx="6" fill="none" stroke="#d8cfc0"/></svg>