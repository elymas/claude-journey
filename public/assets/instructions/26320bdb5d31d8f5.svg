<svg xmlns="http://www.w3.org/2000/svg" width="1059" height="623" viewBox="0 0 1059 623" role="img"><title>주문서 복사를 누른다. 폴더의 기획안.md를 열고 Ctrl + A.</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1059" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1047" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 주문서 복사를 누른다. 폴더의 기획안.md를 열고 Ctrl + A.</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="73.9" y="127.9" font-size="17.6" textLength="72.3" lengthAdjust="spacingAndGlyphs">• 돌아가기</text>
<text x="70.8" y="191.6" font-size="12.9" textLength="100.1" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="197.0" y="192.3" font-size="39.8" textLength="415.6" lengthAdjust="spacingAndGlyphs">기획안.md — 먼저 묻는 버전</text>
<text x="715.7" y="223.7" font-size="16.0" textLength="32.3" lengthAdjust="spacingAndGlyphs">주황</text>
<text x="761.9" y="192.2" font-size="19.1" textLength="97.0" lengthAdjust="spacingAndGlyphs">단 주문서 복사</text>
<text x="785.0" y="219.6" font-size="11.1" textLength="52.3" lengthAdjust="spacingAndGlyphs">늘리 죽</text>
<text x="897.4" y="192.5" font-size="17.5" textLength="107.7" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="880.4" y="223.7" font-size="16.0" textLength="138.5" lengthAdjust="spacingAndGlyphs">획만 .md를 덮어쓴다</text>
<text x="77.0" y="282.2" font-size="16.0" textLength="124.7" lengthAdjust="spacingAndGlyphs"># 정책자료 기획안</text>
<text x="80.0" y="304.7" font-size="19.1" textLength="269.4" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="77.0" y="346.4" font-size="17.5" textLength="61.6" lengthAdjust="spacingAndGlyphs">#할 일</text>
<text x="97.1" y="369.2" font-size="22.9" textLength="370.6" lengthAdjust="spacingAndGlyphs">부를 때 받은 결과 폴더의 요약 파일 한 개만 읽는다.</text>
<text x="103.1" y="390.8" font-size="19.2" textLength="203.2" lengthAdjust="spacingAndGlyphs">정책자료 원본은 읽지 않는다.</text>
<text x="75.0" y="408.7" font-size="22.8" textLength="445.7" lengthAdjust="spacingAndGlyphs">2. 쓰기 전에 네 가지를 묻는다. 답을 받기 전에는 쓰지 않는다.</text>
<text x="97.1" y="430.7" font-size="22.8" textLength="295.6" lengthAdjust="spacingAndGlyphs">이 기획안의 목표 / 얻고 싶은 기대효과 /</text>
<text x="103.1" y="451.3" font-size="15.9" textLength="297.1" lengthAdjust="spacingAndGlyphs">누구에게 보고하나 / 발표 시간은 몇 분인가</text>
<text x="78.5" y="474.0" font-size="19.0" textLength="434.1" lengthAdjust="spacingAndGlyphs">3. 답을 받으면 요약에서 목표에 맞는 주제 후보를 2~3개 낸다.</text>
<text x="101.5" y="496.0" font-size="27.3" textLength="401.5" lengthAdjust="spacingAndGlyphs">후보마다 요약의 어느 항목이 근거인지 적고, 고르게 한다.</text>
<text x="75.0" y="513.5" font-size="27.3" textLength="318.0" lengthAdjust="spacingAndGlyphs">4. 요약 맨 아래의 ‘점검 기록’을 먼저 본다.</text>
<text x="101.5" y="536.2" font-size="22.7" textLength="286.8" lengthAdjust="spacingAndGlyphs">고친 항목이 있으면 고친 후의 값을 쓴다.</text>
<text x="78.5" y="560.0" font-size="20.7" textLength="480.2" lengthAdjust="spacingAndGlyphs">5. 기획안 맨 위에 목표·기대효과·대상·시간을 내가 답한 그대로 적고,</text>
<text x="103.1" y="579.0" font-size="17.5" textLength="138.5" lengthAdjust="spacingAndGlyphs">다섯 덩어리로 쓴다.</text>
<text x="101.5" y="605.4" font-size="31.9" textLength="419.2" lengthAdjust="spacingAndGlyphs">덜어리마다 첫 좋은 결론 한 문장, 그 아래 2거 서 줄 이하.</text>
<text x="639.8" y="289.8" font-size="22.8" textLength="207.4" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="639.8" y="320.7" font-size="22.8" textLength="361.8" lengthAdjust="spacingAndGlyphs">쓰기 전에 묻는다- 목표• 기대효과•대상 시간은 요약에</text>
<text x="643.4" y="345.2" font-size="16.0" textLength="347.9" lengthAdjust="spacingAndGlyphs">없다. 시종이 모르는 건 지어내게 두지 말고 나한테 묻게 적</text>
<text x="639.8" y="369.2" font-size="22.9" textLength="273.6" lengthAdjust="spacingAndGlyphs">는다. 담 전엔 안 쓴다는 줄이 있어야 멈춘다.</text>
<text x="639.8" y="404.2" font-size="22.7" textLength="361.8" lengthAdjust="spacingAndGlyphs">주제 후보를 낸다- 내가 목표를 말하면 시종이 요약에서</text>
<text x="643.4" y="429.5" font-size="17.6" textLength="323.2" lengthAdjust="spacingAndGlyphs">맞는 주제를 찾아 근거와 함께 내민다. 고르는 건 나다.</text>
<text x="641.9" y="463.4" font-size="17.5" textLength="344.8" lengthAdjust="spacingAndGlyphs">' 추정'이라고 적는다 - 기대효과는 시종이 지어내기 제</text>
<text x="639.8" y="487.7" font-size="22.7" textLength="353.0" lengthAdjust="spacingAndGlyphs">일 쉬운 자리. 이 한 줄이 그럴듯을 막는다. 할 일과 기준 양</text>
<text x="639.8" y="509.7" font-size="22.7" textLength="260.3" lengthAdjust="spacingAndGlyphs">쪽에 적어야 내놓기 전에 스스로 확인한다.</text>
<text x="643.4" y="548.1" font-size="17.7" textLength="254.0" lengthAdjust="spacingAndGlyphs">기획안.md를 열고 ctrl+A, ctrl+V, ctrl+S.</text></g><rect x=".5" y=".5" width="1058" height="622" rx="6" fill="none" stroke="#d8cfc0"/></svg>