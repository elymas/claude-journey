<svg xmlns="http://www.w3.org/2000/svg" width="969" height="555" viewBox="0 0 969 555" role="img"><title>‘주문서 복사’를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H969" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="957" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ‘주문서 복사’를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="46.5" y="68.3" font-size="14.5" textLength="67.6" lengthAdjust="spacingAndGlyphs">• 돌아가기</text>
<text x="43.7" y="130.7" font-size="11.6" textLength="94.4" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="163.4" y="131.3" font-size="36.4" textLength="147.9" lengthAdjust="spacingAndGlyphs">그래프.md</text>
<text x="49.3" y="216.3" font-size="14.8" textLength="57.8" lengthAdjust="spacingAndGlyphs"># 그래프</text>
<text x="50.7" y="238.3" font-size="17.5" textLength="266.2" lengthAdjust="spacingAndGlyphs">이 폴더의 규칙.md를 먼저 읽고 따른다.</text>
<text x="49.3" y="276.6" font-size="16.0" textLength="102.8" lengthAdjust="spacingAndGlyphs"># 언제 따르나</text>
<text x="49.3" y="298.7" font-size="18.9" textLength="419.3" lengthAdjust="spacingAndGlyphs">- 따른다: 시만(pptx)에 새로 그려 넣는 그래프 • 차트 표,</text>
<text x="50.7" y="317.3" font-size="17.5" textLength="108.4" lengthAdjust="spacingAndGlyphs">숫자가 든 도식.</text>
<text x="49.3" y="339.5" font-size="19.0" textLength="400.9" lengthAdjust="spacingAndGlyphs">- 따르지 않는다: 요약·기획안·콘티 같은 .md 결과물의 표,</text>
<text x="48.5" y="377.8" font-size="25.1" textLength="464.3" lengthAdjust="spacingAndGlyphs">- 캡처: 기관 자료·기사 캡처는 손대지 않고 넣고, 아래에 출처(기관·날짜)를 단다.</text>
<text x="50.7" y="397.6" font-size="17.5" textLength="102.8" lengthAdjust="spacingAndGlyphs">•날짜)를 단다.</text>
<text x="66.2" y="417.2" font-size="17.5" textLength="418.3" lengthAdjust="spacingAndGlyphs">실제로 찍은 화면만 넣는다. 제목을 그린 그림을 캡처라고 넣지 않는다.</text>
<text x="50.6" y="437.3" font-size="16.4" textLength="50.8" lengthAdjust="spacingAndGlyphs">많는다.</text>
<text x="66.2" y="458.2" font-size="17.5" textLength="366.2" lengthAdjust="spacingAndGlyphs">못 찍으면 링크만 참고 자료 장에 적고 보고에 알린다.</text>
<text x="66.2" y="477.8" font-size="17.5" textLength="321.1" lengthAdjust="spacingAndGlyphs">캡처 속 숫자를 그래프·본문으로 옮기지 않는다.</text>
<text x="49.3" y="497.7" font-size="16.0" textLength="374.6" lengthAdjust="spacingAndGlyphs">- 새로 만드는 그림(일러스트)에는 숫자를 넣지 않는다.</text>
<text x="699.9" y="131.7" font-size="18.6" textLength="91.7" lengthAdjust="spacingAndGlyphs">모 주문서 복사</text>
<text x="785.9" y="161.3" font-size="14.5" textLength="11.3" lengthAdjust="spacingAndGlyphs">새</text>
<text x="826.7" y="131.6" font-size="16.1" textLength="104.2" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="807.0" y="161.3" font-size="14.5" textLength="136.6" lengthAdjust="spacingAndGlyphs">새 파일 · 그대로 붙인다</text>
<text x="585.4" y="224.8" font-size="20.9" textLength="205.9" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="587.3" y="253.8" font-size="17.4" textLength="322.5" lengthAdjust="spacingAndGlyphs">언제 따르나 - 시안에 새로 그리는 그래프만. .md 표와</text>
<text x="581.4" y="277.3" font-size="20.8" textLength="302.8" lengthAdjust="spacingAndGlyphs">템플릿 만들기는 빼고, 캡처는 손대지 않고 출처만-</text>
<text x="587.3" y="300.1" font-size="18.9" textLength="225.3" lengthAdjust="spacingAndGlyphs">범위를 넓히면 다른 주문서와 부딪힌다.</text>
<text x="581.4" y="333.9" font-size="20.8" textLength="327.0" lengthAdjust="spacingAndGlyphs">진짜 캡처만 - 제목을 그린 그림을 캡처라고 넣는 것도</text>
<text x="585.9" y="356.4" font-size="18.9" textLength="174.6" lengthAdjust="spacingAndGlyphs">그럴듯이다. 못 찍으면 링크만.</text>
<text x="587.3" y="390.3" font-size="19.0" textLength="300.0" lengthAdjust="spacingAndGlyphs">콘티 숫자만 - 시안은 콘티 한 개만 읽는다. 그 밖의</text>
<text x="585.9" y="413.0" font-size="17.4" textLength="293.0" lengthAdjust="spacingAndGlyphs">숫자는 어디서 왔는지 아무도 모른다. 출처가 없으면</text>
<text x="581.4" y="434.8" font-size="20.8" textLength="149.4" lengthAdjust="spacingAndGlyphs">찾으러 가지 말고 묻는다.</text>
<text x="587.3" y="467.9" font-size="17.4" textLength="307.0" lengthAdjust="spacingAndGlyphs">바꾸지 않는다 - 반올림• 합계도 바꾸기다. 계산하면</text>
<text x="581.4" y="491.4" font-size="20.8" textLength="189.8" lengthAdjust="spacingAndGlyphs">계산식을 보여 주고 확인받는다.</text>
<text x="587.3" y="521.9" font-size="14.5" textLength="302.8" lengthAdjust="spacingAndGlyphs">없으면 묻는다 - 그럴듯은 빈칸에서 태어난다. 비면</text></g><rect x=".5" y=".5" width="968" height="554" rx="6" fill="none" stroke="#d8cfc0"/></svg>