<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="667" viewBox="0 0 1100 667" role="img"><title>① 주문서 복사를 누른다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H1100" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="1088" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · ① 주문서 복사를 누른다</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="54.3" y="120.1" font-size="18.3" textLength="60.8" lengthAdjust="spacingAndGlyphs">돌아가기</text>
<text x="30.4" y="192.3" font-size="14.9" textLength="110.3" lengthAdjust="spacingAndGlyphs">TEMPLATE</text>
<text x="167.9" y="194.2" font-size="46.4" textLength="535.6" lengthAdjust="spacingAndGlyphs">규칙.md — 폴더의 규칙만 남긴다</text>
<text x="796.2" y="191.8" font-size="20.2" textLength="107.2" lengthAdjust="spacingAndGlyphs">단 주문서 복사</text>
<text x="946.5" y="191.9" font-size="18.1" textLength="110.3" lengthAdjust="spacingAndGlyphs">주문 제조 완료</text>
<text x="952.9" y="227.2" font-size="16.6" textLength="127.9" lengthAdjust="spacingAndGlyphs">주황색이 바뀐 줄</text>
<text x="36.8" y="284.9" font-size="15.0" textLength="83.1" lengthAdjust="spacingAndGlyphs"># 이 폴더 규칙</text>
<text x="36.8" y="315.3" font-size="15.0" textLength="72.0" lengthAdjust="spacingAndGlyphs">‡ 이 폴더는</text>
<text x="38.4" y="329.6" font-size="14.8" textLength="225.4" lengthAdjust="spacingAndGlyphs">정책자료를 읽고 기획안을 만드는 폴더다.</text>
<text x="36.8" y="358.3" font-size="14.9" textLength="83.1" lengthAdjust="spacingAndGlyphs"># 결과물 위치</text>
<text x="36.8" y="374.1" font-size="16.5" textLength="372.5" lengthAdjust="spacingAndGlyphs">새로 만든 파일은 이 폴더 안 ‘결과’ 폴더에 넣는다. 없으면 만든다.</text>
<text x="38.4" y="388.6" font-size="16.6" textLength="132.7" lengthAdjust="spacingAndGlyphs">원본은 건드리지 않는다.</text>
<text x="36.7" y="417.6" font-size="15.5" textLength="78.5" lengthAdjust="spacingAndGlyphs">빠 하지 말 것</text>
<text x="36.8" y="431.8" font-size="14.9" textLength="215.8" lengthAdjust="spacingAndGlyphs">- 자료에 없는 내용을 지어내지 않는다.</text>
<text x="36.8" y="447.6" font-size="16.6" textLength="193.5" lengthAdjust="spacingAndGlyphs">- 원본 파일 이름을 바꾸지 않는다.</text>
<text x="36.8" y="475.1" font-size="13.2" textLength="43.2" lengthAdjust="spacingAndGlyphs">#+ 검증</text>
<text x="36.8" y="490.8" font-size="14.9" textLength="227.0" lengthAdjust="spacingAndGlyphs">- 숫자와 날짜는 원문에서 그대로 옮긴다.</text>
<text x="49.6" y="506.6" font-size="16.5" textLength="214.2" lengthAdjust="spacingAndGlyphs">계산이 필요하면 계산식을 같이 적는다.</text>
<text x="36.8" y="519.3" font-size="16.4" textLength="251.0" lengthAdjust="spacingAndGlyphs">- 원문에 없는 값은 비워두고 ‘미확인’ 목록에</text>
<text x="49.6" y="535.3" font-size="16.7" textLength="209.4" lengthAdjust="spacingAndGlyphs">따로 적는다. 추측해서 채우지 않는다.</text>
<text x="36.8" y="548.6" font-size="13.4" textLength="214.2" lengthAdjust="spacingAndGlyphs">- 각 항목이 어느 파일 어디에서 왔는지</text>
<text x="49.6" y="564.1" font-size="16.5" textLength="111.9" lengthAdjust="spacingAndGlyphs">결과에 같이 적는다.</text>
<text x="663.5" y="301.7" font-size="19.7" textLength="225.4" lengthAdjust="spacingAndGlyphs">잠깐, 주문 내용을 설명해줘.</text>
<text x="663.5" y="336.1" font-size="24.7" textLength="393.3" lengthAdjust="spacingAndGlyphs">빠진 것 - 이름(# 정책자료 기획안), 파일 이름, 절차, 완료</text>
<text x="665.1" y="360.3" font-size="23.0" textLength="286.2" lengthAdjust="spacingAndGlyphs">조건. 전부 일꾼의 것이라 시종.md로 간다.</text>
<text x="663.5" y="397.1" font-size="23.2" textLength="393.3" lengthAdjust="spacingAndGlyphs">바뀐 것 - 결과물 위치가 '결과' 폴더. 결과가 원본 옆에 쌓</text>
<text x="660.0" y="425.0" font-size="23.9" textLength="357.5" lengthAdjust="spacingAndGlyphs">이면 다음 달 시종이 지난달 결과까지 자료로 읽는다.</text>
<text x="663.5" y="461.8" font-size="18.5" textLength="388.5" lengthAdjust="spacingAndGlyphs">남은 것 - 검증 세 줄. 폴더 안 어느 시종이 일해도 걸리는</text>
<text x="664.6" y="489.1" font-size="23.7" textLength="137.5" lengthAdjust="spacingAndGlyphs">규칙이라 여기 둔다.</text>
<text x="664.6" y="526.0" font-size="23.9" textLength="293.3" lengthAdjust="spacingAndGlyphs">규칙.md를 열고 ctrl+A, ctrl+V로 덮어쓴다.</text></g><rect x=".5" y=".5" width="1099" height="666" rx="6" fill="none" stroke="#d8cfc0"/></svg>