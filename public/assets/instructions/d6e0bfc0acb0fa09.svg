<svg xmlns="http://www.w3.org/2000/svg" width="864" height="896" viewBox="0 0 864 896" role="img"><title>물어봤다. “이 기획안의 기대효과가 뭐야?” — 없다. 기획안.md가 정한 덩어리가 네 개뿐이라 넣지 않았다고 한다</title><rect width="100%" height="100%" rx="6" fill="#fffdf8"/><path d="M0 38H864" stroke="#d8cfc0"/><circle cx="13" cy="19" r="3" fill="#ae583f"/><circle cx="24" cy="19" r="3" fill="#b7a079"/><circle cx="35" cy="19" r="3" fill="#87937b"/><text x="852" y="23" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d7569">FIELD NOTES · 물어봤다. “이 기획안의 기대효과가 뭐야?” — 없다. 기획안.md가</text><g fill="#293d36" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif"><text x="494.8" y="109.5" font-size="18.1" textLength="298.9" lengthAdjust="spacingAndGlyphs">하나 물어볼게. 이 기획안의 기대효과가 뭐야?</text>
<text x="76.6" y="185.7" font-size="20.7" textLength="684.4" lengthAdjust="spacingAndGlyphs">결론부터 말하면, 지금 기획안에는 기대효과가 없습니다. 기획안.md 가 정한 덩어리가 배경, 쟁점, 제</text>
<text x="76.6" y="209.8" font-size="19.6" textLength="697.0" lengthAdjust="spacingAndGlyphs">안, 다음 단계 네 개뿐이라 넣지 않았고, 요약에도 이 절차를 도입하면 어떻게 된다는 근거가 없습니다.</text>
<text x="76.6" y="246.0" font-size="20.7" textLength="488.5" lengthAdjust="spacingAndGlyphs">요약에 있는 사실에서 말할 수 있는 건 아래 정도이고, 전부 추론입니다.</text>
<text x="84.1" y="281.3" font-size="20.9" textLength="681.9" lengthAdjust="spacingAndGlyphs">• 한쪽 값만 인용하는 위험이 줄어듭니다. 석유류 8차 최고가격을 '동결'로도 '인하'로도 적은 자료</text>
<text x="113.0" y="306.3" font-size="20.7" textLength="660.6" lengthAdjust="spacingAndGlyphs">가 있는데, 대조 없이 하나만 보면 다른 자료와 어긋난 줄 모르고 쓰게 됩니다. 출처와 나란히 적어</text>
<text x="111.8" y="329.1" font-size="19.6" textLength="195.9" lengthAdjust="spacingAndGlyphs">두면 그걸 막을 수 있습니다.</text>
<text x="84.1" y="356.8" font-size="19.6" textLength="681.9" lengthAdjust="spacingAndGlyphs">• 수치 오류를 잡는 데는 효과가 있습니다. 이번 요약도 점검 단계에서 반도체 협력 규모 같은 수치</text>
<text x="113.0" y="381.7" font-size="20.7" textLength="648.0" lengthAdjust="spacingAndGlyphs">를 원문 쪽으로 고쳤습니다. 다만 그건 회의록의 오류가 아니라 제가 요약하다 생긴 오류였습니</text>
<text x="113.0" y="404.7" font-size="18.2" textLength="22.6" lengthAdjust="spacingAndGlyphs">다.</text>
<text x="76.6" y="453.5" font-size="19.6" textLength="700.7" lengthAdjust="spacingAndGlyphs">한계도 분명합니다. 회의록 자체의 확실한 불일치는 8차 최고가격과 2020년 자살자 수 두 가지뿐이라,</text>
<text x="76.6" y="477.5" font-size="19.6" textLength="695.7" lengthAdjust="spacingAndGlyphs">이 절차로 막을 수 있는 실제 문제는 아직 작습니다. 시간을 얼마나 아끼는지, 실제로 몇 번 잘못 인용되</text>
<text x="76.6" y="501.2" font-size="19.4" textLength="414.4" lengthAdjust="spacingAndGlyphs">는지는 요약에 전혀 없어서 효과의 크기는 말할 수 없습니다.</text>
<text x="76.6" y="536.5" font-size="19.6" textLength="689.4" lengthAdjust="spacingAndGlyphs">기획안에 기대효과를 넣으려면 위 추론을 '추정'으로 표시해서 숫자 없이 두 줄 정도로만 쓸 수 있습니</text>
<text x="77.9" y="561.5" font-size="19.4" textLength="492.3" lengthAdjust="spacingAndGlyphs">다. 숫자를 붙여 쓰려면 요약에 없는 자료가 더 필요합니다. 추가할까요?</text>
<text x="75.3" y="591.2" font-size="14.4" textLength="84.1" lengthAdjust="spacingAndGlyphs">EM A7</text>
<text x="76.6" y="812.6" font-size="20.8" textLength="640.1" lengthAdjust="spacingAndGlyphs">기획안 md 업데이트했어. 다시 해보자. 기획안 md 읽고, 결과 폴더의 자료요약.md로 기획안 써줘.</text>
<text x="77.9" y="851.2" font-size="23.3" textLength="35.2" lengthAdjust="spacingAndGlyphs">+</text>
<text x="155.7" y="848.5" font-size="15.6" textLength="62.8" lengthAdjust="spacingAndGlyphs">내 수동 v</text>
<text x="611.6" y="847.6" font-size="14.4" textLength="104.2" lengthAdjust="spacingAndGlyphs">Sonnet 5.5 높음</text>
<text x="216.0" y="892.9" font-size="12.9" textLength="445.8" lengthAdjust="spacingAndGlyphs">Claude는 AI이므로 실수할 수 있습니다. 응답을 다시 한번 확인해 주세요. 의견 보내기</text></g><rect x=".5" y=".5" width="863" height="895" rx="6" fill="none" stroke="#d8cfc0"/></svg>